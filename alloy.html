      if (!built) return;

      // The animator holds every bone's rest matrix, so a moved bone means a new animator too.
      if (offEvents) { offEvents(); offEvents = null; }
      try {
        anim = Alloy.makeAnimator({ model: m, bones: built.bones, clips: modelClips() });
        // Events reach the status bar, which is the app's one voice. A game would hand them to
        // Webposium instead, which is the whole reason a clip can carry a footstep marker.
        offEvents = anim.onEvent((e) => log('clip <b>' + escapeHtml(e.clip) + '</b> fired <em>' +
          escapeHtml(e.name) + '</em> at ' + e.t.toFixed(2) + 's'));
        for (const p of wasPlaying) anim.play(p.name, { additive: p.additive });
      } catch (err) {
        anim = null;
        logError(err);
      }
    }

    /**
     * The clips that drive this model.
     *
     * The engine owns the rule, and this asks it rather than restating it. A workbench that
     * decides for itself which clips belong to a rig is a workbench that previews a different
     * set than the game plays.
     *
     * @returns {Object<string, Object>} - clips by name
     */
    function modelClips() { return Alloy.clipsForModel(pkg.clips, name); }

    /**
     * Is anything animating right now?
     * @returns {boolean} - true when a clip has weight
     */
    function isAnimating() { return !!anim && anim.state().some((x) => x.weight > 0.001); }

    /**
     * Draws the model, the selection outline and the gizmo.
     * @param {Object} port - the viewport
     * @returns {void}
     */
    function drawViewport(port, dt) {
      // A drag marks the model changed and the frame rebuilds it here, once, however many pointer
      // events arrived in between.
      if (pendingSync) sync();
      if (!built) return;
      const engine = port.engine;
      const mat4 = Alloy.mat4;
      // The bone matrices the renderer is about to upload. A static model leaves them all at the
      // identity, so the animator is only stepped while something plays — and once more after it
      // stops, to put the bones back.
      const live = isAnimating();
      if (anim && (live || animWasLive)) {
        animWasLive = live;
        anim.update(dt, built.boneMatrices);
        // A crossfade finishes, and a one-shot ends, between clicks. Redrawing the transport when
        // the set of live clips changes is what keeps the buttons telling the truth without
        // rebuilding them sixty times a second.
        const now = anim.state().map((x) => x.name).sort().join(',');
        if (now !== lastPlaying) { lastPlaying = now; drawTools(); }
      }
      const resolve = view.uvCheck
        ? () => ({ color: [1, 1, 1], texture: uvTex })
        : materialResolver(matTex);
      engine.drawModel(built, null, resolve);

      // One walk of the tree per frame, shared by the outline and the gizmo. It used to be two,
      // each allocating two matrices per node.
      const index = nodeIndex(model());
      const picked = selectedEntries(index);
      if (!picked.length) return;
      // While a clip plays, the outline and the gizmo would sit at the REST pose while the model
      // is somewhere else — a handle drawn where the thing it moves is not. Hiding them says that
      // honestly; the alternative is a gizmo that lies about what it is attached to.
      if (isAnimating()) return;

      // The selection outline and the gizmo both sit ON TOP of the model rather than inside it.
      // Clearing depth first is what makes a gizmo inside a solid still grabbable; without it the
      // handles disappear into whatever they are moving.
      engine.clearDepth();
      for (const entry of picked) {
        const part = built.parts.find((p) => p.path.join('.') === entry.key);
        if (!part) continue;
        const b = part.bounds;
        const m = mat4.fromTranslation(mat4.create(), b.min);
        m[0] = Math.max(b.max[0] - b.min[0], 1e-4);
        m[5] = Math.max(b.max[1] - b.min[1], 1e-4);
        m[10] = Math.max(b.max[2] - b.min[2], 1e-4);
        engine.drawLines(selBox, m, SELECTION_COLOR);
      }

      const state = gizmoState(index);
      if (!state) return;
      const g = mat4.create();
      // The gizmo takes the pivot's orientation and a constant screen size, so its axes point
      // along the space the inspector's numbers are written in.
      for (let i = 0; i < 3; i++) {
        g[i] = state.basis[0][i] * state.size;
        g[4 + i] = state.basis[1][i] * state.size;
        g[8 + i] = state.basis[2][i] * state.size;
      }
      g[12] = state.pivot[0]; g[13] = state.pivot[1]; g[14] = state.pivot[2];
      engine.drawLines(gizmos[view.mode], g, GIZMO_DIM);
    }

    /**
     * The index entries for the current selection, in tree order.
     * @returns {Array<Object>} - entries from nodeIndex
     */
    function selectedEntries(index) {
      const m = model();
      if (!m) return [];
      const wanted = new Set(view.sel);
      return (index || nodeIndex(m)).filter((e) => wanted.has(e.key));
    }

    /**
     * Where the gizmo sits, which way its axes point, and how big to draw it.
     * @returns {Object|null} - `{pivot, basis, size}` or null with nothing selected
     */
    function gizmoState(index) {
      const picked = selectedEntries(index);
      if (!picked.length || !vp) return null;
      const vec3 = Alloy.vec3;
      const pivot = [0, 0, 0];
      for (const e of picked) {
        pivot[0] += e.world[12]; pivot[1] += e.world[13]; pivot[2] += e.world[14];
      }
      vec3.scale(pivot, pivot, 1 / picked.length);

      // The axes come from the FIRST selected node's parent, which is the space its position,
      // rotation and scale are written in — or from the world when asked (L), in which case the
      // drag converts back before writing.
      const pw = picked[0].parentWorld;
      const basis = view.space === 'world'
        ? [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
        : [0, 1, 2].map((i) => {
          const col = [pw[i * 4], pw[i * 4 + 1], pw[i * 4 + 2]];
          const len = vec3.len(col);
          return len > 1e-8 ? vec3.scale(col, col, 1 / len) : [i === 0 ? 1 : 0, i === 1 ? 1 : 0, i === 2 ? 1 : 0];
        });
      return { pivot, basis, size: gizmoScale(vp.camera, pivot), mode: view.mode };
    }

    /**
     * Records an edit and refreshes everything showing this model.
     * @param {string} label - what changed
     * @param {boolean} [structural] - true when the tree itself changed
     * @returns {void}
     */
    function edited(label, structural) {
      histTouch(label);
      sync();
      drawStats();
      if (structural) drawTree();
      drawInspector();
      buildRail();
    }

    // --- The viewport's pointer: grab a gizmo, or pick a node ---

    /**
     * Starts a gizmo drag, or selects whatever is under the pointer and arms a drag on it.
     *
     * The left button is this editor's alone: the camera (Alloy.OrbitCamera.attach) takes right
     * and middle and never touches left, which is the whole arrangement that lets a gizmo drag
     * not orbit.
     *
     * @param {PointerEvent} ev - the pointerdown
     * @returns {void}
     */
    function onViewportDown(ev) {
      if (ev.button !== 0) return;
      const r = vp.canvas.getBoundingClientRect();
      const sx = ev.clientX - r.left, sy = ev.clientY - r.top;

      const state = gizmoState();
      const handle = state ? gizmoHit(state, vp, sx, sy) : null;
      if (handle) { beginGizmoDrag(ev, state, handle); return; }

      const hit = pickAt(sx, sy);
      if (!hit) {
        if (!ev.ctrlKey) { view.sel = []; drawTree(); drawInspector(); }
        return;
      }
      const key = hit.path.join('.');
      if (ev.ctrlKey) {
        const at = view.sel.indexOf(key);
        if (at >= 0) view.sel.splice(at, 1);
        else view.sel.push(key);
        drawTree();
        drawInspector();
        return;
      }
      if (view.sel.indexOf(key) < 0) {
        view.sel = [key];
        drawTree();
        drawInspector();
      }
      armBodyDrag(ev);
    }

    /**
     * The part whose bounds the pointer's ray hits first.
     *
     * Bounds overlap, so this picks the nearest box rather than the nearest surface. It is wrong
     * for a node wrapped around another, and it is the difference between fifty lines and a
     * triangle-level intersection nobody would notice was more exact.
     *
     * @param {number} sx - pointer x in canvas pixels
     * @param {number} sy - pointer y in canvas pixels
     * @returns {Object|null} - the part, or null
     */
    function pickAt(sx, sy) {
      if (!built) return null;
      const ray = viewportRay(vp, sx, sy);
      let best = null, bestT = Infinity;
      for (const part of built.parts) {
        const t = Alloy.pick.rayAABB(ray.origin, ray.dir, part.bounds.min, part.bounds.max);
        if (t >= 0 && t < bestT) { bestT = t; best = part; }
      }
      return best;
    }

    /**
     * Waits to see whether a press on a selected node becomes a drag.
     *
     * A click selects; a click that then travels moves the thing along its parent's floor, the
     * way you would slide a chair across a room. Four pixels of travel is the line between the
     * two, so a slightly shaky click never nudges anything. Alt at the press lifts instead.
     *
     * @param {PointerEvent} ev - the pointerdown
     * @returns {void}
     */
    function armBodyDrag(ev) {
      const x0 = ev.clientX, y0 = ev.clientY;
      vp.canvas.setPointerCapture(ev.pointerId);
      /**
       * @param {PointerEvent} e - a pointermove
       * @returns {void}
       */
      function move(e) {
        if (Math.hypot(e.clientX - x0, e.clientY - y0) < 4) return;
        disarm(e);
        const state = gizmoState();
        if (!state) return;
        state.mode = 'translate';
        beginGizmoDrag(ev, state, ev.altKey ? { kind: 'axis', key: 'y', index: 1 } : { kind: 'body', key: 'body' });
      }
      /**
       * @param {PointerEvent} e - the pointerup or the move that became a drag
       * @returns {void}
       */
      function disarm(e) {
        vp.canvas.removeEventListener('pointermove', move);
        vp.canvas.removeEventListener('pointerup', disarm);
        vp.canvas.removeEventListener('pointercancel', disarm);
        if (e.type !== 'pointermove' && vp.canvas.hasPointerCapture(e.pointerId)) {
          vp.canvas.releasePointerCapture(e.pointerId);
        }
      }
      vp.canvas.addEventListener('pointermove', move);
      vp.canvas.addEventListener('pointerup', disarm);
      vp.canvas.addEventListener('pointercancel', disarm);
    }

    /**
     * Runs a drag from pointerdown to pointerup, whatever handle started it.
     *
     * One routine for every handle and every mode, because they all reduce to the same shape:
     * measure where the pointer's ray meets the line or plane the handle named, compare with
     * where it met at the grab, and write the difference into every selected node from the
     * transforms they had at the grab. Measuring from the grab rather than from the previous
     * frame is what keeps a snapping drag from ratcheting.
     *
     * Modifiers, all live during the drag: Ctrl inverts the snap toggle (snapping on, Ctrl frees
     * to the smallest unit; snapping off, Ctrl snaps). Shift is precision, the pointer at a tenth.
     * X, Y or Z locks the drag to that axis, tapped again to release. Escape or the right button
     * cancels and puts everything back. A change of lock or precision re-anchors the drag at the
     * pointer's current position, so nothing jumps when a key goes down.
     *
     * Typing a number during the drag replaces the pointer: a distance along the locked axis (or
     * the first free one) for a move, degrees about the ring's axis for a rotation, a factor for
     * a scale. Minus flips the sign, Backspace edits, Enter keeps it, Escape still cancels. The
     * typed value is exact and measured from where the drag began, never snapped, because a
     * person who types 0.3 means 0.3.
     *
     * @param {PointerEvent} ev - the pointerdown
     * @param {Object} state - the gizmo state at grab time
     * @param {Object} handle - `{kind, key, index}` from gizmoHit, or `{kind: 'body'}`
     * @returns {void}
     */
    function beginGizmoDrag(ev, state, handle) {
      ev.preventDefault();
      ev.stopPropagation();
      const m = model();
      const vec3 = Alloy.vec3, quat = Alloy.quat;
      const mode = state.mode;
      const r = vp.canvas.getBoundingClientRect();
      const picked = selectedEntries();
      if (!picked.length) return;

      /**
       * A copy of every selected node's transform, as it is right now.
       * @returns {Array<Object>} - one record per node
       */
      function capture() {
        return picked.map((e) => {
          const node = nodeAt(m, e.path);
          return {
            path: e.path,
            position: (node.position || [0, 0, 0]).slice(),
            rotation: (node.rotation || [0, 0, 0]).slice(),
            scale: (node.scale || [1, 1, 1]).slice(),
            toLocal: worldToLocalOf(e.parentWorld),
          };
        });
      }
      const origin = capture();        // what Escape restores
      let start = capture();           // what the current segment of the drag measures from
      let lock = handle.kind === 'axis' ? handle.index : -1;
      let precise = !!ev.shiftKey;
      let typed = '';                  // the number being typed, if any
      let tip = null;                  // the tag that shows it, beside the pointer
      const initX = ev.clientX, initY = ev.clientY;
      let lastX = ev.clientX, lastY = ev.clientY;
      const camDir = viewAxis(vp, state.pivot);
      const pivotPx = Alloy.pick.project([], state.pivot, viewProjOf(vp), vp.canvas.clientWidth, vp.canvas.clientHeight);
      let first = measure(ev.clientX - r.left, ev.clientY - r.top);
      if (first === null) {
        // Grabbed edge-on: the ray never meets the handle's plane, so there is nothing to measure
        // and the drag would be dead until Escape. Better to say so and not start.
        log('<i>that handle is edge-on from here</i> &middot; orbit a little and try again');
        return;
      }
      vp.canvas.setPointerCapture(ev.pointerId);
      view.dragging = handle.key;

      /**
       * The world axes this drag may change: one for a lock or an arrow, two for a plane
       * square, three for the centre or the body.
       * @returns {number[]} - axis indices
       */
      function mask() {
        if (lock >= 0) return [lock];
        if (handle.kind === 'plane') return [0, 1, 2].filter((i) => i !== handle.index);
        return [0, 1, 2];
      }

      /**
       * The plane a free drag happens in: the square's own, the floor for the body, the screen
       * for the centre.
       * @returns {number[]} - the plane's normal
       */
      function planeNormal() {
        if (handle.kind === 'plane') return state.basis[handle.index];
        if (handle.kind === 'body') return state.basis[1];
        return camDir;
      }

      /**
       * A vector perpendicular to another, for measuring an angle around it.
       * @param {number[]} axis - the axis
       * @returns {number[][]} - two unit vectors spanning its plane
       */
      function planeOf(axis) {
        const up = Math.abs(axis[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
        const u = vec3.normalize([], vec3.cross([], up, axis));
        const v = vec3.cross([], axis, u);
        return [u, v];
      }

      /**
       * Turns a pointer position into what this drag measures: a world point for a move, an
       * angle for a rotation, a distance for a scale. Null when the ray misses the plane.
       * @param {number} sx - pointer x in canvas pixels
       * @param {number} sy - pointer y in canvas pixels
       * @returns {number[]|number|null} - the measurement
       */
      function measure(sx, sy) {
        const ray = viewportRay(vp, sx, sy);
        if (mode === 'rotate') {
          const axis = lock >= 0 ? state.basis[lock] : camDir;
          const [u, v] = lock >= 0
            ? [state.basis[(lock + 1) % 3], state.basis[(lock + 2) % 3]] : planeOf(axis);
          const hit = [0, 0, 0];
          if (!Alloy.pick.rayPlane(hit, ray.origin, ray.dir, state.pivot, axis)) return null;
          const rel = vec3.sub([], hit, state.pivot);
          return Math.atan2(vec3.dot(rel, v), vec3.dot(rel, u)) * 180 / Math.PI;
        }
        if (mode === 'scale') {
          // A scale reads two things: how far from the pivot the pointer is along the handle, for
          // the ratio a cap or a square gives, and its screen travel (right and up grow), for a
          // grab at the centre where there is no distance to take a ratio from.
          const travel = (sx - pivotPx[0]) - (sy - pivotPx[1]);
          if (handle.kind === 'center' && lock < 0) return { d: 0, travel };
          if (lock >= 0) {
            return { d: Alloy.pick.closestOnLine([], ray.origin, ray.dir, state.pivot, state.basis[lock]), travel };
          }
          const hit = [0, 0, 0];
          if (!Alloy.pick.rayPlane(hit, ray.origin, ray.dir, state.pivot, planeNormal())) return null;
          return { d: vec3.dist(hit, state.pivot), travel };
        }
        if (lock >= 0) {
          const dir = state.basis[lock];
          const t = Alloy.pick.closestOnLine([], ray.origin, ray.dir, state.pivot, dir);
          return vec3.scaleAndAdd([], state.pivot, dir, t);
        }
        const hit = [0, 0, 0];
        if (!Alloy.pick.rayPlane(hit, ray.origin, ray.dir, state.pivot, planeNormal())) return null;
        return hit;
      }

      /**
       * Applies the drag to every selected node.
       * @param {PointerEvent} e - the pointermove
       * @returns {void}
       */
      function apply(e) {
        lastX = e.clientX; lastY = e.clientY;
        if (typed) { placeTip(); return; }   // a typed number has taken over from the pointer
        if (!!e.shiftKey !== precise) { precise = !!e.shiftKey; reanchor(); }
        const now = measure(e.clientX - r.left, e.clientY - r.top);
        if (now === null || first === null) return;
        const snap = view.snapping !== !!e.ctrlKey;
        const fine = precise ? 0.1 : 1;
        const axes = mask();

        for (const s of start) {
          const node = nodeAt(m, s.path);
          if (!node) continue;
          if (mode === 'translate') {
            const dWorld = vec3.scale([], vec3.sub([], now, first), fine);
            const local = s.toLocal(dWorld);
            const next = s.position.slice();
            // Only an axis that actually moved is snapped. Snapping is to the grid, not by the
            // step, so a floor drag on a node sitting at 0.41 must not lift it to 0.5 on the way.
            for (const i of axes) {
              if (Math.abs(local[i]) < 1e-6) continue;
              next[i] = snapTo(s.position[i] + local[i], snap ? view.snapMove : 0.01);
            }
            node.position = next.map((v) => Math.round(v * 1e4) / 1e4);
          } else if (mode === 'rotate') {
            // Wrapped into -180..180, or dragging past the seam spins the node the long way.
            let d = now - first;
            while (d > 180) d -= 360;
            while (d < -180) d += 360;
            d = snapTo(d * fine, snap ? view.snapSpin : 1);
            // The axis in the parent's space, where the node's rotation is written; a spin
            // about it goes on the OUTSIDE of the node's own rotation.
            const axisWorld = lock >= 0 ? state.basis[lock] : camDir;
            const axisLocal = vec3.normalize([], s.toLocal(axisWorld));
            const spin = quat.fromAxisAngle([], axisLocal, d);
            const startQ = s.rotation.length === 4
              ? s.rotation : quat.fromEuler([], s.rotation[0], s.rotation[1], s.rotation[2]);
            const q = quat.normalize([], quat.multiply([], spin, startQ));
            node.rotation = s.rotation.length === 4
              ? q.map((v) => Math.round(v * 1e5) / 1e5)
              : quat.toEuler([], q).map((v) => Math.round(v * 1e3) / 1e3);
          } else {
            // Scale is a RATIO, not a distance: dragging the handle to twice its start distance
            // doubles the node. Measuring it as a difference would make a small node explode and
            // a large one barely move.
            // A ratio when the grab was far enough from the pivot to have one; otherwise a
            // hundred pixels of travel doubles, the way a centre handle scales everywhere.
            let factor = Math.abs(first.d) > 0.2 * state.size
              ? now.d / first.d
              : Math.pow(2, (now.travel - first.travel) / 100);
            if (!Number.isFinite(factor) || factor < 0.001) factor = 0.001;
            factor = 1 + (factor - 1) * fine;
            const next = s.scale.slice();
            for (const i of axes) next[i] = Math.max(0.001, snapTo(s.scale[i] * factor, snap ? view.snapScale : 0.01));
            node.scale = next.map((v) => Math.round(v * 1e4) / 1e4);
          }
        }
        pendingSync = true;
        wake();
        refreshTransformRows();
      }

      /**
       * Restarts the measurement from where the pointer is now, keeping what has been applied.
       * @returns {void}
       */
      function reanchor() {
        start = capture();
        first = measure(lastX - r.left, lastY - r.top);
      }

      /**
       * Applies the typed number, exactly, from where the drag began.
       * @returns {void}
       */
      function applyTyped() {
        const v = parseFloat(typed);
        const axis = lock >= 0 ? lock : mask()[0];
        const what = mode === 'translate' ? 'move ' + 'XYZ'[axis] + ' <b>' + typed + '</b>'
          : mode === 'rotate' ? 'rotate ' + (lock >= 0 ? 'XYZ'[lock] : 'view') + ' <b>' + typed + '°</b>'
          : 'scale <b>×' + typed + '</b>';
        showTip(what);
        log(what + ' &middot; Enter keeps it, Escape cancels');
        if (!Number.isFinite(v)) return;
        for (const s of origin) {
          const node = nodeAt(m, s.path);
          if (!node) continue;
          if (mode === 'translate') {
            const local = s.toLocal(vec3.scale([], state.basis[axis], v));
            node.position = s.position.map((p, i) => Math.round((p + local[i]) * 1e4) / 1e4);
          } else if (mode === 'rotate') {
            const axisWorld = lock >= 0 ? state.basis[lock] : camDir;
            const spin = quat.fromAxisAngle([], vec3.normalize([], s.toLocal(axisWorld)), v);
            const startQ = s.rotation.length === 4
              ? s.rotation : quat.fromEuler([], s.rotation[0], s.rotation[1], s.rotation[2]);
            const q = quat.normalize([], quat.multiply([], spin, startQ));
            node.rotation = s.rotation.length === 4
              ? q.map((x) => Math.round(x * 1e5) / 1e5)
              : quat.toEuler([], q).map((x) => Math.round(x * 1e3) / 1e3);
          } else {
            const next = s.scale.slice();
            for (const i of mask()) next[i] = Math.max(0.001, Math.round(s.scale[i] * v * 1e4) / 1e4);
            node.scale = next;
          }
        }
        pendingSync = true;
        wake();
        refreshTransformRows();
      }

      /**
       * Shows, or updates, the tag beside the pointer.
       * @param {string} html - what it says
       * @returns {void}
       */
      function showTip(html) {
        if (!tip) {
          tip = document.createElement('div');
          tip.className = 'drag-tip';
          vp.canvas.parentNode.appendChild(tip);
        }
        tip.innerHTML = html;
        placeTip();
      }

      /**
       * Keeps the tag beside the pointer.
       * @returns {void}
       */
      function placeTip() {
        if (!tip) return;
        const host = vp.canvas.parentNode.getBoundingClientRect();
        tip.style.left = (lastX - host.left + 16) + 'px';
        tip.style.top = (lastY - host.top + 14) + 'px';
      }

      /**
       * Keys during the drag: axis locks and precision. Escape is the shell's, which asks the
       * active drag to cancel.
       * @param {KeyboardEvent} k - the keydown or keyup
       * @returns {void}
       */
      function onKeys(k) {
        if (k.type === 'keydown' && !k.ctrlKey && !k.metaKey) {
          const at = 'xyz'.indexOf(k.key.toLowerCase());
          if (at >= 0 && k.key.length === 1) {
            k.preventDefault();
            lock = lock === at ? -1 : at;
            if (typed) { applyTyped(); return; }
            reanchor();
            log(lock >= 0 ? 'locked to <b>' + 'XYZ'[lock] + '</b>' : 'lock released');
            return;
          }
          // The number being typed. Minus flips the sign rather than appending, which is what
          // lets you type 2 and then decide it was the other way.
          if (/^[0-9.]$/.test(k.key)) { k.preventDefault(); typed += k.key; applyTyped(); return; }
          if (k.key === '-') {
            k.preventDefault();
            typed = typed.startsWith('-') ? typed.slice(1) : '-' + typed;
            applyTyped();
            return;
          }
          if (k.key === 'Backspace' && typed) {
            k.preventDefault();
            typed = typed.slice(0, -1);
            if (typed && typed !== '-') applyTyped();
            else {
              // Cleared: the pointer takes over again as if nothing had been typed, measured
              // from where the drag began, so the node lands where the mouse says, not where
              // the number left it.
              typed = '';
              if (tip) { tip.remove(); tip = null; }
              for (const s of origin) {
                const node = nodeAt(m, s.path);
                if (!node) continue;
                node.position = s.position.slice(); node.rotation = s.rotation.slice(); node.scale = s.scale.slice();
              }
              start = capture();
              first = measure(initX - r.left, initY - r.top);
              log('back to the pointer');
            }
            return;
          }
          if (k.key === 'Enter' && typed) { k.preventDefault(); up(); return; }
        }
        if (k.key === 'Shift' && !!(k.type === 'keydown') !== precise) { precise = k.type === 'keydown'; reanchor(); }
      }

      /**
       * A second button during the drag cancels it.
       * @param {PointerEvent} e - the pointerdown
       * @returns {void}
       */
      function onOtherButton(e) {
        if (e.button === 2) { e.preventDefault(); e.stopPropagation(); cancel(); }
      }

      /**
       * Unhooks everything.
       * @returns {void}
       */
      function end() {
        vp.canvas.removeEventListener('pointermove', apply);
        vp.canvas.removeEventListener('pointerup', up);
        vp.canvas.removeEventListener('pointercancel', up);
        vp.canvas.removeEventListener('lostpointercapture', lost);
        vp.canvas.removeEventListener('pointerdown', onOtherButton);
        window.removeEventListener('blur', lost);
        window.removeEventListener('keydown', onKeys, true);
        window.removeEventListener('keyup', onKeys, true);
        if (vp.canvas.hasPointerCapture(ev.pointerId)) vp.canvas.releasePointerCapture(ev.pointerId);
        if (tip) { tip.remove(); tip = null; }
        view.dragging = null;
        activeDrag = null;
      }

      /**
       * Puts every node back where the drag found it.
       * @returns {void}
       */
      function cancel() {
        for (const s of origin) {
          const node = nodeAt(m, s.path);
          if (!node) continue;
          node.position = s.position.slice();
          node.rotation = s.rotation.slice();
          node.scale = s.scale.slice();
        }
        end();
        sync();
        drawInspector();
        log('cancelled');
      }

      /**
       * Ends the drag and records it as one edit.
       * @param {PointerEvent} e - the pointerup
       * @returns {void}
       */
      function up(e) {
        end();
        // A press with no movement is not an edit: no history step, no dirty dot, no autosave.
        const same = JSON.stringify(capture()) === JSON.stringify(origin);
        if (same) { sync(); drawInspector(); return; }
        edited(mode);
      }

      /**
       * The pointer went away without a release — the window lost focus, a dialog opened. A drag
       * left armed would keep eating digits until Escape, so it cancels instead.
       * @returns {void}
       */
      function lost() { if (activeDrag) cancel(); }

      activeDrag = { cancel };
      vp.canvas.addEventListener('pointermove', apply);
      vp.canvas.addEventListener('pointerup', up);
      vp.canvas.addEventListener('pointercancel', up);
      vp.canvas.addEventListener('lostpointercapture', lost);
      window.addEventListener('blur', lost);
      vp.canvas.addEventListener('pointerdown', onOtherButton);
      window.addEventListener('keydown', onKeys, true);
      window.addEventListener('keyup', onKeys, true);
    }

    /**
     * Redraws the ground grid at the snap step, so the grid you see is the grid you snap to.
     *
     * Only between 0.05 and 1: finer than that is a haze of lines, and a step of 1 or more is
     * the default grid already. A major line every whole unit keeps the scale readable.
     *
     * @returns {void}
     */
    function refreshGrid() {
      if (!vp) return;
      const step = view.snapping && view.snapMove >= 0.05 && view.snapMove < 1 ? view.snapMove : 1;
      if (vp.gridStep === step) return;
      vp.gridStep = step;
      vp.engine.disposeMesh(vp.grid);
      vp.grid = vp.engine.makeLines(Alloy.geometry.gridLines({
        size: 20, step, majorEvery: Math.max(1, Math.round(1 / step)) }));
    }


    // --- The node tree ---

    /**
     * Rebuilds the node tree panel.
     * @returns {void}
     */
    function drawTree() {
      const m = model();
      if (!m) return;
      ui.tree.innerHTML = '';
      const entries = nodeIndex(m);
      const add = miniButton('+', 'add a node at the root', (ev) => {
        ev.stopPropagation();
        openAddMenu(ev.clientX, ev.clientY, false);
      });
      ui.tree.appendChild(sectionHead('Nodes · ' + entries.length, add));

      for (const e of entries) {
        const row = document.createElement('div');
        row.className = 'lay' + (view.sel.indexOf(e.key) >= 0 ? ' sel' : '');
        row.draggable = true;
        row.dataset.key = e.key;

        const nm = document.createElement('span');
        nm.className = 'nm';
        // Indentation IS the hierarchy here. A tree drawn without it is a list, and a list of
        // eleven nodes called "cylinder" tells you nothing about what is attached to what.
        nm.style.paddingLeft = (e.depth * 11) + 'px';
        nm.textContent = (e.node.name || e.node.primitive || 'node');

        const bl = document.createElement('span');
        bl.className = 'bl';
        const bits = [];
        if (e.node.bone) bits.push('bone');
        if (e.node.subdivide) bits.push('sub ' + e.node.subdivide);
        if (e.node.uv && e.node.uv.mode && e.node.uv.mode !== 'default') bits.push(e.node.uv.mode);
        if (!e.node.primitive) bits.push('group');
        bl.textContent = bits.join(' · ');

        row.append(nm, bl);
        row.addEventListener('click', (ev) => {
          if (ev.ctrlKey || ev.metaKey) {
            const at = view.sel.indexOf(e.key);
            if (at >= 0) view.sel.splice(at, 1);
            else view.sel.push(e.key);
          } else {
            view.sel = [e.key];
          }
          drawTree();
          drawInspector();
        });
        row.addEventListener('contextmenu', (ev) => {
          ev.preventDefault();
          if (view.sel.indexOf(e.key) < 0) view.sel = [e.key];
          drawTree();
          nodeMenu(ev.clientX, ev.clientY, e);
        });
        row.addEventListener('dragstart', (ev) => {
          ev.dataTransfer.setData('text/plain', e.key);
          ev.dataTransfer.effectAllowed = 'move';
          row.classList.add('drag');
        });
        row.addEventListener('dragend', () => row.classList.remove('drag'));
        row.addEventListener('dragover', (ev) => { ev.preventDefault(); row.classList.add('over'); });
        row.addEventListener('dragleave', () => row.classList.remove('over'));
        row.addEventListener('drop', (ev) => {
          ev.preventDefault();
          row.classList.remove('over');
          reparent(ev.dataTransfer.getData('text/plain'), e.key);
        });
        ui.tree.appendChild(row);
      }
    }

    /**
     * The menu of things a new node can be.
     * @param {number} x - client x
     * @param {number} y - client y
     * @returns {void}
     */
    function openAddMenu(x, y, asChild) {
      const items = Alloy.primitiveTypes.map((p) => ({ label: p, fn: () => addNode(p, asChild) }));
      items.push({ sep: true }, { label: 'empty group', fn: () => addNode('', asChild) });
      openMenu(x, y, asChild ? 'Add a child' : 'Add a node', items);
    }

    /**
     * Adds a node at the root, or as a child of the selection when asked to.
     *
     * The root is the default on purpose. The tree's + used to add under whatever was selected,
     * which is right for a hut with a body group and wrong for a chair being assembled part by
     * part — the back went under the seat, the post under the back, every position became
     * relative, and nothing said so. "Add a child…" on the node's own menu is the explicit way.
     *
     * @param {string} primitive - the primitive, or empty for a group
     * @param {boolean} asChild - true to add under the first selected node
     * @returns {void}
     */
    function addNode(primitive, asChild) {
      const m = model();
      const node = newNode(primitive);
      uniqueNodeNames(m, node);
      const picked = asChild ? selectedEntries() : [];
      if (picked.length) {
        const parent = picked[0].node;
        if (!parent.children) parent.children = [];
        parent.children.push(node);
        view.sel = [picked[0].key + '.' + (parent.children.length - 1)];
        log('added <b>' + escapeHtml(node.name) + '</b> under <b>' + escapeHtml(parent.name || 'node') + '</b>');
      } else {
        m.nodes.push(node);
        view.sel = [String(m.nodes.length - 1)];
        log('added <b>' + escapeHtml(node.name) + '</b> at the root &middot; right-click a node for Add a child');
      }
      edited('add node', true);
    }

    /**
     * Moves a node under another, refusing the moves that would break the tree.
     * @param {string} fromKey - the dragged node's path key
     * @param {string} toKey - the node it was dropped on
     * @returns {void}
     */
    function reparent(fromKey, toKey) {
      if (!fromKey || fromKey === toKey) return;
      const m = model();
      // Dropping a node onto its own descendant would make a cycle: the subtree would be its own
      // parent, and the merge would recurse until the depth guard caught it. Comparing path
      // prefixes catches it here, where the message can be useful.
      if (toKey.lastIndexOf(fromKey + '.', 0) === 0) {
        log('<i>a node cannot be moved inside itself</i>');
        return;
      }
      const fromPath = fromKey.split('.').map(Number);
      const slot = nodeSlot(m, fromPath);
      if (!slot) return;
      const node = slot.list[slot.index];
      const target = nodeAt(m, toKey.split('.').map(Number));
      if (!target) return;
      slot.list.splice(slot.index, 1);
      if (!target.children) target.children = [];
      target.children.push(node);
      // The path changed, so the old key names something else now. Re-find the node rather than
      // keeping a stale selection pointing at whatever moved up into its place.
      const moved = nodeIndex(m).find((e) => e.node === node);
      view.sel = moved ? [moved.key] : [];
      edited('reparent', true);
    }

    /**
     * The menu for one node.
     * @param {number} x - client x
     * @param {number} y - client y
     * @param {Object} entry - the node's index entry
     * @returns {void}
     */
    function nodeMenu(x, y, entry) {
      const m = model();
      openMenu(x, y, entry.node.name || 'node', [
        { label: 'Add a child…', fn: () => openAddMenu(x, y, true) },
        { label: 'Rename', fn: () => {
          const el = [...ui.tree.querySelectorAll('.lay')].find((r) => r.dataset.key === entry.key);
          if (el) editInPlace(el.querySelector('.nm'), entry.node.name || '', (next) => {
            entry.node.name = next;
            edited('rename node', true);
          });
        } },
        { label: 'Duplicate', fn: () => duplicateNodes() },
        { sep: true },
        { label: 'Mirror along X', fn: () => mirrorNodes(0) },
        { label: 'Mirror along Y', fn: () => mirrorNodes(1) },
        { label: 'Mirror along Z', fn: () => mirrorNodes(2) },
        { sep: true },
        { label: 'Move to the root', fn: () => {
          const slot = nodeSlot(m, entry.path);
          if (!slot || entry.path.length === 1) return;
          const node = slot.list[slot.index];
          slot.list.splice(slot.index, 1);
          m.nodes.push(node);
          view.sel = [String(m.nodes.length - 1)];
          edited('move to root', true);
        } },
        { label: entry.node.bone ? 'Stop being a bone' : 'Make this a bone', fn: () => {
          entry.node.bone = !entry.node.bone;
          edited('bone', true);
        } },
        { sep: true },
        { label: 'Delete', danger: true, fn: () => deleteNodes() },
      ]);
    }

    /**
     * Copies every selected node beside itself.
     * @returns {void}
     */
    function duplicateNodes() {
      const m = model();
      const picked = selectedEntries();
      const next = [];
      // Deepest first, so removing and inserting does not shift the paths still to be processed.
      for (const e of picked.slice().reverse()) {
        const slot = nodeSlot(m, e.path);
        if (!slot) continue;
        const copy = JSON.parse(JSON.stringify(slot.list[slot.index]));
        copy.name = (copy.name || 'node') + ' copy';
        uniqueNodeNames(m, copy);
        slot.list.splice(slot.index + 1, 0, copy);
        next.push(e.path.slice(0, -1).concat(e.path[e.path.length - 1] + 1).join('.'));
      }
      view.sel = next;
      edited('duplicate node', true);
    }

    /**
     * Copies every selected node and flips the copy along an axis.
     *
     * Mirroring is a negative scale, which turns the copy's triangles inside out. The merge
     * notices and reverses their winding, so the mirrored half is solid rather than invisible.
     * Doing it as a scale rather than by rewriting vertices is what keeps the copy a live node
     * whose parameters still mean something.
     *
     * @param {number} axis - 0 for X, 1 for Y, 2 for Z
     * @returns {void}
     */
    function mirrorNodes(axis) {
      const m = model();
      const picked = selectedEntries();
      const next = [];
      for (const e of picked.slice().reverse()) {
        const slot = nodeSlot(m, e.path);
        if (!slot) continue;
        const copy = JSON.parse(JSON.stringify(slot.list[slot.index]));
        copy.name = (copy.name || 'node') + ' mirror';
        uniqueNodeNames(m, copy);
        copy.scale = (copy.scale || [1, 1, 1]).slice();
        copy.scale[axis] = -copy.scale[axis];
        copy.position = (copy.position || [0, 0, 0]).slice();
        copy.position[axis] = -copy.position[axis];
        slot.list.splice(slot.index + 1, 0, copy);
        next.push(e.path.slice(0, -1).concat(e.path[e.path.length - 1] + 1).join('.'));
      }
      view.sel = next;
      edited('mirror', true);
      log('mirrored ' + next.length + ' node' + (next.length === 1 ? '' : 's') +
          ' along ' + 'XYZ'[axis]);
    }

    /**
     * Deletes every selected node.
     * @returns {void}
     */
    function deleteNodes() {
      const m = model();
      const picked = selectedEntries();
      for (const e of picked.slice().reverse()) {
        const slot = nodeSlot(m, e.path);
        if (slot) slot.list.splice(slot.index, 1);
      }
      view.sel = [];
      edited('delete node', true);
    }

    // --- The inspector ---

    /**
     * Rebuilds the inspector for the selected node, once nobody is typing into it.
     * @returns {void}
     */
    function drawInspector() { redrawKeepingFocus(ui.insp, drawInspectorNow); }

    /**
     * Rebuilds the inspector for the selected node, right now.
     * @returns {void}
     */
    function drawInspectorNow() {
      ui.insp.innerHTML = '';
      const m = model();
      if (!m) return;
      const picked = selectedEntries();
      if (!picked.length) {
        const note = document.createElement('div');
        note.className = 'prow note';
        note.textContent = m.nodes.length
          ? 'Select a node in the tree, or click one in the viewport. Ctrl-click adds to the selection.'
          : 'This model has no nodes. Press + above to add one.';
        ui.insp.appendChild(note);
        return;
      }
      if (picked.length > 1) {
        const note = document.createElement('div');
        note.className = 'prow note';
        note.textContent = picked.length + ' nodes selected. The gizmo moves all of them; the ' +
          'fields below edit the first.';
        ui.insp.appendChild(note);
      }
      const entry = picked[0];
      const node = entry.node;

      ui.insp.appendChild(sectionHead('node'));
      ui.insp.appendChild(paramRow('name', { type: 'string', label: 'Name' }, node.name || '',
        (v) => { node.name = v; edited('rename node', true); }));
      // What the node is, stated rather than offered. Changing a box into a sphere throws away
      // every parameter and is exactly a delete and an add, so that is what a person does.
      const what = document.createElement('div');
      what.className = 'prow';
      const whatLabel = document.createElement('label');
      whatLabel.textContent = node.primitive ? 'Primitive' : 'Group';
      const whatValue = document.createElement('span');
      whatValue.style.cssText = 'color:var(--ink);font-size:11px';
      whatValue.textContent = node.primitive || 'holds its children and draws nothing itself';
      what.append(whatLabel, whatValue);
      ui.insp.appendChild(what);

      if (node.primitive) {
        const desc = Alloy.describeGeometry(node.primitive);
        const note = document.createElement('div');
        note.className = 'prow note';
        note.textContent = desc.description;
        ui.insp.appendChild(note);
        paramRows(ui.insp, desc.params, Object.assign({}, desc.defaults, node.params), (k, v) => {
          node.params = node.params || {};
          node.params[k] = v;
          edited('set ' + k);
        });
      }

      // --- Transform ---
      ui.insp.appendChild(sectionHead('transform'));
      vectorRow('Position', node.position || [0, 0, 0], 0.05, (v) => {
        node.position = v;
        edited('position');
      });
      const rot = node.rotation && node.rotation.length === 4
        ? Alloy.quat.toEuler([], node.rotation).map((d) => Math.round(d * 1e3) / 1e3)
        : (node.rotation || [0, 0, 0]);
      vectorRow('Rotation °', rot, 1, (v) => {
        // Written back as euler degrees whatever it arrived as. A quaternion in the data is for
        // an exporter and a clip; a person editing a rest pose wants the three numbers.
        node.rotation = v;
        edited('rotation');
      });
      vectorRow('Scale', node.scale || [1, 1, 1], 0.05, (v) => {
        node.scale = v;
        edited('scale');
      });

      // --- Appearance ---
      ui.insp.appendChild(sectionHead('appearance'));
      const matNames = [''].concat(Object.keys(pkg.materials || {}).sort());
      ui.insp.appendChild(paramRow('material', { type: 'enum', options: matNames, label: 'Material' },
        node.material || '', (v) => { node.material = v; edited('material', true); }));
      ui.insp.appendChild(paramRow('subdivide',
        { type: 'number', min: 0, max: 3, step: 1, label: 'Subdivide' },
        node.subdivide || 0, (v) => {
          node.subdivide = Math.round(v);
          if (!node.subdivide) delete node.subdivide;
          edited('subdivide', true);
        }));
      ui.insp.appendChild(paramRow('bone', { type: 'boolean', label: 'Is a bone' },
        !!node.bone, (v) => { node.bone = v; if (!v) delete node.bone; edited('bone', true); }));

      // --- UV projection ---
      const uv = node.uv || {};
      ui.insp.appendChild(sectionHead('uv projection'));
      const projNote = document.createElement('div');
      projNote.className = 'prow note';
      projNote.textContent = 'Scale is world units per repeat, so one number keeps texels the ' +
        'same size on everything however it is shaped.';
      ui.insp.appendChild(projNote);
      ui.insp.appendChild(paramRow('mode',
        { type: 'enum', options: ['default', 'box', 'planar', 'cylindrical'], label: 'Mode' },
        uv.mode || 'default', (v) => {
          if (v === 'default') delete node.uv;
          else node.uv = Object.assign({ scale: 1, axis: 'y' }, node.uv, { mode: v });
          edited('uv mode', true);
        }));
      if (uv.mode && uv.mode !== 'default') {
        if (uv.mode !== 'box') {
          ui.insp.appendChild(paramRow('axis', { type: 'enum', options: ['x', 'y', 'z'], label: 'Axis' },
            uv.axis || 'y', (v) => { node.uv.axis = v; edited('uv axis'); }));
        }
        ui.insp.appendChild(paramRow('scale',
          { type: 'number', min: 0.05, max: 32, step: 0.05, label: 'Units per repeat' },
          uv.scale === undefined ? 1 : uv.scale, (v) => { node.uv.scale = v; edited('uv scale'); }));
      }
    }

    /**
     * Three numeric fields on one row, for a position, a rotation or a scale.
     * @param {string} label - what it is
     * @param {number[]} value - the three current numbers
     * @param {number} step - the spinner increment
     * @param {function(number[]): void} onChange - called with a new triple
     * @returns {void}
     */
    function vectorRow(label, value, step, onChange) {
      const row = document.createElement('div');
      row.className = 'prow';
      const lab = document.createElement('label');
      lab.textContent = label;
      const ctl = document.createElement('div');
      ctl.className = 'ctl';
      for (let i = 0; i < 3; i++) {
        const n = document.createElement('input');
        n.type = 'number';
        n.step = step;
        n.style.flex = '1 1 0';
        n.value = Math.round((value[i] || 0) * 1e4) / 1e4;
        n.addEventListener('input', () => {
          const v = parseFloat(n.value);
          if (!Number.isFinite(v)) return;
          const next = value.slice();
          next[i] = v;
          onChange(next);
        });
        ctl.appendChild(n);
      }
      row.append(lab, ctl);
      ui.insp.appendChild(row);
    }

    // --- The toolbar ---

    /**
     * Rebuilds the toolbar above the viewport.
     * @returns {void}
     */
    function drawTools() {
      ui.tools.innerHTML = '';
      const letters = { translate: 'W', rotate: 'E', scale: 'R' };
      for (const mode of ['translate', 'rotate', 'scale']) {
        const b = miniButton(mode, mode + ' the selection (' + letters[mode] + ')', () => {
          view.mode = mode;
          drawTools();
        });
        b.classList.toggle('on', view.mode === mode);
        ui.tools.appendChild(b);
      }
      const space = miniButton('world', 'gizmo along the world axes rather than the parent\'s (L)', () => {
        view.space = view.space === 'world' ? 'parent' : 'world';
        drawTools();
      });
      space.classList.toggle('on', view.space === 'world');
      ui.tools.appendChild(space);
      const snap = miniButton('snap', 'round to the increment while dragging; hold Ctrl for the opposite', () => {
        view.snapping = !view.snapping;
        refreshGrid();
        drawTools();
      });
      snap.classList.toggle('on', view.snapping);
      ui.tools.appendChild(snap);

      const step = document.createElement('input');
      step.type = 'number';
      step.step = 0.05;
      step.min = 0;
      step.value = view.snapMove;
      step.title = 'snap increment for moving';
      step.style.cssText = 'flex:0 0 62px;font:inherit;font-size:11px;color:var(--ink);' +
        'background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:1px 4px';
      step.addEventListener('input', () => {
        const v = parseFloat(step.value);
        if (Number.isFinite(v) && v >= 0) { view.snapMove = v; refreshGrid(); }
      });
      ui.tools.appendChild(step);

      const uv = miniButton('uv check', 'show a checker instead of the materials', () => {
        view.uvCheck = !view.uvCheck;
        drawTools();
      });
      uv.classList.toggle('on', view.uvCheck);
      const grid = miniButton('grid', 'show the ground grid', () => {
        if (vp) vp.showGrid = !vp.showGrid;
        drawTools();
      });
      grid.classList.toggle('on', !vp || vp.showGrid);
      ui.tools.append(uv, grid);
      ui.tools.appendChild(miniButton('frame', 'fit the camera to the model', () => {
        if (vp && built) vp.camera.frameBounds(built.bounds.min, built.bounds.max, 1.5);
      }));

      const clips = Object.keys(modelClips()).sort();
      if (clips.length) {
        const sep = document.createElement('span');
        sep.style.cssText = 'color:var(--dim2);margin:0 2px';
        sep.textContent = '|';
        ui.tools.appendChild(sep);

        for (const cn of clips) {
          const playing = anim && anim.isPlaying(cn);
          const b = miniButton(cn, 'play ' + cn + ', crossfading from whatever is playing', () => {
            if (!anim) return;
            // Clicking the clip that is already playing stops it; clicking another crossfades.
            // One button per clip rather than a dropdown and a play button, because with three
            // clips the dropdown is more clicks and less information.
            if (anim.isPlaying(cn)) anim.stop(cn, 0.2);
            else anim.blendTo(cn, 0.25);
            drawTools();
          });
          b.classList.toggle('on', !!playing);
          ui.tools.appendChild(b);
        }
        ui.tools.appendChild(miniButton('+shrug', 'layer an additive clip over whatever is playing', () => {
          if (!anim || !modelClips().shrug) { log('<i>no additive clip here</i>'); return; }
          anim.play('shrug', { additive: true, loop: false, weight: 1 });
        }));
        ui.tools.appendChild(miniButton('stop', 'stop every clip', () => {
          if (anim) anim.stop(null, 0.2);
          drawTools();
        }));
      }

      const info = document.createElement('span');
      info.style.color = 'var(--dim2)';
      info.style.marginLeft = '4px';
      info.dataset.role = 'stats';
      ui.tools.appendChild(info);
      drawStats();
    }

    /**
     * Writes the first selected node's transform into the inspector's existing fields.
     *
     * A drag used to rebuild the whole inspector on every pointer event — twenty-odd rows of
     * inputs, per mouse move. The rows are still there; only their numbers changed.
     *
     * @returns {void}
     */
    function refreshTransformRows() {
      const picked = selectedEntries();
      if (!picked.length) return;
      const node = picked[0].node;
      const rows = ui.insp.querySelectorAll('.prow');
      /**
       * @param {string} label - the row's label
       * @param {number[]} vals - three numbers
       * @returns {boolean} - whether the row was found
       */
      function put(label, vals) {
        for (const row of rows) {
          const l = row.querySelector('label');
          if (!l || l.textContent !== label) continue;
          const inputs = row.querySelectorAll('input[type=number]');
          for (let i = 0; i < 3; i++) {
            if (inputs[i] && document.activeElement !== inputs[i]) inputs[i].value = Math.round((vals[i] || 0) * 1e4) / 1e4;
          }
          return true;
        }
        return false;
      }
      const rot = node.rotation && node.rotation.length === 4
        ? Alloy.quat.toEuler([], node.rotation).map((d) => Math.round(d * 1e3) / 1e3)
        : (node.rotation || [0, 0, 0]);
      if (!put('Position', node.position || [0, 0, 0])) { drawInspector(); return; }
      put('Rotation °', rot);
      put('Scale', node.scale || [1, 1, 1]);
    }

    /**
     * Refreshes the node and triangle count in the toolbar without rebuilding the toolbar.
     *
     * Separate from drawTools because it changes on every edit and the toolbar does not: a
     * count that was only right after a refresh said "1 nodes" under an eight-node chair.
     *
     * @returns {void}
     */
    function drawStats() {
      const info = ui.tools.querySelector('[data-role=stats]');
      if (!info) return;
      // The tree's count, not the merge's: the merge counts primitives and skips empty groups,
      // so it said "8 nodes" under a nine-row tree. A person counts rows.
      const m = model();
      info.textContent = built && m
        ? nodeIndex(m).length + ' nodes · ' + (built.mesh.count / 3) + ' tris · ' +
          built.groups.length + ' mat · ' + (built.bones.length - 1) + ' bones'
        : 'nothing built';
    }

    sync();
    drawTools();
    drawTree();
    drawInspector();
    if (vp && built) vp.camera.frameBounds(built.bounds.min, built.bounds.max, 1.5);

    return {
      /**
       * Re-reads the model from the package, after an undo or an edit made elsewhere.
       * @returns {void}
       */
      refresh() {
        const m = model();
        if (!m) return;
        // A crossfade finishes between refreshes, so the clip buttons are redrawn from the
        // animator rather than from what was clicked.
        // A path that no longer resolves is dropped rather than kept: after an undo the tree may
        // be a different shape, and a stale path would silently edit whatever moved into its place.
        const live = new Set(nodeIndex(m).map((e) => e.key));
        view.sel = view.sel.filter((k) => live.has(k));
        sync();
        drawTools();
        drawTree();
        drawInspector();
      },
      /**
       * Handles the keys this editor claims while it has focus.
       * @param {KeyboardEvent} ev - the keydown
       * @returns {boolean} - true when it was consumed
       */
      onKey(ev) {
        if (activeDrag) return false;   // a drag owns the keyboard while it runs
        const k = ev.key.toLowerCase();
        // Ctrl+D duplicates, the IntelliJ reflex. The shell's preventDefault on a handled key is
        // what keeps the browser from offering to bookmark the page; Ctrl+D is one of the few
        // browser keys a page is allowed to take. Shift+D does the same for Blender hands.
        if (k === 'd' && (ev.ctrlKey || ev.shiftKey) && !ev.altKey && !ev.metaKey) {
          if (!view.sel.length) { log('select a node to duplicate'); return true; }
          duplicateNodes();
          log('duplicated &middot; drag the copy where it goes');
          return true;
        }
        if (ev.ctrlKey || ev.metaKey || ev.altKey || ev.shiftKey) return false;
        if (k === 'w') { view.mode = 'translate'; drawTools(); return true; }
        if (k === 'e') { view.mode = 'rotate'; drawTools(); return true; }
        if (k === 'r') { view.mode = 'scale'; drawTools(); return true; }
        if (k === 'l') { view.space = view.space === 'world' ? 'parent' : 'world'; drawTools(); return true; }
        if (k === 'f') {
          if (vp && built) vp.camera.frameBounds(built.bounds.min, built.bounds.max, 1.5);
          return true;
        }
        if (ev.key === 'Delete' || ev.key === 'Backspace') {
          if (view.sel.length) { deleteNodes(); return true; }
        }
        return false;
      },
      /**
       * Lets go of the viewport and everything it owns.
       * @returns {void}
       */
      dispose() {
        if (offEvents) offEvents();
        if (vp) vp.dispose();
      },
    };
  }

  //#endregion === Model Editor ===


  // =====================================================================
  //           Material Editor — the join between a texture and a model
  // =====================================================================
  //#region === Material Editor ===

  // *********************************************************************
  // MENTAL MODEL: A MATERIAL IS ONE MORE LEVEL OF INDIRECTION THAN SEEMS NECESSARY, right up to
  // the moment two hundred nodes want the same wall and one of them needs it tinted. A node names
  // a material, a material names a texture, and that is the whole of it.
  //
  // The preview is a sphere and a box, not a swatch. A flat square tells you the colour and
  // nothing about how the material behaves under a light, which is the only question a material
  // editor is asked.
  // *********************************************************************

  /**
   * Builds a material editor into a window body.
   * @param {HTMLElement} host - the window body
   * @param {string} name - the material's name
   * @returns {Object} - the editor
   */
  function makeMaterialEditor(host, name, win) {
    host.innerHTML =
      '<div class="tex">' +
        '<div class="tex-left">' +
          '<div data-ui="stage" style="flex:1 1 auto;min-height:0;position:relative"></div>' +
        '</div>' +
        '<div class="tex-right" style="flex:0 0 268px">' +
          '<div class="tex-insp" data-ui="insp"></div>' +
        '</div>' +
      '</div>';
    const ui = {};
    for (const el of host.querySelectorAll('[data-ui]')) ui[el.dataset.ui] = el;

    let ball = null, slab = null, tex = null, texKey = null;

    /**
     * The material this editor edits, read fresh from the package.
     * @returns {Object|null} - the material
     */
    function mat() { return (pkg.materials || {})[name] || null; }

    const vp = makeViewport(ui.stage, {
      camera: { target: [0, 0.35, 0], distance: 3.4, yaw: 28, pitch: 16 },
      draw: (port) => {
        const m = mat();
        if (!m || !ball) return;
        const resolve = () => ({
          color: rgbOf(m.color, '#ffffff'),
          emissive: rgbOf(m.emissive, '#000000'),
          texture: tex,
          alphaTest: m.alphaTest || 0,
          unlit: !!m.unlit,
        });
        const mat4 = Alloy.mat4;
        port.engine.drawMesh(ball, mat4.fromTranslation(mat4.create(), [0, 0.62, 0]), resolve());
        port.engine.drawMesh(slab, mat4.fromTranslation(mat4.create(), [0, 0.06, 0]), resolve());
      },
    });

    if (vp) {
      vp.spin = true;
      ball = vp.engine.makeMesh(Alloy.geometry.sphere({ radius: 0.5, widthSegments: 28, heightSegments: 18 }));
      slab = vp.engine.makeMesh(Alloy.geometry.projectUVs(
        Alloy.geometry.box({ width: 1.8, height: 0.12, depth: 1.8 }), { mode: 'box', scale: 0.9 }));
    }

    /**
     * Converts a stored hex colour into the float triple a draw call wants.
     * @param {string|number[]} c - the colour
     * @param {string} dflt - what to use when it is missing
     * @returns {number[]} - rgb in 0..1
     */
    function rgbOf(c, dflt) {
      const v = Alloy.texture.color(c || dflt);
      return [v[0], v[1], v[2]];
    }

    /**
     * Uploads the named texture if it changed.
     * @returns {void}
     */
    function syncTexture() {
      if (!vp) return;
      const m = mat();
      const t = m && m.texture ? pkg.textures[m.texture] : null;
      const key = t ? m.texture + JSON.stringify(t) : null;
      if (key === texKey) return;
      texKey = key;
      if (tex) { vp.engine.disposeTexture(tex); tex = null; }
      if (t) {
        try { tex = vp.engine.makeTexture(texturePixels(t)); } catch (err) { logError(err); }
      }
    }

    /**
     * Records an edit and refreshes everything showing this material.
     * @param {string} label - what changed
     * @returns {void}
     */
    function edited(label) {
      histTouch(label);
      syncTexture();
      draw();
      buildRail();
      // Every model window is showing this material on something, so they all have to re-resolve.
      for (const rec of winOpen.values()) {
        if (rec !== win && rec.editor && rec.editor.refresh) rec.editor.refresh();
      }
    }

    /**
     * Rebuilds the inspector.
     * @returns {void}
     */
    function draw() { redrawKeepingFocus(ui.insp, drawNow); }

    /**
     * Rebuilds the inspector, right now.
     * @returns {void}
     */
    function drawNow() {
      const m = mat();
      ui.insp.innerHTML = '';
      if (!m) return;
      ui.insp.appendChild(sectionHead('material'));
      ui.insp.appendChild(paramRow('color', { type: 'color', label: 'Tint' }, m.color || '#ffffff',
        (v) => { m.color = v; edited('material colour'); }));
      ui.insp.appendChild(paramRow('emissive', { type: 'color', label: 'Emissive' },
        m.emissive || '#000000', (v) => { m.emissive = v; edited('material emissive'); }));
      const note = document.createElement('div');
      note.className = 'prow note';
      note.textContent = 'Emissive is added after lighting, so it ignores every light. A lamp, ' +
        'a screen, a hot coal.';
      ui.insp.appendChild(note);

      ui.insp.appendChild(sectionHead('texture'));
      const texNames = [''].concat(Object.keys(pkg.textures).sort());
      ui.insp.appendChild(paramRow('texture', { type: 'enum', options: texNames, label: 'Texture' },
        m.texture || '', (v) => { m.texture = v; edited('material texture'); }));
      if (m.texture && !pkg.textures[m.texture]) {
        const bad = document.createElement('div');
        bad.className = 'prow note';
        bad.style.color = 'var(--bad)';
        bad.textContent = 'This material names a texture that is not in the package.';
        ui.insp.appendChild(bad);
      }

      ui.insp.appendChild(sectionHead('transparency'));
      ui.insp.appendChild(paramRow('alphaTest',
        { type: 'number', min: 0, max: 1, step: 0.02, label: 'Cutout at' },
        m.alphaTest || 0, (v) => { m.alphaTest = v; edited('alpha test'); }));
      const cut = document.createElement('div');
      cut.className = 'prow note';
      cut.textContent = 'Above zero, any pixel more transparent than this is discarded outright. ' +
        'Leaves, fences, ladders. There is no blended transparency and no sorting.';
      ui.insp.appendChild(cut);
      ui.insp.appendChild(paramRow('unlit', { type: 'boolean', label: 'Unlit' },
        !!m.unlit, (v) => { m.unlit = v; edited('unlit'); }));
    }

    syncTexture();
    draw();

    return {
      /**
       * Re-reads the material from the package.
       * @returns {void}
       */
      refresh() { syncTexture(); draw(); },
      /**
       * Lets go of the viewport.
       * @returns {void}
       */
      dispose() {
        if (vp && tex) vp.engine.disposeTexture(tex);
        if (vp) vp.dispose();
      },
    };
  }


  // =====================================================================
  //           Clip Editor — authoring a clip on a timeline
  // =====================================================================
  //#region === Clip Editor ===

  // *********************************************************************
  // MENTAL MODEL: THE CLIP IS THE TRUTH AND THE PLAYHEAD IS A QUESTION PUT TO IT. There is no
  // "current pose" stored anywhere: the viewport asks the animator what the clip says at the
  // playhead's time, every frame, and draws that.
  //
  // That is what makes AUTO-KEY simple rather than fiddly. Dragging a bone does not modify a
  // working pose that later has to be committed; it writes a keyframe at the playhead, and the
  // next frame the viewport asks the clip again and sees the change. Editing and previewing are
  // the same path, so they cannot disagree — which is the failure mode of every editor that keeps
  // a pose buffer beside its data.
  //
  // THE TIMELINE IS ONE CANVAS, not a DOM node per key. A clip with six bones and forty keys each
  // is nearly a thousand elements to build, lay out and hit-test, and the browser is slower at
  // that than at drawing a thousand diamonds. Hit testing is arithmetic on the same coordinates
  // the drawing used, which also means what you click is exactly what you see.
  // *********************************************************************

  const TIMELINE = {
    rulerH: 18,      // the time ruler along the top
    eventH: 14,      // the strip event markers live on
    rowH: 17,        // one bone's track
    labelW: 96,      // the bone names down the left
    padR: 12,
  };

  /**
   * Rounds a time to something a person would have typed.
   * @param {number} t - the time in seconds
   * @returns {number} - the time at four decimals
   */
  function tidyTime(t) { return Math.round(t * 1e4) / 1e4; }

  /**
   * Writes a keyframe into a clip, replacing one at the same time.
   *
   * Keys within a thousandth of a second are the same key. Without that, scrubbing to "the same"
   * frame twice and keying leaves two keys a microsecond apart, and the segment between them is an
   * instant jump that nothing in the UI is large enough to show.
   *
   * @param {Object} clip - the clip
   * @param {string} bone - the bone's name
   * @param {string} channel - 'position', 'rotation' or 'scale'
   * @param {number} t - when
   * @param {number[]} v - the value
   * @param {string} [ease] - the easing from this key onward
   * @returns {Object} - the key that was written
   */
  function setClipKey(clip, bone, channel, t, v, ease) {
    clip.tracks = clip.tracks || {};
    const track = clip.tracks[bone] || (clip.tracks[bone] = {});
    const keys = track[channel] || (track[channel] = []);
    const time = tidyTime(t);
    const value = v.map((n) => Math.round(n * 1e4) / 1e4);
    const at = keys.findIndex((k) => Math.abs(k.t - time) < 1e-3);
    if (at >= 0) {
      keys[at].v = value;
      if (ease) keys[at].ease = ease;
      return keys[at];
    }
    const key = { t: time, v: value };
    if (ease && ease !== 'linear') key.ease = ease;
    keys.push(key);
    keys.sort((a, b) => a.t - b.t);
    return key;
  }

  /**
   * Removes a keyframe, and the track and channel it leaves empty.
   * @param {Object} clip - the clip
   * @param {string} bone - the bone's name
   * @param {string} channel - which channel
   * @param {number} t - the key's time
   * @returns {boolean} - true when something was removed
   */
  function removeClipKey(clip, bone, channel, t) {
    const track = clip.tracks && clip.tracks[bone];
    const keys = track && track[channel];
    if (!keys) return false;
    const at = keys.findIndex((k) => Math.abs(k.t - t) < 1e-3);
    if (at < 0) return false;
    keys.splice(at, 1);
    // An empty channel and then an empty track are cleaned up, so a clip never carries a track
    // that animates nothing and the validator never has to describe one.
    if (!keys.length) delete track[channel];
    if (!Object.keys(track).length) delete clip.tracks[bone];
    return true;
  }

  /**
   * Builds a clip editor into a window body.
   *
   * @param {HTMLElement} host - the window body
   * @param {string} name - the clip's name in the package
   * @param {Object} win - the window record
   * @returns {Object} - the editor
   */
  function makeClipEditor(host, name, win) {
    const view = {
      time: 0,
      playing: false,
      /** @type {string[]} selected bone names */ sel: [],
      /** @type {Object|null} the selected key: `{bone, channel, t}` */ key: null,
      mode: 'rotate',
      autoKey: true,
      onion: 0,
      snapFrames: 24,
      snapping: true,
      blendWith: '',
      blendMix: 0,
      dragging: null,
    };

    host.innerHTML =
      '<div class="tex">' +
        '<div class="tex-left">' +
          '<div class="tex-tools" data-ui="tools"></div>' +
          '<div data-ui="stage" style="flex:1 1 auto;min-height:0;position:relative"></div>' +
          '<div class="clip-time" data-ui="timewrap"><canvas data-ui="tl"></canvas></div>' +
        '</div>' +
        '<div class="tex-right">' +
          '<div class="tex-insp" data-ui="insp"></div>' +
        '</div>' +
      '</div>';
    const ui = {};
    for (const el of host.querySelectorAll('[data-ui]')) ui[el.dataset.ui] = el;

    let built = null, matTex = {}, anim = null, gizmos = null, ghost = null, dirtyKey = null;
    const poseMats = { main: null, onionA: null, onionB: null };

    /**
     * The clip this editor edits, read fresh from the package every time.
     * @returns {Object|null} - the clip
     */
    function clip() { return pkg.clips[name] || null; }

    /**
     * The model this clip drives.
     * @returns {Object|null} - the model
     */
    function model() {
      const c = clip();
      return c && c.model ? pkg.models[c.model] || null : null;
    }

    const vp = makeViewport(ui.stage, {
      camera: { target: [0, 1, 0], distance: 4.6, yaw: 26, pitch: 8 },
      draw: drawViewport,
    });
    if (vp) {
      gizmos = makeGizmoMeshes(vp.engine);
      vp.canvas.addEventListener('pointerdown', onViewportDown);
    }

    /**
     * Rebuilds everything when the clip, its model or the materials change.
     * @returns {void}
     */
    function sync() {
      if (!vp) return;
      const m = model();
      const c = clip();
      if (!c) return;
      const key = JSON.stringify(c) + '|' + JSON.stringify(m) + '|' + JSON.stringify(pkg.materials);
      if (key === dirtyKey) return;
      dirtyKey = key;

      if (built) vp.engine.disposeModel(built);
      built = null;
      anim = null;
      if (ghost) { vp.engine.disposeMesh(ghost); ghost = null; }
      if (!m) return;

      try {
        built = vp.engine.makeModel(m);
        matTex = uploadMaterialTextures(vp.engine, matTex);
        const clips = {};
        clips[name] = c;
        if (view.blendWith && pkg.clips[view.blendWith]) clips[view.blendWith] = pkg.clips[view.blendWith];
        anim = Alloy.makeAnimator({ model: m, bones: built.bones, clips });
        // One wireframe of the whole model, posed by whichever bone matrices it is handed. That
        // is what an onion skin is: the same ghost drawn at a different time.
        ghost = vp.engine.makeLines(Alloy.geometry.edgeLines(built.mesh.geometry, [1, 1, 1]));
        const n = built.bones.length * 16;
        poseMats.main = new Float32Array(n);
        poseMats.onionA = new Float32Array(n);
        poseMats.onionB = new Float32Array(n);
      } catch (err) {
        logError(err);
      }
    }

    /**
     * Records an edit and refreshes everything showing this clip.
     * @param {string} label - what changed
     * @returns {void}
     */
    function edited(label) {
      histTouch(label);
      dirtyKey = null;
      sync();
      drawTimeline();
      drawInspector();
      buildRail();
    }

    /**
     * The clip's length, never zero.
     * @returns {number} - seconds
     */
    function duration() { const c = clip(); return Math.max(1e-3, (c && c.duration) || 1); }

    /**
     * Rounds a time to the frame grid when snapping is on.
     * @param {number} t - the time
     * @returns {number} - the snapped time
     */
    function snapTime(t) {
      if (!view.snapping || view.snapFrames <= 0) return clamp(t, 0, duration());
      const step = 1 / view.snapFrames;
      return clamp(Math.round(t / step) * step, 0, duration());
    }

    // --- The viewport ---

    /**
     * Draws the model at the playhead, plus onion skins and the gizmo.
     * @param {Object} port - the viewport
     * @param {number} dt - seconds since the last frame
     * @returns {void}
     */
    function drawViewport(port, dt) {
      if (!built || !anim) return;
      const engine = port.engine;

      if (view.playing) {
        view.time += dt;
        const dur = duration();
        const c = clip();
        if (c && c.loop !== false) view.time = ((view.time % dur) + dur) % dur;
        else if (view.time >= dur) { view.time = dur; view.playing = false; drawTools(); }
        drawTimeline();
      }

      // Onion skins first, so the solid pose draws over them.
      if (view.onion > 0) {
        const step = view.onion;
        for (const [t, mats, shade] of [[view.time - step, poseMats.onionA, 0.32],
                                        [view.time + step, poseMats.onionB, 0.32]]) {
          anim.poseAt([{ clip: name, time: wrapTime(t), weight: 1 }], mats);
          engine.drawLines(ghost, null, [shade, shade * 0.9, shade * 1.15], mats);
        }
      }

      anim.poseAt(poseSpecs(), poseMats.main);
      built.boneMatrices.set(poseMats.main);
      engine.drawModel(built, null, materialResolver(matTex));

      drawGizmo(engine);
    }

    /**
     * What the viewport should be posed with: this clip, and the blend partner if one is chosen.
     * @returns {Array<Object>} - poseAt specs
     */
    function poseSpecs() {
      const mix = view.blendWith && pkg.clips[view.blendWith] ? clamp(view.blendMix, 0, 1) : 0;
      if (!mix) return [{ clip: name, time: view.time, weight: 1 }];
      const other = pkg.clips[view.blendWith];
      // The partner is sampled at the SAME PHASE, not the same second: comparing a one-second walk
      // against a three-second idle at t = 0.5 would compare the middle of one with the first
      // sixth of the other, which is not the transition anybody is testing.
      const phase = view.time / duration();
      return [
        { clip: name, time: view.time, weight: 1 - mix },
        { clip: view.blendWith, time: phase * Math.max(1e-3, other.duration || 1), weight: mix },
      ];
    }

    /**
     * Wraps a time into the clip, for onion skins that run off either end.
     * @param {number} t - the time
     * @returns {number} - a time inside the clip
     */
    function wrapTime(t) {
      const dur = duration();
      return ((t % dur) + dur) % dur;
    }

    //#endregion === Clip Editor ===

    // --- The gizmo, which writes keyframes instead of transforms ---

    /**
     * Where the gizmo sits for the selected bone, in the pose that is on screen.
     * @returns {Object|null} - `{pivot, basis, size, bone}` or null
     */
    function gizmoState() {
      if (!anim || !view.sel.length || !vp) return null;
      const boneName = view.sel[0];
      const world = anim.worldOf(boneName);
      if (!world) return null;
      const pivot = [world[12], world[13], world[14]];
      // The bone's OWN axes, because a rotation key is written in the bone's local space and a
      // gizmo along the world axes would not match the numbers it produces.
      const basis = [0, 1, 2].map((i) => {
        const col = [world[i * 4], world[i * 4 + 1], world[i * 4 + 2]];
        const len = Alloy.vec3.len(col);
        return len > 1e-8 ? Alloy.vec3.scale(col, col, 1 / len)
                          : [i === 0 ? 1 : 0, i === 1 ? 1 : 0, i === 2 ? 1 : 0];
      });
      return { pivot, basis, size: gizmoScale(vp.camera, pivot), mode: view.mode, bone: boneName };
    }

    /**
     * Draws the gizmo over the posed model.
     * @param {Object} engine - the renderer
     * @returns {void}
     */
    function drawGizmo(engine) {
      const state = gizmoState();
      if (!state) return;
      engine.clearDepth();
      const mat4 = Alloy.mat4;
      const g = mat4.create();
      for (let i = 0; i < 3; i++) {
        g[i] = state.basis[0][i] * state.size;
        g[4 + i] = state.basis[1][i] * state.size;
        g[8 + i] = state.basis[2][i] * state.size;
      }
      g[12] = state.pivot[0]; g[13] = state.pivot[1]; g[14] = state.pivot[2];
      engine.drawLines(gizmos[view.mode], g, GIZMO_DIM);
    }

    /**
     * Grabs a gizmo handle, or picks the bone under the pointer.
     * @param {PointerEvent} ev - the pointerdown
     * @returns {void}
     */
    function onViewportDown(ev) {
      if (ev.button !== 0 || ev.shiftKey || !anim) return;
      const r = vp.canvas.getBoundingClientRect();
      const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
      const state = gizmoState();
      const handle = state ? gizmoHit(state, vp, sx, sy) : null;
      // Bones drag by axis only, for now: the plane squares and the centre cube are drawn
      // because the gizmo is shared, and they are simply not grabbable here yet.
      if (handle && handle.kind === 'axis') { beginBoneDrag(ev, state, handle); return; }
      if (handle) return;
      pickBone(ev, sx, sy);
    }

    /**
     * Selects the bone whose part the pointer's ray hits first, in the POSED model.
     * @param {PointerEvent} ev - the pointerdown
     * @param {number} sx - pointer x in canvas pixels
     * @param {number} sy - pointer y in canvas pixels
     * @returns {void}
     */
    function pickBone(ev, sx, sy) {
      if (!built) return;
      const ray = viewportRay(vp, sx, sy);
      let best = null, bestT = Infinity;
      for (const part of built.parts) {
        // The part bounds are the REST pose, so this picks where the limb started rather than
        // where it is now. Good enough to choose a limb and honest about being approximate; a
        // per-frame rebuild of every bound would cost more than it is worth here.
        const t = Alloy.pick.rayAABB(ray.origin, ray.dir, part.bounds.min, part.bounds.max);
        if (t >= 0 && t < bestT) { bestT = t; best = part; }
      }
      if (!best) { view.sel = []; drawTimeline(); drawInspector(); return; }
      // Walk up from the picked node to the bone that governs it, which is what can be animated.
      const boneIndex = built.geometry ? 0 : 0;
      const bone = built.bones[built.mesh.geometry.joints[built.mesh.geometry.indices[best.indexStart]]];
      view.sel = bone && bone.name ? [bone.name] : [];
      drawTimeline();
      drawInspector();
    }

    /**
     * Drags a bone, writing a keyframe at the playhead as it goes.
     * @param {PointerEvent} ev - the pointerdown
     * @param {Object} state - the gizmo state at grab time
     * @param {Object} axis - which axis was grabbed
     * @returns {void}
     */
    function beginBoneDrag(ev, state, axis) {
      ev.preventDefault();
      ev.stopPropagation();
      const c = clip();
      const boneName = state.bone;
      const vec3 = Alloy.vec3, quat = Alloy.quat;
      const dir = state.basis[axis.index];
      const r = vp.canvas.getBoundingClientRect();
      // What the clip says this bone is doing right now. Every step of the drag is measured from
      // here rather than from the previous frame, so a snapping drag cannot ratchet.
      const start = anim.sampleLocal(name, boneName, view.time);
      if (!start) return;
      const startEuler = quat.toEuler([], start.rotation);
      const first = measure(ev.clientX - r.left, ev.clientY - r.top);
      vp.canvas.setPointerCapture(ev.pointerId);
      view.dragging = axis.key;
      // The key that was at the playhead before this drag, if any, so Escape can put it back —
      // or take away the one the drag wrote.
      const channel = view.mode === 'rotate' ? 'rotation' : view.mode === 'translate' ? 'position' : 'scale';
      const hadKeys = (c.tracks && c.tracks[boneName] && c.tracks[boneName][channel]) || [];
      const had = hadKeys.find((k) => Math.abs(k.t - view.time) < 1e-3);
      const hadValue = had ? had.v.slice() : null;
      activeDrag = {
        /**
         * Restores the key that was there, or removes the one this drag made.
         * @returns {void}
         */
        cancel() {
          if (hadValue) setClipKey(c, boneName, channel, view.time, hadValue);
