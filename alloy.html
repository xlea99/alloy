    const CL_ORDER = [16, 17, 18, 0, 8, 7, 9, 6, 10, 5, 11, 4, 12, 3, 13, 2, 14, 1, 15];

    /**
     * Compresses bytes into a deflate stream with dynamic Huffman codes, one final block.
     * @param {Uint8Array} data - the bytes to compress
     * @returns {Uint8Array} - a raw deflate stream
     */
    function deflateDynamic(data) {
      const { count, lens, vals } = lz77(data);

      // Frequencies, then the two trees.
      const litFreq = new Uint32Array(286), distFreq = new Uint32Array(30);
      for (let t = 0; t < count; t++) {
        if (lens[t]) { litFreq[257 + lengthCode(lens[t])]++; distFreq[distanceCode(vals[t])]++; }
        else litFreq[vals[t]]++;
      }
      litFreq[256]++;
      const litLen = huffmanLengths(litFreq, 15);
      const distLen = huffmanLengths(distFreq, 15);
      // A block with no matches still has to declare a distance tree; one code of length one
      // is what the RFC suggests for exactly this case.
      if (!distLen.some((l) => l)) distLen[0] = 1;
      const litCode = canonicalCodes(litLen), distCode = canonicalCodes(distLen);

      let hlit = 286; while (hlit > 257 && !litLen[hlit - 1]) hlit--;
      let hdist = 30; while (hdist > 1 && !distLen[hdist - 1]) hdist--;

      // The code lengths themselves are sent run-length coded through a third, tiny alphabet.
      const all = [];
      for (let s = 0; s < hlit; s++) all.push(litLen[s]);
      for (let s = 0; s < hdist; s++) all.push(distLen[s]);
      const seq = [];                     // [symbol, extraValue, extraBits]
      for (let i = 0; i < all.length;) {
        const v = all[i];
        let run = 1;
        while (i + run < all.length && all[i + run] === v) run++;
        if (v === 0 && run >= 3) {
          const take = Math.min(run, 138);
          if (take <= 10) seq.push([17, take - 3, 3]); else seq.push([18, take - 11, 7]);
          i += take;
        } else if (v !== 0 && run >= 4) {
          seq.push([v, 0, 0]);
          let left = run - 1;
          i += 1;
          while (left >= 3) { const take = Math.min(left, 6); seq.push([16, take - 3, 2]); left -= take; i += take; }
        } else {
          seq.push([v, 0, 0]);
          i++;
        }
      }
      const clFreq = new Uint32Array(19);
      for (const item of seq) clFreq[item[0]]++;
      const clLen = huffmanLengths(clFreq, 7);
      const clCode = canonicalCodes(clLen);
      let hclen = 19; while (hclen > 4 && !clLen[CL_ORDER[hclen - 1]]) hclen--;

      const bw = makeBitWriter();
      bw.bits(1, 1);                    // final block
      bw.bits(2, 2);                    // dynamic Huffman
      bw.bits(hlit - 257, 5);
      bw.bits(hdist - 1, 5);
      bw.bits(hclen - 4, 4);
      for (let i = 0; i < hclen; i++) bw.bits(clLen[CL_ORDER[i]], 3);
      for (const [sym, extra, extraBits] of seq) {
        bw.huff(clCode[sym], clLen[sym]);
        if (extraBits) bw.bits(extra, extraBits);
      }
      for (let t = 0; t < count; t++) {
        if (lens[t]) {
          const lc = lengthCode(lens[t]);
          bw.huff(litCode[257 + lc], litLen[257 + lc]);
          if (LENGTH_EXTRA[lc]) bw.bits(lens[t] - LENGTH_BASE[lc], LENGTH_EXTRA[lc]);
          const dc = distanceCode(vals[t]);
          bw.huff(distCode[dc], distLen[dc]);
          if (DIST_EXTRA[dc]) bw.bits(vals[t] - DIST_BASE[dc], DIST_EXTRA[dc]);
        } else {
          bw.huff(litCode[vals[t]], litLen[vals[t]]);
        }
      }
      bw.huff(litCode[256], litLen[256]);
      return bw.finish();
    }

    /**
     * The smaller of the two deflate flavours for a buffer. Fixed codes win only on inputs too
     * small to pay for a tree, which a 1×1 texture is and a 16×16 one is not.
     * @param {Uint8Array} data - the bytes to compress
     * @returns {Uint8Array} - a raw deflate stream
     */
    function deflate(data) {
      const dynamic = deflateDynamic(data);
      if (data.length > 512) return dynamic;
      const fixed = deflateFixed(data);
      return fixed.length < dynamic.length ? fixed : dynamic;
    }

    /**
     * Wraps a raw deflate stream as zlib: the two-byte header, then an Adler-32 of the input.
     * @param {Uint8Array} deflated - the raw stream
     * @param {Uint8Array} raw - what was compressed, for the checksum
     * @returns {Uint8Array} - a zlib stream
     */
    function zlibWrap(deflated, raw) {
      // 0x78 is a 32K window with deflate, 0x01 makes the two bytes a multiple of 31, which is
      // the header's own check.
      const out = new Uint8Array(2 + deflated.length + 4);
      out[0] = 0x78; out[1] = 0x01;
      out.set(deflated, 2);
      const ad = adler32(raw);
      out[out.length - 4] = (ad >>> 24) & 0xff;
      out[out.length - 3] = (ad >>> 16) & 0xff;
      out[out.length - 2] = (ad >>> 8) & 0xff;
      out[out.length - 1] = ad & 0xff;
      return out;
    }

    /**
     * Finds the palette of an RGBA buffer, if it has 256 colours or fewer.
     *
     * Entries with any transparency come first, so the tRNS chunk — which may stop at the last
     * non-opaque entry — is as short as it can be.
     *
     * @param {Uint8Array} rgba - the pixels, 4 bytes each
     * @returns {Object|null} - `{indices, plte, trns}` or null when there are too many colours
     */
    function paletteOf(rgba) {
      const seen = new Map();
      const keys = [];
      for (let i = 0; i < rgba.length; i += 4) {
        const k = ((rgba[i] << 24) | (rgba[i + 1] << 16) | (rgba[i + 2] << 8) | rgba[i + 3]) >>> 0;
        if (!seen.has(k)) {
          if (keys.length === 256) return null;
          seen.set(k, keys.length);
          keys.push(k);
        }
      }
      const order = keys.map((k, i) => i).sort((a, b) => ((keys[a] & 255) === 255 ? 1 : 0) - ((keys[b] & 255) === 255 ? 1 : 0) || a - b);
      const slot = new Uint8Array(keys.length);
      order.forEach((original, at) => { slot[original] = at; });
      const plte = new Uint8Array(keys.length * 3);
      let lastAlpha = -1;
      const alphas = new Uint8Array(keys.length);
      order.forEach((original, at) => {
        const k = keys[original];
        plte[at * 3] = (k >>> 24) & 255; plte[at * 3 + 1] = (k >>> 16) & 255; plte[at * 3 + 2] = (k >>> 8) & 255;
        alphas[at] = k & 255;
        if (alphas[at] !== 255) lastAlpha = at;
      });
      const indices = new Uint8Array(rgba.length / 4);
      for (let i = 0, j = 0; i < rgba.length; i += 4, j++) {
        const k = ((rgba[i] << 24) | (rgba[i + 1] << 16) | (rgba[i + 2] << 8) | rgba[i + 3]) >>> 0;
        indices[j] = slot[seen.get(k)];
      }
      return { indices, plte, trns: lastAlpha >= 0 ? alphas.subarray(0, lastAlpha + 1) : null };
    }

    /**
     * Filters every row of an image, adaptively or with no filter at all.
     * @param {Uint8Array} bytes - the image, `bpp` bytes per pixel
     * @param {number} width - image width
     * @param {number} height - image height
     * @param {number} bpp - bytes per pixel
     * @param {boolean} adaptive - choose per row, or write filter 0 everywhere
     * @returns {Uint8Array} - the filtered rows, each with its filter byte
     */
    function filterImage(bytes, width, height, bpp, adaptive) {
      const stride = width * bpp;
      const out = new Uint8Array((stride + 1) * height);
      for (let y = 0; y < height; y++) {
        if (adaptive) filterRow(bytes, y, width, out, y * (stride + 1), bpp);
        else { out[y * (stride + 1)] = 0; out.set(bytes.subarray(y * stride, (y + 1) * stride), y * (stride + 1) + 1); }
      }
      return out;
    }

    /**
     * Chooses a scanline filter and writes the filtered row.
     *
     * The heuristic is the one from the PNG specification: try all five and keep the one whose
     * bytes, read as signed, have the smallest total magnitude. Values near zero are what the
     * compressor can turn into short codes, so the sum of absolute differences is a good proxy
     * for the compressed size at a fraction of the cost of actually compressing five times.
     *
     * @param {Uint8Array} rgba - the whole image, `bpp` bytes per pixel
     * @param {number} y - the row index
     * @param {number} width - image width
     * @param {Uint8Array} out - destination, receives 1 filter byte plus the row
     * @param {number} at - where in `out` to write
     * @param {number} [bytesPerPixel] - 4 for RGBA, 1 for palette indices; default 4
     * @returns {void}
     */
    function filterRow(rgba, y, width, out, at, bytesPerPixel) {
      const bpp = bytesPerPixel || 4, stride = width * bpp;
      const row = y * stride, prevRow = row - stride;
      let bestType = 0, bestScore = Infinity;
      const candidate = new Uint8Array(stride);
      const chosen = new Uint8Array(stride);

      for (let type = 0; type < 5; type++) {
        let score = 0;
        for (let x = 0; x < stride; x++) {
          const raw = rgba[row + x];
          const a = x >= bpp ? rgba[row + x - bpp] : 0;
          const b = y > 0 ? rgba[prevRow + x] : 0;
          const c = (x >= bpp && y > 0) ? rgba[prevRow + x - bpp] : 0;
          let v;
          switch (type) {
            case 0: v = raw; break;
            case 1: v = raw - a; break;
            case 2: v = raw - b; break;
            case 3: v = raw - ((a + b) >> 1); break;
            default: {
              const p = a + b - c;
              const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
              v = raw - (pa <= pb && pa <= pc ? a : (pb <= pc ? b : c));
            }
          }
          v &= 0xff;
          candidate[x] = v;
          score += v < 128 ? v : 256 - v;
        }
        if (score < bestScore) { bestScore = score; bestType = type; chosen.set(candidate); }
      }
      out[at] = bestType;
      out.set(chosen, at + 1);
    }

    /**
     * Encodes a pixel buffer as a PNG and returns it as base64.
     *
     * 8-bit, never interlaced, one IDAT. Colour type is RGBA, or a palette when the image has
     * 256 colours or fewer — which the chunky textures this engine makes usually do, and which
     * roughly halves the file again on top of what the dynamic Huffman codes save. The caller
     * never chooses: every applicable encoding is tried and the shortest wins, and any PNG
     * reader opens the result.
     *
     * @param {Pixels} px - the buffer to encode
     * @returns {string} - base64 PNG, with no data URL prefix
     */
    function encodePNG(px) {
      const width = px.width, height = px.height;
      const rgba = pixelsToBytes(px);

      // Every encoding that applies is tried and the shortest file wins. Nothing about this is a
      // choice the caller makes: the file is a valid PNG whichever way it went, and the only
      // difference is how many bytes the data block carries.
      const candidates = [{ type: 6, bytes: rgba, bpp: 4, adaptive: true, plte: null, trns: null }];
      const pal = paletteOf(rgba);
      if (pal) {
        // Palette rows are indices, not intensities, so filtering them is a coin toss: the
        // specification recommends none, experience says sometimes. Both are tried.
        candidates.push({ type: 3, bytes: pal.indices, bpp: 1, adaptive: true, plte: pal.plte, trns: pal.trns });
        candidates.push({ type: 3, bytes: pal.indices, bpp: 1, adaptive: false, plte: pal.plte, trns: pal.trns });
      }

      let best = null;
      for (const c of candidates) {
        const filtered = filterImage(c.bytes, width, height, c.bpp, c.adaptive);
        const zlib = zlibWrap(deflate(filtered), filtered);
        const ihdr = new Uint8Array(13);
        const dv = new DataView(ihdr.buffer);
        dv.setUint32(0, width);
        dv.setUint32(4, height);
        ihdr[8] = 8;          // bit depth
        ihdr[9] = c.type;     // colour type: RGBA, or palette
        ihdr[10] = 0;         // compression: deflate
        ihdr[11] = 0;         // filter method: adaptive per row
        ihdr[12] = 0;         // interlace: none
        const chunks = [makeChunk('IHDR', ihdr)];
        if (c.plte) chunks.push(makeChunk('PLTE', c.plte));
        if (c.trns) chunks.push(makeChunk('tRNS', c.trns));
        chunks.push(makeChunk('IDAT', zlib), makeChunk('IEND', new Uint8Array(0)));
        let total = 8;
        for (const ch of chunks) total += ch.length;
        if (best && total >= best.length) continue;
        const file = new Uint8Array(total);
        file.set(PNG_SIGNATURE, 0);
        let at = 8;
        for (const ch of chunks) { file.set(ch, at); at += ch.length; }
        best = file;
      }
      return base64Encode(best);
    }

    /**
     * Wraps chunk data in its length, type and CRC.
     * @param {string} type - the four-character chunk name
     * @param {Uint8Array} data - the chunk's payload
     * @returns {Uint8Array} - the complete chunk
     */
    function makeChunk(type, data) {
      const out = new Uint8Array(12 + data.length);
      const dv = new DataView(out.buffer);
      dv.setUint32(0, data.length);
      for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
      out.set(data, 8);
      // The CRC covers the type and the data, and not the length. A decoder that includes the
      // length rejects every valid PNG in the world, which is a memorable afternoon.
      dv.setUint32(8 + data.length, crc32(out, 4, 8 + data.length));
      return out;
    }

    //#endregion === PNG ===


    // *********************************************************************
    //           Atlas — many textures, one upload
    // *********************************************************************
    //#region === Atlas ===

    // *********************************************************************
    // MENTAL MODEL: an atlas exists to make DRAW CALLS cheaper, not memory. Every change of bound
    // texture is a state change the GPU pays for, so a scene of forty small textures is forty
    // draw calls that could have been one. Packed into a single image with a rect per entry, the
    // whole scene draws in one.
    //
    // The price is exact and worth stating: an atlased texture CANNOT TILE. Sampling past the
    // edge of a rect lands in a neighbour, so a wall that repeats its bricks four times across
    // has to stay out of the atlas. Filtering makes it worse — a linear sample near a rect's edge
    // reaches a texel into whatever is next to it — which is why entries are padded here and why
    // the padding is copied from the edge rather than left transparent.
    //
    // Shelf packing, not a skyline or a maxrects. Sorted by height, laid left to right, wrapped
    // to a new shelf when the row fills. It wastes a little space on very mixed sizes and it is
    // twenty lines; the good packers are several hundred for a few percent, and a texture atlas
    // that is one power of two larger costs nothing anybody can feel.
    // *********************************************************************

    /**
     * Packs several pixel buffers into one, with a rect for each.
     *
     * TWO SETS OF RECTS COME BACK, and the difference between them has already cost one bug.
     *
     * `rects` are in TEXTURE COORDINATES, ready to hand straight to a material's `uvRect`. They
     * account for the vertical flip that makeTexture applies by default, because a pixel buffer's
     * row 0 is its top while texture coordinate v = 0 is the bottom. Getting this wrong does not
     * produce a wrong-looking texture; it samples the empty part of the atlas and the object goes
     * black, which looks like a lighting problem and is not one.
     *
     * `pixelRects` are in IMAGE pixels with the origin at the top left, which is what a workbench
     * wants when it draws a selection box over a picture of the atlas.
     *
     * @param {Array<{name: string, pixels: Pixels}>} entries - what to pack
     * @param {Object} [opts] - packing options
     * @param {number} [opts.padding] - edge-extended border around each entry, default 1
     * @param {number} [opts.maxSize] - largest atlas to try, default MAX_TEXTURE_SIZE
     * @param {boolean} [opts.flipY] - whether the atlas will be uploaded flipped, default true
     * @returns {Object} - { pixels, rects, pixelRects, size }
     */
    function packAtlas(entries, opts) {
      const padding = (opts && opts.padding !== undefined) ? opts.padding : 1;
      const maxSize = (opts && opts.maxSize) || MAX_TEXTURE_SIZE;

      const items = entries.map((e, i) => ({
        name: e.name, px: e.pixels, order: i,
        w: e.pixels.width + padding * 2, h: e.pixels.height + padding * 2,
      }));
      // Tallest first, and ties broken by the original order so packing is deterministic.
      items.sort((a, b) => (b.h - a.h) || (a.order - b.order));

      let size = 1;
      while (size < maxSize) {
        if (tryShelfPack(items, size)) break;
        size *= 2;
      }
      if (!tryShelfPack(items, size)) {
        throw new Error('Alloy atlas: these ' + entries.length + ' textures do not fit in ' +
                        maxSize + ' pixels square. Bake fewer of them, or make them smaller.');
      }

      const flipY = !(opts && opts.flipY === false);
      const atlas = makePixels(size, size, [0, 0, 0, 0]);
      const rects = {};
      const pixelRects = {};
      for (const it of items) {
        const x = it.x + padding, y = it.y + padding;
        blitInto(atlas, it.px, x, y, padding);
        pixelRects[it.name] = [x, y, it.px.width, it.px.height];
        // Under a flipped upload the entry's TOP edge in the image is its HIGHEST v, so the rect's
        // origin is measured from the far side: v0 = 1 - (y + height) / size.
        const v0 = flipY ? (size - y - it.px.height) / size : y / size;
        rects[it.name] = [x / size, v0, it.px.width / size, it.px.height / size];
      }
      return { pixels: atlas, rects, pixelRects, size };
    }

    /**
     * Tries to lay every item out in a square of the given size, writing x and y onto each.
     * @param {Object[]} items - the items, tallest first
     * @param {number} size - the square's side
     * @returns {boolean} - true when they all fit
     */
    function tryShelfPack(items, size) {
      let shelfY = 0, shelfH = 0, x = 0;
      for (const it of items) {
        if (it.w > size) return false;
        if (x + it.w > size) { shelfY += shelfH; x = 0; shelfH = 0; }
        if (shelfY + it.h > size) return false;
        it.x = x; it.y = shelfY;
        x += it.w;
        if (it.h > shelfH) shelfH = it.h;
      }
      return true;
    }

    /**
     * Copies one buffer into another at an offset, extending its edge pixels outward by `bleed`.
     *
     * The bleed is what stops a neighbour's colours appearing along an entry's edge under linear
     * filtering or a mipmap. Duplicating the edge row rather than leaving it transparent means
     * the worst a filtered sample can do is read the entry's own edge twice.
     *
     * @param {Pixels} dst - destination
     * @param {Pixels} src - source
     * @param {number} ox - left edge in dst
     * @param {number} oy - top edge in dst
     * @param {number} bleed - how many pixels of edge extension to write around it
     * @returns {void}
     */
    function blitInto(dst, src, ox, oy, bleed) {
      const d = dst.data, s = src.data;
      for (let y = -bleed; y < src.height + bleed; y++) {
        const sy = clamp(y, 0, src.height - 1);
        const dy = oy + y;
        if (dy < 0 || dy >= dst.height) continue;
        for (let x = -bleed; x < src.width + bleed; x++) {
          const sx = clamp(x, 0, src.width - 1);
          const dx = ox + x;
          if (dx < 0 || dx >= dst.width) continue;
          const di = (dy * dst.width + dx) * 4, si = (sy * src.width + sx) * 4;
          d[di] = s[si]; d[di + 1] = s[si + 1]; d[di + 2] = s[si + 2]; d[di + 3] = s[si + 3];
        }
      }
    }

    //#endregion === Atlas ===


    // *********************************************************************
    //           Introspection — what a texture can be made of
    // *********************************************************************
    //#region === Texture Introspection ===

    /**
     * Describes a generator: what it is, what it takes, what it defaults to.
     * @param {string} type - a key of TEXTURE_GENERATORS
     * @returns {Object} - { type, description, defaults, params }, freshly copied
     */
    function describeGenerator(type) {
      const spec = TEXTURE_GENERATORS[type];
      if (!spec) {
        throw new Error('Alloy.describeGenerator: unknown generator "' + type + '". Known ' +
                        'generators: ' + Object.keys(TEXTURE_GENERATORS).join(', ') + '.');
      }
      return {
        type, description: spec.description,
        defaults: JSON.parse(JSON.stringify(spec.defaults)),
        params: JSON.parse(JSON.stringify(spec.params)),
      };
    }

    /**
     * Describes a draw op.
     * @param {string} type - a key of DRAW_OPS
     * @returns {Object} - { type, description, defaults, params }, freshly copied
     */
    function describeDrawOp(type) {
      const spec = DRAW_OPS[type];
      if (!spec) {
        throw new Error('Alloy.describeDrawOp: unknown op "' + type + '". Known ops: ' +
                        Object.keys(DRAW_OPS).join(', ') + '.');
      }
      return {
        type, description: spec.description,
        defaults: JSON.parse(JSON.stringify(spec.defaults)),
        params: JSON.parse(JSON.stringify(spec.params)),
      };
    }

    /**
     * Describes an adjustment.
     * @param {string} type - a key of ADJUSTMENTS
     * @returns {Object} - { type, description, defaults, params }, freshly copied
     */
    function describeAdjustment(type) {
      const spec = ADJUSTMENTS[type];
      if (!spec) {
        throw new Error('Alloy.describeAdjustment: unknown adjustment "' + type + '". Known ' +
                        'adjustments: ' + Object.keys(ADJUSTMENTS).join(', ') + '.');
      }
      return {
        type, description: spec.description,
        defaults: JSON.parse(JSON.stringify(spec.defaults)),
        params: JSON.parse(JSON.stringify(spec.params)),
      };
    }

    //#endregion === Texture Introspection ===

    //#endregion === Texture ===


    // =====================================================================
    //           Package — everything a game loads, as one plain object
    // =====================================================================
    //#region === Package ===

    // *********************************************************************
    // MENTAL MODEL: a package is EVERYTHING one project needs from Alloy, as one plain object.
    // Textures now; models and clips as the phases that build them land. It is data, never a
    // class, and the engine owns its schema and its migrations forever.
    //
    // It lives in a `managed-data` block as a single `const`, which is the whole OFCU trick: the
    // block is JavaScript, so the browser parses it at load with no fetch and no build step, and
    // it is JSON-shaped, so a tool can read it as text and splice it without executing anything.
    //
    // The rule the OFCU Bible attaches to that block is the one to keep in mind here: a data block
    // may not depend on anything outside itself. Alloy makes that easy by never putting a function
    // in one. A texture layer is a generator's NAME and its numbers, so there is nothing to
    // serialize that a `JSON.parse` cannot read back.
    // *********************************************************************

    // Bumped when the shape of a package changes in a way that needs a migration. A package
    // carrying a HIGHER number than the engine is refused rather than half-read, because the
    // failure of loading a newer package with an older engine is silent and shaped like data loss.
    // 1: textures only.
    // 2: materials and models join them.
    // 3: clips join them.
    const PACKAGE_SCHEMA = 5;

    /**
     * Makes an empty package.
     * @param {string} [name] - what to call it
     * @returns {Object} - a new package
     */
    function emptyPackage(name) {
      return {
        schema: PACKAGE_SCHEMA,
        name: name || 'untitled',
        textures: {},
        materials: {},
        models: {},
        clips: {},
      };
    }

    /**
     * Migrates an older package forward.
     *
     * The engine carries every migration it has ever needed, forever. A package written a year
     * ago has to open, and the alternative — asking a person to find and fix their own data — is
     * how a format dies. Migrations only ever ADD; a package that loses a field on load is a
     * package that loses work.
     *
     * @param {Object} pkg - the package, modified in place
     * @returns {Object} - pkg
     */
    function migratePackage(pkg) {
      if (!pkg || typeof pkg !== 'object') return pkg;
      if (!pkg.schema || pkg.schema < 2) {
        if (!pkg.materials) pkg.materials = {};
        if (!pkg.models) pkg.models = {};
        pkg.schema = 2;
      }
      if (pkg.schema < 3) {
        if (!pkg.clips) pkg.clips = {};
        pkg.schema = 3;
      }
      if (pkg.schema < 4) {
        // A draw-ops layer becomes one shape row per op, folded together under a folder, so
        // every row is one source and blend, opacity, mask and region belong to each shape. The
        // engine still evaluates an `ops` row it meets in hand-written data; it just no longer
        // makes one.
        for (const name in (pkg.textures || {})) {
          const tex = pkg.textures[name];
          if (!tex || !Array.isArray(tex.layers)) continue;
          const next = [];
          let drawn = 0;
          for (const layer of tex.layers) {
            if (!layer || layer.type !== 'ops') { next.push(layer); continue; }
            drawn++;
            const folder = layer.folder || ('draw ' + drawn);
            for (const op of (Array.isArray(layer.ops) ? layer.ops : [])) {
              const row = { type: 'shape', op: JSON.parse(JSON.stringify(op)), folder };
              for (const k of ['enabled', 'blend', 'opacity', 'seed', 'clip']) if (layer[k] !== undefined) row[k] = layer[k];
              if (layer.mask) row.mask = JSON.parse(JSON.stringify(layer.mask));
              next.push(row);
            }
          }
          tex.layers = next;
        }
        pkg.schema = 4;
      }
      if (pkg.schema < 5) {
        // Pixels split in two. A raster row whose PNG is the texture's size is paint and drops
        // its `fit`; one of any other size is an image, kept as it came. A PNG that will not
        // even give up its header is left alone for the validator to name.
        for (const name in (pkg.textures || {})) {
          const tex = pkg.textures[name];
          if (!tex || !Array.isArray(tex.layers)) continue;
          /** @param {Object} row - a raster row, or a raster mask */
          const sort = (row) => {
            if (!row || row.type !== 'raster') return;
            if (typeof row.png === 'string' && row.png) {
              try {
                const size = pngSize(row.png);
                if (size.width !== tex.width || size.height !== tex.height) { row.type = 'image'; return; }
              } catch (err) { return; }
            }
            delete row.fit;
          };
          for (const layer of tex.layers) {
            if (!layer) continue;
            sort(layer);
            if (layer.mask) sort(layer.mask);
          }
        }
        pkg.schema = 5;
      }
      return pkg;
    }

    /**
     * Makes a new model: one box at the origin, which is the smallest thing that is visibly a
     * model rather than an empty tree.
     * @param {string} name - the model's name
     * @returns {Model} - a new model
     */
    function emptyModel(name) {
      return { name, nodes: [{ name: 'root', primitive: 'box', params: {}, material: '' }] };
    }

    /**
     * Makes a new material.
     * @param {string} name - the material's name
     * @returns {Object} - a new material
     */
    function emptyMaterial(name) {
      return { name, color: '#c8ccd4', texture: '', emissive: '#000000', alphaTest: 0 };
    }

    /**
     * Makes a new texture definition with one flat layer, which is what *New texture* produces.
     *
     * A single solid layer rather than nothing at all: an empty stack evaluates to transparent
     * black, which is indistinguishable from a broken preview, and the first thing anyone does is
     * add a base colour anyway.
     *
     * @param {string} name - the texture's name
     * @param {number} [size] - width and height, default 128
     * @returns {Texture} - a new texture definition
     */
    function emptyTexture(name, size) {
      const n = size || 128;
      return {
        name, width: n, height: n, seed: 1,
        layers: [{ type: 'generator', generator: 'solid', params: { color: '#7a7f88' } }],
      };
    }

    /**
     * Checks a package's shape and reports everything wrong with it at once.
     *
     * Everything, not the first thing. A package hand-written by a person or an AI is usually
     * wrong in several small ways, and a validator that stops at the first one turns a two-minute
     * fix into six rounds of running it again.
     *
     * @param {Object} pkg - the package to check
     * @returns {string[]} - one sentence per problem, empty when it is sound
     */
    function validatePackage(pkg) {
      const issues = [];
      if (!pkg || typeof pkg !== 'object') return ['A package must be an object.'];
      if (pkg.schema > PACKAGE_SCHEMA) {
        issues.push('This package is schema ' + pkg.schema + ' and this engine understands up to ' +
                    PACKAGE_SCHEMA + '. Update Alloy rather than loading it here.');
      }
      if (!pkg.textures || typeof pkg.textures !== 'object') {
        issues.push('A package needs a `textures` object, even an empty one.');
        return issues;
      }
      if (pkg.materials && typeof pkg.materials !== 'object') issues.push('`materials` must be an object.');
      if (pkg.models && typeof pkg.models !== 'object') issues.push('`models` must be an object.');

      for (const name in (pkg.materials || {})) {
        const m = pkg.materials[name];
        if (!m || typeof m !== 'object') { issues.push('material "' + name + '" is not an object.'); continue; }
        if (m.texture && !pkg.textures[m.texture]) {
          issues.push('material "' + name + '" names texture "' + m.texture + '", which is not in ' +
                      'this package.');
        }
      }

      for (const name in (pkg.models || {})) {
        const model = pkg.models[name];
        if (!model || !Array.isArray(model.nodes)) {
          issues.push('model "' + name + '" needs a `nodes` array.');
          continue;
        }
        const seen = new Set();
        /**
         * Checks one node and everything under it.
         * @param {ModelNode} node - the node
         * @param {string} path - where it is, for the message
         * @returns {void}
         */
        function checkNode(node, path) {
          if (!node || typeof node !== 'object') { issues.push(path + ' is not an object.'); return; }
          // A node listed as its own descendant recurses forever at merge time, and the stack
          // overflow that produces names nothing useful.
          if (seen.has(node)) { issues.push(path + ' appears twice in the tree, which is a cycle.'); return; }
          seen.add(node);
          if (node.primitive && PRIMITIVE_TYPES.indexOf(node.primitive) < 0) {
            issues.push(path + ' names primitive "' + node.primitive + '". Known primitives: ' +
                        PRIMITIVE_TYPES.join(', ') + '.');
          }
          if (node.material && pkg.materials && !pkg.materials[node.material]) {
            issues.push(path + ' names material "' + node.material + '", which is not in this package.');
          }
          if (node.rotation && node.rotation.length !== 3 && node.rotation.length !== 4) {
            issues.push(path + ' has a rotation of ' + node.rotation.length + ' numbers; it must ' +
                        'be three euler degrees or four quaternion components.');
          }
          if (node.children) {
            if (!Array.isArray(node.children)) issues.push(path + ' has a `children` that is not an array.');
            else node.children.forEach((c, i) => checkNode(c, path + ' > child ' + i));
          }
        }
        model.nodes.forEach((n, i) => checkNode(n, 'model "' + name + '" node ' + i));
      }

      if (pkg.clips && typeof pkg.clips !== 'object') issues.push('`clips` must be an object.');
      for (const name in (pkg.clips || {})) {
        const clip = pkg.clips[name];
        const where = 'clip "' + name + '"';
        if (!clip || typeof clip !== 'object') { issues.push(where + ' is not an object.'); continue; }
        if (!(clip.duration > 0)) issues.push(where + ' needs a duration greater than zero.');
        if (clip.tracks && typeof clip.tracks !== 'object') {
          issues.push(where + ' has a `tracks` that is not an object.');
          continue;
        }
        // Which bones this clip may name. A track naming a node that is not a bone is the one
        // mistake that produces no error and no motion: the merge baked that node into its
        // ancestor, so nothing downstream can move it.
        const boneNames = clip.model && pkg.models && pkg.models[clip.model]
          ? collectBoneNames(pkg.models[clip.model]) : null;
        for (const bone in (clip.tracks || {})) {
          if (boneNames && !boneNames.has(bone)) {
            issues.push(where + ' animates "' + bone + '", which is not a bone in model "' +
                        clip.model + '". Mark that node as a bone, or the track does nothing.');
          }
          const track = clip.tracks[bone];
          for (const channel of ['position', 'rotation', 'scale']) {
            const keys = track[channel];
            if (keys === undefined) continue;
            if (!Array.isArray(keys)) {
              issues.push(where + ' track "' + bone + '.' + channel + '" is not an array.');
              continue;
            }
            keys.forEach((k, i) => {
              if (!k || typeof k.t !== 'number' || !Array.isArray(k.v)) {
                issues.push(where + ' key ' + i + ' of "' + bone + '.' + channel +
                            '" needs a numeric `t` and an array `v`.');
                return;
              }
              const want = channel === 'rotation' ? [3, 4] : [3];
              if (want.indexOf(k.v.length) < 0) {
                issues.push(where + ' key ' + i + ' of "' + bone + '.' + channel + '" has ' +
                            k.v.length + ' numbers; expected ' + want.join(' or ') + '.');
              }
            });
          }
        }
        if (clip.model && pkg.models && !pkg.models[clip.model]) {
          issues.push(where + ' names model "' + clip.model + '", which is not in this package.');
        }
      }
      for (const name in pkg.textures) {
        const tex = pkg.textures[name];
        const where = 'texture "' + name + '"';
        if (!tex || typeof tex !== 'object') { issues.push(where + ' is not an object.'); continue; }
        if (!Number.isInteger(tex.width) || !Number.isInteger(tex.height)) {
          issues.push(where + ' needs whole-number width and height.');
        }
        if (!Array.isArray(tex.layers)) { issues.push(where + ' needs a `layers` array.'); continue; }
        tex.layers.forEach((layer, i) => {
          const at = where + ' layer ' + i;
          if (!layer || typeof layer !== 'object') { issues.push(at + ' is not an object.'); return; }
          if (layer.type === 'generator') {
            if (!TEXTURE_GENERATORS[layer.generator]) {
              issues.push(at + ' names generator "' + layer.generator + '", which does not exist.');
            }
          } else if (layer.type === 'adjust') {
            if (!ADJUSTMENTS[layer.adjust]) {
              issues.push(at + ' names adjustment "' + layer.adjust + '", which does not exist.');
            }
          } else if (layer.type === 'shape') {
            if (!layer.op || !DRAW_OPS[layer.op.op]) {
              issues.push(at + ' is a shape row whose op is "' + (layer.op && layer.op.op) + '", which does not exist.');
            }
          } else if (layer.type === 'ops') {
            if (!Array.isArray(layer.ops)) issues.push(at + ' is an ops layer with no `ops` array.');
            else layer.ops.forEach((op, j) => {
              if (!DRAW_OPS[op && op.op]) {
                issues.push(at + ' op ' + j + ' is "' + (op && op.op) + '", which does not exist.');
              }
            });
          } else if (layer.type === 'raster' || layer.type === 'image') {
            // An empty one is fine: it evaluates as transparent. It used to be reported, and a
            // package with a blank paint row then refused to load, which is the worse outcome
            // by a distance. The row list says "(empty)"; that is the reminder.
            if (layer.png !== undefined && typeof layer.png !== 'string') {
              issues.push(at + ' has png data that is not a string.');
            } else if (layer.type === 'raster' && layer.png) {
              // Paint promises the texture's size. A picture of another size is an image row.
              try {
                const size = pngSize(layer.png);
                if (size.width !== tex.width || size.height !== tex.height) {
                  issues.push(at + ' is a paint row of ' + size.width + '×' + size.height + ' in a ' +
                              tex.width + '×' + tex.height + ' texture; paint is texture-sized, so make it an image row or resample it.');
                }
              } catch (err) {
                issues.push(at + ' has png data that is not a PNG: ' + err.message);
              }
            }
            if (layer.type === 'image' && layer.fit !== undefined && layer.fit !== 'stretch' && layer.fit !== 'tile') {
              issues.push(at + ' has fit "' + layer.fit + '"; expected stretch or tile.');
            }
          } else {
            issues.push(at + ' has type "' + layer.type + '"; expected generator, shape, raster, image or adjust.');
          }
          if (layer.blend && !BLEND_MODES[layer.blend]) {
            issues.push(at + ' names blend mode "' + layer.blend + '", which does not exist.');
          }
          if (layer.folder !== undefined && typeof layer.folder !== 'string') {
            issues.push(at + ' has a folder that is not a string.');
          }
          if (layer.clip !== undefined && typeof layer.clip !== 'boolean') {
            issues.push(at + ' has a clip that is not true or false.');
          }
        });
      }
      return issues;
    }

    /**
     * Every bone name in a model, which is what a clip's tracks are allowed to name.
     * @param {Model} model - the model
     * @returns {Set<string>} - the names
     */
    function collectBoneNames(model) {
      const out = new Set();
      /**
       * @param {ModelNode} node - the node
       * @returns {void}
       */
      function walk(node) {
        if (node.bone && node.name) out.add(node.name);
        if (node.children) for (const c of node.children) walk(c);
      }
      if (model && Array.isArray(model.nodes)) for (const n of model.nodes) walk(n);
      return out;
    }

    // The three character sequences that can move the end of a script block. Nothing that is
    // legitimately package data contains one, so finding one means either a mistake or somebody
    // trying to break out of the block, and both are refusals.
    const TEXT_HAZARDS = ['</' + 'script', '<' + '!--', '--' + '>'];

    /**
     * Refuses to serialize text that could end the script block it is about to live in.
     *
     * This is the OFCU Bible's delimiters rule, enforced at the one place package data becomes
     * file text. It matters most for the free-form strings — a texture's name, a text op's
     * content — because those are the only values a person can type anything into.
     *
     * @param {string} value - the string being serialized
     * @param {string} where - what it is, for the message
     * @returns {void}
     */
    function checkText(value, where) {
      for (const hazard of TEXT_HAZARDS) {
        if (value.indexOf(hazard) >= 0) {
          throw new Error('Alloy: ' + where + ' contains "' + hazard + '", which would end the ' +
                          'script block this package is written into and silently kill the page. ' +
                          'Remove it.');
        }
      }
    }

    /**
     * Serializes a value as readable JavaScript, with arrays of numbers kept on one line.
     *
     * The OFCU Bible asks that a written data block look like code a careful developer would have
     * written by hand, because it is a primary authoring surface and not just an export artifact.
     * `JSON.stringify` with an indent puts every element of `[0.5, 0.25, 0]` on its own line,
     * which turns a colour into four lines and a package into something nobody reads.
     *
     * @param {*} value - the value
     * @param {string} indent - the current indentation
     * @param {string} where - a path for error messages
     * @returns {string} - JavaScript source
     */
    function serializeValue(value, indent, where) {
      if (value === null || value === undefined) return 'null';
      if (typeof value === 'number') {
        if (!Number.isFinite(value)) {
          throw new Error('Alloy: ' + where + ' is ' + value + ', which is not a number JSON can ' +
                          'carry. Fix the value before saving.');
        }
        // Trim float noise: 0.30000000000000004 is not more accurate than 0.3, it is just longer.
        return String(Math.round(value * 1e6) / 1e6);
      }
      if (typeof value === 'boolean') return String(value);
      if (typeof value === 'string') { checkText(value, where); return JSON.stringify(value); }

      const inner = indent + '  ';
      if (Array.isArray(value)) {
        if (!value.length) return '[]';
        // An array of plain numbers is a colour, a point or a rect. Keep it on one line.
        if (value.every((v) => typeof v === 'number')) {
          return '[' + value.map((v) => serializeValue(v, '', where)).join(', ') + ']';
        }
        // An array of short number arrays is a point list. Keep each point on one line.
        return '[\n' + value.map((v, i) =>
          inner + serializeValue(v, inner, where + '[' + i + ']')).join(',\n') + '\n' + indent + ']';
      }
      const keys = Object.keys(value).filter((k) => value[k] !== undefined);
      if (!keys.length) return '{}';
      return '{\n' + keys.map((k) =>
        inner + (/^[A-Za-z_$][\w$]*$/.test(k) ? k : JSON.stringify(k)) + ': ' +
        serializeValue(value[k], inner, where + '.' + k)).join(',\n') + '\n' + indent + '}';
    }

    /**
     * Renders a package as the complete `managed-data` script block a game file carries.
     *
     * @param {Object} pkg - the package
     * @param {Object} [opts] - rendering options
     * @param {string} [opts.constName] - the global the block declares, default from the name
     * @param {string} [opts.project] - the project id for data-ofcu-alloy-project
     * @param {string} [opts.indent] - leading indentation for the block's contents
     * @param {string[]} [opts.changelog] - lines written above the const as comments
     * @returns {string} - the block, opening tag to closing tag
     */
    function packageBlock(pkg, opts) {
      const cfg = opts || {};
      const issues = validatePackage(pkg);
      if (issues.length) {
        throw new Error('Alloy: this package will not serialize until these are fixed:\n  ' +
                        issues.join('\n  '));
      }
      const project = cfg.project || pkg.name || 'untitled';
      checkText(project, 'the project name');
      const constName = cfg.constName || packageIdent(project);
      const indent = cfg.indent === undefined ? '  ' : cfg.indent;

      const built = new Date().toISOString().slice(0, 19);
      const lines = [];
      lines.push('<' + 'script data-ofcu-type="managed-data"');
      lines.push('        data-ofcu-package="alloy"');
      lines.push('        data-ofcu-built="' + built + '"');
      lines.push('        data-ofcu-alloy-project="' + project + '">');
      if (cfg.changelog && cfg.changelog.length) {
        for (const line of cfg.changelog) { checkText(line, 'a changelog line'); lines.push(indent + '// ' + line); }
        lines.push('');
      }
      lines.push(indent + 'const ' + constName + ' = ' + serializeValue(pkg, indent, 'package') + ';');
      lines.push('<' + '/' + 'script>');
      return lines.join('\n');
    }

    /**
     * Turns a project name into a legal, shouty JavaScript identifier: "sunset larceny" becomes
     * SUNSET_LARCENY_VISUALS. The suffix is there so a project can carry an Alloy package and a
     * Webposium one without the two claiming the same global.
     * @param {string} project - the project name
     * @returns {string} - an identifier
     */
    function packageIdent(project) {
      const base = String(project).toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      return (/^[0-9]/.test(base) || !base ? 'P_' + base : base) + '_VISUALS';
    }

    /**
     * Reads a package back out of a `managed-data` block's text.
     *
     * `JSON.parse` cannot read it, because the block is JavaScript with unquoted keys and
     * comments. `new Function` can, and is safe here for the reason the block exists: it contains
     * no functions and closes over nothing, so evaluating it can only produce data.
     *
     * @param {string} text - the block's contents, or a whole block including its tags
     * @returns {Object} - the package
     */
    function parsePackageBlock(text) {
      let body = String(text);
      const open = body.indexOf('>');
      if (body.lastIndexOf('<' + 'script', 0) === 0 && open >= 0) {
        body = body.slice(open + 1, body.lastIndexOf('<' + '/' + 'script'));
      }
      const match = body.match(/const\s+([A-Za-z_$][\w$]*)\s*=/);
      if (!match) {
        throw new Error('Alloy: this block declares no `const`, so there is no package in it.');
      }
      let pkg;
      try {
        pkg = new Function(body + '\n;return ' + match[1] + ';')();
      } catch (err) {
        throw new Error('Alloy: this block did not evaluate: ' + err.message);
      }
      migratePackage(pkg);
      const issues = validatePackage(pkg);
      if (issues.length) {
        throw new Error('Alloy: the block parsed but is not a sound package:\n  ' + issues.join('\n  '));
      }
      return pkg;
    }

    //#endregion === Package ===




    // =====================================================================
    //           Shaders — the GLSL this engine ships
    // =====================================================================
    //#region === Shaders ===

    // *********************************************************************
    // MENTAL MODEL: LIGHTING HAPPENS PER VERTEX, ON PURPOSE. The fragment shader interpolates a
    // colour and writes it, and that is the whole pixel pipeline.
    //
    // This is not a corner cut on the way to something better. Per-vertex lighting is what the
    // hardware this look imitates actually did, and it is why a low-poly model from that era
    // reads as faceted and solid rather than as a smooth object with too few polygons. Chunky
    // geometry plus per-pixel lighting looks like a mistake; chunky geometry plus per-vertex
    // lighting looks like a decision.
    //
    // It is also, incidentally, the cheap one: the cost scales with vertices rather than with
    // screen area, so a scene of boxes costs nearly nothing no matter how close the camera gets.
    //
    // Two rules for editing anything below. `#version 300 es` must be the FIRST characters in
    // the source — a single leading newline is a compile error whose message names line 1 and
    // does not mention whitespace. And every `in` here is bound by the ATTR table, not by a
    // layout qualifier, so that JavaScript stays the one place attribute locations are decided.
    // *********************************************************************

    // How many point lights a scene may have at once, and therefore how long the uniform arrays
    // are. Four is not a hardware limit; it is the number past which per-vertex lighting stops
    // being convincing anyway, because a light's falloff is only sampled where a vertex happens
    // to be. A room wants one or two and a fire wants one.
    const MAX_POINT_LIGHTS = 4;

    /**
     * Builds the lit vertex shader for a given bone and light capacity.
     *
     * The array sizes have to be compile-time constants in GLSL, so the source is generated
     * rather than fixed. The bone count is decided from what the device actually reports, which
     * is the difference between working everywhere and working on the machine it was written on.
     *
     * @param {number} maxBones - length of the uBones array
     * @param {number} maxLights - length of the point-light arrays
     * @returns {string} - GLSL ES 3.00 source
     */
    function litVertexSource(maxBones, maxLights) {
      return `#version 300 es
precision highp float;

in vec3  aPosition;
in vec3  aNormal;
in vec2  aUV;
in float aJoint;      // which bone moves this vertex; 0 is always the identity
in vec4  aInst0;      // per-instance model matrix, one column per attribute
in vec4  aInst1;
in vec4  aInst2;
in vec4  aInst3;

uniform mat4 uProj;
uniform mat4 uView;
uniform mat4 uModel;
uniform mat4 uBones[${maxBones}];

uniform vec3  uLightDir;        // direction TOWARD the sun, unit, world space
uniform vec3  uLightColor;
uniform vec3  uAmbientSky;
uniform vec3  uAmbientGround;
uniform vec3  uColor;
uniform vec3  uEmissive;
uniform float uUnlit;

uniform int   uPointCount;
uniform vec3  uPointPos[${maxLights}];
uniform vec3  uPointColor[${maxLights}];
uniform float uPointRange[${maxLights}];

out vec3 vColor;
out vec2 vUV;

void main() {
  // Three transforms in one: the object's placement, its per-instance placement, and its bone.
  // A plain mesh has an identity instance matrix and bone 0, so it costs two identity multiplies
  // and needs no second shader.
  mat4 inst  = mat4(aInst0, aInst1, aInst2, aInst3);
  mat4 world = uModel * inst * uBones[int(aJoint)];

  vec4 wp = world * vec4(aPosition, 1.0);
  // The upper 3x3 is enough here: a rest pose's non-uniform scale was already baked into the
  // vertex by the merge, and a bone's matrix is a rigid delta from that rest pose.
  vec3 n = normalize(mat3(world) * aNormal);

  // Hemisphere ambient: straight up takes the sky colour, straight down the ground colour, and a
  // vertical wall lands halfway between them.
  vec3 light = mix(uAmbientGround, uAmbientSky, n.y * 0.5 + 0.5);
  light += uLightColor * max(dot(n, uLightDir), 0.0);

  for (int i = 0; i < ${maxLights}; i++) {
    if (i >= uPointCount) break;
    vec3  toLight = uPointPos[i] - wp.xyz;
    float dist    = length(toLight);
    float range   = max(uPointRange[i], 0.0001);
    // A windowed falloff rather than a pure inverse square. It reaches exactly zero at the range,
    // so a light can be switched off or culled at its edge with no visible step; inverse square
    // never quite reaches zero and every cut-off is a seam.
    float atten = clamp(1.0 - dist / range, 0.0, 1.0);
    atten *= atten;
    light += uPointColor[i] * max(dot(n, toLight / max(dist, 0.0001)), 0.0) * atten;
  }

  vec3 lit = uColor * light + uEmissive;
  vColor = mix(lit, uColor + uEmissive, uUnlit);
  vUV = aUV;

  gl_Position = uProj * uView * wp;
}
`;
    }

    const SHADER_LIT_FS = `#version 300 es
precision highp float;

in vec3 vColor;
in vec2 vUV;

uniform sampler2D uTex;
uniform float uHasTex;      // 1.0 when a texture is bound, 0.0 when the material is flat
uniform vec4  uUVRect;      // xy offset, zw scale — the whole texture is (0, 0, 1, 1)
uniform float uAlpha;       // material alpha, multiplied into the texture's own
uniform float uAlphaTest;   // discard below this; 0 disables it entirely

out vec4 fragColor;

void main() {
  vec4 tex = texture(uTex, vUV * uUVRect.zw + uUVRect.xy);
  // Mixing against a constant rather than branching keeps both paths the same shader. An
  // untextured material samples texel (0,0) of whatever is bound and then throws it away, which
  // costs one fetch and saves a second program.
  vec3 rgb = vColor * mix(vec3(1.0), tex.rgb, uHasTex);
  float a = uAlpha * mix(1.0, tex.a, uHasTex);

  // The cutout path. A leaf, a fence, a ladder: one texture with holes in it, no sorting, no
  // blending, and it writes depth like any solid surface. Everything this engine's look needs
  // from transparency, without any of what sorted alpha would cost.
  if (a < uAlphaTest) discard;

  fragColor = vec4(rgb, a);
}
`;

    /**
     * Builds the line vertex shader.
     *
     * It carries bones for one reason: an onion skin. Drawing a ghost of a pose needs the same
     * skinning the solid model gets, and a wireframe is the only way to show one without blended
     * transparency — which this engine deliberately does not have.
     *
     * @param {number} maxBones - length of the uBones array
     * @returns {string} - GLSL ES 3.00 source
     */
    function lineVertexSource(maxBones) {
      return `#version 300 es
precision highp float;

in vec3  aPosition;
in vec3  aColor;
in float aJoint;

uniform mat4 uProj;
uniform mat4 uView;
uniform mat4 uModel;
uniform mat4 uBones[${maxBones}];
uniform vec3 uColor;

out vec3 vColor;

void main() {
  vColor = aColor * uColor;
  gl_Position = uProj * uView * uModel * uBones[int(aJoint)] * vec4(aPosition, 1.0);
}
`;
    }

    const SHADER_LINE_FS = `#version 300 es
precision highp float;

in vec3 vColor;
out vec4 fragColor;

void main() {
  fragColor = vec4(vColor, 1.0);
}
`;

    // Which attribute name gets which location. The names must match the `in` declarations above,
    // and the locations must match the ATTR table, because a VAO records locations and a program
    // records names and nothing in WebGL will ever tell you they disagree.
    const ATTR_NAMES = {
      aPosition: ATTR.position,
      aNormal:   ATTR.normal,
      aUV:       ATTR.uv,
      aColor:    ATTR.color,
      aJoint:    ATTR.joint,
      aInst0:    ATTR.inst0,
      aInst1:    ATTR.inst1,
      aInst2:    ATTR.inst2,
      aInst3:    ATTR.inst3,
    };

    //#endregion === Shaders ===


    // =====================================================================
    //           GL Plumbing — programs, buffers, meshes
    // =====================================================================
    //#region === GL Plumbing ===

    // *********************************************************************
    // MENTAL MODEL: WEBGL FAILS SILENTLY BY DESIGN. A shader that does not compile links to
    // nothing and draws nothing; a uniform whose name is misspelled returns a null location that
    // `uniform3fv` accepts without complaint; a buffer bound to the wrong target renders black.
    // The API's answer to every one of these is a blank screen and an empty console.
    //
    // So every function in this section is loud. Compilation errors come back with the shader's
    // source LINE-NUMBERED, because the driver's message says "ERROR: 0:47" and counting to 47
    // by hand at midnight is how a five-minute typo becomes an hour. Uniform locations are
    // gathered by ASKING THE PROGRAM what it has rather than by looking names up on faith, so a
    // uniform that was optimized away is simply absent instead of silently null. Geometry is
    // validated before it reaches the GPU, where a bad index is undefined behaviour rather than
    // an error.
    //
    // The rule for anything added here: if it can fail, it must say so, name the thing that
    // failed, and say what was expected.
    // *********************************************************************

    /**
     * Numbers every line of a shader source, so a driver message like "ERROR: 0:47" can be read
     * against the source without counting.
     * @param {string} src - shader source
     * @returns {string} - the source with a right-aligned line number on every line
     */
    function numberLines(src) {
      const lines = src.split('\n');
      const width = String(lines.length).length;
      return lines.map((line, i) => String(i + 1).padStart(width, ' ') + ' | ' + line).join('\n');
    }

    /**
     * Compiles one shader stage, or throws with the driver's log and the numbered source.
     * @param {WebGL2RenderingContext} gl - the context
     * @param {number} type - gl.VERTEX_SHADER or gl.FRAGMENT_SHADER
     * @param {string} src - GLSL ES 3.00 source, starting with the version directive
     * @param {string} label - a name for the error message, e.g. "lit vertex"
     * @returns {WebGLShader} - the compiled shader
     */
    function compileShader(gl, type, src, label) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, src);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error('Alloy: the ' + label + ' shader did not compile.\n' + log + '\n' +
                        numberLines(src));
      }
      return shader;
    }

    /**
     * @typedef {Object} Program
     * @property {WebGLProgram} program - the linked program
     * @property {Object<string, WebGLUniformLocation>} uniforms - by name, without any [0] suffix
     * @property {string} label - the program's name, for error messages
     * @property {number} camGen - the camera generation whose matrices this program last uploaded
     */

    /**
     * Compiles, links and introspects a program.
     *
     * Attribute locations are bound from the ATTR table BEFORE linking, which is the whole reason
     * one mesh's vertex array object can feed either program in this engine. Bind them after and
     * the call is ignored until the next link, which is a bug that survives every test that
     * happens to use only one program.
     *
     * @param {WebGL2RenderingContext} gl - the context
     * @param {string} vsSrc - vertex shader source
     * @param {string} fsSrc - fragment shader source
     * @param {string} label - a name for error messages, e.g. "lit"
     * @returns {Program} - the program and its uniform locations
     */
    function makeProgram(gl, vsSrc, fsSrc, label) {
      const vs = compileShader(gl, gl.VERTEX_SHADER, vsSrc, label + ' vertex');
      const fs = compileShader(gl, gl.FRAGMENT_SHADER, fsSrc, label + ' fragment');
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);

      for (const name in ATTR_NAMES) gl.bindAttribLocation(program, ATTR_NAMES[name], name);

      gl.linkProgram(program);
      // The shaders are reference-counted by the program; detaching and deleting them now frees
      // the sources without touching the linked result.
      gl.detachShader(program, vs); gl.deleteShader(vs);
      gl.detachShader(program, fs); gl.deleteShader(fs);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const log = gl.getProgramInfoLog(program);
        gl.deleteProgram(program);
        throw new Error('Alloy: the ' + label + ' program did not link.\n' + log);
      }

      // Ask the program what uniforms it actually has. A uniform the compiler removed because
      // nothing read it is then simply missing from this map, which is honest — looking a name
      // up on faith returns null, and passing null to uniform3fv is a silent no-op.
      const uniforms = {};
      const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < count; i++) {
        const info = gl.getActiveUniform(program, i);
        // An array uniform reports as "name[0]"; store it under the bare name.
        const name = info.name.replace(/\[0\]$/, '');
        uniforms[name] = gl.getUniformLocation(program, info.name);
      }

      return { program, uniforms, label, camGen: -1, lightGen: -1 };
    }

    /**
     * @typedef {Object} Mesh
     * @property {WebGLVertexArrayObject} vao - everything needed to draw, in one binding
     * @property {WebGLBuffer[]} buffers - every buffer this mesh owns, for disposal
     * @property {number} count - vertices to draw, or indices when indexed
     * @property {number} glMode - gl.TRIANGLES or gl.LINES
     * @property {number} indexType - gl.UNSIGNED_SHORT, gl.UNSIGNED_INT, or 0 when not indexed
     * @property {Geometry} geometry - the CPU-side source, kept for editing and context restore
     * @property {boolean} disposed - true once the GPU resources are gone
     */

    /**
     * Checks a geometry before any of it reaches the GPU.
     *
     * Every fault here is invisible once uploaded: a normals array one vertex short shades the
     * last face with whatever memory follows it, and an index past the end of the buffer is
     * undefined behaviour that renders differently on every machine you try it on. Catching them
     * at build time turns a rendering mystery into a sentence.
     *
     * @param {Geometry} geometry - the geometry to check
     * @returns {number} - the vertex count
     */
    function validateGeometry(geometry) {
      if (!geometry || !geometry.positions) {
        throw new Error('Alloy.makeMesh: geometry has no positions array.');
      }
      const positions = geometry.positions;
      if (positions.length % 3 !== 0) {
        throw new Error('Alloy.makeMesh: positions has ' + positions.length + ' floats, which is ' +
                        'not a multiple of 3. Every vertex needs x, y and z.');
      }
      const vertexCount = positions.length / 3;

      /**
       * Checks one optional attribute array's length against the vertex count.
       * @param {string} name - the attribute's name, for the message
       * @param {Float32Array|undefined} arr - the array, may be undefined
       * @param {number} components - floats per vertex
       * @returns {void}
       */
      function checkAttr(name, arr, components) {
        if (!arr) return;
        if (arr.length !== vertexCount * components) {
          throw new Error('Alloy.makeMesh: ' + name + ' has ' + arr.length + ' floats but there ' +
                          'are ' + vertexCount + ' vertices, so it should have ' +
                          (vertexCount * components) + '.');
        }
      }
      checkAttr('normals', geometry.normals, 3);
      checkAttr('uvs', geometry.uvs, 2);
      checkAttr('colors', geometry.colors, 3);
      checkAttr('joints', geometry.joints, 1);

      if (geometry.indices) {
        const idx = geometry.indices;
        if (!(idx instanceof Uint16Array) && !(idx instanceof Uint32Array)) {
          throw new Error('Alloy.makeMesh: indices must be a Uint16Array or a Uint32Array, got ' +
                          (idx.constructor ? idx.constructor.name : typeof idx) + '.');
        }
        for (let i = 0; i < idx.length; i++) {
          if (idx[i] >= vertexCount) {
            throw new Error('Alloy.makeMesh: index ' + i + ' is ' + idx[i] + ', but there are ' +
                            'only ' + vertexCount + ' vertices (0 to ' + (vertexCount - 1) + ').');
          }
        }
      }
      return vertexCount;
    }

    /**
     * Uploads a geometry into GPU buffers and records the layout in a vertex array object.
     *
     * The VAO is the point. Without one, every draw call has to re-bind each buffer and re-issue
     * each vertexAttribPointer, which is a dozen calls per mesh per frame; with one, drawing is
     * bindVertexArray plus the draw. It also means a mesh cannot be drawn half-configured,
     * because the configuration is the object.
     *
     * @param {WebGL2RenderingContext} gl - the context
     * @param {Geometry} geometry - CPU-side arrays
     * @returns {Mesh} - a mesh ready to draw
     */
    function makeMeshFor(gl, geometry) {
      const vertexCount = validateGeometry(geometry);
      const buffers = [];

      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);

      /**
       * Uploads one attribute array and points an attribute location at it.
       * @param {Float32Array|undefined} arr - the data, skipped when undefined
       * @param {number} location - the attribute location from the ATTR table
       * @param {number} components - floats per vertex
       * @returns {WebGLBuffer|null} - the buffer, or null when there was no data
       */
      function attrib(arr, location, components) {
        if (!arr) return null;
        const buf = gl.createBuffer();
        buffers.push(buf);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(location);
        gl.vertexAttribPointer(location, components, gl.FLOAT, false, 0, 0);
        return buf;
      }

      const named = {};
      named.position = attrib(geometry.positions, ATTR.position, 3);
      named.normal   = attrib(geometry.normals,   ATTR.normal,   3);
      named.uv       = attrib(geometry.uvs,       ATTR.uv,       2);
      named.color    = attrib(geometry.colors,    ATTR.color,    3);
      named.joint    = attrib(geometry.joints,    ATTR.joint,    1);

      let count = vertexCount;
      let indexType = 0;
      if (geometry.indices) {
        const buf = gl.createBuffer();
        buffers.push(buf);
        // ELEMENT_ARRAY_BUFFER binding is part of VAO state, which is exactly why this is bound
        // while the VAO is bound and never touched again.
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, buf);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, geometry.indices, gl.STATIC_DRAW);
        named.index = buf;
        count = geometry.indices.length;
        indexType = geometry.indices instanceof Uint32Array ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT;
      }

      gl.bindVertexArray(null);
      gl.bindBuffer(gl.ARRAY_BUFFER, null);

      return {
        vao, buffers, count, indexType, geometry, disposed: false,
        // Named as well as listed, because an instance set has to rebind exactly these into a
        // VAO of its own and cannot do that from an anonymous array.
        attribs: named,
        glMode: geometry.mode === 'lines' ? gl.LINES : gl.TRIANGLES,
      };
    }

    /**
     * @typedef {Object} Texture2D
     * @property {WebGLTexture} handle - the GL object
     * @property {number} width - width in pixels
     * @property {number} height - height in pixels
     * @property {Pixels} pixels - the CPU-side source, kept for editing and context restore
     * @property {Object} opts - the options it was created with, for the same reason
     * @property {boolean} disposed - true once the GPU resource is gone
     */

    const TEXTURE_DEFAULTS = {
      // NEAREST magnification is not a shortcut, it is the aesthetic. Smoothing a 64 pixel
      // texture across a wall is what makes low-poly geometry look like a rough draft of
      // something else; keeping the texels square is what makes it look deliberate.
      filter: 'nearest',
      wrap:   'repeat',
      // Mipmaps on. Minification is the one place filtering is not optional: a texture seen at a
      // glancing angle without mipmaps does not look retro, it crawls and sparkles, which is a
      // different artifact from a different era and not one anybody was nostalgic for.
      mipmap: true,
      flipY:  true,
    };

    /**
     * Uploads a pixel buffer to the GPU.
     *
     * flipY is on by default and is the reason a texture comes out the right way up. A pixel
     * buffer's row 0 is its top, because that is what every drawing tool means by the top; GL's
     * texture coordinate v = 0 is the BOTTOM. Something has to reconcile those two, and doing it
     * once at upload is cheaper and far less confusing than flipping every mesh's UVs.
     *
     * @param {WebGL2RenderingContext} gl - the context
     * @param {Pixels} pixels - the source buffer
     * @param {Object} [opts] - overrides for any key of TEXTURE_DEFAULTS
     * @returns {Texture2D} - the uploaded texture
     */
    function makeTextureFor(gl, pixels, opts) {
      const cfg = withDefaults(TEXTURE_DEFAULTS, opts);
      const handle = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, handle);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, cfg.flipY);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, pixels.width, pixels.height, 0,
                    gl.RGBA, gl.UNSIGNED_BYTE, pixelsToBytes(pixels));
      // Left set, the flip would silently apply to every later upload including ones that do not
      // want it. WebGL's pixelStore state is global and sticky.
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

      const pow2 = isPowerOfTwo(pixels.width) && isPowerOfTwo(pixels.height);
      const wantMip = cfg.mipmap && pow2;
      if (wantMip) gl.generateMipmap(gl.TEXTURE_2D);

      const mag = cfg.filter === 'linear' ? gl.LINEAR : gl.NEAREST;
      // The minification filter is where the mipmap actually gets used. NEAREST_MIPMAP_LINEAR
      // keeps texels square within a level while blending between levels, which is the retro
      // combination: crisp up close, stable in the distance.
      const min = wantMip
        ? (cfg.filter === 'linear' ? gl.LINEAR_MIPMAP_LINEAR : gl.NEAREST_MIPMAP_LINEAR)
        : mag;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, mag);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, min);

      // WebGL2 can repeat a non-power-of-two texture, unlike WebGL1, so this is a real choice
      // rather than a limitation. Mipmaps still need power of two here because generateMipmap on
      // an odd size rounds down and the smallest levels drift off the texel grid.
      const wrap = cfg.wrap === 'clamp' ? gl.CLAMP_TO_EDGE
                 : cfg.wrap === 'mirror' ? gl.MIRRORED_REPEAT : gl.REPEAT;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);

      gl.bindTexture(gl.TEXTURE_2D, null);
      return {
        handle, width: pixels.width, height: pixels.height,
        pixels, opts: cfg, disposed: false,
      };
    }

    /**
     * Binds a mesh's existing attribute buffers into whatever VAO is currently bound.
     *
     * Used by an instance set, which needs its own VAO (it adds the per-instance attributes) but
     * must point at the same geometry. A VAO records bindings, not ownership, so nothing here
     * copies a vertex.
     *
     * @param {WebGL2RenderingContext} gl - the context
     * @param {Mesh} mesh - the mesh whose buffers to bind
     * @returns {void}
     */
    function bindMeshAttribs(gl, mesh) {
      const layout = [
        ['position', ATTR.position, 3],
        ['normal', ATTR.normal, 3],
        ['uv', ATTR.uv, 2],
        ['color', ATTR.color, 3],
        ['joint', ATTR.joint, 1],
      ];
      for (const [name, loc, size] of layout) {
        const buf = mesh.attribs[name];
        if (!buf) continue;
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
      }
    }

    // The up vector every view matrix is built against. Frozen and shared, so building a view
    // matrix every frame allocates nothing.
    const WORLD_UP = Object.freeze([0, 1, 0]);

    /**
     * Is this a power of two?
     * @param {number} v - the value
     * @returns {boolean} - true for 1, 2, 4, 8 and so on
     */
    function isPowerOfTwo(v) { return v > 0 && (v & (v - 1)) === 0; }

    //#endregion === GL Plumbing ===


    // =====================================================================
    //           Camera — orbit, pan, dolly
    // =====================================================================
    //#region === Camera ===

    // *********************************************************************
    // MENTAL MODEL: the camera is FOUR NUMBERS AND A POINT — yaw, pitch, distance, field of view,
    // orbiting a target. There is no camera position stored anywhere; the eye is derived from
    // those every frame. That is what makes the controls composable: panning moves the target,
    // dollying changes the distance, orbiting changes two angles, and none of them can put the
    // camera somewhere the others cannot get back from.
    //
    // Every one of them is kept twice, as a DESIRED value the input writes and a CURRENT value
    // the render reads, with update(dt) easing one toward the other. The easing is frame-rate
    // independent (an exponential of dt, not a fixed fraction), because a fixed fraction per
    // frame makes the camera feel different at 60Hz and at 144Hz for no reason a person can name.
    //
    // Set `smoothTime` to 0 for an exact snap. Anything above about 0.12s starts feeling like
    // the camera is arguing with you.
    // *********************************************************************

    const CAMERA_DEFAULTS = {
      target:      [0, 0, 0],
      distance:    6,
      yaw:         35,        // degrees, 0 looks down +Z at the target
      pitch:       22,        // degrees, positive looks down at the target
      fov:         50,        // vertical, degrees
      near:        0.1,
      far:         500,
      minDistance: 0.25,
      maxDistance: 500,
      minPitch:    -89,       // never exactly +/-90: at the pole the up vector is undefined
      maxPitch:    89,
      orbitSpeed:  0.32,      // degrees per pixel dragged
      panSpeed:    1.0,       // multiplier on the exact screen-space pan
      zoomSpeed:   0.0012,    // per wheel unit, exponential
      smoothTime:  0.055,     // seconds to cover ~63% of the remaining distance; 0 to snap
    };

    class OrbitCamera {

      /**
       * Makes an orbit camera.
       * @param {Object} [opts] - overrides for any key of CAMERA_DEFAULTS
       */
      constructor(opts) {
        const cfg = withDefaults(CAMERA_DEFAULTS, opts);
        for (const k in cfg) this[k] = cfg[k];

        // CAMERA_DEFAULTS.target is one array, and withDefaults copies references. Without this
        // clone, two cameras built with no explicit target would share a target vector and pan
        // each other around the scene.
        this.target = vec3.clone(cfg.target);

        // What reset() returns to. Copied now so later edits to the live values cannot drift it.
        this._home = {
          target: vec3.clone(cfg.target), distance: cfg.distance,
          yaw: cfg.yaw, pitch: cfg.pitch,
        };

        // The desired values input writes; `target`, `distance`, `yaw` and `pitch` above are the
        // current ones the view is built from.
        this._toTarget   = vec3.clone(cfg.target);
        this._toDistance = cfg.distance;
        this._toYaw      = cfg.yaw;
        this._toPitch    = cfg.pitch;

        // Scratch, so nothing in the render path allocates.
        this._eye   = vec3.create();
        this._right = vec3.create();
        this._up    = vec3.create();
        this._detach = null;
      }

      /**
       * Eases the current values toward the desired ones. Call once per frame, before view().
       *
       * With smoothTime at 0 this is an exact assignment, so a caller that wants no smoothing
       * still has to call it — that is deliberate. A camera that only moves when ticked is a
       * camera whose motion can be paused, stepped and recorded.
       *
       * @param {number} dt - seconds since the last call
       * @returns {void}
       */
      update(dt) {
        const k = this.smoothTime > 0 ? 1 - Math.exp(-dt / this.smoothTime) : 1;
        this.yaw      += (this._toYaw - this.yaw) * k;
        this.pitch    += (this._toPitch - this.pitch) * k;
        this.distance += (this._toDistance - this.distance) * k;
        vec3.lerp(this.target, this.target, this._toTarget, k);
        // Damping approaches its target forever and never arrives. Close enough IS arrived, and
        // saying so exactly is what lets a viewport stop redrawing once nothing is moving.
        if (Math.abs(this._toYaw - this.yaw) < 1e-3) this.yaw = this._toYaw;
        if (Math.abs(this._toPitch - this.pitch) < 1e-3) this.pitch = this._toPitch;
        if (Math.abs(this._toDistance - this.distance) < 1e-4) this.distance = this._toDistance;
        if (vec3.dist(this.target, this._toTarget) < 1e-5) vec3.copy(this.target, this._toTarget);
      }

      /**
       * Has the damped motion arrived? True when nothing about the view will change next frame.
       * @returns {boolean} - true when at rest
       */
      settled() {
        return this.yaw === this._toYaw && this.pitch === this._toPitch &&
               this.distance === this._toDistance &&
               this.target[0] === this._toTarget[0] && this.target[1] === this._toTarget[1] &&
               this.target[2] === this._toTarget[2];
      }

      /**
       * Computes the camera's world position from the angles and the target.
       * @param {number[]} [out] - destination vec3, the camera's own scratch when omitted
       * @returns {number[]} - out
       */
      eye(out) {
        const o = out || this._eye;
        const sy = Math.sin(this.yaw * DEG2RAD), cy = Math.cos(this.yaw * DEG2RAD);
        const sp = Math.sin(this.pitch * DEG2RAD), cp = Math.cos(this.pitch * DEG2RAD);
        o[0] = this.target[0] + this.distance * cp * sy;
        o[1] = this.target[1] + this.distance * sp;
        o[2] = this.target[2] + this.distance * cp * cy;
        return o;
      }

      /**
       * Writes the view matrix.
       * @param {Float32Array} out - destination mat4
       * @returns {Float32Array} - out
       */
      view(out) {
        return mat4.lookAt(out, this.eye(), this.target, WORLD_UP);
      }

      /**
       * Writes the projection matrix.
       * @param {Float32Array} out - destination mat4
       * @param {number} aspect - viewport width divided by height
       * @returns {Float32Array} - out
       */
      proj(out, aspect) {
        return mat4.perspective(out, this.fov, aspect, this.near, this.far);
      }

      /**
       * Returns to the position the camera was constructed with.
       * @param {boolean} [instant] - true to skip the smoothing and land immediately
       * @returns {void}
       */
      reset(instant) {
        vec3.copy(this._toTarget, this._home.target);
        this._toDistance = this._home.distance;
        this._toYaw = this._home.yaw;
        this._toPitch = this._home.pitch;
        if (instant) this.update(Infinity);
      }

      /**
       * Aims the camera. Every field is optional; anything unsaid is left where it was.
       *
       * This writes the DESIRED values, not the current ones. Writing `camera.yaw` directly looks
       * like it works and is undone by the next `update`, which eases the current values back
       * toward the desired ones — so aiming a camera has to go through here.
       *
       * @param {Object} [opts] - `{target, distance, yaw, pitch, fov, instant}`
       * @returns {void}
       */
      goTo(opts) {
        const o = opts || {};
        if (o.target) vec3.copy(this._toTarget, o.target);
        if (o.distance !== undefined) {
