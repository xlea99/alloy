          this._toDistance = clamp(o.distance, this.minDistance, this.maxDistance);
        }
        if (o.yaw !== undefined) this._toYaw = o.yaw;
        if (o.pitch !== undefined) this._toPitch = clamp(o.pitch, this.minPitch, this.maxPitch);
        if (o.fov !== undefined) this.fov = o.fov;
        if (o.instant) this.update(Infinity);
      }

      /**
       * Frames an axis-aligned bounding box: centres the target on it and backs off far enough
       * to see all of it.
       *
       * The distance is derived from the box's bounding SPHERE rather than its extents, which
       * costs a little framing tightness and buys a view that does not change as the object
       * rotates. Padding above 1 leaves air around the subject.
       *
       * @param {number[]} min - low corner
       * @param {number[]} max - high corner
       * @param {number} [padding] - multiplier on the fitted distance, default 1.35
       * @returns {void}
       */
      frameBounds(min, max, padding) {
        const pad = padding === undefined ? 1.35 : padding;
        this._toTarget[0] = (min[0] + max[0]) / 2;
        this._toTarget[1] = (min[1] + max[1]) / 2;
        this._toTarget[2] = (min[2] + max[2]) / 2;
        const radius = Math.max(vec3.dist(min, max) / 2, 1e-4);
        const d = radius / Math.sin(this.fov * DEG2RAD / 2) * pad;
        this._toDistance = clamp(d, this.minDistance, this.maxDistance);
      }

      /**
       * Orbits by a screen drag.
       * @param {number} dx - pixels moved right
       * @param {number} dy - pixels moved down
       * @returns {void}
       */
      orbit(dx, dy) {
        // Dragging right turns the model to the right, which means the camera goes left.
        this._toYaw -= dx * this.orbitSpeed;
        this._toPitch = clamp(this._toPitch + dy * this.orbitSpeed, this.minPitch, this.maxPitch);
      }

      /**
       * Pans by a screen drag, in true screen-space units: a point under the cursor stays under
       * the cursor, at any distance and any field of view.
       * @param {number} dx - pixels moved right
       * @param {number} dy - pixels moved down
       * @param {number} viewportHeight - the viewport's height in the same pixels as dx and dy
       * @returns {void}
       */
      pan(dx, dy, viewportHeight) {
        const sy = Math.sin(this.yaw * DEG2RAD), cy = Math.cos(this.yaw * DEG2RAD);
        const sp = Math.sin(this.pitch * DEG2RAD), cp = Math.cos(this.pitch * DEG2RAD);

        // The camera basis, derived rather than read back out of a matrix so this works before
        // the first frame has been drawn.
        vec3.set(this._right, cy, 0, -sy);
        vec3.set(this._up, -sy * sp, cp, -cy * sp);

        // World units covered by one pixel at the target's depth.
        const k = 2 * this._toDistance * Math.tan(this.fov * DEG2RAD / 2) /
                  Math.max(viewportHeight, 1) * this.panSpeed;

        vec3.scaleAndAdd(this._toTarget, this._toTarget, this._right, -dx * k);
        vec3.scaleAndAdd(this._toTarget, this._toTarget, this._up, dy * k);
      }

      /**
       * Dollies in or out. Exponential, so every notch of the wheel covers the same proportion
       * of the remaining distance and approaching an object never turns into a crawl.
       * @param {number} amount - wheel delta, positive to move away
       * @returns {void}
       */
      dolly(amount) {
        this._toDistance = clamp(this._toDistance * Math.exp(amount * this.zoomSpeed),
                                 this.minDistance, this.maxDistance);
      }

      /**
       * Binds pointer and wheel controls to a canvas, and returns the function that unbinds them.
       *
       * The engine listens on the canvas it was given and on nothing else — no window handlers,
       * no document handlers. Keyboard shortcuts are the app's business, because an engine that
       * claims a key inside somebody's game has taken something that was not offered.
       *
       * Right drag orbits, middle drag (or shift-right) pans, wheel dollies. The LEFT button is
       * left alone entirely, so whatever the canvas is showing can be clicked, picked and dragged
       * without the camera moving under it. The tool's gizmos live on the left button; a game's
       * own picking will too. The old mapping orbited on left drag, which meant every gizmo drag
       * also swung the camera — the model moved and the world moved with it.
       *
       * @param {HTMLCanvasElement} canvas - the canvas to listen on
       * @returns {function(): void} - call to remove every listener
       */
      attach(canvas) {
        if (this._detach) this._detach();

        let mode = 0;                    // 0 none, 1 orbit, 2 pan
        let lastX = 0, lastY = 0, activeId = null;
        const self = this;

        /**
         * Starts a drag and captures the pointer. Left button: not ours.
         * @param {PointerEvent} ev - the pointerdown
         * @returns {void}
         */
        function onDown(ev) {
          if (mode !== 0 || ev.button === 0) return;
          mode = (ev.button === 2 && !ev.shiftKey) ? 1 : 2;
          lastX = ev.clientX; lastY = ev.clientY;
          activeId = ev.pointerId;
          canvas.setPointerCapture(ev.pointerId);
          ev.preventDefault();
        }

        /**
         * Applies a drag.
         * @param {PointerEvent} ev - the pointermove
         * @returns {void}
         */
        function onMove(ev) {
          if (mode === 0 || ev.pointerId !== activeId) return;
          const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
          lastX = ev.clientX; lastY = ev.clientY;
          if (mode === 1) self.orbit(dx, dy);
          else self.pan(dx, dy, canvas.clientHeight);
        }

        /**
         * Ends a drag.
         * @param {PointerEvent} ev - the pointerup, cancel or leave
         * @returns {void}
         */
        function onUp(ev) {
          if (ev.pointerId !== activeId) return;
          mode = 0; activeId = null;
          if (canvas.hasPointerCapture(ev.pointerId)) canvas.releasePointerCapture(ev.pointerId);
        }

        /**
         * Dollies on the wheel.
         * @param {WheelEvent} ev - the wheel event
         * @returns {void}
         */
        function onWheel(ev) {
          // Without preventDefault the page scrolls behind the canvas, and the listener has to be
          // non-passive for that to be allowed at all.
          ev.preventDefault();
          // deltaMode 1 is lines rather than pixels, which some mice and most of Firefox report.
          const scale = ev.deltaMode === 1 ? 16 : 1;
          self.dolly(ev.deltaY * scale);
        }

        /**
         * Swallows the context menu so a right-drag can orbit.
         * @param {MouseEvent} ev - the contextmenu event
         * @returns {void}
         */
        function onMenu(ev) { ev.preventDefault(); }

        canvas.addEventListener('pointerdown', onDown);
        canvas.addEventListener('pointermove', onMove);
        canvas.addEventListener('pointerup', onUp);
        canvas.addEventListener('pointercancel', onUp);
        canvas.addEventListener('wheel', onWheel, { passive: false });
        canvas.addEventListener('contextmenu', onMenu);

        this._detach = function detach() {
          canvas.removeEventListener('pointerdown', onDown);
          canvas.removeEventListener('pointermove', onMove);
          canvas.removeEventListener('pointerup', onUp);
          canvas.removeEventListener('pointercancel', onUp);
          canvas.removeEventListener('wheel', onWheel);
          canvas.removeEventListener('contextmenu', onMenu);
          self._detach = null;
        };
        return this._detach;
      }
    }

    //#endregion === Camera ===


    // =====================================================================
    //           Renderer — the Alloy class
    // =====================================================================
    //#region === Renderer ===

    // *********************************************************************
    // MENTAL MODEL: the renderer is IMMEDIATE MODE and owns no scene. It holds a context, two
    // programs and the current camera matrices; you hand it a mesh, a model matrix and a
    // material, and it issues a draw. It has never heard of a node tree, an instance or a world.
    //
    // That is the boundary the whole project is built on: Alloy renders, the game owns the
    // world. Phase 3 puts a node tree ON TOP of drawMesh, and Phase 7's retained API
    // (createInstance, play, blendTo) puts instances on top of that. Both are layers with these
    // calls underneath, still callable, because the moment a renderer starts owning a scene it
    // starts having opinions about how a game stores one.
    //
    // The camera is uploaded LAZILY. Programs record which camera generation they last saw, and
    // a program only re-uploads the projection and view matrices when it is behind. That is what
    // makes the corner gizmo cheap: it swaps the camera, draws three lines, and swaps back.
    // *********************************************************************

    class Alloy {

      /**
       * Creates a renderer on a canvas.
       *
       * @param {HTMLCanvasElement} canvas - the canvas to render into
       * @param {Object} [opts] - overrides for any key of ENGINE_DEFAULTS, plus:
       * @param {function(): void} [opts.onContextLost] - called when the GPU takes the context away
       * @param {function(): void} [opts.onContextRestored] - called after resources are rebuilt
       */
      constructor(canvas, opts) {
        if (!canvas || typeof canvas.getContext !== 'function') {
          throw new Error('new Alloy(canvas): expected a canvas element, got ' +
                          (canvas === undefined ? 'undefined' : typeof canvas) + '.');
        }

        const cfg = withDefaults(ENGINE_DEFAULTS, opts);
        this.opts = cfg;
        this.canvas = canvas;
        // Cloned, not shared: withDefaults is shallow, so two renderers built without a light
        // would otherwise point at ENGINE_DEFAULTS.light itself and the first one to animate a
        // sun in place would move it for every viewport on the page. Same reason OrbitCamera
        // clones its target.
        this.light = {
          direction: cfg.light.direction.slice(),
          color: cfg.light.color.slice(),
          intensity: cfg.light.intensity,
        };
        this.ambient = { sky: cfg.ambient.sky.slice(), ground: cfg.ambient.ground.slice() };

        const gl = canvas.getContext('webgl2', {
          antialias:       cfg.antialias,
          depth:           true,
          alpha:           false,
          powerPreference: cfg.powerPreference,
          // The default is to throw the drawing buffer away after every composite, which is
          // faster. Anything that wants to read pixels back — a thumbnail, a screenshot, colour
          // picking — has to either preserve it or read before the frame ends. Phase 4 picks by
          // reading immediately, so this stays false and the speed is kept.
          preserveDrawingBuffer: false,
        });
        if (!gl) {
          throw new Error('new Alloy(canvas): this browser did not give up a WebGL2 context. ' +
                          'Alloy needs WebGL2, which every current browser has and which is ' +
                          'sometimes disabled by a flag, a headless environment, or a driver ' +
                          'blocklist. Check chrome://gpu or about:support.');
        }
        this.gl = gl;
        this.lost = false;

        // How many bones fit. The uniform arrays have to be sized at compile time, and the floor
        // WebGL2 guarantees is 256 vertex uniform vectors — enough for 52 bones once everything
        // else has its share. Asking the device rather than assuming is the difference between
        // working everywhere and working on the machine this was written on.
        const maxVectors = gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS);
        this.maxBones = Math.max(1, Math.min(64, Math.floor((maxVectors - 48) / 4)));
        this.maxPointLights = MAX_POINT_LIGHTS;

        this._programs = {
          lit:  makeProgram(gl, litVertexSource(this.maxBones, MAX_POINT_LIGHTS), SHADER_LIT_FS, 'lit'),
          line: makeProgram(gl, lineVertexSource(this.maxBones), SHADER_LINE_FS, 'line'),
        };
        this._current = null;      // the program record currently bound

        /** @type {Array<Object>} point lights: `{position, color, range, intensity}` */
        this.lights = [];
        this.cullEnabled = cfg.cull !== false;
        this._lightPos = new Float32Array(MAX_POINT_LIGHTS * 3);
        this._lightCol = new Float32Array(MAX_POINT_LIGHTS * 3);
        this._lightRange = new Float32Array(MAX_POINT_LIGHTS);
        this._frustum = new Float32Array(24);
        this._viewProj = mat4.create();
        this._worldBounds = { min: [0, 0, 0], max: [0, 0, 0] };
        this._instanceSets = new Set();
        this._identityBones = mat4.create();
        this._lineBonesPosed = false;

        // Every mesh and texture this renderer made, so a lost context can be rebuilt from
        // CPU-side data.
        this._meshes = new Set();
        this._textures = new Set();

        // A 1x1 white texture, bound whenever a material has none. WebGL treats sampling from an
        // incomplete texture unit as undefined, and "undefined" on some drivers means black,
        // which turns every untextured object in the scene into a silhouette. One texel is a
        // cheaper answer than a second shader program.
        this._whiteTex = makeTextureFor(this.gl, makePixels(1, 1, [1, 1, 1, 1]),
                                        { mipmap: false, filter: 'nearest' });

        // Camera state. `_camGen` increments whenever the matrices change, and each program
        // remembers the generation it last uploaded.
        this._proj = mat4.create();
        this._view = mat4.create();
        this._camGen = 0;
        // Lighting is uploaded the same way the camera is: once per program per change, not once
        // per draw. Assigning `lights`, `light` or `ambient` bumps the generation on the next
        // frame; mutating one in place needs touchLights().
        this._lightGen = 0;
        this._lightRefs = null;

        // Scratch, reused every draw so the render path allocates nothing.
        this._normalMat = mat3.create();
        this._lightDir = vec3.create();
        this._identity = mat4.create();

        this.width = 0;
        this.height = 0;
        this.dpr = 1;
        this.frame = 0;
        this.stats = { draws: 0, triangles: 0, lines: 0, vertices: 0, culled: 0, instances: 0 };

        this._onLost = (ev) => {
          // Without preventDefault the context is gone for good and `webglcontextrestored` never
          // fires. This is the one line that makes recovery possible at all.
          ev.preventDefault();
          this.lost = true;
          if (cfg.onContextLost) cfg.onContextLost();
        };
        this._onRestored = () => {
          this._rebuild();
          this.lost = false;
          if (cfg.onContextRestored) cfg.onContextRestored();
        };
        canvas.addEventListener('webglcontextlost', this._onLost, false);
        canvas.addEventListener('webglcontextrestored', this._onRestored, false);

        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        if (cfg.cull) { gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK); }
        gl.clearColor(cfg.clearColor[0], cfg.clearColor[1], cfg.clearColor[2], cfg.clearColor[3]);
        this._setGenericAttribs();

        this.resize();
      }

      /**
       * Sets the values every disabled vertex attribute falls back to.
       *
       * These are CONTEXT state, not vertex-array state, so setting them once covers every mesh
       * that does not supply the attribute itself. That is what lets one shader draw a plain mesh
       * and an instanced skinned model: a mesh with no joint buffer reads bone 0, and one with no
       * instance buffer reads the identity matrix.
       *
       * Without this an instanced attribute defaults to (0, 0, 0, 1), which builds a matrix that
       * collapses every vertex onto the origin — a model that renders as nothing at all.
       *
       * @returns {void}
       */
      _setGenericAttribs() {
        const gl = this.gl;
        gl.vertexAttrib1f(ATTR.joint, 0);
        gl.vertexAttrib4f(ATTR.inst0, 1, 0, 0, 0);
        gl.vertexAttrib4f(ATTR.inst1, 0, 1, 0, 0);
        gl.vertexAttrib4f(ATTR.inst2, 0, 0, 1, 0);
        gl.vertexAttrib4f(ATTR.inst3, 0, 0, 0, 1);
        // Slot 0 of the bone array is the identity, always, so a mesh with no joints needs no
        // special case in the shader or here.
        for (const key of ['lit', 'line']) {
          const rec = this._programs[key];
          gl.useProgram(rec.program);
          gl.uniformMatrix4fv(rec.uniforms.uBones, false, mat4.create());
        }
        this._current = null;
      }

      /**
       * Matches the drawing buffer to the canvas's displayed size, capped by maxDPR.
       *
       * Called at the top of every beginFrame, which is the only place that reliably notices a
       * resize: there is no resize event for "my flex container got narrower", and a
       * ResizeObserver inside the engine would be the engine watching markup it does not own.
       *
       * @returns {boolean} - true when the size actually changed
       */
      resize() {
        const dpr = Math.min(
          (typeof window !== 'undefined' && window.devicePixelRatio) || 1, this.opts.maxDPR);
        const w = Math.max(1, Math.round(this.canvas.clientWidth * dpr));
        const h = Math.max(1, Math.round(this.canvas.clientHeight * dpr));
        if (w === this.width && h === this.height && dpr === this.dpr) return false;

        this.canvas.width = w;
        this.canvas.height = h;
        this.width = w;
        this.height = h;
        this.dpr = dpr;
        return true;
      }

      /**
       * The viewport's aspect ratio.
       * @returns {number} - width divided by height
       */
      get aspect() { return this.width / Math.max(this.height, 1); }

      /**
       * Starts a frame: resizes, clears, and takes the camera's matrices.
       * @param {Object} camera - anything with view(out) and proj(out, aspect); normally an OrbitCamera
       * @returns {void}
       */
      beginFrame(camera) {
        const gl = this.gl;
        this.resize();
        this.resetViewport();
        // A new lights array, light or ambient object means new uniforms. In-place edits are the
        // caller's to announce, through touchLights().
        const refs = this.lights.length + '|' + (this.lights[0] ? '' : '-');
        if (this._lightRefs === null || this._lightRefs.lights !== this.lights ||
            this._lightRefs.light !== this.light || this._lightRefs.ambient !== this.ambient ||
            this._lightRefs.n !== refs) {
          this._lightRefs = { lights: this.lights, light: this.light, ambient: this.ambient, n: refs };
          this._lightGen++;
        }

        camera.proj(this._proj, this.aspect);
        camera.view(this._view);
        this._camGen++;
        // The frustum is derived once per frame, here, so every draw call this frame tests
        // against the same six planes rather than recomputing them.
        frustumFromMatrix(this._frustum, mat4.multiply(this._viewProj, this._proj, this._view));

        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        this.stats.draws = 0;
        this.stats.triangles = 0;
        this.stats.lines = 0;
        this.stats.vertices = 0;
        this.stats.culled = 0;
        this.stats.instances = 0;
      }

      /**
       * Ends a frame. Nothing is deferred, so this only advances the frame counter — it exists so
       * that when something IS deferred (sorted transparency, a post pass) every caller already
       * has the hook.
       * @returns {void}
       */
      endFrame() { this.frame++; }

      /**
       * Replaces the camera matrices mid-frame, for a pass that needs its own view — the corner
       * gizmo, a minimap, a thumbnail.
       * @param {Float32Array} view - view matrix
       * @param {Float32Array} proj - projection matrix
       * @returns {void}
       */
      setCamera(view, proj) {
        mat4.copy(this._view, view);
        mat4.copy(this._proj, proj);
        this._camGen++;
        frustumFromMatrix(this._frustum, mat4.multiply(this._viewProj, this._proj, this._view));
      }

      /**
       * Restricts drawing to part of the canvas. Coordinates are DEVICE pixels with the origin at
       * the BOTTOM left, which is WebGL's convention and the opposite of the DOM's.
       * @param {number} x - left edge, device pixels
       * @param {number} y - bottom edge, device pixels
       * @param {number} w - width, device pixels
       * @param {number} h - height, device pixels
       * @returns {void}
       */
      setViewport(x, y, w, h) { this.gl.viewport(x, y, w, h); }

      /**
       * Restores the viewport to the whole canvas.
       * @returns {void}
       */
      resetViewport() { this.gl.viewport(0, 0, this.width, this.height); }

      /**
       * Clears depth without touching colour, so a later pass draws over everything already
       * there. The corner gizmo uses this to sit on top of the scene.
       * @returns {void}
       */
      clearDepth() { this.gl.clear(this.gl.DEPTH_BUFFER_BIT); }

      /**
       * Uploads a geometry to the GPU.
       * @param {Geometry} geometry - CPU-side arrays
       * @returns {Mesh} - a mesh ready to draw
       */
      makeMesh(geometry) {
        const mesh = makeMeshFor(this.gl, geometry);
        this._meshes.add(mesh);
        return mesh;
      }

      /**
       * Uploads a pixel buffer, or evaluates a texture definition and uploads the result.
       *
       * Taking either is the whole point of the layer stack being data: a game hands over the
       * JSON it loaded and never sees a pixel buffer, while the workbench hands over a buffer it
       * is already showing in a preview and does not evaluate it twice.
       *
       * @param {Pixels|Texture} source - a pixel buffer, or a texture definition with `layers`
       * @param {Object} [opts] - overrides for any key of TEXTURE_DEFAULTS
       * @returns {Texture2D} - the uploaded texture
       */
      makeTexture(source, opts) {
        const pixels = source && source.layers ? evaluateTexture(source) : source;
        if (!pixels || !pixels.data) {
          throw new Error('Alloy.makeTexture: expected a pixel buffer or a texture definition ' +
                          'with a `layers` array.');
        }
        const tex = makeTextureFor(this.gl, pixels, opts);
        this._textures.add(tex);
        return tex;
      }

      /**
       * Releases a texture's GPU resources.
       * @param {Texture2D} tex - the texture to free
       * @returns {void}
       */
      disposeTexture(tex) {
        if (!tex || tex.disposed) return;
        this.gl.deleteTexture(tex.handle);
        tex.disposed = true;
        this._textures.delete(tex);
      }

      /**
       * Uploads a lines geometry. Identical to makeMesh; the separate name is so a reader of the
       * app can tell at the call site which program is going to draw the thing.
       * @param {Geometry} geometry - a geometry whose mode is 'lines'
       * @returns {Mesh} - a mesh ready to draw
       */
      makeLines(geometry) {
        if (geometry.mode !== 'lines') {
          throw new Error('Alloy.makeLines: geometry mode is "' + geometry.mode + '", expected ' +
                          '"lines". Use makeMesh for triangles.');
        }
        return this.makeMesh(geometry);
      }

      /**
       * Releases a mesh's GPU resources. The mesh is unusable afterwards and says so if drawn.
       * @param {Mesh} mesh - the mesh to free
       * @returns {void}
       */
      disposeMesh(mesh) {
        if (!mesh || mesh.disposed) return;
        const gl = this.gl;
        gl.deleteVertexArray(mesh.vao);
        for (const buf of mesh.buffers) gl.deleteBuffer(buf);
        mesh.buffers.length = 0;
        mesh.disposed = true;
        this._meshes.delete(mesh);
      }

      /**
       * Binds a program and brings its camera matrices up to date if they are stale.
       * @param {Program} rec - the program record
       * @returns {Program} - rec
       */
      _use(rec) {
        const gl = this.gl;
        if (this._current !== rec) {
          gl.useProgram(rec.program);
          this._current = rec;
        }
        if (rec.camGen !== this._camGen) {
          gl.uniformMatrix4fv(rec.uniforms.uProj, false, this._proj);
          gl.uniformMatrix4fv(rec.uniforms.uView, false, this._view);
          rec.camGen = this._camGen;
        }
        return rec;
      }

      /**
       * Draws a mesh with the lit program.
       *
       * @param {Mesh} mesh - the mesh
       * @param {Float32Array} [model] - model matrix, identity when omitted
       * @param {Object} [material] - surface description
       * @param {number[]} [material.color] - rgb tint, default white
       * @param {number[]} [material.emissive] - rgb added after lighting, default black
       * @param {boolean} [material.unlit] - true to skip lighting entirely
       * @returns {void}
       */
      drawMesh(mesh, model, material) {
        if (this.lost) return;
        if (mesh.disposed) {
          throw new Error('Alloy.drawMesh: this mesh was disposed. Its buffers are gone; build ' +
                          'a new one from its geometry.');
        }
        const m = model || this._identity;
        if (this.cullEnabled && mesh.geometry.bounds && !this._visible(mesh.geometry.bounds, m)) {
          this.stats.culled++;
          return;
        }
        const gl = this.gl;
        const rec = this._use(this._programs.lit);
        gl.uniformMatrix3fv(rec.uniforms.uNormalMat, false, mat3.normalFromMat4(this._normalMat, m));
        this._drawGroup(mesh, m, material || EMPTY_MATERIAL, null, 0);
      }

      /**
       * Draws a lines mesh with the line program.
       * @param {Mesh} mesh - a mesh built from a 'lines' geometry
       * @param {Float32Array} [model] - model matrix, identity when omitted
       * @param {number[]} [color] - rgb multiplied into every vertex colour, default white
       * @param {Float32Array} [bones] - bone matrices, for a posed wireframe
       * @returns {void}
       */
      drawLines(mesh, model, color, bones) {
        if (this.lost) return;
        if (mesh.disposed) {
          throw new Error('Alloy.drawLines: this mesh was disposed. Its buffers are gone; build ' +
                          'a new one from its geometry.');
        }
        const gl = this.gl;
        const rec = this._use(this._programs.line);

        gl.uniformMatrix4fv(rec.uniforms.uModel, false, model || this._identity);
        gl.uniform3fv(rec.uniforms.uColor, color || WHITE);
        // A wireframe with no joints reads bone 0, which is the identity, so an ordinary grid or
        // gizmo needs no bone array at all. Only a posed wireframe passes one.
        if (bones) gl.uniformMatrix4fv(rec.uniforms.uBones, false, bones);
        else if (this._lineBonesPosed) {
          gl.uniformMatrix4fv(rec.uniforms.uBones, false, this._identityBones);
        }
        this._lineBonesPosed = !!bones;

        gl.bindVertexArray(mesh.vao);
        if (mesh.indexType) gl.drawElements(mesh.glMode, mesh.count, mesh.indexType, 0);
        else gl.drawArrays(mesh.glMode, 0, mesh.count);

        this.stats.draws++;
        this.stats.vertices += mesh.count;
        this.stats.lines += mesh.count / 2;
      }

      /**
       * Merges a model's node tree and uploads the result.
       *
       * @param {Model} modelData - the model definition
       * @param {Object} [opts] - passed to mergeModel
       * @returns {Object} - a drawable model: `{mesh, groups, bones, boneMatrices, bounds, nodes}`
       */
      makeModel(modelData, opts) {
        const merged = mergeModel(modelData, opts);
        const mesh = this.makeMesh(merged.geometry);
        // One matrix per bone, all identity. This set belongs to the MODEL and is what a static
        // instance draws with; an animated one brings its own, because two characters sharing one
        // buffer do not share a pose. See `drawModel`'s `bones` argument.
        const boneMatrices = identityBones(merged.bones.length);
        if (merged.bones.length > this.maxBones) {
          throw new Error('Alloy.makeModel: this model has ' + merged.bones.length + ' bones and ' +
                          'this device allows ' + this.maxBones + '. Mark fewer nodes as bones, ' +
                          'or split the model.');
        }
        // `parts` travels with the built model because a workbench needs to know which node each
        // range of the buffer came from — to outline it, to pick it, to say what was clicked. A
        // game never looks at it and pays only for the array.
        return { mesh, groups: merged.groups, bones: merged.bones, boneMatrices,
                 parts: merged.parts, bounds: merged.bounds, nodes: merged.nodes, instances: null };
      }

      /**
       * Releases a model's GPU resources.
       * @param {Object} built - a model from makeModel
       * @returns {void}
       */
      disposeModel(built) {
        if (!built) return;
        if (built.instances) this.disposeInstances(built.instances);
        this.disposeMesh(built.mesh);
      }

      /**
       * Draws a model: one call per material, all sharing one vertex buffer.
       *
       * @param {Object} built - a model from makeModel
       * @param {Float32Array} [model] - where to put it, identity when omitted
       * @param {Object|function(string): Object} [materials] - a map or a lookup by material name
       * @param {Float32Array} [bones] - a pose to draw with, the model's own when omitted. This is
       *   what lets many instances share one vertex buffer and still hold different poses.
       * @returns {void}
       */
      drawModel(built, model, materials, bones) {
        if (this.lost) return;
        if (!built || !built.mesh || built.mesh.disposed) {
          throw new Error('Alloy.drawModel: this model was disposed. Its buffers are gone; build ' +
                          'a new one with makeModel.');
        }
        const m = model || this._identity;
        if (this.cullEnabled && built.bounds && !this._visible(built.bounds, m)) {
          this.stats.culled++;
          return;
        }
        const gl = this.gl;
        const rec = this._use(this._programs.lit);
        gl.uniformMatrix4fv(rec.uniforms.uBones, false, bones || built.boneMatrices);
        for (const group of built.groups) {
          if (!group.count) continue;
          this._drawGroup(built.mesh, m, this._materialFor(materials, group.material), group, 0);
        }
      }

      /**
       * Makes an instance set: one model, many placements, one draw call per material.
       *
       * The per-instance matrix arrives as four vec4 attributes with a divisor of one, which is
       * how a mat4 crosses the attribute boundary — there is no mat4 attribute type, and a
       * uniform array would cap the count at a few hundred and cost an upload per frame.
       *
       * @param {Object} built - a model from makeModel
       * @param {number} capacity - how many instances at most
       * @returns {Object} - the instance set
       */
      makeInstances(built, capacity) {
        const gl = this.gl;
        const mesh = built.mesh;
        const buffer = gl.createBuffer();
        const matrices = new Float32Array(capacity * 16);

        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        // The same attribute layout the mesh already has, pointing at the same buffers. A VAO
        // records bindings, not ownership, so nothing here is a copy of the geometry.
        bindMeshAttribs(gl, mesh);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.attribs.index);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, matrices.byteLength, gl.DYNAMIC_DRAW);
        for (let c = 0; c < 4; c++) {
          const loc = ATTR.inst0 + c;
          gl.enableVertexAttribArray(loc);
          gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, 64, c * 16);
          gl.vertexAttribDivisor(loc, 1);
        }
        gl.bindVertexArray(null);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);

        const set = { built, vao, buffer, matrices, capacity, count: 0, disposed: false };
        built.instances = set;
        this._instanceSets.add(set);
        return set;
      }

      /**
       * Uploads an instance set's matrices.
       * @param {Object} set - from makeInstances
       * @param {number} count - how many of the matrices are live
       * @returns {void}
       */
      updateInstances(set, count) {
        if (count > set.capacity) {
          throw new Error('Alloy.updateInstances: ' + count + ' instances into a set built for ' +
                          set.capacity + '. Make a bigger set.');
        }
        set.count = count;
        const gl = this.gl;
        gl.bindBuffer(gl.ARRAY_BUFFER, set.buffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, set.matrices, 0, count * 16);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
      }

      /**
       * Draws every live instance in a set.
       *
       * There is no per-instance culling here on purpose: the point of an instance set is that
       * the whole set costs one call, and testing a thousand boxes on the CPU to skip some of
       * them would cost more than drawing them. Cull whole sets, not their members.
       *
       * @param {Object} set - from makeInstances
       * @param {Object|function(string): Object} [materials] - a map or a lookup
       * @returns {void}
       */
      drawInstances(set, materials) {
        if (this.lost) return;
        if (!set || set.disposed) {
          throw new Error('Alloy.drawInstances: this instance set was disposed (or the context ' +
                          'was lost and it went with it). Make a new one with makeInstances.');
        }
        if (!set.count) return;
        const gl = this.gl;
        const built = set.built;
        const rec = this._use(this._programs.lit);
        gl.uniformMatrix4fv(rec.uniforms.uBones, false, built.boneMatrices);
        for (const group of built.groups) {
          if (!group.count) continue;
          this._drawGroup(built.mesh, this._identity,
            this._materialFor(materials, group.material), group, set.count, set.vao);
        }
      }

      /**
       * Releases an instance set.
       * @param {Object} set - from makeInstances
       * @returns {void}
       */
      disposeInstances(set) {
        if (!set || set.disposed) return;
        this.gl.deleteVertexArray(set.vao);
        this.gl.deleteBuffer(set.buffer);
        set.disposed = true;
        if (set.built) set.built.instances = null;
        this._instanceSets.delete(set);
      }

      /**
       * Resolves a material by name from a map, a function, or nothing at all.
       * @param {Object|function(string): Object|undefined} materials - the lookup
       * @param {string} name - the material's name
       * @returns {Object} - a material, never null
       */
      _materialFor(materials, name) {
        if (typeof materials === 'function') return materials(name) || DEFAULT_MATERIAL;
        if (materials && materials[name]) return materials[name];
        return DEFAULT_MATERIAL;
      }

      /**
       * Is a locally-bounded object inside the frustum once placed?
       * @param {Object} bounds - local bounds
       * @param {Float32Array} m - the world matrix
       * @returns {boolean} - true when any part of it could be on screen
       */
      _visible(bounds, m) {
        transformBounds(this._worldBounds, bounds, m);
        return aabbInFrustum(this._frustum, this._worldBounds.min, this._worldBounds.max);
      }

      /**
       * Issues one draw for one material range, instanced or not.
       * @param {Mesh} mesh - the mesh
       * @param {Float32Array} model - the model matrix
       * @param {Object} material - the resolved material
       * @param {Object} [group] - `{start, count}` into the index buffer, or the whole mesh
       * @param {number} [instances] - instance count, 0 for a plain draw
       * @param {WebGLVertexArrayObject} [vao] - a VAO to use instead of the mesh's own
       * @returns {void}
       */
      _drawGroup(mesh, model, material, group, instances, vao) {
        const gl = this.gl;
        const rec = this._programs.lit;
        const u = rec.uniforms;

        gl.uniformMatrix4fv(u.uModel, false, model);
        this._applyLighting(rec);
        gl.uniform3fv(u.uColor, material.color || WHITE);
        gl.uniform3fv(u.uEmissive, material.emissive || BLACK);
        gl.uniform1f(u.uUnlit, material.unlit ? 1 : 0);

        const tex = material.texture;
        if (tex && tex.disposed) {
          throw new Error('Alloy: a material references a texture that was disposed.');
        }
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, tex ? tex.handle : this._whiteTex.handle);
        gl.uniform1i(u.uTex, 0);
        gl.uniform1f(u.uHasTex, tex ? 1 : 0);
        gl.uniform4fv(u.uUVRect, material.uvRect || FULL_UV_RECT);
        gl.uniform1f(u.uAlpha, material.alpha === undefined ? 1 : material.alpha);
        gl.uniform1f(u.uAlphaTest, material.alphaTest || 0);

        gl.bindVertexArray(vao || mesh.vao);
        const start = group ? group.start : 0;
        const count = group ? group.count : mesh.count;
        const offset = start * (mesh.indexType === gl.UNSIGNED_INT ? 4 : 2);
        if (instances) gl.drawElementsInstanced(mesh.glMode, count, mesh.indexType, offset, instances);
        else gl.drawElements(mesh.glMode, count, mesh.indexType, offset);

        this.stats.draws++;
        this.stats.vertices += count * (instances || 1);
        this.stats.triangles += (count / 3) * (instances || 1);
        if (instances) this.stats.instances += instances;
      }

      /**
       * Says that a light was changed in place, so the next draw uploads it again.
       * @returns {void}
       */
      touchLights() { this._lightGen++; }

      /**
       * Uploads the scene's lights, once per program per change.
       * @param {Object} u - the lit program's uniform map
       * @returns {void}
       */
      _applyLighting(rec) {
        if (rec.lightGen === this._lightGen) return;
        rec.lightGen = this._lightGen;
        const u = rec.uniforms;
        const gl = this.gl;
        // The shader wants the direction TOWARD the light; the config states the direction the
        // light travels, because that is how a person describes a sun.
        vec3.normalize(this._lightDir, vec3.negate(this._lightDir, this.light.direction));
        gl.uniform3fv(u.uLightDir, this._lightDir);
        gl.uniform3f(u.uLightColor,
          this.light.color[0] * this.light.intensity,
          this.light.color[1] * this.light.intensity,
          this.light.color[2] * this.light.intensity);
        gl.uniform3fv(u.uAmbientSky, this.ambient.sky);
        gl.uniform3fv(u.uAmbientGround, this.ambient.ground);

        const n = Math.min(this.lights.length, MAX_POINT_LIGHTS);
        gl.uniform1i(u.uPointCount, n);
        if (!n) return;
        for (let i = 0; i < n; i++) {
          const L = this.lights[i];
          this._lightPos[i * 3] = L.position[0];
          this._lightPos[i * 3 + 1] = L.position[1];
          this._lightPos[i * 3 + 2] = L.position[2];
          const k = L.intensity === undefined ? 1 : L.intensity;
          this._lightCol[i * 3] = L.color[0] * k;
          this._lightCol[i * 3 + 1] = L.color[1] * k;
          this._lightCol[i * 3 + 2] = L.color[2] * k;
          this._lightRange[i] = L.range === undefined ? 8 : L.range;
        }
        gl.uniform3fv(u.uPointPos, this._lightPos.subarray(0, n * 3));
        gl.uniform3fv(u.uPointColor, this._lightCol.subarray(0, n * 3));
        gl.uniform1fv(u.uPointRange, this._lightRange.subarray(0, n));
      }

      /**
       * Rebuilds every GPU resource after the context came back.
       *
       * This works only because a Mesh keeps the Geometry it was built from, which it keeps
       * anyway for editing. The mesh objects are mutated IN PLACE rather than replaced, so every
       * reference the app is holding stays valid and nothing outside this method has to know the
       * context ever went away.
       *
       * @returns {void}
       */
      _rebuild() {
        const gl = this.gl;
        this._programs = {
          lit:  makeProgram(gl, litVertexSource(this.maxBones, MAX_POINT_LIGHTS), SHADER_LIT_FS, 'lit'),
          line: makeProgram(gl, lineVertexSource(this.maxBones), SHADER_LINE_FS, 'line'),
        };
        this._current = null;
        this._camGen++;

        for (const mesh of this._meshes) {
          const fresh = makeMeshFor(gl, mesh.geometry);
          mesh.vao = fresh.vao;
          mesh.buffers = fresh.buffers;
          mesh.count = fresh.count;
          mesh.indexType = fresh.indexType;
          mesh.glMode = fresh.glMode;
        }
        // Textures rebuild the same way and for the same reason: a Texture2D keeps the pixel
        // buffer it was uploaded from, so nothing has to be re-evaluated and no reference the app
        // is holding goes stale.
        for (const tex of this._textures) {
          tex.handle = makeTextureFor(gl, tex.pixels, tex.opts).handle;
        }
        this._whiteTex = makeTextureFor(gl, makePixels(1, 1, [1, 1, 1, 1]),
                                        { mipmap: false, filter: 'nearest' });
        // Instance sets own a VAO and a buffer, neither of which survives a lost context.
        for (const set of this._instanceSets) {
          set.vao = null;
          set.disposed = true;
          if (set.built) set.built.instances = null;
        }
        this._instanceSets.clear();
        this._setGenericAttribs();

        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        if (this.opts.cull) { gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK); }
        const c = this.opts.clearColor;
        gl.clearColor(c[0], c[1], c[2], c[3]);
        this.width = 0; this.height = 0;   // force the next resize() to reapply the buffer size
      }

      /**
       * Releases everything this renderer owns and unbinds its listeners.
       * @returns {void}
       */
      dispose() {
        const gl = this.gl;
        // Instance sets own a VAO and a buffer that belong to no mesh, so they go first.
        for (const set of Array.from(this._instanceSets)) this.disposeInstances(set);
        for (const mesh of Array.from(this._meshes)) this.disposeMesh(mesh);
        for (const tex of Array.from(this._textures)) this.disposeTexture(tex);
        gl.deleteTexture(this._whiteTex.handle);
        for (const key in this._programs) gl.deleteProgram(this._programs[key].program);
        this.canvas.removeEventListener('webglcontextlost', this._onLost);
        this.canvas.removeEventListener('webglcontextrestored', this._onRestored);
        this._programs = {};
        this._current = null;
      }
    }

    // Shared constants for the default material. Frozen because they are handed straight to
    // uniform3fv from a dozen call sites, and a renderer that could scribble on the definition
    // of "white" is a renderer that will.
    const WHITE = Object.freeze([1, 1, 1]);
    const BLACK = Object.freeze([0, 0, 0]);
    const EMPTY_MATERIAL = Object.freeze({});
    const FULL_UV_RECT = Object.freeze([0, 0, 1, 1]);

    //#endregion === Renderer ===

    // =====================================================================
    //           Runtime — the stage a game stands a package on
    // =====================================================================
    //#region === Runtime ===

    // *********************************************************************
    // MENTAL MODEL: THE STAGE IS A CONVENIENCE, NOT A LAYER. Everything under it stays public, and
    // everything it does a game can do itself with the same calls in the same order. It holds no
    // state the renderer does not already hold, invents no format, and hides nothing.
    //
    // It exists because the twenty lines between "I have a package" and "I have pixels" are the
    // same twenty lines every time — upload each texture once, resolve materials to float colours,
    // merge each model once, give the animated ones a bone array, compose a matrix per frame — and
    // a game that has to rewrite them will rewrite them slightly wrong. Slightly wrong here means
    // a texture uploaded per material instead of per texture, which is the difference between a
    // level that loads instantly and one that hitches on the way in.
    //
    // THE STAGE OWNS GPU RESOURCES; THE GAME OWNS THE WORLD. That division is the whole design.
    // The stage keeps a list of instances only so `render` has something to walk. Where an
    // instance is, what it is doing, and whether it still exists are the game's business: write
    // `inst.position` directly, every frame, from whatever the simulation says. There is no scene
    // graph here, no parenting, no update callback and no place for game logic to live. If Alloy
    // ever grows one of those, this paragraph is the thing that was violated.
    //
    // WHAT IS SHARED AND WHAT IS NOT. Forty crates share one merged buffer and one set of GPU
    // textures; they do not share a pose. So geometry and textures are cached per package while
    // bone matrices are allocated per instance — and only for instances that can actually animate,
    // because a bone array per crate is the cost that turns a hundred crates into ten.
    // *********************************************************************

    // Scratch for the one quaternion `instanceMatrix` needs. Module scope rather than a local,
    // because this runs once per instance per frame and a render loop must not allocate.
    const INSTANCE_QUAT = quat.create();
    const NO_OFFSET = Object.freeze([0, 0, 0]);
    const NO_SCALING = Object.freeze([1, 1, 1]);

    /**
     * The matrix an instance's authored transform composes to.
     *
     * Its own function, and published, because it is the seam where three plain arrays a game
     * wrote become the matrix the GPU is handed — and a seam that only runs inside a render loop
     * is a seam no test can reach. This one has already been wrong once: `quat.fromEuler` takes
     * three NUMBERS, and handing it the array put NaN through the whole 3x3 basis. The translation
     * stayed correct, the draw call reported perfect health, and the screen was black.
     *
     * @param {Float32Array} out - destination matrix
     * @param {number[]} [position] - where, origin when omitted
     * @param {number[]} [rotation] - three euler degrees or four quaternion components
     * @param {number[]} [scale] - per axis, unit when omitted
     * @returns {Float32Array} - out
     */
    function instanceMatrix(out, position, rotation, scale) {
      return mat4.compose(out, position || NO_OFFSET,
        nodeRotation(INSTANCE_QUAT, rotation), scale || NO_SCALING);
    }

    /**
     * A model placed in the world: a transform, optionally a pose, and nothing else.
     *
     * Made by `stage.createInstance`, never directly — the stage is what knows how to merge the
     * model, size the bone array, and find the clips that drive it.
     */
    class Instance {

      /**
       * @param {Stage} stage - the stage that made it
       * @param {string} model - the model's name in the package
       * @param {Object} built - the shared built model from the stage's cache
       * @param {Object} [opts] - placement and overrides
       */
      constructor(stage, model, built, opts) {
        const cfg = opts || {};
        this.stage = stage;
        this.model = model;
        this._built = built;

        // Plain arrays, because these are the numbers a game reads, writes and saves, and a
        // Float32Array does not survive JSON. The matrix below is the Float32Array; these are the
        // authored values it gets composed from.
        this.position = cfg.position ? cfg.position.slice() : [0, 0, 0];
        // Three numbers are euler degrees, four are a quaternion — the same rule model nodes
        // follow, because an instance's transform and a node's are the same kind of thing.
        this.rotation = cfg.rotation ? cfg.rotation.slice() : [0, 0, 0];
        this.scale = cfg.scale === undefined ? [1, 1, 1]
          : (typeof cfg.scale === 'number' ? [cfg.scale, cfg.scale, cfg.scale] : cfg.scale.slice());

        /** @type {Float32Array} where the renderer is told to put it */
        this.matrix = mat4.create();

        // Recomposed from position, rotation and scale every frame. That is one `mat4.compose` per
        // instance per frame, which is nothing beside a draw call, and it is what makes
        // `inst.position[1] += dt` simply work. A game whose physics hands over a transform sets
        // `compose` to false and writes `matrix` itself.
        this.compose = cfg.compose === undefined ? true : !!cfg.compose;

        /** @type {boolean} drawn or not. An invisible instance still animates; see `render`. */
        this.visible = cfg.visible === undefined ? true : !!cfg.visible;

        /**
         * Material overrides for this instance alone, as a map of material name to the shape
         * `stage.material()` returns. Team colours, damage states, the object under the cursor.
         * @type {Object|null}
         */
        this.materials = cfg.materials || null;

        /** @type {Object|null} the animator, or null when nothing can animate this model */
        this.animator = null;
        /** @type {Float32Array|null} this instance's own pose, null when it never poses */
        this.bones = null;

        const clips = stage.clipsFor(model);
        if (cfg.animate === undefined ? Object.keys(clips).length > 0 : !!cfg.animate) {
          this.animator = makeAnimator({ model: stage.modelData(model), bones: built.bones, clips });
          this.bones = identityBones(built.bones.length);
        }
      }

      /**
       * The model's bounds in model space, before this instance's transform.
       * @returns {Object} - `{min, max}`
       */
      get bounds() { return this._built.bounds; }

      /**
       * The materials this instance actually draws with, which is what an override map has to be
       * keyed by. A highlight, a team colour or a damage state needs this list and would otherwise
       * be read off the model data by hand.
       * @returns {string[]} - material names, one per draw group
       */
      get materialNames() { return this._built.groups.map((g) => g.material); }

      /**
       * Starts a clip. See the animator's own `play` for the options.
       * @param {string} clip - the clip's name
       * @param {Object} [opts] - loop, speed, fade, weight, additive, offset
       * @returns {Instance} - this, for chaining
       */
      play(clip, opts) {
        if (!this.animator) {
          throw new Error('Alloy: this instance of "' + this.model + '" has no animator, so it ' +
                          'cannot play "' + clip + '". Nothing in the package animates that ' +
                          'model; pass {animate: true} to createInstance if the clips arrive ' +
                          'after the instance does, or if you only want look-at and springs.');
        }
        this.animator.play(clip, opts);
        return this;
      }

      /**
       * Crossfades from whatever is playing to this clip.
       * @param {string} clip - the clip's name
       * @param {number} [seconds] - the fade length
       * @param {Object} [opts] - as `play`
       * @returns {Instance} - this
       */
      blendTo(clip, seconds, opts) {
        if (this.animator) this.animator.blendTo(clip, seconds, opts);
        return this;
      }

      /**
       * Fades a clip out, or everything when no name is given.
       * @param {string} [clip] - the clip's name
       * @param {number} [seconds] - the fade length
       * @returns {Instance} - this
       */
      stop(clip, seconds) {
        if (this.animator) this.animator.stop(clip, seconds);
        return this;
      }

      /**
       * Whether a clip is contributing to the pose.
       * @param {string} clip - the clip's name
       * @returns {boolean} - true while its weight is above nothing
       */
      isPlaying(clip) { return !!this.animator && this.animator.isPlaying(clip); }

      /**
       * Calls back when a clip crosses an event marker.
       * @param {function(Object): void} fn - the listener
       * @returns {function(): void} - call it to unsubscribe
       */
      onEvent(fn) {
        if (!this.animator) return function () { /* nothing subscribed, nothing to undo */ };
        return this.animator.onEvent(fn);
      }

      /**
       * Takes this instance out of the world. Its shared model and textures stay, because other
       * instances are standing on them and the next spawn should not pay to build them again.
       * @returns {void}
       */
      remove() { this.stage.remove(this); }
    }

    /**
     * A canvas, a package, and everything between them. Made by `Alloy.init(canvas, opts)`.
     */
    class Stage {

      /**
       * @param {HTMLCanvasElement} canvas - the canvas to render into
       * @param {Object} [opts] - anything `new Alloy(canvas, opts)` takes, plus:
       * @param {Object} [opts.camera] - OrbitCamera options
       * @param {Object} [opts.package] - a package to load immediately
       */
      constructor(canvas, opts) {
        const cfg = opts || {};

        /** @type {Alloy} the renderer. Lights, stats and every draw method live here. */
        this.renderer = new Alloy(canvas, cfg);

        /** @type {OrbitCamera} the camera. Orbit, pan, dolly, attach, frameBounds, goTo. */
        this.camera = new OrbitCamera(cfg.camera);

        /** @type {Array<Instance>} everything `render` walks, in creation order */
        this.instances = [];

        /** @type {Object|null} the loaded package, as data. Read it; do not edit it in place. */
        this.package = null;

        this._models = new Map();     // model name to built model, shared by every instance
        this._textures = new Map();   // TEXTURE name to Texture2D, shared by every material
        this._materials = new Map();  // material name to the float form a draw call wants
        this._resolve = (name) => this.material(name);

        if (cfg.package) this.loadPackage(cfg.package);
      }

      /**
       * Loads a package: uploads its textures, and forgets everything from the package before it.
       *
       * Textures are uploaded once per TEXTURE, not once per material that names one — six
       * materials on the same brick share one upload. Models are NOT built here: a package is a
       * library and a scene uses part of it, so a model is merged the first time an instance of it
       * is created, and never again after that.
       *
       * A texture that fails to evaluate throws. That is a broken package, and load is exactly
       * when you want to hear about it — not on frame four hundred, in a colour you cannot place.
       *
       * @param {Object} pkg - an Alloy package
       * @returns {Stage} - this, for chaining
       */
      loadPackage(pkg) {
        if (!pkg || typeof pkg !== 'object') {
          throw new Error('Alloy: loadPackage wants a package object, got ' +
                          (pkg === null ? 'null' : typeof pkg) + '.');
        }
        migratePackage(pkg);
        const issues = validatePackage(pkg);
        if (issues.length) {
          throw new Error('Alloy: this package will not load:\n  ' + issues.join('\n  '));
        }
        this.unloadPackage();
        this.package = pkg;

        for (const name in (pkg.textures || {})) {
          try {
            this._textures.set(name, this.renderer.makeTexture(pkg.textures[name]));
          } catch (err) {
            throw new Error('Alloy: texture "' + name + '" did not evaluate: ' + err.message);
          }
        }
        return this;
      }

      /**
       * Drops every GPU resource this package put on the card, and every instance standing on it.
       * `loadPackage` calls it before loading the next one.
       * @returns {void}
       */
      unloadPackage() {
        this.instances.length = 0;
        for (const built of this._models.values()) this.renderer.disposeModel(built);
        for (const tex of this._textures.values()) this.renderer.disposeTexture(tex);
        this._models.clear();
        this._textures.clear();
        this._materials.clear();
        this.package = null;
      }

      /**
       * The float form of a material that a draw call wants, cached.
       *
       * A package stores colours as hex, because that is what a person types and what a colour
       * input speaks; the renderer takes float triples. Converting here, once per material, serves
       * both audiences without either one converting per frame.
       *
       * @param {string} name - the material's name
       * @returns {Object} - `{color, emissive, texture, alphaTest, unlit}`
       */
      material(name) {
        if (this._materials.has(name)) return this._materials.get(name);
        const m = (this.package && this.package.materials && this.package.materials[name]) || null;
        if (!m) return DEFAULT_MATERIAL;
        const rgb = (c, dflt) => { const v = toRGBA(c || dflt); return [v[0], v[1], v[2]]; };
        const out = {
          color: rgb(m.color, '#ffffff'),
          emissive: rgb(m.emissive, '#000000'),
          texture: (m.texture && this._textures.get(m.texture)) || null,
          alphaTest: m.alphaTest || 0,
          unlit: !!m.unlit,
        };
        this._materials.set(name, out);
        return out;
      }

      /**
       * The model data a name refers to, as it sits in the package.
       * @param {string} name - the model's name
       * @returns {Object} - the model
       */
      modelData(name) {
        const m = this.package && this.package.models && this.package.models[name];
        if (!m) {
          throw new Error('Alloy: this package has no model called "' + name + '". It has: ' +
                          (Object.keys((this.package && this.package.models) || {}).join(', ') ||
                           'none') + '.');
        }
        return m;
      }

      /**
       * The clips that drive a model, out of the loaded package.
       *
       * @param {string} model - the model's name
       * @returns {Object} - a clips map, possibly empty
       * @see clipsForModel, which is the rule; this is the loaded package asking it
       */
      clipsFor(model) {
        return clipsForModel(this.package && this.package.clips, model);
      }

      /**
       * Builds a model, or returns the one already built. One merge and one vertex buffer per
       * model name, however many instances stand on it.
       * @param {string} name - the model's name
       * @returns {Object} - the built model
       */
      built(name) {
        if (!this._models.has(name)) {
          this._models.set(name, this.renderer.makeModel(this.modelData(name)));
        }
        return this._models.get(name);
      }

      /**
       * Puts a model in the world.
       * @param {string} model - the model's name in the package
       * @param {Object} [opts] - position, rotation, scale, visible, materials, compose, animate
       * @returns {Instance} - the instance, already in the world
       */
      createInstance(model, opts) {
        const inst = new Instance(this, model, this.built(model), opts);
        this.instances.push(inst);
        return inst;
      }

      /**
       * Takes an instance out of the world.
       * @param {Instance} inst - the instance
       * @returns {boolean} - true if it was there
       */
      remove(inst) {
        const at = this.instances.indexOf(inst);
        if (at < 0) return false;
        this.instances.splice(at, 1);
        return true;
      }

      /**
       * Aims the camera. Every field is optional and anything unsaid is left alone.
       *
       * These are the camera's DESIRED values, which it eases toward. That easing is the
       * difference between a camera move and a camera cut, and `instant` is how you ask for a cut.
       *
       * @param {Object} opts - `{target, distance, yaw, pitch, fov, instant}`
       * @returns {Stage} - this, for chaining
       */
      setCamera(opts) {
        this.camera.goTo(opts);
        return this;
      }

      /**
       * Advances everything by `dt` seconds and draws one frame.
       *
       * ANIMATORS ADVANCE WHETHER OR NOT THE INSTANCE IS DRAWN. A character who is invisible or
       * culled and whose clip stops advancing is a bug you meet three hours later, when it pops
       * into view mid-stride or never fires the event a door was waiting on. Skipping the DRAW is
       * what visibility and culling are for, and that saving is already taken.
       *
       * @param {number} dt - seconds since the last call
       * @returns {Object} - the renderer's stats for this frame
       */
      render(dt) {
        const step = dt || 0;
        this.camera.update(step);
        this.renderer.beginFrame(this.camera);
        for (const inst of this.instances) {
          if (inst.animator) inst.animator.update(step, inst.bones);
          if (!inst.visible) continue;
          if (inst.compose) {
            instanceMatrix(inst.matrix, inst.position, inst.rotation, inst.scale);
          }
          this.renderer.drawModel(inst._built, inst.matrix,
            inst.materials ? (n) => inst.materials[n] || this.material(n) : this._resolve,
            inst.bones);
        }
        this.renderer.endFrame();
        return this.renderer.stats;
      }

      /**
       * Matches the drawing buffer to the canvas's size on screen. `render` already does this;
       * call it directly only when you need the new size before the next frame.
       * @returns {boolean} - true if the size changed
       */
      resize() { return this.renderer.resize(); }

      /**
       * Finds the nearest instance under a point on the canvas, by bounding box.
       *
       * Boxes, not triangles, for the same reason the workbench picks that way: it is fifty lines
       * against an exactness that costs real work per click and that nobody has yet missed. A game
       * that needs the exact surface has `Alloy.pick` and the instance list, which is all this is.
       *
       * @param {number} sx - x in CSS pixels from the canvas's left edge
       * @param {number} sy - y in CSS pixels from its top edge
       * @returns {Object|null} - `{instance, distance}`, or null for a miss
       */
      instanceAt(sx, sy) {
        const canvas = this.renderer.canvas;
        const w = canvas.clientWidth, h = Math.max(canvas.clientHeight, 1);
        const viewProj = mat4.multiply(mat4.create(),
          this.camera.proj(mat4.create(), w / h), this.camera.view(mat4.create()));
        const inv = mat4.invert(mat4.create(), viewProj);
        if (!inv) return null;
        const ray = unproject({ origin: [0, 0, 0], dir: [0, 0, 1] }, sx, sy, inv, w, h);
        const world = { min: [0, 0, 0], max: [0, 0, 0] };
        let best = null;
        for (const inst of this.instances) {
          if (!inst.visible || !inst._built.bounds) continue;
          transformBounds(world, inst._built.bounds, inst.matrix);
          const t = rayAABB(ray.origin, ray.dir, world.min, world.max);
          if (t >= 0 && (!best || t < best.distance)) best = { instance: inst, distance: t };
        }
        return best;
      }

      /**
       * Releases everything: the package's GPU resources, and the renderer's own.
       * @returns {void}
       */
      dispose() {
        this.unloadPackage();
        this.renderer.dispose();
      }
    }

    /**
     * Stands a package on a canvas. The one call a game makes.
     *
     * Everything it returns is public and everything it does is available separately, so a game
     * that outgrows the stage keeps its renderer and walks away, rather than rewriting.
     *
     * @param {HTMLCanvasElement} canvas - the canvas to render into
     * @param {Object} [opts] - renderer options, plus `camera` and `package`
     * @returns {Stage} - the stage
     */
    function init(canvas, opts) { return new Stage(canvas, opts); }

    //#endregion === Runtime ===


    // =====================================================================
    //           Statics — what the engine tells you about itself
    // =====================================================================
    //#region === Statics ===

    // THE ONE CALL A GAME MAKES. Everything below this line is what the stage is built from, and
    // is here because a game that outgrows the stage should keep the engine, not leave it.
    Alloy.init = init;
    Alloy.Stage = Stage;
    Alloy.Instance = Instance;

    // The math travels with the engine. A consuming project should never reimplement a matrix
    // multiply to position a model, and Phase 5's animation blending is built entirely on quat.
    Alloy.vec3 = vec3;
    Alloy.mat3 = mat3;
    Alloy.mat4 = mat4;
    Alloy.quat = quat;

    // Geometry builders, by name and directly. `buildGeometry` is what model data goes through;
    // the named builders are for a caller that already knows what it wants.
    Alloy.geometry = {
      box, plane, cylinder, cone, sphere, wedge, gridLines, axisLines,
      build: buildGeometry, subdivide, projectUVs, computeBounds, edgeLines,
    };

    // Models: the node tree, and what turns one into something the GPU can draw. `mergeModel`
    // runs in Node, which is how a model can be built and asserted about without a browser.
    Alloy.mergeModel = mergeModel;
    Alloy.countNodes = countNodes;
    Alloy.identityBones = identityBones;
    Alloy.clipsForModel = clipsForModel;
    Alloy.instanceMatrix = instanceMatrix;
    Alloy.nodeRotation = nodeRotation;
    Alloy.primitiveTypes = PRIMITIVE_TYPES;
    Alloy.defaultMaterial = DEFAULT_MATERIAL;

    // Culling, exposed because a game with its own scene graph wants to cull before it ever calls
    // a draw method — which is the whole point of the game owning the world.
    Alloy.frustum = { fromMatrix: frustumFromMatrix, testAABB: aabbInFrustum, transformBounds };

    // Picking: a game needs to know what was clicked as much as a workbench does.
    Alloy.pick = { project, unproject, rayAABB, rayPlane, closestOnLine };

    // Animation. All of it is pure math, which is how a walk cycle is asserted about in Node: the
    // animator writes into a Float32Array and has never heard of a renderer.
    Alloy.makeAnimator = makeAnimator;
    Alloy.prepareClip = prepareClip;
    Alloy.easings = Object.keys(EASINGS);
    Alloy.matToQuat = matToQuat;

    // Ask the engine what it supports instead of reading its source. This is the OFCU rule about
    // an AI being a first-class user, and it costs nothing here because the schema is the same
    // table the builders read their defaults from.
    Alloy.geometryTypes = Object.keys(GEOMETRY_SPECS);
    Alloy.describeGeometry = describeGeometry;

    // The texture engine, whole. `evaluate` is the one a game calls; the rest is what the
    // workbench and a test need. All of it runs in Node — that is the point of the section.
    Alloy.texture = {
      evaluate: evaluateTexture,
      bake: bakeTexture,
      makePixels, clonePixels, fillPixels,
      toBytes: pixelsToBytes, fromBytes: pixelsFromBytes,
      packAtlas,
      decodePNG, encodePNG, pngSize,
      base64Encode, base64Decode,
      color: toRGBA,
    };

    // The vocabulary a texture may use, published so a UI builds its menus from the registry and
    // an AI writing a layer stack can ask instead of guessing.
    // The row types a texture is made of, in the order a picker should offer them.
    Alloy.layerTypes = ['generator', 'shape', 'raster', 'image', 'adjust'];
    Alloy.generatorTypes = Object.keys(TEXTURE_GENERATORS);
    Alloy.describeGenerator = describeGenerator;
    Alloy.drawOpTypes = Object.keys(DRAW_OPS);
    Alloy.describeDrawOp = describeDrawOp;
    Alloy.adjustmentTypes = Object.keys(ADJUSTMENTS);
    Alloy.describeAdjustment = describeAdjustment;
    Alloy.blendModes = Object.keys(BLEND_MODES);
    // The font, exposed so the workbench can draw a glyph picker and so anyone who wants to fix
    // a letter can see exactly what shape it is.
    Alloy.font = { glyphs: FONT_5X7, width: FONT_W, height: FONT_H };

    // The package: what a game loads, and how it becomes text in a file. The engine owns the
    // schema and its migrations; the workbench never edits the shape.
    Alloy.emptyPackage = emptyPackage;
    Alloy.emptyTexture = emptyTexture;
    Alloy.emptyModel = emptyModel;
    Alloy.emptyMaterial = emptyMaterial;
    Alloy.emptyClip = emptyClip;
    Alloy.collectBoneNames = collectBoneNames;
    Alloy.migratePackage = migratePackage;
    Alloy.validatePackage = validatePackage;
    Alloy.packageBlock = packageBlock;
    Alloy.parsePackageBlock = parsePackageBlock;
    Alloy.packageIdent = packageIdent;
    Alloy.packageSchema = PACKAGE_SCHEMA;

    Alloy.OrbitCamera = OrbitCamera;
    Alloy.defaults = { engine: ENGINE_DEFAULTS, camera: CAMERA_DEFAULTS };
    Alloy.attributeLocations = ATTR;

    Alloy.version = ALLOY_VERSION;
    Alloy.build = ALLOY_BUILD;

    //#endregion === Statics ===

    return Alloy;
  })();

</script>

<script data-ofcu-type="app" data-ofcu-project="alloy">
  // =====================================================================
  // =====================================================================
  //                 ALLOY — the visual engine of the OFCU
  //                    APP — the authoring workbench
  // =====================================================================
  // =====================================================================
  "use strict";

  // Alloy is the visual counterpart to Webposium: textures, meshes and animation, computed at
  // runtime from JSON, with no asset files anywhere. It is developed under the OFCU rules:
  //
  //  1. One file only, forever. `alloy.html` is the whole program. No external .js, .css, .json,
  //     .png, .glb. No CDN, no build step, no fetch.
  //  2. Only HTML, CSS, JS and WebGL2. Nothing downloaded from the internet gets embedded.
  //  3. All data is JSON. Geometry, skeletons and clips are readable text; base64 PNG is allowed
  //     only as a raster layer inside a texture stack.
  //  4. The engine block above is portable. It works identically here and pasted into a game, and
  //     it never reaches for markup it does not own.
  //
  // Everything in THIS block is the workbench and is never exported.
  //
  // PHASE 2 — the texture workbench. The shell arrives here because there is finally more than one
  // thing to look at: a rail listing the package, a desk of floating windows, and a status bar.
  // The mesh and animation workbenches (Phases 4 and 6) are new window KINDS on this same shell,
  // not new shells.

  // =====================================================================
  //           App Setup — dom refs, prefs, logging
  // =====================================================================
  //#region === App Setup ===

  // Every element the app touches, in one place. A typo here is a null at boot rather than an
  // undefined halfway through a render, and the checker cross-references this map against the
  // markup so a renamed id cannot go unnoticed.
  const dom = {
    head:       document.getElementById('head'),
    ver:        document.getElementById('ver'),
    dot:        document.getElementById('dot'),
    pkgName:    document.getElementById('pkgName'),
    homeText:   document.getElementById('homeText'),
    saveBtn:    document.getElementById('saveBtn'),
    saveAs:     document.getElementById('saveAs'),
    btnView:    document.getElementById('btnView'),
    btnWindows: document.getElementById('btnWindows'),
    btnRail:    document.getElementById('btnRail'),
    rail:       document.getElementById('rail'),
    desk:       document.getElementById('desk'),
    deskHint:   document.getElementById('deskHint'),
    deskLine:   document.getElementById('deskLine'),
    stat:       document.getElementById('stat'),
    log:        document.getElementById('log'),
    menu:       document.getElementById('menu'),
    card:       document.getElementById('card'),
    fileIn:     document.getElementById('fileIn'),
    imgIn:      document.getElementById('imgIn'),
    fatal:      document.getElementById('fatal'),
    fatalTitle: document.getElementById('fatalTitle'),
    fatalBody:  document.getElementById('fatalBody'),
  };

  /**
   * Writes one line to the status bar. The app has exactly one voice, and this is it: every
   * refusal from the engine arrives here, at the moment it happens, in a sentence a person can
   * act on. There is no `console.log` in a shipped path, because a message nobody sees is a
   * message nobody acts on.
   * @param {string} html - the message, simple inline markup allowed
   * @returns {void}
   */
  function log(html) { dom.log.innerHTML = html; }

  /**
   * Reports a caught error in the status bar and hands the message back.
   * @param {Error} err - the error
   * @returns {string} - its first line
   */
  function logError(err) {
    const first = (err && err.message ? err.message : String(err)).split('\n')[0];
    log('<i>' + escapeHtml(first) + '</i>');
    return first;
  }

  /**
   * Clamps a value into an inclusive range.
   *
   * The engine has one of these, inside its own closure, where the app cannot reach it. Sharing
   * it would mean exporting a three-line utility across the one boundary this file is built on,
   * so the app keeps its own — and this comment exists so nobody spends a minute wondering which
   * one they are looking at.
   *
   * @param {number} v - value to clamp
   * @param {number} lo - lower bound
   * @param {number} hi - upper bound
   * @returns {number} - v, or the bound it exceeded
   */
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /**
   * Rounds up to the next 1, 2 or 5 times a power of ten: 0.3 → 0.5, 1.2 → 2, 7 → 10, 30 → 50.
   * @param {number} v - a positive number
   * @returns {number} - the nice number at or above it
   */
  function niceCeil(v) {
    if (!(v > 0)) return 1;
    const e = Math.pow(10, Math.floor(Math.log10(v)));
    const m = v / e;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e;
  }

  /**
   * Escapes text for insertion into markup.
   * @param {string} s - the text
   * @returns {string} - the escaped text
   */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  }

  /**
   * Replaces the desk with an unrecoverable-error card.
   * @param {string} title - a short heading
   * @param {string} body - what happened and what to try
   * @returns {void}
   */
  function fatal(title, body) {
    dom.fatalTitle.textContent = title;
    dom.fatalBody.textContent = body;
    dom.fatal.hidden = false;
  }

  // --- UI preferences: about the person and their monitor, never about the work ---

  const PREFS_KEY = 'alloy.prefs';
  const SNAP_KEY = 'alloy.snapshot';

  const uiPrefs = (function loadPrefs() {
    const base = { rail: true, win: {}, lastStorage: null, tiling: false, booted: false, texRight: 292, texJson: 380 };
    try {
      const raw = localStorage.getItem(PREFS_KEY);
      return raw ? Object.assign(base, JSON.parse(raw)) : base;
    } catch (err) {
      // A corrupt or unavailable localStorage must not stop the tool from opening. Layout is a
      // convenience; losing it costs one drag.
      return base;
    }
  })();

  /**
   * Persists the UI preferences. Called on every layout change, so it swallows quota and
   * private-mode failures rather than interrupting whatever the person was doing.
   * @returns {void}
   */
  function savePrefs() {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(uiPrefs)); } catch (err) { /* not fatal */ }
  }

  //#endregion === App Setup ===


  // =====================================================================
  //           Package State — the one loaded package, and undo
  // =====================================================================
  //#region === Package State ===

  // *********************************************************************
  // MENTAL MODEL: THERE IS ONE LOADED PACKAGE and every editor is a view of it with no state of
  // its own beyond view state — selection, scroll, zoom, which layer is being edited. Every edit
  // goes through the package and calls histTouch().
  //
  // UNDO IS PACKAGE SNAPSHOTS, not a command stack. The build plan asked for a command stack;
  // this is a deliberate departure, and the reason is that a command stack has to be exhaustive
  // to be correct. Every new edit path is a new command, and the one somebody forgets to write is
  // an edit that silently cannot be undone. A snapshot cannot be forgotten: if the change is in
  // the package it is in the snapshot, and if it is not in the package it was view state and
  // should not have survived anyway.
  //
  // That gives a free correctness check on every future editor: an editor whose data does not
  // survive an undo is an editor keeping package state somewhere it does not belong.
  //
  // The cost is memory, and it is bounded by the one thing here that is not small — a base64
  // raster layer. Those are INTERNED by content hash, so a snapshot stores a key rather than a
  // copy of a PNG, and thirty undo steps of a package with a hand-painted texture cost thirty
  // copies of a short string.
  // *********************************************************************

  /** @type {Object} the loaded package; the one thing every editor reads */
  let pkg = Alloy.emptyPackage('untitled');

  /** @type {Object|null} where Save goes: {kind:'storage'|'file', name, handle} */
  let home = null;

  /** @type {{kind: string, id: string}|null} the rail's selection, at most one thing */
  let selection = null;

  // The raster intern table. Keys are content hashes; values are the base64 payloads. A package
  // in a snapshot carries keys; the live package carries the payloads.
  const rasterStore = new Map();

  const history = { past: [], future: [], pending: null, timer: 0, clean: null };
  const HISTORY_LIMIT = 60;

  /**
   * Hashes a string to a short stable key. Used only to intern raster payloads, where a collision
   * would swap one hand-painted texture for another — so it takes 64 bits from two independent
   * passes rather than 32, which puts a collision past anything a person will ever author.
   * @param {string} s - the text
   * @returns {string} - a hex key
   */
  function internKey(s) {
    let a = 0x811c9dc5, b = 0x01000193;
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
