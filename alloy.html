     * them. It is the last render when that was at full size, and one full evaluation otherwise.
     * @returns {Object|null} - Pixels, or null when the texture will not evaluate
     */
    function fullComposite() {
      const t = tex();
      if (!t) return null;
      if (lastPixels && lastPixels.width === t.width && lastPixels.height === t.height) return lastPixels;
      try {
        const opts = work ? { pixels: { [work.index]: float ? withFloat(work.pixels) : work.pixels } } : undefined;
        lastPixels = Alloy.texture.evaluate(t, opts);
        return lastPixels;
      } catch (err) { logError(err); return null; }
    }

    host.innerHTML =
      '<div class="tex">' +
        '<div class="tex-rail" data-ui="rail"></div>' +
        '<div class="tex-left">' +
          '<div class="tex-tools" data-ui="tools"></div>' +
          '<div class="tex-stage" data-ui="stage">' +
            '<div class="tex-canvas-wrap" data-ui="wrap">' +
              '<canvas data-ui="canvas"></canvas>' +
              '<div class="tex-ov" data-ui="ov"></div>' +
            '</div>' +
            '<div class="tex-json" data-ui="json" hidden>' +
              '<textarea data-ui="jsonText" spellcheck="false"></textarea>' +
              '<div class="note" data-ui="jsonNote"></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="tex-right" data-ui="right">' +
          '<div class="tex-layers" data-ui="layers"></div>' +
          '<div class="tex-insp" data-ui="insp"></div>' +
        '</div>' +
        '<input type="color" data-ui="wellIn" style="position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0">' +
      '</div>';

    // Found by `data-ui` inside this editor's own root, never by id: there can be two of this
    // window open, and ids would make them fight over the same elements.
    const ui = {};
    for (const el of host.querySelectorAll('[data-ui]')) ui[el.dataset.ui] = el;
    ui.jsonText.addEventListener('input', applyJson);
    // Both side panels resize by their inner edge, and remember it for every texture window.
    ui.right.style.flex = '0 0 ' + uiPrefs.texRight + 'px';
    makeSplitter(ui.right, 'left', () => uiPrefs.texRight, (w) => {
      uiPrefs.texRight = Math.round(w);
      ui.right.style.flex = '0 0 ' + uiPrefs.texRight + 'px';
      savePrefs();
      layoutPreview();
      drawHandles();
    }, 220, 700);
    ui.json.style.width = uiPrefs.texJson + 'px';
    makeSplitter(ui.json, 'right', () => uiPrefs.texJson, (w) => {
      uiPrefs.texJson = Math.round(w);
      ui.json.style.width = uiPrefs.texJson + 'px';
      savePrefs();
    }, 240, 900);
    // Tab inserts two spaces rather than leaving the panel: it is a code box.
    ui.jsonText.addEventListener('keydown', (ev) => {
      if (ev.key !== 'Tab') return;
      ev.preventDefault();
      const el = ui.jsonText, a = el.selectionStart, b = el.selectionEnd;
      el.value = el.value.slice(0, a) + '  ' + el.value.slice(b);
      el.selectionStart = el.selectionEnd = a + 2;
      applyJson();
    });

    /**
     * The texture this editor edits, read fresh from the package every time.
     * @returns {Object|null} - the texture, or null if it has been deleted
     */
    function tex() { return pkg.textures[name] || null; }

    /**
     * The selected row, or null.
     * @returns {Object|null} - the row
     */
    function layer() {
      const t = tex();
      return t && t.layers[view.layer] ? t.layers[view.layer] : null;
    }

    /**
     * Records an edit and redraws everything that shows it.
     * @param {string} label - what changed, for the undo step
     * @param {boolean} [structural] - true when the row list itself changed
     * @returns {void}
     */
    function edited(label, structural) {
      histTouch(label);
      scheduleRender();
      if (structural) { drawLayers(); drawRail(); }
      drawInspector();
      drawBytes();
      drawJson();
      buildRail();
      notifyViewers();
    }

    // --- Preview ---

    /**
     * Schedules a preview evaluation on the next frame.
     *
     * Coalescing to one evaluation per frame is what makes dragging a slider feel live: without
     * it a fast drag queues thirty evaluations of a 256 pixel texture and the UI stops answering.
     *
     * @returns {void}
     */
    function scheduleRender() {
      if (pending) return;
      pending = requestAnimationFrame(() => { pending = 0; render(); });
    }

    /**
     * Evaluates the texture and paints it, with the handles over it.
     * @returns {void}
     */
    function render() {
      const t = tex();
      if (!t) return;
      const cap = previewCap();
      const scale = Math.min(1, cap / Math.max(t.width, t.height));
      const w = Math.max(1, Math.round(t.width * scale));
      const h = Math.max(1, Math.round(t.height * scale));

      let px;
      try {
        // The working pixels stand in for the paint row at any scale: the engine fits them the
        // way it fits a picture, so a stroke shows live on a texture bigger than the screen too.
        const opts = work ? { pixels: { [work.index]: float ? withFloat(work.pixels) : work.pixels } } : undefined;
        px = Alloy.texture.evaluate(scale === 1 ? t : Object.assign({}, t, { width: w, height: h }), opts);
      } catch (err) {
        // The error goes where the eyes are. Leaving the last good picture up and a red line in
        // the status bar read as "the toggles do nothing", which is worse than a broken preview.
        const message = logError(err);
        const canvas = ui.canvas;
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#3a1418';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#ff9a9a';
        ctx.font = Math.max(10, Math.round(w / 14)) + 'px ui-monospace, monospace';
        const words = message.split(' ');
        let line = '', y = Math.round(h * 0.25);
        for (const word of words) {
          const next = line ? line + ' ' + word : word;
          if (ctx.measureText(next).width > w - 16 && line) { ctx.fillText(line, 8, y); line = word; y += Math.round(w / 11); }
          else line = next;
        }
        ctx.fillText(line, 8, y);
        layoutPreview();
        return;
      }
      lastPixels = px;
      renderedCap = Math.max(w, h);
      const bytes = Alloy.texture.toBytes(px);
      const reps = view.tiling ? 3 : 1;
      const canvas = ui.canvas;
      canvas.width = w * reps;
      canvas.height = h * reps;
      const ctx = canvas.getContext('2d');
      const img = new ImageData(bytes, w, h);
      for (let ty = 0; ty < reps; ty++) {
        for (let tx = 0; tx < reps; tx++) ctx.putImageData(img, tx * w, ty * h);
      }
      layoutPreview();
      drawHandles();
    }

    /**
     * Sizes the preview to fit the stage, times the zoom, and applies the pan.
     * @returns {void}
     */
    function layoutPreview() {
      const stage = ui.stage.getBoundingClientRect();
      const canvas = ui.canvas;
      if (!canvas.width || !stage.width) return;
      // The fit is for ONE tile, tiling or not: turning tiling on keeps the texture the size it
      // was and grows the neighbours outward around it, off the edges of the stage if need be.
      const reps = view.tiling ? 3 : 1;
      const fit = Math.min((stage.width - 16) / (canvas.width / reps), (stage.height - 16) / (canvas.height / reps));
      const scale = Math.max(0.02, fit * Math.pow(1.25, view.zoom));
      const cw = Math.round(canvas.width * scale);
      const ch = Math.round(canvas.height * scale);
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      ui.wrap.style.width = cw + 'px';
      ui.wrap.style.height = ch + 'px';
      ui.wrap.style.transform = 'translate(' + Math.round(view.panX) + 'px, ' + Math.round(view.panY) + 'px)';
    }

    /**
     * Is a texel inside the selection? Everything is, when there is none.
     * @param {number} x - texel x
     * @param {number} y - texel y
     * @returns {boolean} - true when painting there is allowed
     */
    function selHas(x, y) {
      const sel = view.sel;
      if (!sel) return true;
      if (x < sel.x || y < sel.y || x >= sel.x + sel.w || y >= sel.y + sel.h) return false;
      return !sel.mask || sel.mask[(y - sel.y) * sel.w + (x - sel.x)] === 1;
    }

    /**
     * Combines a fresh selection with the current one the way the modifier asks: Shift adds,
     * Alt subtracts, neither replaces.
     * @param {Object} next - `{x, y, w, h, mask}`
     * @param {PointerEvent} ev - the gesture, for its modifiers
     * @returns {void}
     */
    function applySelection(next, ev) {
      const cur = view.sel;
      if (!cur || !(ev.shiftKey || ev.altKey)) { view.sel = next; return; }
      const has = (sel, x, y) => x >= sel.x && y >= sel.y && x < sel.x + sel.w && y < sel.y + sel.h &&
                                (!sel.mask || sel.mask[(y - sel.y) * sel.w + (x - sel.x)] === 1);
      const x0 = ev.altKey ? cur.x : Math.min(cur.x, next.x), y0 = ev.altKey ? cur.y : Math.min(cur.y, next.y);
      const x1 = ev.altKey ? cur.x + cur.w : Math.max(cur.x + cur.w, next.x + next.w);
      const y1 = ev.altKey ? cur.y + cur.h : Math.max(cur.y + cur.h, next.y + next.h);
      const w = x1 - x0, h = y1 - y0, mask = new Uint8Array(w * h);
      let any = false;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const inCur = has(cur, x0 + x, y0 + y), inNext = has(next, x0 + x, y0 + y);
        const on = ev.altKey ? inCur && !inNext : inCur || inNext;
        if (on) { mask[y * w + x] = 1; any = true; }
      }
      view.sel = any ? trimSelection({ x: x0, y: y0, w, h, mask }) : null;
    }

    /**
     * Shrinks a masked selection's box to the texels it actually holds.
     * @param {Object} sel - a selection with a mask
     * @returns {Object} - the same selection, trimmed
     */
    function trimSelection(sel) {
      let x0 = sel.w, y0 = sel.h, x1 = -1, y1 = -1;
      for (let y = 0; y < sel.h; y++) for (let x = 0; x < sel.w; x++) {
        if (!sel.mask[y * sel.w + x]) continue;
        if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y;
      }
      if (x1 < 0) return null;
      const w = x1 - x0 + 1, h = y1 - y0 + 1, mask = new Uint8Array(w * h);
      let full = true;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        mask[y * w + x] = sel.mask[(y + y0) * sel.w + x + x0];
        if (!mask[y * w + x]) full = false;
      }
      return { x: sel.x + x0, y: sel.y + y0, w, h, mask: full ? null : mask };
    }

    // --- Coordinates ---

    /**
     * Converts a client point to normalized texture coordinates, on the centre tile.
     * @param {number} clientX - client x
     * @param {number} clientY - client y
     * @returns {number[]} - [u, v] in 0..1 on the texture, unclamped
     */
    function toTexture(clientX, clientY) {
      const r = ui.canvas.getBoundingClientRect();
      const reps = view.tiling ? 3 : 1, off = view.tiling ? 1 : 0;
      return [((clientX - r.left) / r.width) * reps - off, ((clientY - r.top) / r.height) * reps - off];
    }

    /**
     * Converts normalized texture coordinates to a position inside the canvas wrapper.
     * @param {number} u - normalized x
     * @param {number} v - normalized y
     * @returns {number[]} - [left, top] in CSS pixels
     */
    function toWrap(u, v) {
      const r = ui.canvas.getBoundingClientRect();
      const reps = view.tiling ? 3 : 1, off = view.tiling ? 1 : 0;
      return [((u + off) / reps) * r.width, ((v + off) / reps) * r.height];
    }

    /**
     * The texel under a client point.
     * @param {number} clientX - client x
     * @param {number} clientY - client y
     * @returns {number[]} - [x, y] whole texels, unclamped
     */
    function toTexel(clientX, clientY) {
      const t = tex();
      const [u, v] = toTexture(clientX, clientY);
      return [Math.floor(u * t.width), Math.floor(v * t.height)];
    }

    // --- Toolbar ---

    /**
     * Rebuilds the toolbar above the preview.
     * @returns {void}
     */
    function drawTools() {
      const t = tex();
      if (!t) return;
      ui.tools.innerHTML = '';
      const tile = miniButton('tile 3×3', 'check the texture wraps without a seam', () => {
        view.tiling = !view.tiling;
        uiPrefs.tiling = view.tiling;
        savePrefs();
        drawTools();
        render();
      });
      tile.classList.toggle('on', view.tiling);
      ui.tools.append(tile);
      ui.tools.append(miniButton('−', 'zoom out', () => { view.zoom--; layoutPreview(); drawHandles(); }));
      ui.tools.append(miniButton('+', 'zoom in', () => { view.zoom++; layoutPreview(); drawHandles(); }));
      ui.tools.append(miniButton('fit', 'fit the preview to the window', () => { view.zoom = 0; view.panX = 0; view.panY = 0; layoutPreview(); drawHandles(); renderIfCoarse(); }));

      const size = document.createElement('span');
      size.style.color = 'var(--dim2)';
      size.style.marginLeft = '4px';
      size.textContent = t.width + '×' + t.height;
      ui.tools.append(size);
      ui.tools.append(miniButton('size…', 'change the texture resolution', (ev) => {
        askText(ev.clientX, ev.clientY, 'Size in pixels, as "width x height" or one number', t.width + 'x' + t.height, (v) => {
          const m = v.match(/^\s*(\d+)\s*(?:[x×,\s]\s*(\d+))?\s*$/);
          if (!m) { log('<i>write a size like 128 or 256x64</i>'); return; }
          const w = parseInt(m[1], 10), h = m[2] ? parseInt(m[2], 10) : w;
          if (w < 1 || h < 1 || w > 4096 || h > 4096) { log('<i>sizes run from 1 to 4096</i>'); return; }
          const n = resamplePaintRows(t, w, h);
          t.width = w; t.height = h;
          work = null;
          edited('resize texture', true);
          drawTools();
          if (n) log('resized to <b>' + w + '×' + h + '</b> &middot; ' + n + ' paint row' + (n === 1 ? '' : 's') + ' resampled');
        });
      }));

      const seed = document.createElement('span');
      seed.style.color = 'var(--dim2)';
      seed.style.marginLeft = '4px';
      seed.textContent = 'seed ' + (t.seed | 0);
      ui.tools.append(seed);
      ui.tools.append(miniButton('reroll', 'a different draw of the same recipe', () => {
        t.seed = (Math.random() * 1e9) | 0;
        edited('reroll seed');
        drawTools();
      }));

      const sep = document.createElement('span');
      sep.className = 'sep';
      ui.tools.append(sep);
      const bytes = document.createElement('span');
      // Both readouts keep a fixed box whether or not they have anything to say. A toolbar that
      // wraps decides its height from what is in it, and a readout that appeared on hover once
      // tipped the whole row onto two lines and pushed the picture down every time the pointer
      // crossed it.
      bytes.style.cssText = 'color:var(--dim2);min-width:7ch;flex:0 0 auto';
      bytes.dataset.role = 'bytes';
      bytes.title = 'what this texture costs in the data block, indentation and all';
      ui.tools.append(bytes);
      const where = document.createElement('span');
      where.style.cssText = 'color:var(--dim2);margin-left:auto;min-width:10ch;text-align:right;flex:0 0 auto';
      where.dataset.role = 'where';
      // A no-break space, never empty: an empty span that has wrapped to its own line has no
      // height, and the first hover gave it some, which pushed the picture down.
      where.textContent = ' ';
      ui.tools.append(where);
      drawBytes();
    }

    /**
     * How many bytes this texture occupies in the package's data block.
     *
     * Measured, not estimated: the block is serialized exactly as a save would write it and the
     * texture's own span is found in that text — from its key line to its closing brace at the
     * same indentation — so the count is what the html file will carry, layout, indentation and
     * base64 included. Not "the block minus the block without it": a package with a material
     * naming this texture refuses to serialize without it.
     *
     * @returns {number} - bytes of UTF-8, or -1 if the package cannot be serialized right now
     */
    function textureBytes() {
      let block;
      try { block = Alloy.packageBlock(pkg); } catch (err) { return -1; }
      const lines = block.split('\n');
      let inTextures = -1, start = -1, indent = 0;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (inTextures < 0) {
          const m = /^(\s*)textures: \{\s*$/.exec(line);
          if (m) inTextures = m[1].length;
          continue;
        }
        if (start < 0) {
          const m = /^(\s*)\S/.exec(line);
          if (!m) continue;
          if (m[1].length <= inTextures) return -1;          // left the textures map: not found
          const key = /^(\s*)("?)([^"]*)\2: \{/.exec(line);
          if (key && key[1].length === inTextures + 2 && key[3] === name) { start = i; indent = key[1].length; }
          continue;
        }
        const close = /^(\s*)\},?\s*$/.exec(line);
        if (close && close[1].length === indent) {
          const text = lines.slice(start, i + 1).join('\n') + '\n';
          return new TextEncoder().encode(text).length;
        }
      }
      return -1;
    }

    /**
     * Refreshes the size readout in the toolbar.
     * @returns {void}
     */
    function drawBytes() {
      const el = ui.tools.querySelector('[data-role=bytes]');
      if (!el) return;
      const n = textureBytes();
      el.textContent = n < 0 ? '? B' : n < 1024 ? n + ' B'
        : n < 1024 * 1024 ? (n / 1024).toFixed(n < 10240 ? 2 : 1) + ' KB'
        : (n / (1024 * 1024)).toFixed(2) + ' MB';
    }

    /**
     * Shows the texel under the pointer, so a painter knows where they are.
     * @param {number[]|null} xy - the texel, or null to clear
     * @returns {void}
     */
    function drawWhere(xy) {
      const el = ui.tools.querySelector('[data-role=where]');
      if (!el) return;
      el.textContent = xy ? xy[0] + ', ' + xy[1] : ' ';
    }

    /**
     * Fills the JSON panel from the texture, unless the person is typing in it.
     * @returns {void}
     */
    function drawJson() {
      if (!view.json) return;
      const t = tex();
      if (!t) return;
      if (document.activeElement === ui.jsonText) return;
      ui.jsonText.value = JSON.stringify(t, null, 2);
      ui.jsonNote.className = 'note';
      ui.jsonNote.textContent = 'Edits apply as you type, once the text parses. Escape leaves the panel.';
    }

    /**
     * Applies the JSON panel's text to the texture, when it parses.
     *
     * The texture object is kept and its contents replaced, because every window and the rail
     * hold the package by reference; swapping the object would leave them looking at a ghost.
     * The name stays the key's, since renaming is the rail's job.
     *
     * @returns {void}
     */
    function applyJson() {
      const t = tex();
      if (!t) return;
      let next;
      try {
        next = JSON.parse(ui.jsonText.value);
      } catch (err) {
        ui.jsonNote.className = 'note bad';
        ui.jsonNote.textContent = err.message;
        return;
      }
      if (!next || typeof next !== 'object' || !Array.isArray(next.layers)) {
        ui.jsonNote.className = 'note bad';
        ui.jsonNote.textContent = 'A texture is an object with a `layers` array.';
        return;
      }
      for (const k of Object.keys(t)) delete t[k];
      Object.assign(t, next);
      t.name = name;
      ui.jsonNote.className = 'note';
      ui.jsonNote.textContent = 'applied';
      view.layer = Math.max(0, Math.min(view.layer, t.layers.length - 1));
      work = null;
      edited('edit json', true);
    }

    // --- The rail: the hand for the selected row ---

    /**
     * One button on the rail.
     * @param {string} glyph - what it shows
     * @param {string} title - the tooltip, with the key in brackets
     * @param {boolean} on - whether it is lit
     * @param {function(MouseEvent): void} fn - what it does
     * @returns {HTMLElement} - the button
     */
    function toolButton(glyph, title, on, fn) {
      const el = document.createElement('div');
      el.className = 'tool' + (on ? ' on' : '');
      el.textContent = glyph;
      el.title = title;
      el.addEventListener('click', fn);
      return el;
    }

    /**
     * A thin line between groups of rail buttons.
     * @returns {HTMLElement} - the separator
     */
    function railSep() {
      const el = document.createElement('div');
      el.className = 'tool sep';
      return el;
    }

    /**
     * The tools that make sense for a row type. Everything else the rail shows is common.
     * @param {string} type - the row type
     * @returns {Array<Object>} - `{tool, glyph, title}` entries
     */
    function handFor(type) {
      // An image row has no hand of its own: it is a picture from outside, and the way to paint
      // on it is to convert it to paint, which the inspector and the row menu both offer.
      if (type === 'raster') {
        return [
          { tool: 'pencil', glyph: '✎', title: 'pencil (B) — left paints primary, right paints secondary' },
          { tool: 'eraser', glyph: '◻', title: 'eraser (E) — to transparent' },
          { tool: 'bucket', glyph: '◆', title: 'bucket (G) — fill the connected colour; Shift fills every pixel of it' },
        ];
      }
      if (type === 'shape') {
        return [
          { tool: 'line', glyph: '╱', title: 'line (L) — drag to draw a new line row' },
          { tool: 'rect', glyph: '▭', title: 'rectangle (R) — drag to draw a new rectangle row' },
          { tool: 'ellipse', glyph: '◯', title: 'ellipse (O) — drag to draw a new ellipse row' },
          { tool: 'polygon', glyph: '⬠', title: 'polygon (P) — click to add points, double-click to finish' },
          { tool: 'text', glyph: 'T', title: 'text (T) — click to place a new text row' },
        ];
      }
      return [];
    }

    /**
     * Rebuilds the rail for the selected row.
     * @returns {void}
     */
    function drawRail() {
      const L = layer();
      const type = L ? L.type : '';
      const hand = handFor(type);
      if (!['move', 'marquee', 'lasso', 'wand', 'picker'].includes(view.tool) && !hand.some((h) => h.tool === view.tool)) {
        // A tool the row cannot use is put down; the hand goes back to the one tool every row has.
        view.tool = 'move';
      }
      ui.rail.innerHTML = '';
      const common = [
        { tool: 'marquee', glyph: '⬚', title: 'marquee (M) — drag a rectangle; Shift adds, Alt subtracts' },
        { tool: 'lasso', glyph: '⌒', title: 'lasso (Q) — draw a loop around texels; Shift adds, Alt subtracts' },
        { tool: 'wand', glyph: '✦', title: 'wand (W) — select the connected colour under the pointer; Ctrl for every texel of it; Shift adds, Alt subtracts' },
        { tool: 'move', glyph: '✥', title: 'move (V) — drag a shape to move it; on a paint row, drag the marquee to move its pixels, Ctrl-drag to copy them' },
        { tool: 'picker', glyph: '⊙', title: 'eyedropper (I) — left picks primary, right picks secondary' },
      ];
      for (const c of common) ui.rail.appendChild(toolButton(c.glyph, c.title, view.tool === c.tool, () => setTool(c.tool)));
      if (view.sel) {
        ui.rail.appendChild(toolButton('⊡', 'use the selection as this row\'s region', false, selectionToRegion));
        ui.rail.appendChild(toolButton('⧉', 'copy the selection\'s texels (Ctrl+C); Ctrl+X cuts, Ctrl+V pastes', false, () => copySelection(false)));
        ui.rail.appendChild(toolButton('✕', 'clear the selection (sets floating pixels down)', false, () => { bakeFloat(); view.sel = null; drawRail(); drawHandles(); }));
      }
      ui.rail.appendChild(railSep());

      if (hand.length) {
        for (const h of hand) ui.rail.appendChild(toolButton(h.glyph, h.title, view.tool === h.tool, () => setTool(h.tool)));
        if (type === 'raster') {
          const size = toolButton(String(paintState.size), 'brush size ([ and ], or Ctrl+wheel over the picture) — click to cycle 1 to 8', false, () => {
            paintState.size = paintState.size >= 8 ? 1 : paintState.size + 1;
            drawRail();
          });
          size.classList.add('num');
          ui.rail.appendChild(size);
          ui.rail.appendChild(toolButton('⇔', 'mirror across X while painting', paintState.symX, () => { paintState.symX = !paintState.symX; drawRail(); }));
          ui.rail.appendChild(toolButton('⇕', 'mirror across Y while painting', paintState.symY, () => { paintState.symY = !paintState.symY; drawRail(); }));
          ui.rail.appendChild(toolButton('α', 'lock alpha — paint only where pixels already are', paintState.lockAlpha, () => { paintState.lockAlpha = !paintState.lockAlpha; drawRail(); }));
          ui.rail.appendChild(toolButton('◐', 'shading ink — the pencil lightens a texel to the next colour in this row\'s palette, right button darkens', paintState.shade, () => { paintState.shade = !paintState.shade; drawRail(); }));
          ui.rail.appendChild(toolButton('⇄', 'replace every primary-coloured pixel with secondary', false, replaceColour));
          ui.rail.appendChild(toolButton('⭘', 'outline — a one-texel border in secondary around everything painted', false, outlineRow));
          if (view.sel) {
            ui.rail.appendChild(railSep());
            ui.rail.appendChild(toolButton('⇋', 'flip the selection left to right', false, () => flipSelection(0)));
            ui.rail.appendChild(toolButton('⇵', 'flip the selection top to bottom', false, () => flipSelection(1)));
            ui.rail.appendChild(toolButton('↻', 'turn the selection a quarter turn clockwise', false, rotateSelection));
          }
        }
        ui.rail.appendChild(railSep());
      }

      if (type === 'generator' || type === 'adjust') {
        // The catalogue: the hand for a row whose only verb is "be this one instead".
        const kind = type === 'generator' ? 'generator' : 'adjust';
        const names = type === 'generator' ? Alloy.generatorTypes : Alloy.adjustmentTypes;
        for (const which of names) {
          const el = document.createElement('div');
          el.className = 'tool thumb' + (L[kind] === which ? ' on' : '');
          el.title = which + ' — ' + (type === 'generator' ? Alloy.describeGenerator(which) : Alloy.describeAdjustment(which)).description;
          const url = catalogueThumb(kind, which);
          if (url) el.style.backgroundImage = 'url(' + url + ')';
          else el.textContent = which.slice(0, 3);
          el.addEventListener('click', () => {
            if (L[kind] === which) return;
            L[kind] = which;
            L.params = {};
            edited('change ' + kind, true);
          });
          ui.rail.appendChild(el);
        }
        if (type === 'generator') {
          ui.rail.appendChild(railSep());
          ui.rail.appendChild(toolButton('⟳', 'reroll the seed', false, () => { tex().seed = (Math.random() * 1e9) | 0; edited('reroll seed'); drawTools(); }));
        }
        ui.rail.appendChild(railSep());
      }

      // The colour wells: the hand's colours, whatever the row.
      const wells = document.createElement('div');
      wells.className = 'wells';
      wells.title = 'primary and secondary colours — click to change, X to swap';
      const primary = document.createElement('div');
      primary.className = 'well primary';
      primary.style.background = paintState.primary;
      primary.addEventListener('click', () => pickWell('primary', primary));
      const secondary = document.createElement('div');
      secondary.className = 'well secondary';
      secondary.style.background = paintState.secondary;
      secondary.addEventListener('click', () => pickWell('secondary', secondary));
      wells.append(secondary, primary);
      ui.rail.appendChild(wells);
      ui.rail.appendChild(toolButton('⇅', 'swap the colours (X)', false, swapColours));

      const spacer = document.createElement('div');
      spacer.style.flex = '1 1 auto';
      ui.rail.appendChild(spacer);
      ui.rail.appendChild(toolButton('{}', 'the texture as the text the data block carries, editable', view.json, () => {
        view.json = !view.json;
        ui.json.hidden = !view.json;
        drawJson();
        drawRail();
      }));
    }

    /**
     * Picks up a tool.
     * @param {string} tool - the tool's name
     * @returns {void}
     */
    function setTool(tool) {
      view.tool = tool;
      if (tool !== 'polygon') view.polyRow = -1;
      drawRail();
      ui.canvas.style.cursor = cursorFor(tool);
    }

    // The drawn cursors, one per centre mark, made once. The system crosshair is a hairline with
    // no halo, and on Windows it vanishes on a mid grey — a flat #808080 row swallowed it whole.
    const CURSORS = new Map();

    /**
     * The cursor for a tool: a crosshair with a light halo under a dark core, so it reads on any
     * colour, with a small mark at the centre saying what the tool does. Move keeps the arrow.
     * @param {string} tool - the tool's name
     * @returns {string} - a CSS cursor value
     */
    function cursorFor(tool) {
      if (tool === 'move') return 'default';
      const mark = tool === 'eraser' ? 'square' : tool === 'bucket' ? 'dot' : tool === 'picker' ? 'ring' : 'none';
      if (CURSORS.has(mark)) return CURSORS.get(mark);
      const arms = "M9.5 1v6M9.5 12v6M1 9.5h6M12 9.5h6";
      const centre = mark === 'square' ? "<rect x='7.5' y='7.5' width='4' height='4' fill='none'/>"
        : mark === 'dot' ? "<circle cx='9.5' cy='9.5' r='1.6' stroke='none' fill='#000'/>"
        : mark === 'ring' ? "<circle cx='9.5' cy='9.5' r='2.2' fill='none'/>" : '';
      const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='19' height='19'>" +
        "<g stroke='#fff' stroke-width='3' stroke-linecap='round' opacity='0.9'><path d='" + arms + "'/>" + centre + "</g>" +
        "<g stroke='#000' stroke-width='1'><path d='" + arms + "'/>" + centre + "</g></svg>";
      const value = 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '") 9 9, crosshair';
      CURSORS.set(mark, value);
      return value;
    }

    /**
     * Opens the browser's colour picker for one well.
     * @param {string} which - 'primary' or 'secondary'
     * @returns {void}
     */
    function pickWell(which, anchor) {
      // The browser anchors its colour popup to the input, so the input sits exactly under the
      // well that was clicked, invisible. Parked off-screen it opened the popup off-screen too,
      // which read as a click that did nothing.
      const at = ui.wellIn.offsetParent || host;
      const a = anchor.getBoundingClientRect(), h = at.getBoundingClientRect();
      ui.wellIn.style.left = (a.left - h.left) + 'px';
      ui.wellIn.style.top = (a.top - h.top) + 'px';
      ui.wellIn.style.width = a.width + 'px';
      ui.wellIn.style.height = a.height + 'px';
      ui.wellIn.value = paintState[which];
      ui.wellIn.oninput = () => { paintState[which] = ui.wellIn.value; drawRail(); };
      try { if (ui.wellIn.showPicker) ui.wellIn.showPicker(); else ui.wellIn.click(); }
      catch (err) { ui.wellIn.click(); }
    }

    /**
     * Swaps the two colours.
     * @returns {void}
     */
    function swapColours() {
      const p = paintState.primary;
      paintState.primary = paintState.secondary;
      paintState.secondary = p;
      drawRail();
    }

    // --- The row list, with folders ---

    let dragFrom = -1;     // the row being dragged, so a hovered row can say which side it lands on
    let dragRun = false;   // true while a whole folder is being dragged: it cannot go inside another

    /**
     * The list as runs: consecutive rows sharing a folder become one entry.
     * @returns {Array<Object>} - `{folder, from, to}` runs, bottom first (`from` is the lower index)
     */
    function runsOf() {
      const t = tex();
      const runs = [];
      for (let i = 0; i < t.layers.length; i++) {
        const f = t.layers[i].folder || '';
        const last = runs[runs.length - 1];
        if (f && last && last.folder === f && last.to === i - 1) last.to = i;
        else runs.push({ folder: f, from: i, to: i });
      }
      return runs;
    }

    /**
     * Rebuilds the row list, top row first, folders folded as asked.
     * @returns {void}
     */
    function drawLayers() {
      const t = tex();
      if (!t) return;
      ui.layers.innerHTML = '';
      const add = miniButton('+', 'add a row', (ev) => {
        ev.stopPropagation();
        openMenu(ev.clientX, ev.clientY, 'Add a row', [
          { label: 'Generator', fn: () => addLayer('generator') },
          { label: 'Shape', fn: () => addLayer('shape') },
          { label: 'Paint', fn: () => addLayer('raster') },
          { label: 'Image (a PNG file)…', fn: () => importImageRow() },
          { label: 'Adjustment', fn: () => addLayer('adjust') },
        ]);
      });
      ui.layers.appendChild(sectionHead('Rows · ' + t.layers.length, add));

      const runs = runsOf().reverse();
      for (const run of runs) {
        const folded = run.folder && view.folds.has(run.folder);
        if (run.folder) ui.layers.appendChild(folderHead(run, folded));
        if (folded) continue;
        for (let i = run.to; i >= run.from; i--) ui.layers.appendChild(layerRow(i, !!run.folder));
      }
    }

    /**
     * The head row of a folder: fold, name, count, drag as a unit.
     * @param {Object} run - the run it heads
     * @param {boolean} folded - whether it is folded
     * @returns {HTMLElement} - the row
     */
    function folderHead(run, folded) {
      const t = tex();
      const row = document.createElement('div');
      row.className = 'lay folder' + (view.layer >= run.from && view.layer <= run.to ? ' in' : '');
      row.draggable = true;
      const arrow = document.createElement('span');
      arrow.className = 'num';
      arrow.textContent = folded ? '▸' : '▾';
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = run.folder;
      const bl = document.createElement('span');
      bl.className = 'bl';
      bl.textContent = (run.to - run.from + 1) + ' rows';
      row.append(arrow, nm, bl);
      row.addEventListener('click', () => {
        if (folded) view.folds.delete(run.folder); else view.folds.add(run.folder);
        drawLayers();
      });
      row.addEventListener('contextmenu', (ev) => {
        ev.preventDefault();
        openMenu(ev.clientX, ev.clientY, run.folder, [
          { label: 'Rename…', fn: () => askText(ev.clientX, ev.clientY, 'Rename the folder', run.folder, (next) => {
            for (let i = run.from; i <= run.to; i++) t.layers[i].folder = next;
            edited('rename folder', true);
          }) },
          { label: 'Bake to one paint row', fn: () => bakeRun(run) },
          { label: 'Unfold rows', fn: () => { for (let i = run.from; i <= run.to; i++) delete t.layers[i].folder; edited('unfold', true); } },
          { sep: true },
          { label: 'Delete the folder and its rows', danger: true, fn: () => askConfirm(ev.clientX, ev.clientY,
            'Delete "' + run.folder + '" and its ' + (run.to - run.from + 1) + ' rows?', () => {
              t.layers.splice(run.from, run.to - run.from + 1);
              view.layer = Math.max(0, Math.min(view.layer, t.layers.length - 1));
              edited('delete folder', true);
            }) },
        ]);
      });
      // A folder drags as a block: its key is the run, and a drop on a row moves the whole run.
      row.addEventListener('dragstart', (ev) => {
        ev.dataTransfer.setData('text/plain', 'run:' + run.from + ':' + run.to);
        ev.dataTransfer.effectAllowed = 'move';
        dragFrom = run.to;
        dragRun = true;
        row.classList.add('drag');
      });
      row.addEventListener('dragend', () => { dragFrom = -1; dragRun = false; row.classList.remove('drag'); });
      wireDrop(row, run.to, { folder: run.folder, head: true });
      return row;
    }

    /**
     * One row of the list.
     * @param {number} i - the row's index
     * @param {boolean} inFolder - whether it sits inside a folder, for the indent
     * @returns {HTMLElement} - the row
     */
    function layerRow(i, inFolder) {
      const t = tex();
      const L = t.layers[i];
      const row = document.createElement('div');
      row.className = 'lay' + (i === view.layer ? ' sel' : '') + (L.enabled === false ? ' off' : '') + (inFolder ? ' inner' : '');
      row.draggable = true;
      row.dataset.index = i;

      const eye = document.createElement('span');
      eye.className = 'eye';
      eye.textContent = L.enabled === false ? '◌' : '●';
      eye.title = 'show or hide this row';
      eye.addEventListener('click', (ev) => {
        ev.stopPropagation();
        L.enabled = L.enabled === false;
        edited('toggle row', true);
      });

      // The row's index, counted from the floor, so the list says out loud what the stack
      // evaluates: 0 first, everything else landing on it in order.
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = i;

      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = layerLabel(L);

      const bl = document.createElement('span');
      bl.className = 'bl';
      const parts = [];
      if (L.clip) parts.push('clip');
      if (L.mask) parts.push('mask');
      if (L.type !== 'adjust' && L.blend && L.blend !== 'normal') parts.push(L.blend);
      if (L.opacity !== undefined && L.opacity < 1) parts.push(Math.round(L.opacity * 100) + '%');
      bl.textContent = parts.join(' · ');

      row.append(num, eye, nm, bl);
      row.addEventListener('click', () => selectRow(i));
      row.addEventListener('contextmenu', (ev) => {
        ev.preventDefault();
        selectRow(i);
        layerMenu(ev.clientX, ev.clientY, i);
      });
      row.addEventListener('dragstart', (ev) => {
        ev.dataTransfer.setData('text/plain', String(i));
        ev.dataTransfer.effectAllowed = 'move';
        dragFrom = i;
        row.classList.add('drag');
      });
      row.addEventListener('dragend', () => { dragFrom = -1; row.classList.remove('drag'); });
      wireDrop(row, i, { folder: tex().layers[i].folder || '', head: false });
      return row;
    }

    /**
     * Makes a row a drop target: the dragged row or run takes this row's slot.
     *
     * WHICH FOLDER THE DROP LANDS IN FOLLOWS THE PLACEMENT LINE, not the row's old name. A folder
     * is only a name on each row, so a row that kept its name after a drop below an unfoldered
     * row showed up as a second folder of the same name down there, and one dropped above its
     * own folder was pulled straight back in. Now: a line inside a folder's rows joins it; a line
     * on a plain row leaves it; a line under a folder's head goes in at the top, a line over the
     * head goes out above it.
     *
     * @param {HTMLElement} row - the element
     * @param {number} i - its index (a folder head uses the top of its run)
     * @param {Object} ctx - `{folder, head}`: the target's folder ('' for none) and whether the
     *   target is a folder's head row
     * @returns {void}
     */
    function wireDrop(row, i, ctx) {
      row.addEventListener('dragover', (ev) => {
        ev.preventDefault();
        // A drop takes this row's slot. Coming from above (a higher index, drawn higher up),
        // the dragged row lands BELOW this row, so the line goes under it; coming from below,
        // above. A folder dragged onto another folder's head always lands above it, since a
        // folder cannot go inside a folder, so its line stays above the head.
        const below = dragFrom > i && !(ctx.head && dragRun);
        row.classList.toggle('over', !below);
        row.classList.toggle('over-below', below);
      });
      row.addEventListener('dragleave', () => row.classList.remove('over', 'over-below'));
      row.addEventListener('drop', (ev) => {
        ev.preventDefault();
        row.classList.remove('over', 'over-below');
        const data = ev.dataTransfer.getData('text/plain');
        const below = dragFrom > i;
        // Under a head the line is inside the folder at its top; over it, outside and above.
        // Either way the slot is ABOVE the folder's top row, not below it as a row's slot is,
        // because the head is drawn above its rows: from above, that is one index higher.
        const folder = ctx.head ? (below ? ctx.folder : '') : ctx.folder;
        const slot = ctx.head && below ? i + 1 : i;
        if (data.startsWith('run:')) {
          const [, a, b] = data.split(':').map(Number);
          if (i >= a && i <= b) return;
          moveRun(a, b, slot, ctx.head ? '' : folder);
          return;
        }
        const from = parseInt(data, 10);
        if (Number.isInteger(from) && from !== i) moveLayer(from, slot, folder);
      });
    }

    /**
     * Selects a row and shows its hand.
     * @param {number} i - the row's index
     * @returns {void}
     */
    function selectRow(i) {
      if (i !== view.layer) bakeFloat();
      view.layer = i;
      view.polyRow = -1;
      drawLayers();
      drawRail();
      drawInspector();
      drawHandles();
    }

    /**
     * What a row is called in the list.
     * @param {Object} L - the row
     * @returns {string} - a short description
     */
    function layerLabel(L) {
      if (L.type === 'generator') return L.generator;
      if (L.type === 'adjust') return L.adjust;
      if (L.type === 'shape') {
        const op = L.op || {};
        return op.op + (op.op === 'text' ? ' “' + String(op.text === undefined ? 'ALLOY' : op.text).slice(0, 12) + '”' : '');
      }
      if (L.type === 'ops') return 'draw · ' + (L.ops ? L.ops.length : 0) + ' ops';
      if (L.type === 'raster') return 'paint' + (L.png ? '' : ' (empty)');
      if (L.type === 'image') return 'image' + (L.png ? '' : ' (empty)');
      return L.type;
    }

    /**
     * The menu for one row.
     * @param {number} x - client x
     * @param {number} y - client y
     * @param {number} i - the row's index
     * @returns {void}
     */
    function layerMenu(x, y, i) {
      const t = tex();
      const L = t.layers[i];
      openMenu(x, y, layerLabel(L), [
        { label: L.enabled === false ? 'Show' : 'Hide', fn: () => { L.enabled = L.enabled === false; edited('toggle row', true); } },
        { label: 'Duplicate', fn: () => {
          t.layers.splice(i + 1, 0, JSON.parse(JSON.stringify(L)));
          view.layer = i + 1;
          edited('duplicate row', true);
        } },
        { sep: true },
        { label: 'Move up', fn: () => moveLayer(i, Math.min(t.layers.length - 1, i + 1)) },
        { label: 'Move down', fn: () => moveLayer(i, Math.max(0, i - 1)) },
        { label: 'Move to folder…', fn: () => askText(x, y, 'Folder name (empty for none)', L.folder || '', (next) => {
          if (next.trim()) L.folder = next.trim(); else delete L.folder;
          edited('move to folder', true);
        }) },
        { label: L.folder ? 'Take out of its folder' : 'New folder here…', fn: () => {
          if (L.folder) { delete L.folder; edited('unfold', true); return; }
          askText(x, y, 'Name the folder', 'group', (next) => { L.folder = next; edited('new folder', true); });
        } },
        { sep: true },
        { label: L.clip ? 'Stop clipping to below' : 'Clip to the row below', fn: () => {
          if (L.clip) delete L.clip; else L.clip = true;
          edited('clip', true);
        } },
        { label: L.mask ? 'Remove the mask' : 'Add a mask', fn: () => {
          if (L.mask) delete L.mask;
          else L.mask = { type: 'generator', generator: 'perlin', params: { scale: 3, contrast: 1.6 } };
          edited('mask', true);
        } },
        L.type === 'image'
          ? { label: 'Convert to paint', fn: () => convertToPaint(i, false) }
          : { label: 'Bake this row to paint', fn: () => bakeRun({ from: i, to: i }) },
        L.type === 'image' ? { label: 'Duplicate as paint', fn: () => convertToPaint(i, true) } : null,
        { sep: true },
        { label: 'Delete', danger: true, fn: () => {
          t.layers.splice(i, 1);
          view.layer = Math.max(0, Math.min(view.layer, t.layers.length - 1));
          work = null;
          edited('delete row', true);
        } },
      ].filter(Boolean));
    }

    /**
     * Adds a row above the selected one, in its folder.
     * @param {string} kind - a key of NEW_LAYERS
     * @param {Object} [op] - for a shape, the op to start with
     * @returns {number} - the new row's index
     */
    function addLayer(kind, op) {
      const t = tex();
      const at = Math.min(t.layers.length, view.layer + 1);
      const row = NEW_LAYERS[kind](op);
      const near = layer();
      if (near && near.folder) row.folder = near.folder;
      t.layers.splice(at, 0, row);
      view.layer = at;
      edited('add ' + (kind === 'raster' ? 'paint' : kind) + ' row', true);
      if (kind === 'raster') { setTool('pencil'); log('a blank paint row &middot; pencil in hand'); }
      if (kind === 'image') setTool('move');
      return at;
    }

    /**
     * Moves a row to another index, and into or out of a folder.
     * @param {number} from - the current index
     * @param {number} to - the destination index
     * @param {string} [folder] - the folder it lands in ('' or nothing for none); undefined
     *   keeps whatever it had, for the menu's move up and down
     * @returns {void}
     */
    function moveLayer(from, to, folder) {
      const t = tex();
      if (to < 0 || to >= t.layers.length) return;
      // Already in that slot: a row right above a folder dropped onto its head only changes
      // folder, and that is still a move worth making.
      if (from === to && (folder === undefined || (t.layers[from].folder || '') === folder)) return;
      const [moved] = t.layers.splice(from, 1);
      if (folder !== undefined) { if (folder) moved.folder = folder; else delete moved.folder; }
      t.layers.splice(to, 0, moved);
      view.layer = to;
      if (work) work = null;
      edited('reorder rows', true);
    }

    /**
     * Moves a run of rows so its top lands on an index. Dropped inside another folder, the run
     * takes that folder's name, since a folder inside a folder is not a thing this list has and
     * two names interleaved would draw as a mess of small folders.
     * @param {number} a - the run's lowest index
     * @param {number} b - the run's highest index
     * @param {number} to - where its top should land
     * @param {string} [folder] - a folder to merge into, '' or nothing to keep the run's own
     * @returns {void}
     */
    function moveRun(a, b, to, folder) {
      const t = tex();
      const block = t.layers.splice(a, b - a + 1);
      if (folder) for (const row of block) row.folder = folder;
      let at = to > b ? to - block.length + 1 : to;
      at = Math.max(0, Math.min(t.layers.length, at));
      t.layers.splice(at, 0, ...block);
      view.layer = at + block.length - 1;
      work = null;
      edited('move folder', true);
    }

    /**
     * Flattens a run of rows into one paint row holding what they drew, on their own.
     *
     * Evaluated against transparency rather than the rows below, so the paint row lands where
     * the run was and looks the same with the same blend. A group's shared opacity is the one
     * thing this reproduces that folders cannot: bake, then set the paint row's opacity.
     *
     * @param {Object} run - `{from, to}`
     * @returns {void}
     */
    function bakeRun(run) {
      const t = tex();
      const rows = t.layers.slice(run.from, run.to + 1);
      let px;
      try {
        px = Alloy.texture.evaluate({ name: t.name, width: t.width, height: t.height, seed: t.seed, layers: rows });
      } catch (err) { logError(err); return; }
      const baked = { type: 'raster', png: Alloy.texture.encodePNG(px), blend: 'normal', opacity: 1 };
      if (rows[0].folder) baked.folder = rows[0].folder;
      t.layers.splice(run.from, rows.length, baked);
      view.layer = run.from;
      work = null;
      edited('bake', true);
      log('baked ' + rows.length + ' row' + (rows.length === 1 ? '' : 's') + ' to paint');
    }

    // --- The inspector ---

    /**
     * Rebuilds the inspector for the selected row.
     * @returns {void}
     */
    function drawInspector() { redrawKeepingFocus(ui.insp, drawInspectorNow); }

    /**
     * Rebuilds the inspector for the selected row, right now.
     * @returns {void}
     */
    function drawInspectorNow() {
      const t = tex();
      ui.insp.innerHTML = '';
      if (!t) return;
      const L = layer();
      if (!L) {
        const note = document.createElement('div');
        note.className = 'prow note';
        note.textContent = t.layers.length
          ? 'Select a row to edit it.'
          : 'This texture has no rows. Press + above to add one.';
        ui.insp.appendChild(note);
        return;
      }

      ui.insp.appendChild(sectionHead(L.type === 'raster' ? 'paint' : L.type === 'shape' ? 'shape · ' + (L.op && L.op.op) : L.type));
      if (L.type === 'image') drawImageInspector(L);

      if (L.type === 'generator' || L.type === 'adjust') {
        const isGen = L.type === 'generator';
        const key = isGen ? 'generator' : 'adjust';
        const desc = isGen ? Alloy.describeGenerator(L[key]) : Alloy.describeAdjustment(L[key]);
        const note = document.createElement('div');
        note.className = 'prow note';
        note.textContent = L[key] + ' — ' + desc.description + ' Pick another on the rail.';
        ui.insp.appendChild(note);
        const values = Object.assign({}, desc.defaults, L.params);
        paramRows(ui.insp, desc.params, values, (k, v) => {
          L.params = L.params || {};
          L.params[k] = v;
          edited('set ' + k);
        });
      }

      if (L.type === 'raster') drawRasterInspector(L);
      if (L.type === 'shape') drawShapeInspector(L);
      if (L.type === 'ops') {
        const note = document.createElement('div');
        note.className = 'prow note';
        note.textContent = 'A draw-ops row from an older package. Reload the package to migrate it into shape rows.';
        ui.insp.appendChild(note);
      }

      // Landing: blend, opacity, region. Every row has these; an adjustment has no blend because
      // it rewrites what is below it rather than landing on it.
      ui.insp.appendChild(sectionHead('landing'));
      if (L.type !== 'adjust') {
        ui.insp.appendChild(paramRow('blend', { type: 'enum', options: Alloy.blendModes, label: 'Blend' },
          L.blend || 'normal', (v) => { L.blend = v; edited('blend mode', true); }));
      }
      ui.insp.appendChild(paramRow('opacity', { type: 'number', min: 0, max: 1, step: 0.01, label: 'Opacity' },
        L.opacity === undefined ? 1 : L.opacity, (v) => { L.opacity = v; edited('opacity', true); }));
      ui.insp.appendChild(paramRow('enabled', { type: 'boolean', label: 'Visible' },
        L.enabled !== false, (v) => { L.enabled = v; edited('toggle row', true); }));
      if (L.type !== 'adjust') {
        ui.insp.appendChild(paramRow('clip', { type: 'boolean', label: 'Clip to below' },
          !!L.clip, (v) => { if (v) L.clip = true; else delete L.clip; edited('clip', true); }));
        const clipNote = document.createElement('div');
        clipNote.className = 'prow note';
        clipNote.textContent = 'Clipped, this row shows only where the nearest unclipped row below it is opaque: a rect row under a clipped perlin is a local perlin.';
        ui.insp.appendChild(clipNote);
      }

      // The mask, which is a row of its own, one level deep and no further.
      const maskHead = sectionHead('mask', miniButton(L.mask ? 'remove' : 'add', 'a mask fades this row where it is dark', () => {
        if (L.mask) delete L.mask;
        else L.mask = { type: 'generator', generator: 'perlin', params: { scale: 3, contrast: 1.6 } };
        edited('mask', true);
      }));
      ui.insp.appendChild(maskHead);
      if (L.mask) {
        const m = L.mask;
        if (m.type === 'shape') {
          const note = document.createElement('div');
          note.className = 'prow note';
          note.textContent = 'A ' + (m.op && m.op.op) + ' region, from the marquee. Remove it to mask by a generator instead.';
          ui.insp.appendChild(note);
          const d = Alloy.describeDrawOp(m.op.op);
          paramRows(ui.insp, d.params, Object.assign({}, d.defaults, m.op), (k, v) => { m.op[k] = v; edited('mask ' + k); });
        } else {
          ui.insp.appendChild(paramRow('generator', { type: 'enum', options: Alloy.generatorTypes, label: 'Mask from' },
            m.generator, (v) => { m.generator = v; m.params = {}; edited('mask generator', true); }));
          const md = Alloy.describeGenerator(m.generator);
          paramRows(ui.insp, md.params, Object.assign({}, md.defaults, m.params), (k, v) => {
            m.params = m.params || {};
            m.params[k] = v;
            edited('mask ' + k);
          });
        }
        ui.insp.appendChild(paramRow('invert', { type: 'boolean', label: 'Invert' },
          !!m.invert, (v) => { m.invert = v; edited('invert mask'); }));
      } else {
        const note = document.createElement('div');
        note.className = 'prow note';
        note.textContent = 'No mask. A mask is a second generator whose brightness decides where this row shows; a marquee can become one.';
        ui.insp.appendChild(note);
      }
    }

    /**
     * The inspector for a paint row.
     * @param {Object} L - the row
     * @returns {void}
     */
    function drawRasterInspector(L) {
      const info = document.createElement('div');
      info.className = 'prow note';
      if (L.png) {
        const t = tex();
        info.textContent = t.width + ' × ' + t.height + ' · ' + Math.round(L.png.length * 0.75 / 1024) + ' KB in the package.';
      } else {
        info.textContent = 'Nothing painted yet. Pick the pencil on the rail. To bring in a PNG, add an image row instead.';
      }
      ui.insp.appendChild(info);
    }

    /**
     * The inspector for an image row: what is stored, how it fits, and the way to paint on it.
     * @param {Object} L - the row
     * @returns {void}
     */
    function drawImageInspector(L) {
      const t = tex();
      const info = document.createElement('div');
      info.className = 'prow note';
      if (L.png) {
        try {
          const size = Alloy.texture.pngSize(L.png);
          info.textContent = 'Stored at ' + size.width + ' × ' + size.height + ', shown at ' + t.width + ' × ' + t.height +
            ' · ' + Math.round(L.png.length * 0.75 / 1024) + ' KB in the package. The full picture is kept, so the texture can grow later.';
        } catch (err) {
          info.textContent = 'This PNG will not decode: ' + err.message;
          info.style.color = 'var(--bad)';
        }
      } else {
        info.textContent = 'No picture yet. Import a PNG, or paste one with Ctrl+V.';
      }
      ui.insp.appendChild(info);
      const row = document.createElement('div');
      row.className = 'prow';
      row.appendChild(miniButton('import a PNG…', 'choose a file', () => importRaster(false)));
      if (L.png) {
        row.appendChild(miniButton('convert to paint', 'resample to ' + t.width + '×' + t.height + ' and make it a paint row; undo brings the picture back', () => convertToPaint(view.layer, false)));
      }
      ui.insp.appendChild(row);
      ui.insp.appendChild(paramRow('fit', { type: 'enum', options: ['stretch', 'tile'], label: 'Fit' },
        L.fit || 'stretch', (v) => { L.fit = v; edited('image fit'); }));
    }

    /**
     * The inspector for a shape row: its op's parameters.
     * @param {Object} L - the row
     * @returns {void}
     */
    function drawShapeInspector(L) {
      const op = L.op;
      if (!op || !Alloy.describeDrawOp(op.op)) return;
      const desc = Alloy.describeDrawOp(op.op);
      const note = document.createElement('div');
      note.className = 'prow note';
      note.textContent = desc.description + ' Drag the handles on the preview to place it.';
      ui.insp.appendChild(note);
      paramRows(ui.insp, desc.params, Object.assign({}, desc.defaults, op), (k, v) => {
        op[k] = v;
        edited('set ' + k, k === 'points');
        drawHandles();
      });
    }

    /**
     * Replaces the selected image row's PNG from a file.
     * @param {boolean} quiet - true when a cancelled picker is not worth a word
     * @returns {void}
     */
    function importRaster(quiet) {
      const L = layer();
      if (!L || L.type !== 'image') { if (!quiet) log('<i>select an image row first</i>, or add one'); return; }
      pickImage((base64) => {
        const slim = slimPNG(base64);
        L.png = slim.png;
        edited('import image', true);
        log('imported <b>' + Math.round(base64.length * 0.75 / 1024) + ' KB</b> of PNG' +
            (slim.saved > 0 ? ' &middot; re-encoded to <b>' + Math.round(slim.png.length * 0.75 / 1024) + ' KB</b>' : ''));
      });
    }

    /**
     * Picks a PNG file and adds it as a new image row above the selected one. The row is only
     * made once a file is chosen, so a cancelled picker leaves nothing behind.
     * @returns {void}
     */
    function importImageRow() {
      pickImage((base64) => {
        const slim = slimPNG(base64);
        addLayer('image', slim.png);
        log('imported <b>' + Math.round(base64.length * 0.75 / 1024) + ' KB</b> of PNG as an image row' +
            (slim.saved > 0 ? ' &middot; re-encoded to <b>' + Math.round(slim.png.length * 0.75 / 1024) + ' KB</b>' : ''));
      });
    }

    /**
     * Resamples decoded pixels to a size, nearest neighbour, stretched or tiled. The one
     * resampler the workbench has: converting an image to paint and resizing a texture both go
     * through it, so the two agree texel for texel with what the engine showed.
     * @param {Object} src - the pixels to read
     * @param {number} w - the width wanted
     * @param {number} h - the height wanted
     * @param {string} [fit] - 'stretch' (default) or 'tile'
     * @returns {Object} - new pixels
     */
    function resampleNearest(src, w, h, fit) {
      const out = Alloy.texture.makePixels(w, h, [0, 0, 0, 0]);
      const d = out.data, sd = src.data, sw = src.width, sh = src.height, tile = fit === 'tile';
      for (let y = 0; y < h; y++) {
        const sy = tile ? ((y % sh) + sh) % sh : Math.min(sh - 1, Math.floor(y * sh / h));
        for (let x = 0; x < w; x++) {
          const sx = tile ? ((x % sw) + sw) % sw : Math.min(sw - 1, Math.floor(x * sw / w));
          const di = (y * w + x) * 4, si = (sy * sw + sx) * 4;
          d[di] = sd[si]; d[di + 1] = sd[si + 1]; d[di + 2] = sd[si + 2]; d[di + 3] = sd[si + 3];
        }
      }
      return out;
    }

    /**
     * Turns an image row into a paint row at the texture's size, in place or as a copy above
     * it. Blend, opacity, region, mask and folder come along; the picture's extra detail does
     * not, which is the trade, and undo is the way back.
     * @param {number} i - the row's index
     * @param {boolean} copy - true to keep the image row and add the paint row above it
     * @returns {void}
     */
    function convertToPaint(i, copy) {
      const t = tex();
      const L = t.layers[i];
      if (!L || L.type !== 'image') return;
      let png = '';
      if (L.png) {
        try {
          png = Alloy.texture.encodePNG(resampleNearest(Alloy.texture.decodePNG(L.png), t.width, t.height, L.fit));
        } catch (err) { logError(err); return; }
      }
      const paint = JSON.parse(JSON.stringify(L));
      paint.type = 'raster';
      paint.png = png;
      delete paint.fit;
      if (copy) { t.layers.splice(i + 1, 0, paint); view.layer = i + 1; }
      else { t.layers[i] = paint; view.layer = i; }
      work = null;
      edited(copy ? 'duplicate as paint' : 'convert to paint', true);
      setTool('pencil');
      log((copy ? 'a paint copy at ' : 'now paint at ') + t.width + '×' + t.height + ' &middot; pencil in hand');
    }

    /**
     * Brings every paint row, and every paint mask, to a new texture size. Paint promises the
     * texture's size, so the size button is a real edit: shrinking loses texels, the way
     * resizing a sprite does anywhere.
     * @param {Object} t - the texture
     * @param {number} w - the new width
     * @param {number} h - the new height
     * @returns {number} - how many rows were resampled
     */
    function resamplePaintRows(t, w, h) {
      let n = 0;
      /** @param {Object} row - a row or a mask */
      const fix = (row) => {
        if (!row || row.type !== 'raster' || !row.png) return;
        try {
          const src = Alloy.texture.decodePNG(row.png);
          if (src.width === w && src.height === h) return;
          row.png = Alloy.texture.encodePNG(resampleNearest(src, w, h));
          n++;
        } catch (err) { logError(err); }
      };
      for (const L of t.layers) { fix(L); if (L && L.mask) fix(L.mask); }
      return n;
    }

    // --- Handles and the marquee, over the preview ---

    /**
     * The draggable handles for one op, in normalized coordinates.
     *
     * Lengths in the data are in units of the SHORTER axis, so a radius has to be converted to a
     * normalized offset per axis before it can be drawn.
     *
     * @param {Object} op - the op
     * @param {Object} t - the texture, for its aspect
     * @returns {Array<Object>} - `{key, u, v, mid}` handles
     */
    function handlesFor(op, t) {
      const d = Alloy.describeDrawOp(op.op).defaults;
      const p = Object.assign({}, d, op);
      const unit = Math.min(t.width, t.height);
      const ux = unit / t.width, uy = unit / t.height;
      if (op.op === 'rect') {
        return [
          { key: 'move', u: p.x + p.w / 2, v: p.y + p.h / 2, mid: true },
          { key: 'tl', u: p.x, v: p.y },
          { key: 'br', u: p.x + p.w, v: p.y + p.h },
        ];
      }
      if (op.op === 'circle') {
        return [{ key: 'move', u: p.x, v: p.y, mid: true }, { key: 'r', u: p.x + p.r * ux, v: p.y }];
      }
      if (op.op === 'ellipse') {
        return [
          { key: 'move', u: p.x, v: p.y, mid: true },
          { key: 'rx', u: p.x + p.rx * ux, v: p.y },
          { key: 'ry', u: p.x, v: p.y + p.ry * uy },
        ];
      }
      if (op.op === 'line' || op.op === 'polygon') {
        return (p.points || []).map((pt, i) => ({ key: 'p' + i, u: pt[0], v: pt[1] }));
      }
      if (op.op === 'text') return [{ key: 'move', u: p.x, v: p.y, mid: true }];
      return [];
    }

    // The live handle elements, kept so a drag can MOVE them rather than rebuild them.
    let handleEls = [];

    /**
     * Rebuilds the overlay: the selected shape's handles and the marquee.
     *
     * WHILE A DRAG IS LIVE THIS ONLY MOVES THE EXISTING ELEMENTS. Replacing them would remove the
     * one holding the pointer capture, which ends the gesture silently.
     *
     * @returns {void}
     */
    function drawHandles() {
      if (view.interacting && handleEls.length) { positionHandles(); drawMarquee(); return; }
      ui.ov.innerHTML = '';
      handleEls = [];
      drawMarquee();
      const t = tex();
      const L = layer();
      if (!t || !L || L.type !== 'shape' || !L.op) return;
      const r = ui.canvas.getBoundingClientRect();
      if (!r.width) return;
      for (const h of handlesFor(L.op, t)) {
        const el = document.createElement('div');
        el.className = 'h' + (h.mid ? ' mid' : '');
        const [x, y] = toWrap(h.u, h.v);
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.title = h.key;
        el.addEventListener('pointerdown', (ev) => startHandleDrag(ev, L.op, h.key, t));
        ui.ov.appendChild(el);
        handleEls.push({ key: h.key, el });
      }
    }

    /**
     * Moves the existing handle elements to match the op, without replacing any of them.
     * @returns {void}
     */
    function positionHandles() {
      const t = tex();
      const L = layer();
      if (!t || !L || L.type !== 'shape' || !L.op || !handleEls.length) return;
      for (const h of handlesFor(L.op, t)) {
        const found = handleEls.find((e) => e.key === h.key);
        if (!found) continue;
        const [x, y] = toWrap(h.u, h.v);
        found.el.style.left = x + 'px';
        found.el.style.top = y + 'px';
      }
    }

    /**
     * Draws, moves or removes the marquee rectangle.
     * @returns {void}
     */
    function drawMarquee() {
      let el = ui.ov.querySelector('.marquee');
      let mk = ui.ov.querySelector('.marquee-mask');
      if (!view.sel) { if (el) el.remove(); if (mk) mk.remove(); return; }
      const t = tex();
      const sel = view.sel;
      const [x0, y0] = toWrap(sel.x / t.width, sel.y / t.height);
      const [x1, y1] = toWrap((sel.x + sel.w) / t.width, (sel.y + sel.h) / t.height);
      if (!sel.mask) {
        if (mk) mk.remove();
        if (!el) { el = document.createElement('div'); el.className = 'marquee'; ui.ov.appendChild(el); }
        el.style.left = x0 + 'px'; el.style.top = y0 + 'px';
        el.style.width = (x1 - x0) + 'px'; el.style.height = (y1 - y0) + 'px';
        return;
      }
      // A masked selection is outlined on a canvas at SCREEN resolution, one device pixel wide,
      // drawn just OUTSIDE each selected texel, in its unselected neighbour. Drawn inside at a
      // fraction of a texel, as it was, any rounding between this canvas and the picture's own
      // scaling left a hair of the selected texel showing above the line.
      if (el) el.remove();
      if (!mk) { mk = document.createElement('canvas'); mk.className = 'marquee-mask'; ui.ov.appendChild(mk); }
      const dpr = window.devicePixelRatio || 1;
      const pad = 2;
      const left = x0 - pad, top = y0 - pad, cw = (x1 - x0) + pad * 2, ch = (y1 - y0) + pad * 2;
      mk.width = Math.max(1, Math.ceil(cw * dpr)); mk.height = Math.max(1, Math.ceil(ch * dpr));
      mk.style.left = left + 'px'; mk.style.top = top + 'px';
      mk.style.width = cw + 'px'; mk.style.height = ch + 'px';
      const ctx = mk.getContext('2d');
      ctx.clearRect(0, 0, mk.width, mk.height);
      ctx.fillStyle = '#ffb454';
      const m = sel.mask, has = (x, y) => x >= 0 && y >= 0 && x < sel.w && y < sel.h && m[y * sel.w + x] === 1;
      // Texel edges on this canvas, in device pixels, from the same mapping the picture uses.
      const ex = (x) => Math.round((toWrap((sel.x + x) / t.width, 0)[0] - left) * dpr);
      const ey = (y) => Math.round((toWrap(0, (sel.y + y) / t.height)[1] - top) * dpr);
      const line = Math.max(1, Math.round(dpr));
      for (let y = 0; y < sel.h; y++) for (let x = 0; x < sel.w; x++) {
        if (!has(x, y)) continue;
        const l = ex(x), r = ex(x + 1), tp = ey(y), bt = ey(y + 1);
        if (!has(x, y - 1)) ctx.fillRect(l - line, tp - line, r - l + line * 2, line);
        if (!has(x, y + 1)) ctx.fillRect(l - line, bt, r - l + line * 2, line);
        if (!has(x - 1, y)) ctx.fillRect(l - line, tp - line, line, bt - tp + line * 2);
        if (!has(x + 1, y)) ctx.fillRect(r, tp - line, line, bt - tp + line * 2);
      }
    }

    /**
     * Drags one handle, writing straight into the op.
     * @param {PointerEvent} ev - the pointerdown
     * @param {Object} op - the op being edited
     * @param {string} key - which handle
     * @param {Object} t - the texture
     * @returns {void}
     */
    function startHandleDrag(ev, op, key, t) {
      ev.preventDefault();
      ev.stopPropagation();
      const el = ev.currentTarget;
      el.setPointerCapture(ev.pointerId);
      view.interacting = true;
      const d = Alloy.describeDrawOp(op.op).defaults;
      const start = Object.assign({}, d, JSON.parse(JSON.stringify(op)));
      const unit = Math.min(t.width, t.height);
      const ux = unit / t.width, uy = unit / t.height;
      const [su, sv] = toTexture(ev.clientX, ev.clientY);

      /**
       * Applies the drag to the op.
       * @param {PointerEvent} e - the pointermove
       * @returns {void}
       */
      function move(e) {
        const [u, v] = toTexture(e.clientX, e.clientY);
        const du = u - su, dv = v - sv;
        if (key === 'move') {
          op.x = snapNum(start.x + du);
          op.y = snapNum(start.y + dv);
        } else if (key === 'tl') {
          op.x = snapNum(start.x + du); op.y = snapNum(start.y + dv);
          op.w = snapNum(Math.max(0.001, start.w - du)); op.h = snapNum(Math.max(0.001, start.h - dv));
        } else if (key === 'br') {
          op.w = snapNum(Math.max(0.001, start.w + du)); op.h = snapNum(Math.max(0.001, start.h + dv));
        } else if (key === 'r') {
          op.r = snapNum(Math.max(0.001, (u - start.x) / ux));
        } else if (key === 'rx') {
          op.rx = snapNum(Math.max(0.001, (u - start.x) / ux));
        } else if (key === 'ry') {
          op.ry = snapNum(Math.max(0.001, (v - start.y) / uy));
        } else if (key.charCodeAt(0) === 112) {
          const i = parseInt(key.slice(1), 10);
          const pts = op.points.map((q) => q.slice());
          pts[i] = [snapNum(start.points[i][0] + du), snapNum(start.points[i][1] + dv)];
          op.points = pts;
        }
        scheduleRender();
        drawHandles();
      }
      /**
       * Ends the drag and settles the preview at full resolution.
       * @param {PointerEvent} e - the pointerup or pointercancel
       * @returns {void}
       */
      function up(e) {
        if (el.hasPointerCapture && el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
        view.interacting = false;
        edited('move shape');
        drawHandles();
      }
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    }

    /**
     * Rounds a dragged coordinate to something a person would have typed: four decimals is a
     * tenth of a pixel on the largest texture this engine builds, and it is what the block
     * serializer keeps, so the package in memory survives its own round trip.
     * @param {number} v - the raw value
     * @returns {number} - the value at four decimals
     */
    function snapNum(v) { return Math.round(v * 1e4) / 1e4; }

    /**
     * Is a point inside an op? Used to pick a shape on the preview.
     * @param {Object} op - the op
     * @param {number} u - normalized x
     * @param {number} v - normalized y
     * @param {Object} t - the texture
     * @returns {boolean} - true when the point is on the shape
     */
    function hitOp(op, u, v, t) {
      const p = Object.assign({}, Alloy.describeDrawOp(op.op).defaults, op);
      const unit = Math.min(t.width, t.height);
      const ux = unit / t.width, uy = unit / t.height;
      if (op.op === 'fill') return true;
      if (op.op === 'rect') return u >= p.x && u <= p.x + p.w && v >= p.y && v <= p.y + p.h;
      if (op.op === 'circle') {
        const dx = (u - p.x) / ux, dy = (v - p.y) / uy;
        return Math.hypot(dx, dy) <= p.r;
      }
      if (op.op === 'ellipse') {
        const dx = (u - p.x) / (p.rx * ux), dy = (v - p.y) / (p.ry * uy);
        return Math.hypot(dx, dy) <= 1;
      }
      if (op.op === 'text') {
        const scale = Math.max(1, Math.round(p.size * unit / Alloy.font.height));
        const advance = (Alloy.font.width + p.spacing) * scale;
        const w = String(p.text).length * advance / t.width;
        const h = Alloy.font.height * scale / t.height;
        const x0 = p.align === 'center' ? p.x - w / 2 : (p.align === 'right' ? p.x - w : p.x);
        return u >= x0 && u <= x0 + w && v >= p.y && v <= p.y + h;
      }
      if (op.op === 'line' || op.op === 'polygon') {
        const pts = p.points || [];
        const slack = (p.width || 0.02) + 0.01;
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          if (i === pts.length - 1 && op.op === 'line' && !p.closed) break;
          const ax = (a[0] - u) / ux, ay = (a[1] - v) / uy;
          const bx = (b[0] - u) / ux, by = (b[1] - v) / uy;
          const dx = bx - ax, dy = by - ay;
          const len2 = dx * dx + dy * dy;
          const tt = len2 > 0 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2)) : 0;
          if (Math.hypot(ax + dx * tt, ay + dy * tt) <= slack) return true;
        }
        return false;
      }
      return false;
    }

    /**
     * The topmost shape row under a point, or -1.
     * @param {number} u - normalized x
     * @param {number} v - normalized y
     * @returns {number} - the row index
     */
    function shapeAt(u, v) {
      const t = tex();
      for (let i = t.layers.length - 1; i >= 0; i--) {
        const L = t.layers[i];
        if (L.type === 'shape' && L.enabled !== false && L.op && hitOp(L.op, u, v, t)) return i;
      }
      return -1;
    }

    // --- The stage's pointer: what the hand does ---

    /**
     * Runs a press-drag-release on the canvas through the tool in hand.
     * @param {PointerEvent} ev - the pointerdown
     * @returns {void}
     */
    function onCanvasDown(ev) {
      if (ev.button !== 0 && ev.button !== 2) return;
      const t = tex();
      const L = layer();
      if (!t) return;
      const tool = view.tool;
      if (tool === 'picker') { pickColour(ev); return; }
      if (tool === 'marquee') { startMarquee(ev); return; }
      if (tool === 'lasso') { startLasso(ev); return; }
      if (tool === 'wand') { wandSelect(ev); return; }
      if (tool === 'move') { startMove(ev); return; }
      if (tool === 'pencil' || tool === 'eraser' || tool === 'bucket') {
        if (!L || L.type !== 'raster') { log('<i>select a paint row</i> to ' + tool); return; }
        if (tool === 'bucket') { bucketFill(ev); return; }
        startStroke(ev, tool === 'eraser');
        return;
      }
      if (tool === 'text') { placeText(ev); return; }
      if (tool === 'polygon') { polygonPoint(ev); return; }
      if (tool === 'line' || tool === 'rect' || tool === 'ellipse') { startShape(ev, tool); }
    }

    /**
     * Reads the composite colour under the pointer into a well.
     * @param {PointerEvent} ev - the click
     * @returns {void}
     */
    function pickColour(ev) {
      const t = tex();
      const px = fullComposite();
      if (!px) return;
      const [x, y] = toTexel(ev.clientX, ev.clientY);
      const xx = ((x % t.width) + t.width) % t.width, yy = ((y % t.height) + t.height) % t.height;
      const d = px.data, i = (yy * px.width + xx) * 4;
      const hex = '#' + [d[i], d[i + 1], d[i + 2]].map((c) => Math.round(clamp(c, 0, 1) * 255).toString(16).padStart(2, '0')).join('');
      paintState[ev.button === 2 ? 'secondary' : 'primary'] = hex;
      drawRail();
      log('picked <b>' + hex + '</b>');
    }

    /**
     * Drags out the marquee. A click with no drag clears it.
     * @param {PointerEvent} ev - the pointerdown
     * @returns {void}
     */
    function startMarquee(ev) {
      ev.preventDefault();
      bakeFloat();
      const t = tex();
      const [x0, y0] = toTexel(ev.clientX, ev.clientY);
      let moved = false;
      const before = view.sel;
      ui.canvas.setPointerCapture(ev.pointerId);
      /** @param {PointerEvent} e - a move */
      const move = (e) => {
        const [x1, y1] = toTexel(e.clientX, e.clientY);
        if (x1 === x0 && y1 === y0) return;
        moved = true;
        const ax = clamp(Math.min(x0, x1), 0, t.width - 1), ay = clamp(Math.min(y0, y1), 0, t.height - 1);
        const bx = clamp(Math.max(x0, x1), 0, t.width - 1), by = clamp(Math.max(y0, y1), 0, t.height - 1);
        view.sel = { x: ax, y: ay, w: bx - ax + 1, h: by - ay + 1 };
        drawMarquee();
      };
      /** @param {PointerEvent} e - the release */
      const up = (e) => {
        if (ui.canvas.hasPointerCapture(e.pointerId)) ui.canvas.releasePointerCapture(e.pointerId);
        ui.canvas.removeEventListener('pointermove', move);
        ui.canvas.removeEventListener('pointerup', up);
        ui.canvas.removeEventListener('pointercancel', up);
        if (!moved) { if (!e.shiftKey && !e.altKey) view.sel = null; }
        else if (e.shiftKey || e.altKey) { const fresh = view.sel; view.sel = before; applySelection(fresh, e); }
        drawRail();
        drawHandles();
      };
      ui.canvas.addEventListener('pointermove', move);
      ui.canvas.addEventListener('pointerup', up);
      ui.canvas.addEventListener('pointercancel', up);
    }

    /**
     * Makes the marquee the selected row's region: a rect mask in the row's own space.
     * @returns {void}
     */
    function selectionToRegion() {
      const L = layer();
      const t = tex();
      if (!L || !view.sel) return;
      bakeFloat();
      if (view.sel.mask) {
        // A freehand or wand selection becomes a painted mask: a raster row, exactly its shape.
        const m = Alloy.texture.makePixels(t.width, t.height, [0, 0, 0, 1]);
        for (let y = 0; y < view.sel.h; y++) for (let x = 0; x < view.sel.w; x++) {
          if (!view.sel.mask[y * view.sel.w + x]) continue;
          const i = ((view.sel.y + y) * t.width + view.sel.x + x) * 4;
          m.data[i] = 1; m.data[i + 1] = 1; m.data[i + 2] = 1;
        }
        L.mask = { type: 'raster', png: Alloy.texture.encodePNG(m) };
      } else {
        L.mask = { type: 'shape', op: { op: 'rect', x: snapNum(view.sel.x / t.width), y: snapNum(view.sel.y / t.height),
                                        w: snapNum(view.sel.w / t.width), h: snapNum(view.sel.h / t.height), fill: '#ffffff' } };
      }
      view.sel = null;
      edited('region from selection', true);
      log('the selection is now this row\'s region');
    }

    /**
     * The move tool: picks the shape under the pointer and drags it.
     * @param {PointerEvent} ev - the pointerdown
     * @returns {void}
     */
    function startMove(ev) {
      const t = tex();
      const [u, v] = toTexture(ev.clientX, ev.clientY);
      const i = shapeAt(u, v);
      if (i < 0) {
        const L = layer();
        if (L && L.type === 'raster') {
          const [tx, ty] = toTexel(ev.clientX, ev.clientY);
          if (view.sel && tx >= view.sel.x && ty >= view.sel.y && tx < view.sel.x + view.sel.w && ty < view.sel.y + view.sel.h) {
            startFloat(ev, ev.ctrlKey || ev.altKey);
          } else {
            log('draw a marquee first, then drag inside it to move those pixels — Ctrl-drag copies');
          }
        }
        return;
      }
      if (i !== view.layer) selectRow(i);
      const L = t.layers[i];
      const op = L.op;
      ev.preventDefault();
      const d = Alloy.describeDrawOp(op.op).defaults;
      const start = Object.assign({}, d, JSON.parse(JSON.stringify(op)));
      const [su, sv] = [u, v];
      view.interacting = true;
      ui.canvas.setPointerCapture(ev.pointerId);
      /** @param {PointerEvent} e - a move */
      const move = (e) => {
        const [cu, cv] = toTexture(e.clientX, e.clientY);
        const du = cu - su, dv = cv - sv;
        if (Array.isArray(start.points)) op.points = start.points.map((q) => [snapNum(q[0] + du), snapNum(q[1] + dv)]);
