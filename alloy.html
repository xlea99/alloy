      a = Math.imul(a ^ c, 0x01000193) >>> 0;
      b = Math.imul(b + c, 0x85ebca6b) >>> 0;
      b = (b ^ (b >>> 13)) >>> 0;
    }
    return a.toString(16) + b.toString(16) + ':' + s.length;
  }

  /**
   * Copies a package, replacing raster payloads with intern keys. This is what a history snapshot
   * holds, and it is why undo does not cost a megabyte a step.
   * @param {Object} p - the package
   * @returns {string} - the serialized snapshot
   */
  function snapshot(p) {
    return JSON.stringify(p, function (key, value) {
      if (key === 'png' && typeof value === 'string' && value.length > 64) {
        // The key of a payload is memoised on the payload itself: hashing a megabyte of base64
        // character by character on every dirty check was the cost, and the same string asks the
        // same question every time.
        let k = internKeys.get(value);
        if (!k) {
          k = internKey(value);
          if (internKeys.size >= 32) internKeys.delete(internKeys.keys().next().value);
          internKeys.set(value, k);
        }
        if (!rasterStore.has(k)) rasterStore.set(k, value);
        return '@' + k;
      }
      return value;
    });
  }
  const internKeys = new Map();

  // The package's generation: bumped by every path that changes it, so the snapshot text — which
  // every dirty check, header refresh and history commit wants — is computed once per change
  // rather than once per question. Anything that edits `pkg` without histTouch must bump it.
  let pkgGen = 0, snapshotGen = -1, snapshotText = '';

  /**
   * Says the package changed, so the next snapshot is computed fresh.
   * @returns {void}
   */
  function bumpPackage() { pkgGen++; }

  /**
   * The current snapshot text, computed at most once per package change.
   * @returns {string} - see snapshot()
   */
  function snapshotNow() {
    if (snapshotGen !== pkgGen) { snapshotText = snapshot(pkg); snapshotGen = pkgGen; }
    return snapshotText;
  }

  /**
   * Reads a snapshot back, putting the raster payloads where the keys are.
   * @param {string} text - a snapshot from snapshot()
   * @returns {Object} - the package
   */
  function unsnapshot(text) {
    return JSON.parse(text, function (key, value) {
      if (key === 'png' && typeof value === 'string' && value.charCodeAt(0) === 64) {
        const payload = rasterStore.get(value.slice(1));
        if (payload) return payload;
        // A missing intern is not recoverable, but it is also not a reason to lose the rest of
        // the package. An empty raster layer is visible and fixable; a thrown parse is neither.
        return '';
      }
      return value;
    });
  }

  /**
   * Records that the package changed.
   *
   * Commits on a debounce so one gesture — a drag across a slider, a colour scrubbed through
   * fifty values — becomes one undo step rather than fifty. The label is what the status bar
   * shows if the step is undone.
   *
   * @param {string} label - a short description of the edit
   * @returns {void}
   */
  function histTouch(label) {
    bumpPackage();
    wake();
    history.pending = label;
    if (history.timer) clearTimeout(history.timer);
    history.timer = setTimeout(histCommit, 320);
    markDirty();
    saveSnapshotSoon();
  }

  /**
   * Commits any pending edit as one undo step.
   * @returns {void}
   */
  function histCommit() {
    if (history.timer) { clearTimeout(history.timer); history.timer = 0; }
    if (history.pending === null) return;
    const text = snapshotNow();
    const top = history.past.length ? history.past[history.past.length - 1] : null;
    const label = history.pending;
    history.pending = null;
    // Nothing actually changed — a slider dragged back to where it started, a menu opened and
    // dismissed. Pushing it would make undo do nothing once, which reads as a broken undo.
    if (top && top.text === text) return;
    history.past.push({ text, label });
    if (history.past.length > HISTORY_LIMIT) history.past.shift();
    history.future.length = 0;
  }

  // True while an undo or redo is being adopted, so an editor's refresh can tell a history step
  // from any other reason its package changed.
  let historyStepping = false;

  /**
   * Steps backward or forward through the history.
   * @param {number} dir - -1 to undo, 1 to redo
   * @returns {void}
   */
  function histStep(dir) {
    histCommit();
    const from = dir < 0 ? history.past : history.future;
    const to = dir < 0 ? history.future : history.past;
    // The past's top entry is the CURRENT state, so undo needs two: one to move off, one to land.
    const needed = dir < 0 ? 2 : 1;
    if (from.length < needed) { log(dir < 0 ? 'nothing to undo' : 'nothing to redo'); return; }
    if (dir < 0) to.push(from.pop());
    const target = dir < 0 ? from[from.length - 1] : from.pop();
    if (dir > 0) to.push(target);
    // The name is not an edit. Every snapshot carries one, because the package does, but the
    // name a package has is the name its home gave it: Save as "levels" and it is "levels"
    // until it is saved somewhere else, whatever undo does to its contents. Without this, an
    // undo after a save-as put "untitled" in the header over a home still called "levels".
    const name = pkg.name;
    historyStepping = true;
    try { adoptPackage(unsnapshot(target.text), { keepHome: true, silent: true }); }
    finally { historyStepping = false; }
    pkg.name = name;
    bumpPackage();
    updateHeader();
    log(dir < 0 ? 'undo' : 'redo');
  }

  /**
   * Makes a package the loaded one and rebuilds everything that shows it.
   *
   * This is the ONE place a package becomes the current package. Every load path — a file, browser
   * storage, an undo step, New — ends here, so there is exactly one place that has to remember to
   * rebuild the rail, refresh the windows and reset the history.
   *
   * @param {Object} next - the package to adopt
   * @param {Object} [opts] - options
   * @param {boolean} [opts.keepHome] - true to leave `home` alone
   * @param {boolean} [opts.silent] - true to skip resetting the history (an undo step)
   * @param {Object} [opts.home] - the new home
   * @returns {void}
   */
  function adoptPackage(next, opts) {
    bumpPackage();
    wake();
    // Whatever the source — browser storage, a file, history, the starter — the package is
    // brought to the current schema first. The engine owns the migrations; the app just asks.
    Alloy.migratePackage(next);
    const cfg = opts || {};
    const issues = Alloy.validatePackage(next);
    if (issues.length) throw new Error(issues.join('\n'));
    pkg = next;
    if (!cfg.keepHome) home = cfg.home || null;
    if (!cfg.silent) {
      history.past.length = 0;
      history.future.length = 0;
      history.pending = null;
      history.past.push({ text: snapshot(pkg), label: 'load' });
      history.clean = history.past[0].text;
    }
    if (selection && !(selection.kind === 'texture' && pkg.textures[selection.id])) selection = null;
    buildRail();
    winRefreshAll();
    updateHeader();
  }

  /**
   * Marks the package as differing from its home, and updates the dot.
   * @returns {void}
   */
  function markDirty() { updateHeader(); }

  /**
   * Records that what is loaded now matches the home.
   * @returns {void}
   */
  function markClean() {
    histCommit();
    history.clean = snapshotNow();
    updateHeader();
  }

  /**
   * Is there unsaved work?
   * @returns {boolean} - true when the package differs from its last save
   */
  function isDirty() { return history.clean !== null && history.clean !== snapshotNow(); }

  //#endregion === Package State ===


  // =====================================================================
  //           UI Kit — one menu, one card, one way to ask
  // =====================================================================
  //#region === UI Kit ===

  // *********************************************************************
  // MENTAL MODEL: THERE IS ONE MENU AND ONE CARD IN THIS APP. Every right-click anywhere goes
  // through openMenu, every question goes through askText or askConfirm, and every rename of a
  // thing that already has a name happens in place, in the row it is already in.
  //
  // The reason is not tidiness. A second menu implementation is a second set of dismiss rules, a
  // second keyboard behaviour, and a second thing to fix when one of them traps focus. And
  // `window.prompt` is never used at all: it blocks, it cannot be styled, it cannot be dismissed
  // by clicking away, and in a tool that asks for a name twenty times an hour it is unbearable.
  // *********************************************************************

  /** @type {function|null} what to run when the current menu or card closes */
  let dismissHook = null;

  /**
   * Opens the one context menu at a point.
   *
   * @param {number} x - client x
   * @param {number} y - client y
   * @param {string} title - a heading, or empty for none
   * @param {Array<Object>} items - `{label, fn, danger}`, `{sep: true}` or `{label, head: true}`
   * @returns {void}
   */
  function openMenu(x, y, title, items) {
    closeFloaters();
    const m = dom.menu;
    m.innerHTML = '';
    if (title) {
      const h = document.createElement('div');
      h.className = 'mh';
      h.textContent = title;
      m.appendChild(h);
    }
    for (const item of items) {
      if (item.sep) {
        const s = document.createElement('div');
        s.className = 'ms';
        m.appendChild(s);
        continue;
      }
      const el = document.createElement('div');
      if (item.head) {
        el.className = 'mh';
        el.textContent = item.label;
      } else {
        el.className = 'mi' + (item.danger ? ' danger' : '');
        el.textContent = item.label;
        el.addEventListener('click', () => { closeFloaters(); item.fn(); });
      }
      m.appendChild(el);
    }
    m.hidden = false;
    placeFloater(m, x, y);
  }

  /**
   * Asks for a short piece of text on a small card at the pointer.
   * @param {number} x - client x
   * @param {number} y - client y
   * @param {string} label - the question
   * @param {string} value - the starting value
   * @param {function(string): void} fn - called with the trimmed answer, never with an empty one
   * @returns {void}
   */
  function askText(x, y, label, value, fn) {
    closeFloaters();
    const c = dom.card;
    c.innerHTML = '';
    const l = document.createElement('div');
    l.className = 'lbl';
    l.textContent = label;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = value || '';
    const acts = document.createElement('div');
    acts.className = 'acts';
    const ok = document.createElement('button');
    ok.className = 'chip';
    ok.textContent = 'OK';
    const cancel = document.createElement('button');
    cancel.className = 'chip';
    cancel.textContent = 'Cancel';
    acts.append(cancel, ok);
    c.append(l, input, acts);
    c.hidden = false;
    placeFloater(c, x, y);
    input.focus();
    input.select();

    /**
     * Accepts the answer if it is not empty.
     * @returns {void}
     */
    function accept() {
      const v = input.value.trim();
      closeFloaters();
      if (v) fn(v);
    }
    ok.addEventListener('click', accept);
    cancel.addEventListener('click', closeFloaters);
    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); accept(); }
      if (ev.key === 'Escape') { ev.preventDefault(); closeFloaters(); }
      ev.stopPropagation();
    });
  }

  /**
   * Asks a yes-or-no question on the same card. Used for every destruction, because a tool that
   * deletes without asking is a tool people stop trusting with anything.
   * @param {number} x - client x
   * @param {number} y - client y
   * @param {string} message - what is about to happen
   * @param {function(): void} fn - called only on confirmation
   * @returns {void}
   */
  function askConfirm(x, y, message, fn) {
    closeFloaters();
    const c = dom.card;
    c.innerHTML = '';
    const l = document.createElement('div');
    l.className = 'lbl';
    l.textContent = message;
    const acts = document.createElement('div');
    acts.className = 'acts';
    const no = document.createElement('button');
    no.className = 'chip';
    no.textContent = 'Cancel';
    const yes = document.createElement('button');
    yes.className = 'chip danger';
    yes.textContent = 'Delete';
    acts.append(no, yes);
    c.append(l, acts);
    c.hidden = false;
    placeFloater(c, x, y);
    yes.focus();
    yes.addEventListener('click', () => { closeFloaters(); fn(); });
    no.addEventListener('click', closeFloaters);
  }

  /**
   * Edits a name in place, with an input laid exactly over the label it replaces.
   *
   * A name that already exists is edited where it is; a name that does not exist yet is asked for
   * on a card. That split is the whole rule, and it is why renaming never moves your eyes.
   *
   * @param {HTMLElement} el - the element showing the name
   * @param {string} value - the current name
   * @param {function(string): void} fn - called with the new name when it changed
   * @returns {void}
   */
  function editInPlace(el, value, fn) {
    const input = document.createElement('input');
    input.className = 'inplace';
    input.value = value;
    const parent = el.parentNode;
    parent.replaceChild(input, el);
    input.focus();
    input.select();
    let done = false;

    /**
     * Finishes the edit, restoring the label either way.
     * @param {boolean} accept - true to keep the typed value
     * @returns {void}
     */
    function finish(accept) {
      if (done) return;
      done = true;
      const v = input.value.trim();
      if (input.parentNode === parent) parent.replaceChild(el, input);
      if (accept && v && v !== value) fn(v);
    }
    input.addEventListener('blur', () => finish(true));
    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
      if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
      ev.stopPropagation();
    });
  }

  /**
   * Positions a floating element at a point, nudged so it stays on screen.
   * @param {HTMLElement} el - the floater, already visible so it can be measured
   * @param {number} x - client x
   * @param {number} y - client y
   * @returns {void}
   */
  function placeFloater(el, x, y) {
    el.style.left = '0px';
    el.style.top = '0px';
    const r = el.getBoundingClientRect();
    const maxX = window.innerWidth - r.width - 6;
    const maxY = window.innerHeight - r.height - 6;
    el.style.left = Math.max(6, Math.min(x, maxX)) + 'px';
    el.style.top = Math.max(6, Math.min(y, maxY)) + 'px';
  }

  /**
   * Closes the menu and the card, whichever is open.
   * @returns {void}
   */
  function closeFloaters() {
    dom.menu.hidden = true;
    dom.card.hidden = true;
    if (dismissHook) { const fn = dismissHook; dismissHook = null; fn(); }
  }

  /**
   * Copies text to the clipboard, reporting either way.
   * @param {string} text - what to copy
   * @param {string} what - a name for the message
   * @returns {void}
   */
  function copyToClipboard(text, what) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => log('<em>' + escapeHtml(what) + '</em> copied &middot; ' + text.length + ' characters'),
        () => log('<i>the browser refused the clipboard</i> — copy it from the console instead'));
    } else {
      log('<i>no clipboard API here</i> — this needs a secure context');
    }
  }

  //#endregion === UI Kit ===


  // =====================================================================
  //           Param Rows — the one place a control is made
  // =====================================================================
  //#region === Param Rows ===

  // *********************************************************************
  // MENTAL MODEL: a control knows NOTHING about any specific generator, op or adjustment. It
  // reads a schema entry the engine publishes and builds itself from it.
  //
  // That is the whole reason the schema lives in the engine as data rather than here as UI:
  // adding a generator in Phase 3 or a primitive in Phase 4 gives it a full editor for free, and
  // a consuming project can build its own controls off the same table. It also means the
  // inspector cannot drift from the engine — a parameter that exists has a control, and one that
  // does not, does not.
  //
  // Colours are normalized to hex strings on the way in and out. The engine accepts arrays too,
  // and a hand-written package often uses them, but a control has to pick one spelling and hex is
  // the one a colour input speaks.
  // *********************************************************************

  /**
   * Converts any colour the engine accepts into a `#rrggbb` string.
   * @param {number[]|string} c - a colour
   * @returns {string} - hex, without alpha
   */
  function colorToHex(c) {
    const rgba = Alloy.texture.color(c);
    const hex = (v) => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0');
    return '#' + hex(rgba[0]) + hex(rgba[1]) + hex(rgba[2]);
  }

  /**
   * Reads the alpha out of any colour the engine accepts.
   * @param {number[]|string} c - a colour
   * @returns {number} - alpha in 0..1
   */
  function colorAlpha(c) { return Alloy.texture.color(c)[3]; }

  /**
   * Redraws a panel, unless somebody is typing into one of its fields — then waits for them.
   *
   * Every editor here rebuilds its inspector after an edit, and every text field commits on each
   * keystroke so a slider and a viewport can follow live. Put together, those two honest choices
   * produced the worst bug in the tool: the first keystroke committed, the panel was rebuilt, and
   * the input under the cursor was destroyed mid-word. Typing 0.55 wrote 0. Typing #2b3a5c wrote
   * #22bb33. This is the one place that reconciles them: a redraw asked for while a text or
   * number field in the panel has focus is deferred until that field is left (blur, Enter, Tab),
   * and if focus moved to another field in the same panel the rebuilt counterpart gets it back.
   *
   * Only the latest deferred draw runs, because they all rebuild from the package anyway.
   *
   * @param {HTMLElement} panel - the panel about to be rebuilt
   * @param {function(): void} draw - what rebuilds it
   * @returns {void}
   */
  function redrawKeepingFocus(panel, draw) {
    // What counts as "being used": a field someone is typing in, a slider mid-drag, a colour
    // input with the browser's picker open. A rebuild while any of those has focus destroys it
    // under the pointer — the slider moved one notch, the picker closed on the first click.
    const inUse = (el) => !!el && panel.contains(el) && el.tagName === 'INPUT' &&
      (el.type === 'text' || el.type === 'number' || el.type === 'range' || el.type === 'color');
    const isControl = (el) => !!el && panel.contains(el) && /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(el.tagName);
    const a = document.activeElement;
    if (!inUse(a)) { draw(); return; }
    panel._deferredDraw = draw;
    if (panel._deferredOn) return;
    const fields = () => panel.querySelectorAll('input, select, button');

    /**
     * Waits on one control: when it is left, the panel rebuilds — unless focus went straight to
     * another control in the same panel, in which case that one is waited on instead. Rebuilding
     * at the instant a second slider is pressed used to kill that slider's first drag.
     * @param {HTMLElement} el - the control that has focus
     * @returns {void}
     */
    function arm(el) {
      panel._deferredOn = el;
      /** @param {KeyboardEvent} ev - a key in the field */
      const onKey = (ev) => { if (ev.key === 'Enter') el.blur(); };
      const finish = () => {
        el.removeEventListener('blur', finish);
        el.removeEventListener('keydown', onKey);
        // Let the focus land first — a Tab is on its way to the next field, a press is landing
        // on a slider — so the decision is made about where it actually went.
        setTimeout(() => {
          const next = document.activeElement;
          if (next !== el && isControl(next)) { arm(next); return; }
          const fn = panel._deferredDraw;
          panel._deferredDraw = null;
          panel._deferredOn = null;
          const at = next && panel.contains(next) ? Array.prototype.indexOf.call(fields(), next) : -1;
          if (fn) fn();
          if (at >= 0) {
            const again = fields()[at];
            if (again) { again.focus(); if (again.select) again.select(); }
          }
        }, 0);
      };
      el.addEventListener('blur', finish);
      el.addEventListener('keydown', onKey);
    }
    arm(a);
  }

  /**
   * Builds one labelled control from a schema entry.
   *
   * @param {string} key - the parameter's name
   * @param {Object} spec - its schema entry: `{type, label, min, max, step, options, nullable}`
   * @param {*} value - the current value
   * @param {function(*): void} onChange - called with the new value, live while dragging
   * @returns {HTMLElement} - the row
   */
  function paramRow(key, spec, value, onChange) {
    const row = document.createElement('div');
    row.className = 'prow';
    const label = document.createElement('label');
    label.textContent = spec.label || key;
    label.title = spec.label || key;
    const ctl = document.createElement('div');
    ctl.className = 'ctl';
    row.append(label, ctl);

    if (spec.type === 'number') {
      const num = document.createElement('input');
      num.type = 'number';
      num.step = spec.step === undefined ? 0.01 : spec.step;
      if (spec.min !== undefined) num.min = spec.min;
      if (spec.max !== undefined) num.max = spec.max;
      num.value = value;

      let range = null;
      if (spec.min !== undefined && spec.max !== undefined) {
        range = document.createElement('input');
        range.type = 'range';
        // The engine's hard range for a size is 0.001 to 1000, which is right for the number
        // field and useless as a slider: a seat 0.08 tall sits one pixel from the left end and
        // one notch of the step is bigger than it. So a slider whose hard range is wide slides a
        // SOFT range around the value — up to twice it, at least one unit, at two hundred steps —
        // and grows on the next rebuild if it was dragged to the end. Narrow ranges (0..1, 0..3)
        // slide the real thing.
        const wide = (spec.max - spec.min) > 50;
        const soft = wide ? Math.min(spec.max, Math.max(1, niceCeil(Math.abs(value || 0) * 2))) : spec.max;
        range.min = spec.min; range.max = soft;
        range.step = wide ? soft / 200 : (spec.step === undefined ? 0.01 : spec.step);
        range.value = value;
        range.addEventListener('input', () => {
          num.value = range.value;
          onChange(parseFloat(range.value));
        });
        ctl.appendChild(range);
      }
      num.addEventListener('input', () => {
        let v = parseFloat(num.value);
        if (!Number.isFinite(v)) return;
        // The schema's limits are limits, not hints. A cylinder 0 tall used to sail through here
        // and fill its normals with NaN.
        if (spec.min !== undefined && v < spec.min) v = spec.min;
        if (spec.max !== undefined && v > spec.max) v = spec.max;
        if (range) range.value = v;
        onChange(v);
      });
      ctl.appendChild(num);

    } else if (spec.type === 'color') {
      const swatch = document.createElement('input');
      swatch.type = 'color';
      const hasValue = value !== null && value !== undefined;
      swatch.value = hasValue ? colorToHex(value) : '#000000';
      const text = document.createElement('input');
      text.type = 'text';
      text.value = hasValue ? colorToHex(value) : '';
      text.placeholder = spec.nullable ? 'none' : '#rrggbb';
      swatch.addEventListener('input', () => { text.value = swatch.value; onChange(swatch.value); });
      text.addEventListener('input', () => {
        const v = text.value.trim();
        if (!v && spec.nullable) { onChange(null); return; }
        // Only push a colour the engine will accept. Typing "#ff" mid-keystroke should not throw
        // and should not blank the layer; it should just do nothing until it is a colour.
        try { Alloy.texture.color(v); } catch (err) { return; }
        swatch.value = colorToHex(v);
        onChange(v);
      });
      ctl.append(swatch, text);
      if (spec.nullable) {
        const off = document.createElement('button');
        off.className = 'chip mini';
        off.type = 'button';
        off.textContent = hasValue ? 'off' : 'on';
        off.title = hasValue ? 'turn this off' : 'turn this on';
        off.addEventListener('click', () => onChange(hasValue ? null : '#ffffff'));
        ctl.appendChild(off);
      }

    } else if (spec.type === 'enum') {
      const sel = document.createElement('select');
      for (const opt of spec.options) {
        const o = document.createElement('option');
        o.value = opt; o.textContent = opt;
        sel.appendChild(o);
      }
      sel.value = value;
      sel.addEventListener('change', () => onChange(sel.value));
      ctl.appendChild(sel);

    } else if (spec.type === 'boolean') {
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = !!value;
      box.addEventListener('change', () => onChange(box.checked));
      ctl.appendChild(box);

    } else if (spec.type === 'string') {
      const text = document.createElement('input');
      text.type = 'text';
      text.value = value === undefined || value === null ? '' : String(value);
      text.addEventListener('input', () => onChange(text.value));
      ctl.appendChild(text);

    } else if (spec.type === 'palette') {
      row.style.display = 'block';
      const pal = document.createElement('div');
      pal.className = 'pal';
      const list = Array.isArray(value) ? value.slice() : [];
      list.forEach((c, i) => {
        const sw = document.createElement('input');
        sw.type = 'color';
        sw.className = 'sw';
        sw.value = colorToHex(c);
        sw.title = 'right-click to remove';
        sw.addEventListener('input', () => {
          const next = list.slice();
          next[i] = sw.value;
          onChange(next);
        });
        sw.addEventListener('contextmenu', (ev) => {
          ev.preventDefault();
          const next = list.slice();
          next.splice(i, 1);
          onChange(next.length ? next : null);
        });
        pal.appendChild(sw);
      });
      const add = document.createElement('button');
      add.className = 'chip mini';
      add.type = 'button';
      add.textContent = '+';
      add.title = 'add a colour';
      add.addEventListener('click', () => onChange(list.concat(['#ffffff'])));
      pal.appendChild(add);
      if (list.length) {
        const clear = document.createElement('button');
        clear.className = 'chip mini';
        clear.type = 'button';
        clear.textContent = 'no palette';
        clear.addEventListener('click', () => onChange(null));
        pal.appendChild(clear);
      }
      row.appendChild(pal);

    } else if (spec.type === 'points') {
      row.style.display = 'block';
      const wrap = document.createElement('div');
      wrap.className = 'pts';
      const list = Array.isArray(value) ? value.map((p) => [p[0], p[1]]) : [];
      list.forEach((p, i) => {
        const line = document.createElement('div');
        line.className = 'pt';
        const tag = document.createElement('span');
        tag.textContent = i;
        line.appendChild(tag);
        [0, 1].forEach((axis) => {
          const n = document.createElement('input');
          n.type = 'number';
          n.step = 0.01;
          n.value = p[axis];
          n.addEventListener('input', () => {
            const v = parseFloat(n.value);
            if (!Number.isFinite(v)) return;
            const next = list.map((q) => q.slice());
            next[i][axis] = v;
            onChange(next);
          });
          line.appendChild(n);
        });
        const del = document.createElement('button');
        del.className = 'chip mini';
        del.type = 'button';
        del.textContent = '×';
        del.title = 'remove this point';
        del.addEventListener('click', () => {
          if (list.length <= 2) { log('<i>a path needs at least two points</i>'); return; }
          const next = list.map((q) => q.slice());
          next.splice(i, 1);
          onChange(next);
        });
        line.appendChild(del);
        wrap.appendChild(line);
      });
      const add = document.createElement('button');
      add.className = 'chip mini';
      add.type = 'button';
      add.textContent = '+ point';
      add.addEventListener('click', () => {
        const next = list.map((q) => q.slice());
        const last = next[next.length - 1] || [0.5, 0.5];
        // A new point lands beside the last one rather than on top of it, so it can be grabbed.
        next.push([Math.min(1, last[0] + 0.08), Math.min(1, last[1] + 0.08)]);
        onChange(next);
      });
      wrap.appendChild(add);
      row.appendChild(wrap);

    } else {
      const note = document.createElement('span');
      note.textContent = 'no control for type "' + spec.type + '"';
      note.style.color = 'var(--bad)';
      ctl.appendChild(note);
    }
    return row;
  }

  /**
   * Builds every control for a schema, in the schema's own order.
   * @param {HTMLElement} host - where to append
   * @param {Object} schema - a `params` object from a describe call
   * @param {Object} values - the current parameter values
   * @param {function(string, *): void} onChange - called with the key and the new value
   * @returns {void}
   */
  function paramRows(host, schema, values, onChange) {
    for (const key in schema) {
      host.appendChild(paramRow(key, schema[key], values[key], (v) => onChange(key, v)));
    }
  }

  /**
   * Makes a small section heading, optionally with a button on the right.
   * @param {string} text - the heading
   * @param {HTMLElement} [action] - an element pinned to the right
   * @returns {HTMLElement} - the heading
   */
  function sectionHead(text, action) {
    const el = document.createElement('div');
    el.className = 'sect';
    const t = document.createElement('span');
    t.textContent = text;
    el.appendChild(t);
    if (action) { action.classList.add('add'); el.appendChild(action); }
    return el;
  }

  /**
   * Puts a drag grip on one vertical edge of a panel, so it can be made wider or narrower.
   *
   * The panel must be positioned (relative or absolute). The grip reports a new width through
   * `set`, clamped to the range given; how the width is applied — flex basis, style width — is
   * the panel's business, which is what lets one helper serve a flex column and an overlay.
   *
   * @param {HTMLElement} panel - the panel to resize
   * @param {string} side - 'left' or 'right': which edge grows
   * @param {function(): number} get - the current width in CSS pixels
   * @param {function(number): void} set - applies a new width
   * @param {number} min - the narrowest allowed
   * @param {number} max - the widest allowed
   * @returns {HTMLElement} - the grip
   */
  function makeSplitter(panel, side, get, set, min, max) {
    const grip = document.createElement('div');
    grip.className = 'vgrip ' + side;
    grip.title = 'drag to resize';
    grip.addEventListener('pointerdown', (ev) => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      ev.stopPropagation();
      const startX = ev.clientX, startW = get();
      grip.setPointerCapture(ev.pointerId);
      grip.classList.add('live');
      /** @param {PointerEvent} e - a move */
      const move = (e) => {
        const dx = e.clientX - startX;
        set(Math.max(min, Math.min(max, side === 'left' ? startW - dx : startW + dx)));
      };
      /** @param {PointerEvent} e - the release */
      const up = (e) => {
        grip.classList.remove('live');
        if (grip.hasPointerCapture(e.pointerId)) grip.releasePointerCapture(e.pointerId);
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', up);
        grip.removeEventListener('pointercancel', up);
      };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', up);
      grip.addEventListener('pointercancel', up);
    });
    panel.appendChild(grip);
    return grip;
  }

  /**
   * Makes a small button.
   * @param {string} text - the label
   * @param {string} title - the tooltip
   * @param {function(MouseEvent): void} fn - the click handler
   * @returns {HTMLButtonElement} - the button
   */
  function miniButton(text, title, fn) {
    const b = document.createElement('button');
    b.className = 'chip mini';
    b.type = 'button';
    b.textContent = text;
    b.title = title;
    b.addEventListener('click', fn);
    return b;
  }

  //#endregion === Param Rows ===


  // =====================================================================
  //           Windows — the desk, and what floats over it
  // =====================================================================
  //#region === Windows ===

  // *********************************************************************
  // MENTAL MODEL: THE DESK IS A SURFACE. Every editor floats over it in a window you place
  // yourself, and a maximised window is the desk of whatever you are doing.
  //
  // A window is an INSTANCE: a KIND and a SUBJECT. `texture:brick` and `texture:tiles` are two
  // windows with their own selection, scroll and preview, and neither knows the other exists. An
  // editor keeps its state in its own closure and addresses its own DOM by `data-ui` inside its
  // own root — never by id, because there are two of it.
  //
  // What this system guarantees, and what any change must keep: geometry is remembered per window
  // id and restored on the next visit; a window can never leave the desk; edges snap to the desk
  // and to other windows; double-clicking the bar maximises; the window menu lists everything
  // open so nothing can be lost; and windows live in a z-index BAND that sits entirely below
  // every piece of shell chrome, without exception. The band is renumbered when it runs out.
  //
  // Deliberately NOT here: tabs. Three workbenches in one file will beg for a tab strip, and the
  // audit that produced Webposium's shell was almost entirely the cost of that mistake.
  // *********************************************************************

  const Z_LO = 10, Z_HI = 400;
  const SNAP = 8;

  /** @type {Object<string, Object>} kind name to definition */
  const winKinds = {};

  /** @type {Map<string, Object>} open window id to its record */
  const winOpen = new Map();

  let winZ = Z_LO;
  let winFocused = null;
  let winCascade = 0;

  /**
   * Registers a window kind.
   *
   * @param {string} kind - the kind's name
   * @param {Object} def - the definition
   * @param {function(string): string} def.title - the window's title from its subject
   * @param {number} def.w - starting width
   * @param {number} def.h - starting height
   * @param {function(string): boolean} [def.exists] - false closes the window after a package change
   * @param {function(HTMLElement, string, Object): Object} def.make - builds the editor into the body
   * @returns {void}
   */
  function defineWindowKind(kind, def) { winKinds[kind] = def; }

  /**
   * The id a kind and subject share.
   * @param {string} kind - the kind
   * @param {string} [subject] - the subject, absent for a singleton
   * @returns {string} - the id
   */
  function winIdOf(kind, subject) { return subject === undefined || subject === null ? kind : kind + ':' + subject; }

  /**
   * Opens a window, or focuses it if it is already open.
   * @param {string} kind - a registered kind
   * @param {string} [subject] - what it shows
   * @returns {Object} - the window record
   */
  function openWindow(kind, subject) {
    const id = winIdOf(kind, subject);
    if (winOpen.has(id)) { focusWindow(id); return winOpen.get(id); }
    const def = winKinds[kind];
    if (!def) throw new Error('openWindow: no window kind "' + kind + '" is registered.');

    const el = document.createElement('div');
    el.className = 'win';
    const bar = document.createElement('div');
    bar.className = 'win-bar';
    const title = document.createElement('span');
    title.className = 't';
    // Maximise is a button as well as a double-click on the bar: the same toggle, one more way in.
    const maxBtn = document.createElement('span');
    maxBtn.className = 'm';
    const close = document.createElement('span');
    close.className = 'x';
    close.textContent = '×';
    close.title = 'close';
    bar.append(title, maxBtn, close);
    const body = document.createElement('div');
    body.className = 'win-body';
    el.append(bar, body);
    for (const side of ['e', 's', 'se', 'w', 'n']) {
      const grip = document.createElement('div');
      grip.className = 'win-grip ' + side;
      grip.dataset.side = side;
      el.appendChild(grip);
    }
    dom.desk.appendChild(el);

    const saved = uiPrefs.win[id];
    const deskRect = dom.desk.getBoundingClientRect();
    const rec = {
      id, kind, subject, el, bar, body, title, def,
      x: 0, y: 0, w: def.w, h: def.h, max: false, restore: null, editor: null, maxBtn,
    };
    drawMaxButton(rec);
    if (saved) {
      rec.x = saved.x; rec.y = saved.y; rec.w = saved.w; rec.h = saved.h;
      rec.max = !!saved.max;
      rec.restore = saved.restore || null;
    } else {
      const spot = findFreeSpot(rec.w, rec.h, deskRect);
      rec.x = spot[0];
      rec.y = spot[1];
      // No spot covers less than half of it: the desk is full. A window dropped on the pile is
      // a window somebody has to dig out, so the desk is tiled instead, once, and says so.
      rec.crowded = spot[2] > rec.w * rec.h * 0.5;
    }
    winOpen.set(id, rec);
    applyGeometry(rec, deskRect);
    if (rec.crowded) {
      delete rec.crowded;
      tileWindows();
      log('tiled the desk to make room &middot; Shift+T does it again, drag a bar to break it');
    }

    rec.editor = def.make(body, subject, rec) || {};
    for (const vp of viewports) if (body.contains(vp.canvas)) vp.win = rec;
    wake();
    title.textContent = def.title(subject);
    title.title = title.textContent;

    close.addEventListener('click', (ev) => { ev.stopPropagation(); closeWindow(id); });
    maxBtn.addEventListener('click', (ev) => { ev.stopPropagation(); toggleMaximise(rec); });
    bar.addEventListener('pointerdown', (ev) => startWindowDrag(ev, rec));
    bar.addEventListener('dblclick', () => toggleMaximise(rec));
    el.addEventListener('pointerdown', () => focusWindow(id), true);
    for (const grip of el.querySelectorAll('.win-grip')) {
      grip.addEventListener('pointerdown', (ev) => startWindowResize(ev, rec, grip.dataset.side));
    }

    focusWindow(id);
    updateDeskHint();
    return rec;
  }

  /**
   * Finds where to put a new window so it covers as little of the open ones as possible.
   *
   * A blind cascade is the traditional answer and it is wrong the first time anyone opens two
   * windows: an editor and a preview land almost on top of each other, and the first thing a
   * person does is drag one aside. Scoring a handful of candidate positions by how much they
   * overlap costs nothing and usually finds the arrangement they were going to drag to.
   *
   * @param {number} w - the new window's width
   * @param {number} h - the new window's height
   * @param {DOMRect} deskRect - the desk's rect
   * @returns {number[]} - [x, y, overlap], the overlap in square pixels with what is open
   */
  function findFreeSpot(w, h, deskRect) {
    const dw = deskRect.width, dh = deskRect.height;
    const open = Array.from(winOpen.values()).filter((r) => r.el.style.left);
    if (!open.length) return [8, 8, 0];

    const candidates = [[8, 8], [Math.max(0, dw - w - 8), 8], [8, Math.max(0, dh - h - 8)],
                        [Math.max(0, dw - w - 8), Math.max(0, dh - h - 8)],
                        [Math.max(0, (dw - w) / 2), Math.max(0, (dh - h) / 2)]];
    // Also try tucking it against the right and bottom edge of each window already open.
    for (const r of open) {
      candidates.push([Math.min(r.x + r.w + 8, Math.max(0, dw - w)), r.y]);
      candidates.push([r.x, Math.min(r.y + r.h + 8, Math.max(0, dh - h))]);
    }
    const step = (winCascade++ % 6) * 26;
    candidates.push([30 + step, 24 + step]);

    let best = candidates[0], bestScore = Infinity;
    for (const [x, y] of candidates) {
      const cx = Math.max(0, Math.min(x, dw - w)), cy = Math.max(0, Math.min(y, dh - h));
      let score = 0;
      for (const r of open) {
        const ox = Math.max(0, Math.min(cx + w, r.x + r.w) - Math.max(cx, r.x));
        const oy = Math.max(0, Math.min(cy + h, r.y + r.h) - Math.max(cy, r.y));
        score += ox * oy;
      }
      if (score < bestScore) { bestScore = score; best = [cx, cy]; }
      if (score === 0) break;
    }
    return [best[0], best[1], bestScore];
  }

  /**
   * Closes a window and lets its editor go.
   * @param {string} id - the window's id
   * @returns {void}
   */
  function closeWindow(id) {
    const rec = winOpen.get(id);
    if (!rec) return;
    if (rec.editor && rec.editor.dispose) rec.editor.dispose();
    rec.el.remove();
    winOpen.delete(id);
    wake();
    if (winFocused === id) winFocused = null;
    updateDeskHint();
  }

  /**
   * Raises a window and marks it focused.
   * @param {string} id - the window's id
   * @returns {void}
   */
  function focusWindow(id) {
    const rec = winOpen.get(id);
    if (!rec) return;
    if (winFocused === id && rec.el.style.zIndex) return;
    if (winFocused) {
      const old = winOpen.get(winFocused);
      if (old) old.el.classList.remove('focus');
    }
    winFocused = id;
    rec.el.classList.add('focus');
    wake();
    if (++winZ > Z_HI) renumberWindows();
    rec.el.style.zIndex = winZ;
    if (rec.editor && rec.editor.onFocus) rec.editor.onFocus();
  }

  /**
   * Re-spreads the open windows across the z band, keeping their order.
   *
   * The band is bounded so that shell chrome can sit above every window with one number rather
   * than a moving target. Running out is not an error; it is what happens after a few hundred
   * focus changes, and this is the routine maintenance.
   *
   * @returns {void}
   */
  function renumberWindows() {
    const order = Array.from(winOpen.values())
      .sort((a, b) => (parseInt(a.el.style.zIndex, 10) || 0) - (parseInt(b.el.style.zIndex, 10) || 0));
    winZ = Z_LO;
    for (const rec of order) rec.el.style.zIndex = ++winZ;
  }

  /**
   * Writes a window's geometry to its element, clamped so it can never leave the desk.
   * @param {Object} rec - the window record
   * @param {DOMRect} [deskRect] - the desk's rect, measured here when omitted
   * @returns {void}
   */
  function applyGeometry(rec, deskRect) {
    wake();
    const d = deskRect || dom.desk.getBoundingClientRect();
    if (rec.max) {
      rec.el.style.left = '0px';
      rec.el.style.top = '0px';
      rec.el.style.width = d.width + 'px';
      rec.el.style.height = d.height + 'px';
      return;
    }
    rec.w = Math.max(240, Math.min(rec.w, d.width));
    rec.h = Math.max(140, Math.min(rec.h, d.height));
    // A window whose bar has been dragged off the top can never be dragged back, so the clamp is
    // not cosmetic — it is the thing that makes losing a window impossible.
    rec.x = Math.max(0, Math.min(rec.x, d.width - rec.w));
    rec.y = Math.max(0, Math.min(rec.y, d.height - rec.h));
    rec.el.style.left = rec.x + 'px';
    rec.el.style.top = rec.y + 'px';
    rec.el.style.width = rec.w + 'px';
    rec.el.style.height = rec.h + 'px';
  }

  /**
   * Remembers a window's geometry for its next visit.
   * @param {Object} rec - the window record
   * @returns {void}
   */
  function rememberGeometry(rec) {
    uiPrefs.win[rec.id] = { x: rec.x, y: rec.y, w: rec.w, h: rec.h, max: rec.max, restore: rec.restore };
    savePrefs();
  }

  /**
   * Maximises a window, or puts it back where it was.
   * @param {Object} rec - the window record
   * @returns {void}
   */
  function toggleMaximise(rec) {
    if (rec.max) {
      rec.max = false;
      if (rec.restore) { rec.x = rec.restore.x; rec.y = rec.restore.y; rec.w = rec.restore.w; rec.h = rec.restore.h; }
    } else {
      rec.restore = { x: rec.x, y: rec.y, w: rec.w, h: rec.h };
      rec.max = true;
    }
    applyGeometry(rec);
    rememberGeometry(rec);
    drawMaxButton(rec);
    if (rec.editor && rec.editor.onResize) rec.editor.onResize();
  }

  /**
   * Sets the maximise button's glyph and tooltip to match the window's state.
   * @param {Object} rec - the window record
   * @returns {void}
   */
  function drawMaxButton(rec) {
    if (!rec.maxBtn) return;
    rec.maxBtn.textContent = rec.max ? '❐' : '□';
    rec.maxBtn.title = rec.max ? 'back to its size' : 'maximise';
  }

  /**
   * The edges a dragged window may snap to: the desk's, and every other open window's.
   * @param {Object} self - the window being moved, excluded from the list
   * @returns {Object} - `{xs, ys}`, arrays of candidate edge positions
   */
  function snapTargets(self) {
    const d = dom.desk.getBoundingClientRect();
    const xs = [0, d.width];
    const ys = [0, d.height];
    for (const rec of winOpen.values()) {
      if (rec === self || rec.max) continue;
      xs.push(rec.x, rec.x + rec.w);
      ys.push(rec.y, rec.y + rec.h);
    }
    return { xs, ys };
  }

  /**
   * Snaps one edge pair to the nearest candidate within SNAP pixels.
   * @param {number} lo - the leading edge
   * @param {number} size - the extent
   * @param {number[]} candidates - edge positions to snap to
   * @returns {number} - the adjusted leading edge
   */
  function snapEdge(lo, size, candidates) {
    let best = lo, bestD = SNAP + 1;
    for (const c of candidates) {
      for (const d of [c - lo, c - (lo + size)]) {
        if (Math.abs(d) < bestD) { bestD = Math.abs(d); best = lo + d; }
      }
    }
    return bestD <= SNAP ? best : lo;
  }

  /**
   * Drags a window by its bar.
   * @param {PointerEvent} ev - the pointerdown
   * @param {Object} rec - the window record
   * @returns {void}
   */
  function startWindowDrag(ev, rec) {
    if (ev.target.classList.contains('x') || ev.target.classList.contains('m') || rec.max) return;
    ev.preventDefault();
    focusWindow(rec.id);
    const startX = ev.clientX, startY = ev.clientY;
    const ox = rec.x, oy = rec.y;
    const targets = snapTargets(rec);
    rec.bar.setPointerCapture(ev.pointerId);

    /**
     * Moves the window with the pointer.
     * @param {PointerEvent} e - the pointermove
     * @returns {void}
     */
    function move(e) {
      rec.x = snapEdge(ox + e.clientX - startX, rec.w, targets.xs);
      rec.y = snapEdge(oy + e.clientY - startY, rec.h, targets.ys);
      applyGeometry(rec);
    }
    /**
     * Ends the drag.
     * @param {PointerEvent} e - the pointerup
     * @returns {void}
     */
    function up(e) {
      rec.bar.releasePointerCapture(e.pointerId);
      rec.bar.removeEventListener('pointermove', move);
      rec.bar.removeEventListener('pointerup', up);
      rememberGeometry(rec);
    }
    rec.bar.addEventListener('pointermove', move);
    rec.bar.addEventListener('pointerup', up);
  }

  /**
   * Resizes a window by one of its grips.
   * @param {PointerEvent} ev - the pointerdown
   * @param {Object} rec - the window record
   * @param {string} side - 'e', 's', 'se', 'w' or 'n'
   * @returns {void}
   */
  function startWindowResize(ev, rec, side) {
    if (rec.max) return;
    ev.preventDefault();
    ev.stopPropagation();
    focusWindow(rec.id);
    const startX = ev.clientX, startY = ev.clientY;
    const ow = rec.w, oh = rec.h, ox = rec.x, oy = rec.y;
    const grip = ev.currentTarget;
    grip.setPointerCapture(ev.pointerId);

    /**
     * Applies the resize.
     * @param {PointerEvent} e - the pointermove
     * @returns {void}
     */
    function move(e) {
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (side === 'e' || side === 'se') rec.w = ow + dx;
      if (side === 's' || side === 'se') rec.h = oh + dy;
      if (side === 'w') {
        // Dragging the left edge moves the window and resizes it at once, and the minimum width
        // has to be applied to both or the window walks sideways once it stops shrinking.
        const w = Math.max(240, ow - dx);
        rec.x = ox + (ow - w);
        rec.w = w;
      }
      if (side === 'n') {
        const h = Math.max(140, oh - dy);
        rec.y = oy + (oh - h);
        rec.h = h;
      }
      applyGeometry(rec);
      if (rec.editor && rec.editor.onResize) rec.editor.onResize();
    }
    /**
     * Ends the resize.
     * @param {PointerEvent} e - the pointerup
     * @returns {void}
     */
    function up(e) {
      grip.releasePointerCapture(e.pointerId);
      grip.removeEventListener('pointermove', move);
      grip.removeEventListener('pointerup', up);
      rememberGeometry(rec);
      if (rec.editor && rec.editor.onResize) rec.editor.onResize();
    }
    grip.addEventListener('pointermove', move);
    grip.addEventListener('pointerup', up);
  }

  /**
   * Re-reads every open window from the package, and closes any whose subject is gone.
   *
   * Called after every structural change and after every undo. A window whose subject was deleted
   * closing itself is what keeps the desk honest: there is no such thing as an editor showing
   * something that is not in the package.
   *
   * @returns {void}
   */
  function winRefreshAll() {
    for (const rec of Array.from(winOpen.values())) {
      if (rec.def.exists && !rec.def.exists(rec.subject)) { closeWindow(rec.id); continue; }
      rec.title.textContent = rec.def.title(rec.subject);
      if (rec.editor && rec.editor.refresh) rec.editor.refresh();
    }
    updateDeskHint();
  }

  /**
   * Shows the desk's hint only when there is nothing on the desk.
   * @returns {void}
   */
  function updateDeskHint() { dom.deskHint.style.display = winOpen.size ? 'none' : 'flex'; }

  /**
   * Opens the window menu: everything open, the singletons, and the layouts.
   * @param {number} x - client x
   * @param {number} y - client y
   * @returns {void}
   */
  function openWindowMenu(x, y) {
    const items = [];
    if (winOpen.size) {
      items.push({ label: 'open windows', head: true });
      for (const rec of winOpen.values()) {
        items.push({ label: rec.def.title(rec.subject), fn: () => focusWindow(rec.id) });
      }
      items.push({ sep: true });
    }
    items.push({ label: '3D view', fn: () => openWindow('view') });
    const names = Object.keys(pkg.textures);
    if (names.length) {
      items.push({ sep: true }, { label: 'textures', head: true });
      for (const name of names) items.push({ label: name, fn: () => openWindow('texture', name) });
    }
    items.push({ sep: true },
      { label: 'Tile the desk', fn: tileWindows },
      { label: 'Close everything', fn: () => { for (const id of Array.from(winOpen.keys())) closeWindow(id); } });
    openMenu(x, y, 'Windows', items);
  }

  /**
   * Lays every open window out in a grid, which is the one-click way back from a mess.
   * @returns {void}
   */
  function tileWindows() {
    const list = Array.from(winOpen.values());
    if (!list.length) return;
    const d = dom.desk.getBoundingClientRect();
    const cols = Math.ceil(Math.sqrt(list.length));
    const rows = Math.ceil(list.length / cols);
    list.forEach((rec, i) => {
      rec.max = false;
      rec.w = Math.floor(d.width / cols);
      rec.h = Math.floor(d.height / rows);
      rec.x = (i % cols) * rec.w;
      rec.y = Math.floor(i / cols) * rec.h;
      applyGeometry(rec, d);
      rememberGeometry(rec);
      if (rec.editor && rec.editor.onResize) rec.editor.onResize();
    });
  }

  //#endregion === Windows ===


  // =====================================================================
  //           The Rail — the package's table of contents
  // =====================================================================
  //#region === The Rail ===

  // *********************************************************************
  // MENTAL MODEL: the rail is the PACKAGE. Every row is one thing the package will save. Click
  // selects, double-click opens the thing's window, right-click is its menu, and EVERY create,
  // duplicate, rename, delete, import and export in the tool lives in those menus and nowhere
  // else — not in a toolbar, not inside a window.
  //
  // That rule is what stops the same four buttons appearing in six places and drifting apart. It
  // also means a person only has to learn one gesture: whatever you want to do to a thing, you
  // right-click the thing.
  //
  // The rail is REBUILT FROM THE PACKAGE, never patched, so it cannot disagree with what is
  // loaded. It is a rail rather than a window on purpose: it is a table of contents, it edits
  // nothing, it costs nothing when hidden, and a table of contents wants to be in the same place
  // every time.
  // *********************************************************************

  // Thumbnails are evaluated, not stored, and cached by the exact text of their definition. A
  // texture that has not changed does not get re-evaluated on every rail rebuild, and one that
  // has cannot show a stale picture, because the definition IS the cache key.
  const thumbCache = new Map();
  const THUMB = 28;

  /**
   * Renders a small preview of a texture, from cache when the definition has not changed.
   * @param {Object} tex - the texture definition
   * @returns {string} - a data URL for an <img>-less CSS background
   */
  function thumbnailFor(tex) {
    const key = JSON.stringify(tex);
    const hit = thumbCache.get(key);
    if (hit) return hit;
    let url = '';
    try {
      // Evaluated at thumbnail size rather than full size and scaled down: generators are
      // resolution-independent, so a 28 pixel evaluation is both faithful and about two hundred
      // times cheaper than evaluating 512 pixels to throw away 99.7% of them.
      const px = Alloy.texture.evaluate(Object.assign({}, tex, { width: THUMB, height: THUMB }));
      const c = document.createElement('canvas');
      c.width = THUMB; c.height = THUMB;
      const ctx = c.getContext('2d');
      ctx.putImageData(new ImageData(Alloy.texture.toBytes(px), THUMB, THUMB), 0, 0);
      url = c.toDataURL();
    } catch (err) {
      url = '';
    }
    // Bounded, because a long session editing one texture would otherwise cache every keystroke.
    // Oldest out, one at a time: clearing everything at once meant the next rail rebuild
    // re-evaluated every thumbnail in the package in one go.
    if (thumbCache.size >= 240) thumbCache.delete(thumbCache.keys().next().value);
    thumbCache.set(key, url);
    return url;
  }

  /**
   * Builds one group's heading.
   * @param {string} title - the group's name
   * @param {number} count - how many rows it has
   * @param {function(MouseEvent): void} onAdd - what the + button does
   * @param {function(MouseEvent): void} onMenu - what a right-click on the head offers
   * @returns {HTMLElement} - the heading
   */
  function groupHead(title, count, onAdd, onMenu) {
    const head = document.createElement('div');
    head.className = 'grp-head';
    const label = document.createElement('span');
    label.textContent = title;
    const n = document.createElement('span');
    n.className = 'count';
    n.textContent = count;
    head.append(label, n);
    head.appendChild(miniButton('+', 'new ' + title.toLowerCase().replace(/s$/, ''), (ev) => {
      ev.stopPropagation();
      onAdd(ev);
    }));
    head.addEventListener('contextmenu', (ev) => { ev.preventDefault(); onMenu(ev); });
    return head;
  }

  /**
   * Builds one selectable row.
   * @param {string} kind - the selection kind
   * @param {string} name - the entry's name
   * @param {string} sub - the small text on the right
   * @param {HTMLElement|null} swatch - a preview element, or null
   * @param {Object} handlers - `{open, menu}`
   * @returns {HTMLElement} - the row
   */
  function railRow(kind, name, sub, swatch, handlers) {
    const row = document.createElement('div');
    row.className = 'row' + (selection && selection.kind === kind && selection.id === name ? ' sel' : '');
    if (swatch) row.appendChild(swatch);
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = name;
    const s2 = document.createElement('span');
    s2.className = 'sub';
    s2.textContent = sub;
    row.append(nm, s2);
    row.addEventListener('click', () => {
      selection = { kind, id: name };
      buildRail();
      notifyViewers();
    });
    if (handlers.open) row.addEventListener('dblclick', handlers.open);
    row.addEventListener('contextmenu', (ev) => {
      ev.preventDefault();
      selection = { kind, id: name };
      buildRail();
      handlers.menu(ev);
    });
    return row;
  }

  /**
   * Rebuilds the whole rail from the package.
   * @returns {void}
   */
  function buildRail() {
    dom.rail.innerHTML = '';

    // --- Textures ---
    const texNames = Object.keys(pkg.textures).sort();
    dom.rail.appendChild(groupHead('Textures', texNames.length,
      (ev) => newTexture(ev.clientX, ev.clientY),
      (ev) => openMenu(ev.clientX, ev.clientY, 'Textures', [
        { label: 'New texture…', fn: () => newTexture(ev.clientX, ev.clientY) },
        { sep: true },
        { label: 'Import a PNG as a texture…', fn: importPngAsTexture },
        { label: 'Open a package file…', fn: openPackageFile },
      ])));
    if (!texNames.length) dom.rail.appendChild(emptyNote('No textures yet. Press + above.'));
    for (const name of texNames) {
      const tex = pkg.textures[name];
      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      const url = thumbnailFor(tex);
      if (url) swatch.style.backgroundImage = 'url(' + url + ')';
      swatch.style.backgroundSize = 'cover';
      dom.rail.appendChild(railRow('texture', name, tex.width + '×' + tex.height, swatch, {
        open: () => openWindow('texture', name),
        menu: (ev) => textureMenu(ev.clientX, ev.clientY, name),
      }));
    }

    // --- Materials ---
    const matNames = Object.keys(pkg.materials || {}).sort();
    dom.rail.appendChild(groupHead('Materials', matNames.length,
      (ev) => newMaterial(ev.clientX, ev.clientY),
      (ev) => openMenu(ev.clientX, ev.clientY, 'Materials', [
        { label: 'New material…', fn: () => newMaterial(ev.clientX, ev.clientY) },
      ])));
    if (!matNames.length) dom.rail.appendChild(emptyNote('No materials yet.'));
    for (const name of matNames) {
      const m = pkg.materials[name];
      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.style.background = colorToHex(m.color || '#ffffff');
      if (m.texture && pkg.textures[m.texture]) {
        const url = thumbnailFor(pkg.textures[m.texture]);
        if (url) { swatch.style.backgroundImage = 'url(' + url + ')'; swatch.style.backgroundSize = 'cover'; }
      }
      dom.rail.appendChild(railRow('material', name, m.texture || 'flat', swatch, {
        open: () => openWindow('material', name),
        menu: (ev) => materialMenu(ev.clientX, ev.clientY, name),
      }));
    }

    // --- Clips ---
    const clipNames = Object.keys(pkg.clips || {}).sort();
    dom.rail.appendChild(groupHead('Clips', clipNames.length,
      (ev) => newClip(ev.clientX, ev.clientY),
      (ev) => openMenu(ev.clientX, ev.clientY, 'Clips', [
        { label: 'New clip…', fn: () => newClip(ev.clientX, ev.clientY) },
      ])));
    if (!clipNames.length) dom.rail.appendChild(emptyNote('No clips yet.'));
    for (const name of clipNames) {
      const c = pkg.clips[name];
      const tracks = Object.keys(c.tracks || {}).length;
      dom.rail.appendChild(railRow('clip', name,
        (c.duration || 0).toFixed(2) + 's · ' + tracks + ' bone' + (tracks === 1 ? '' : 's'), null, {
          open: () => openWindow('clip', name),
          menu: (ev) => clipMenu(ev.clientX, ev.clientY, name),
        }));
    }

    // --- Models ---
    const modelNames = Object.keys(pkg.models || {}).sort();
    dom.rail.appendChild(groupHead('Models', modelNames.length,
      (ev) => newModel(ev.clientX, ev.clientY),
      (ev) => openMenu(ev.clientX, ev.clientY, 'Models', [
        { label: 'New model…', fn: () => newModel(ev.clientX, ev.clientY) },
      ])));
    if (!modelNames.length) dom.rail.appendChild(emptyNote('No models yet. Press + above.'));
    for (const name of modelNames) {
      const nodes = Alloy.countNodes(pkg.models[name]);
      dom.rail.appendChild(railRow('model', name, nodes + ' node' + (nodes === 1 ? '' : 's'), null, {
        open: () => openWindow('model', name),
        menu: (ev) => modelMenu(ev.clientX, ev.clientY, name),
      }));
    }
  }

  /**
   * A small explanatory line for an empty group.
   * @param {string} text - what to say
   * @returns {HTMLElement} - the note
   */
  function emptyNote(text) {
    const el = document.createElement('div');
    el.className = 'empty';
    el.textContent = text;
    return el;
  }

  /**
   * The menu for one material.
   * @param {number} x - client x
   * @param {number} y - client y
   * @param {string} name - the material's name
   * @returns {void}
   */
  function materialMenu(x, y, name) {
    const m = pkg.materials[name];
    const texNames = Object.keys(pkg.textures).sort();
    openMenu(x, y, name, [
      { label: 'Open', fn: () => openWindow('material', name) },
      { sep: true },
      { label: 'texture', head: true },
      { label: m.texture ? '(none)' : '(none) ·', fn: () => { m.texture = ''; afterEdit('material texture'); } },
    ].concat(texNames.map((t) => ({
      label: (m.texture === t ? '· ' : '') + t,

      { sep: true },

  /**
   * Asks for a name and creates an empty clip against the selected model.
   * @param {number} x - client x
   * @param {number} y - client y
   * @returns {void}
   */
  function newClip(x, y) {
    askText(x, y, 'Name the new clip', uniqueIn('clips', 'clip'), (name) => {
      if (pkg.clips[name]) { log('<i>that name is taken</i>'); return; }
      const model = selection && selection.kind === 'model' ? selection.id
        : Object.keys(pkg.models || {}).sort()[0] || '';
      pkg.clips[name] = Alloy.emptyClip(name, model);
      selection = { kind: 'clip', id: name };
      afterEdit('new clip');

  /**
   * Records an edit and refreshes everything that shows the package.
   * @param {string} label - what changed
   * @returns {void}
   */
  function afterEdit(label) {
    histTouch(label);
    buildRail();
    winRefreshAll();
    notifyViewers();
  }

  /**
   * Finds a free name in one of the package's maps.
   * @param {string} group - 'textures', 'materials' or 'models'
   * @param {string} base - the preferred name
   * @returns {string} - a name nobody is using
   */
  function uniqueIn(group, base) {
    const map = pkg[group] || {};
    if (!map[base]) return base;
    let n = 2;
    while (map[base + ' ' + n]) n++;
    return base + ' ' + n;
  }

  /**
   * Renames an entry in one of the package's maps.
   * @param {string} group - which map
   * @param {string} from - the current name
   * @param {string} to - the new name
   * @returns {void}
   */
  function renameEntry(group, from, to) {
    if (pkg[group][to]) { log('<i>there is already one called "' + escapeHtml(to) + '"</i>'); return; }
    const entry = pkg[group][from];
    delete pkg[group][from];
    entry.name = to;
    pkg[group][to] = entry;
    // Anything pointing at the old name has to follow, or the rename quietly breaks a model.
    if (group === 'materials') {
      for (const modelName in pkg.models) retargetMaterial(pkg.models[modelName], from, to);
    }
    if (group === 'textures') {
      for (const matName in pkg.materials) {
        if (pkg.materials[matName].texture === from) pkg.materials[matName].texture = to;
      }
    }
    if (selection && selection.id === from) selection = { kind: selection.kind, id: to };
    afterEdit('rename');
    log('renamed to <b>' + escapeHtml(to) + '</b>');
  }

  /**
   * Rewrites every reference to a renamed material inside one model.
   * @param {Object} model - the model
   * @param {string} from - the old material name
   * @param {string} to - the new one
   * @returns {void}
   */
  function retargetMaterial(model, from, to) {
    /**
     * @param {Object} node - the node
     * @returns {void}
     */
    function walk(node) {
      if (node.material === from) node.material = to;
      if (node.children) for (const c of node.children) walk(c);
    }
    if (model && model.nodes) for (const n of model.nodes) walk(n);
  }

  /**
   * Copies an entry under a new name.
   * @param {string} group - which map
   * @param {string} name - the entry to copy
   * @returns {void}
   */
  function duplicateEntry(group, name) {
    const copy = JSON.parse(JSON.stringify(pkg[group][name]));
    const next = uniqueIn(group, name + ' copy');
    copy.name = next;
    pkg[group][next] = copy;
    selection = { kind: group.slice(0, -1), id: next };
    afterEdit('duplicate');
    log('duplicated as <b>' + escapeHtml(next) + '</b>');
  }

  /**
   * Removes an entry.
   * @param {string} group - which map
   * @param {string} name - the entry to delete
   * @returns {void}
   */
  function deleteEntry(group, name) {
    delete pkg[group][name];
    if (selection && selection.id === name) selection = null;
    afterEdit('delete');
    log('deleted <b>' + escapeHtml(name) + '</b>');
  }

  function newMaterial(x, y) {

  function newModel(x, y) {

  /**
   * Finds a texture row's live label in the rail.
   *
   * Looked up at the moment it is needed rather than captured when the menu was built. Opening a
   * row's menu rebuilds the rail — the row has to become the selected one — so any element grabbed
   * beforehand is detached by the time the menu is clicked, and editing it puts an input into a
   * tree nobody can see. That was a rename that silently did nothing.
   *
   * @param {string} name - the texture's name
   * @returns {HTMLElement|null} - the label, or null if the rail has moved on
   */
  function railLabelFor(name) {
    for (const row of dom.rail.querySelectorAll('.row')) {
      const nm = row.querySelector('.nm');
      if (nm && nm.textContent === name) return nm;
    }
    return null;
  }

  /**
   * The menu for one texture row.
   * @param {number} x - client x
   * @param {number} y - client y
   * @param {string} name - the texture's name
   * @returns {void}
   */
  function textureMenu(x, y, name) {
    openMenu(x, y, name, [
      { label: 'Open', fn: () => openWindow('texture', name) },
      { label: 'Show on the 3D view', fn: () => { openWindow('view'); notifyViewers(); } },
      { sep: true },
      { label: 'Rename', fn: () => {
        const el = railLabelFor(name);
        if (el) editInPlace(el, name, (next) => renameTexture(name, next));
        else askText(x, y, 'Rename "' + name + '"', name, (next) => renameTexture(name, next));
      } },
      { label: 'Duplicate', fn: () => duplicateTexture(name) },
      { sep: true },
      { label: 'Bake to a raster layer', fn: () => bakeTextureNamed(name) },
      { label: 'Copy this texture as JSON', fn: () => copyToClipboard(JSON.stringify(pkg.textures[name], null, 2), name + '.json') },
      { label: 'Copy the package data block', fn: copyDataBlock },
      { sep: true },
      { label: 'Delete', danger: true, fn: () => askConfirm(x, y, 'Delete the texture "' + name + '"?', () => deleteTexture(name)) },
    ]);

  /**
   * Finds a name nobody is using yet.
   * @param {string} base - the preferred name
   * @returns {string} - base, or base with a number appended
   */
  function uniqueTextureName(base) {
    if (!pkg.textures[base]) return base;
    let n = 2;
    while (pkg.textures[base + ' ' + n]) n++;
    return base + ' ' + n;
  }

  /**
   * Asks for a name and creates an empty texture.
   * @param {number} x - client x
   * @param {number} y - client y
   * @returns {void}
   */
  function newTexture(x, y) {
    askText(x, y, 'Name the new texture', uniqueTextureName('texture'), (name) => {
      if (pkg.textures[name]) { log('<i>there is already a texture called "' + escapeHtml(name) + '"</i>'); return; }
      pkg.textures[name] = Alloy.emptyTexture(name);
      histTouch('new texture');
      selection = { kind: 'texture', id: name };
      buildRail();
      openWindow('texture', name);
      log('created <b>' + escapeHtml(name) + '</b>');
    });

  /**
   * Renames a texture, moving its window with it.
   * @param {string} from - the current name
   * @param {string} to - the new name
   * @returns {void}
   */
  function renameTexture(from, to) {
    if (pkg.textures[to]) { log('<i>there is already a texture called "' + escapeHtml(to) + '"</i>'); return; }
    const tex = pkg.textures[from];
    delete pkg.textures[from];
    tex.name = to;
    pkg.textures[to] = tex;
    // The window's id is built from the subject, so a rename is a close and an open rather than a
    // relabel. Reopening it at the same geometry is what makes that invisible.
    const oldId = winIdOf('texture', from);
    const wasOpen = winOpen.has(oldId);
    if (wasOpen) {
      uiPrefs.win[winIdOf('texture', to)] = uiPrefs.win[oldId];
      closeWindow(oldId);
    }
    if (selection && selection.id === from) selection = { kind: 'texture', id: to };
    histTouch('rename texture');
    buildRail();
    if (wasOpen) openWindow('texture', to);
    notifyViewers();
    log('renamed to <b>' + escapeHtml(to) + '</b>');
  }

  /**
   * Copies a texture under a new name.
   * @param {string} name - the texture to copy
   * @returns {void}
   */
  function duplicateTexture(name) {
    const copy = JSON.parse(JSON.stringify(pkg.textures[name]));
    const next = uniqueTextureName(name + ' copy');
    copy.name = next;
    pkg.textures[next] = copy;
    histTouch('duplicate texture');
    selection = { kind: 'texture', id: next };
    buildRail();
    openWindow('texture', next);
    log('duplicated as <b>' + escapeHtml(next) + '</b>');
  }

  /**
   * Removes a texture and closes its window.
   * @param {string} name - the texture to delete
   * @returns {void}
   */
  function deleteTexture(name) {
    delete pkg.textures[name];
    if (selection && selection.id === name) selection = null;
    histTouch('delete texture');
    buildRail();
    winRefreshAll();
    notifyViewers();
    log('deleted <b>' + escapeHtml(name) + '</b>');
  }

  /**
   * Replaces a texture with a single baked raster layer, after saying what that costs.
   * @param {string} name - the texture to bake
   * @returns {void}
   */
  function bakeTextureNamed(name) {
    try {
      const baked = Alloy.texture.bake(pkg.textures[name]);
      baked.name = name;
      pkg.textures[name] = baked;
      histTouch('bake texture');
      buildRail();
      winRefreshAll();
      notifyViewers();
      const bytes = Math.round(baked.layers[0].png.length * 0.75 / 1024);
      log('baked <b>' + escapeHtml(name) + '</b> to one raster layer, <b>' + bytes +
          ' KB</b> &middot; the recipe is gone, so undo if you wanted it');
    } catch (err) { logError(err); }
  }

  //#endregion === The Rail ===


  // =====================================================================
  //           Texture Editor — where a layer stack is authored
  // =====================================================================
  //#region === Texture Editor ===

  // *********************************************************************
  // MENTAL MODEL: A TEXTURE IS ONE LIST. Every row is one source — a generator, a shape, paint,
  // an adjustment — and how it lands: blend, opacity, a region (a mask, or clip-to-below). No
  // row holds a list of its own. Folders fold rows together in the list and mean nothing to the
  // engine. The RAIL on the left is the hand: it shows the tools the selected row's type can use,
  // and the colour wells, which belong to the hand and not to any row. The PANEL on the right is
  // the list and the selected row's properties. Verbs left, nouns right.
  //
  // The editor is a VIEW OF THE PACKAGE with no state of its own beyond view state — which row is
  // selected, the tool in hand, the zoom, the marquee. Every edit writes into the package and
  // calls histTouch, and then the preview is re-evaluated from the package rather than from
  // anything the editor remembered. Painting is the one place with a working buffer: the strokes
  // go into decoded pixels that stand in for the row's PNG while the pointer is down, and the PNG
  // is written on release, which is also the undo step.
  //
  // That is why undo works without the editor knowing undo exists: refresh() re-reads the layer
  // stack, and the picture follows.
  //
  // The layer list is drawn TOP FIRST, the opposite of the array. The data is bottom-first because
  // that is the order it composites in and the order it reads in a file; every image editor ever
  // made shows the top layer at the top. The data wins in the file and the person wins in the UI,
  // and the one place the two meet is the index arithmetic in this section.
  // *********************************************************************

  // What a new row of each kind looks like. Kept here rather than in the engine because these
  // are editorial choices — a good starting point for a person — not part of the format.
  const NEW_LAYERS = {
    generator: () => ({ type: 'generator', generator: 'perlin', params: {}, blend: 'normal', opacity: 1 }),
    shape:     (op) => ({ type: 'shape', op: op || { op: 'rect', x: 0.25, y: 0.25, w: 0.5, h: 0.5, fill: '#ffffff' }, blend: 'normal', opacity: 1 }),
    adjust:    () => ({ type: 'adjust', adjust: 'levels', params: {} }),
    raster:    () => ({ type: 'raster', png: '', blend: 'normal', opacity: 1 }),
    image:     (png) => ({ type: 'image', png: png || '', fit: 'stretch', blend: 'normal', opacity: 1 }),
  };

  // The hand: what the person is holding, shared by every texture window because it is theirs,
  // not the texture's. Primary paints with the left button and fills new shapes; secondary
  // paints with the right button and strokes them.
  const paintState = { primary: '#dfe6ef', secondary: '#0a0c10', size: 1, symX: false, symY: false, lockAlpha: false, shade: false };

  // The pixel clipboard: what Ctrl+C took from a paint row, for Ctrl+V into any paint row in any
  // texture window. Pixels outside the selection's mask are transparent in it.
  let pixelClipboard = null;

  // The catalogue thumbnails on the rail, one per generator and adjustment, made once.
  const catalogueThumbs = new Map();

  /**
   * A small picture of what a generator or adjustment does, for the rail's catalogue.
   * @param {string} kind - 'generator' or 'adjust'
   * @param {string} which - the registry key
   * @returns {string} - a data URL
   */
  function catalogueThumb(kind, which) {
    const key = kind + ':' + which;
    if (catalogueThumbs.has(key)) return catalogueThumbs.get(key);
    const layers = kind === 'generator'
      ? [{ type: 'generator', generator: which, params: {} }]
      : [{ type: 'generator', generator: 'perlin', params: {} }, { type: 'adjust', adjust: which, params: {} }];
    let url = '';
    try {
      const px = Alloy.texture.evaluate({ name: which, width: 24, height: 24, seed: 3, layers });
      const c = document.createElement('canvas');
      c.width = 24; c.height = 24;
      c.getContext('2d').putImageData(new ImageData(Alloy.texture.toBytes(px), 24, 24), 0, 0);
      url = c.toDataURL();
    } catch (err) { url = ''; }
    catalogueThumbs.set(key, url);
    return url;
  }

  /**
   * Builds a texture editor into a window body.
   *
   * @param {HTMLElement} host - the window body
   * @param {string} name - the texture's name in the package
   * @param {Object} win - the window record
   * @returns {Object} - the editor
   */
  function makeTextureEditor(host, name, win) {
    // Every piece of view state this editor has. Nothing else is remembered anywhere.
    const view = {
      layer: 0, tiling: uiPrefs.tiling, zoom: 0, panX: 0, panY: 0, interacting: false, json: false,
      tool: 'move',        // what the hand is doing on the stage
      sel: null,           // the selection, in texels: {x, y, w, h, mask}; mask is null for a
                           // plain rectangle, else one byte per texel of the box
      folds: new Set(),    // folded folder names
      polyRow: -1,         // the polygon row being extended, one point per click
    };
    let pending = 0;
    // The working pixels of the raster row being painted, decoded once and committed to its PNG
    // at the end of every stroke. `png` remembers what was committed, so an undo that changes
    // the row's PNG under us is noticed and the buffer dropped.
    let work = null;
    // Pixels lifted out of the marquee and carried by the pointer, until they are dropped.
    let float = null;
    // The last evaluated composite, for the eyedropper and the wand, and the long side it was
    // rendered at: the preview is evaluated at what the screen can show, so this may be coarser
    // than the texture, and a picker that needs the real texels asks fullComposite() instead.
    let lastPixels = null;
    let renderedCap = 0;

    /**
     * How many pixels along the long side the preview needs, to look exact on this screen at
     * this zoom. Evaluating more than the screen can show is wasted; evaluating less, which a
     * fixed cap did for anything over 512, smudged a big picture for no saving anyone could see.
     * While a handle is being dragged it drops to 128: generators and shapes are resolution-
     * independent, so that is the same picture at a fraction of the cost, and the full one lands
     * the moment the pointer is released.
     * @returns {number} - the long side, in pixels
     */
    function previewCap() {
      const t = tex();
      if (!t) return 128;
      if (view.interacting && !work) return 128;
      const stage = ui.stage.getBoundingClientRect();
      if (!stage.width) return 512;
      const fit = Math.min((stage.width - 16) / t.width, (stage.height - 16) / t.height);
      const scale = Math.max(0.02, fit * Math.pow(1.25, view.zoom));
      const shown = Math.max(t.width, t.height) * scale * (window.devicePixelRatio || 1);
      return Math.max(128, Math.ceil(shown));
    }

    /**
     * Re-renders when the zoom or the window has outgrown what was last evaluated; a cheaper
     * render is kept, since a coarser display of a finer picture is only the browser's scaling.
     * @returns {void}
     */
    function renderIfCoarse() {
      const t = tex();
      if (!t) return;
      const full = Math.max(t.width, t.height);
      if (renderedCap < full && previewCap() > renderedCap) scheduleRender();
    }

    /**
     * The composite at the texture's full size, for tools that read texels rather than look at
