          else removeClipKey(c, boneName, channel, view.time);
          if (vp.canvas.hasPointerCapture(ev.pointerId)) vp.canvas.releasePointerCapture(ev.pointerId);
          vp.canvas.removeEventListener('pointermove', move);
          vp.canvas.removeEventListener('pointerup', up);
          vp.canvas.removeEventListener('pointercancel', up);
          view.dragging = null;
          activeDrag = null;
          dirtyKey = null;
          sync();
          drawTimeline();
          drawInspector();
          log('cancelled');
        },
      };

      /**
       * Turns a pointer position into the scalar this drag is about.
       * @param {number} sx - pointer x in canvas pixels
       * @param {number} sy - pointer y in canvas pixels
       * @returns {number} - a distance or an angle in degrees
       */
      function measure(sx, sy) {
        const ray = viewportRay(vp, sx, sy);
        if (view.mode === 'rotate') {
          const hit = [0, 0, 0];
          if (!Alloy.pick.rayPlane(hit, ray.origin, ray.dir, state.pivot, dir)) return 0;
          const u = state.basis[(axis.index + 1) % 3], v = state.basis[(axis.index + 2) % 3];
          const rel = vec3.sub([], hit, state.pivot);
          return Math.atan2(vec3.dot(rel, v), vec3.dot(rel, u)) * 180 / Math.PI;
        }
        return Alloy.pick.closestOnLine([], ray.origin, ray.dir, state.pivot, dir);
      }

      /**
       * Applies the drag by writing a key at the playhead.
       * @param {PointerEvent} e - the pointermove
       * @returns {void}
       */
      function move(e) {
        const now = measure(e.clientX - r.left, e.clientY - r.top);
        let delta = now - first;
        if (view.mode === 'rotate') {
          while (delta > 180) delta -= 360;
          while (delta < -180) delta += 360;
          const next = startEuler.slice();
          next[axis.index] = Math.round((startEuler[axis.index] + delta) * 1e3) / 1e3;
          writeKey('rotation', next);
        } else if (view.mode === 'translate') {
          const next = start.position.slice();
          next[axis.index] = start.position[axis.index] + delta;
          writeKey('position', next);
        } else {
          const from = Math.abs(first) < 1e-6 ? 1e-6 : first;
          let factor = now / from;
          if (!Number.isFinite(factor) || factor < 0.001) factor = 0.001;
          const next = start.scale.slice();
          next[axis.index] = Math.max(0.001, start.scale[axis.index] * factor);
          writeKey('scale', next);
        }
      }

      /**
       * Writes the dragged value into the clip at the playhead.
       * @param {string} channel - which channel
       * @param {number[]} value - the new local value
       * @returns {void}
       */
      function writeKey(channel, value) {
        setClipKey(c, boneName, channel, view.time, value);
        // The pose is re-read from the clip on the next frame, so editing and previewing are the
        // same path and cannot drift apart.
        dirtyKey = null;
        sync();
      }

      /**
       * Ends the drag.
       * @param {PointerEvent} e - the pointerup
       * @returns {void}
       */
      function up(e) {
        if (vp.canvas.hasPointerCapture(e.pointerId)) vp.canvas.releasePointerCapture(e.pointerId);
        vp.canvas.removeEventListener('pointermove', move);
        vp.canvas.removeEventListener('pointerup', up);
        vp.canvas.removeEventListener('pointercancel', up);
        view.dragging = null;
        activeDrag = null;
        view.key = { bone: boneName, channel, t: tidyTime(view.time) };
        edited('key ' + view.mode);
      }
      vp.canvas.addEventListener('pointermove', move);
      vp.canvas.addEventListener('pointerup', up);
      vp.canvas.addEventListener('pointercancel', up);
    }

    // --- The timeline ---

    /**
     * The bones this timeline shows: everything the model has, animated or not, so an unkeyed
     * bone has a row to be keyed on rather than appearing only once it already has a key.
     * @returns {string[]} - bone names in tree order
     */
    function timelineBones() {
      if (!anim) return [];
      return anim.boneList().map((b) => b.name).filter(Boolean);
    }

    /**
     * Converts a time to an x position on the timeline canvas.
     * @param {number} t - the time
     * @param {number} w - the canvas width in CSS pixels
     * @returns {number} - the x position
     */
    function timeToX(t, w) {
      const span = w - TIMELINE.labelW - TIMELINE.padR;
      return TIMELINE.labelW + (t / duration()) * span;
    }

    /**
     * Converts an x position back to a time.
     * @param {number} x - the x position
     * @param {number} w - the canvas width in CSS pixels
     * @returns {number} - the time
     */
    function xToTime(x, w) {
      const span = w - TIMELINE.labelW - TIMELINE.padR;
      return clamp(((x - TIMELINE.labelW) / span) * duration(), 0, duration());
    }

    /**
     * Redraws the timeline canvas.
     * @returns {void}
     */
    function drawTimeline() {
      const canvas = ui.tl;
      const wrap = ui.timewrap;
      const w = wrap.clientWidth, bones = timelineBones();
      const h = TIMELINE.rulerH + TIMELINE.eventH + Math.max(1, bones.length) * TIMELINE.rowH + 4;
      wrap.style.height = h + 'px';
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      const g = canvas.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);

      const css = getComputedStyle(document.documentElement);
      const dim = css.getPropertyValue('--dim2').trim() || '#56637a';
      const ink = css.getPropertyValue('--ink').trim() || '#dfe6ef';
      const accent = css.getPropertyValue('--accent').trim() || '#63d2ff';
      const line = css.getPropertyValue('--line').trim() || '#252d3a';
      const warm = css.getPropertyValue('--accent2').trim() || '#ffb454';

      g.font = '10px ui-monospace, monospace';
      g.textBaseline = 'middle';

      // The ruler. One label per tenth of the clip, rounded to something readable.
      g.fillStyle = dim;
      g.strokeStyle = line;
      const dur = duration();
      const ticks = 10;
      for (let i = 0; i <= ticks; i++) {
        const t = (i / ticks) * dur;
        const x = timeToX(t, w);
        g.beginPath();
        g.moveTo(x, 0);
        g.lineTo(x, h);
        g.globalAlpha = i % 5 === 0 ? 0.7 : 0.3;
        g.stroke();
        g.globalAlpha = 1;
        if (i % 2 === 0) g.fillText(t.toFixed(2), x + 2, TIMELINE.rulerH / 2);
      }

      // The event strip.
      const evY = TIMELINE.rulerH + TIMELINE.eventH / 2;
      g.fillStyle = dim;
      g.fillText('events', 4, evY);
      const c = clip();
      for (const ev of (c.events || [])) {
        const x = timeToX(ev.t, w);
        g.fillStyle = warm;
        g.beginPath();
        g.moveTo(x, evY - 5);
        g.lineTo(x + 5, evY);
        g.lineTo(x, evY + 5);
        g.lineTo(x - 5, evY);
        g.closePath();
        g.fill();
      }

      // One row per bone, with a diamond per key. Position, rotation and scale share the row and
      // are told apart by colour: three rows per bone would triple the height for tracks that are
      // usually empty.
      const channelColour = { position: '#6ee7a8', rotation: accent, scale: warm };
      bones.forEach((bone, i) => {
        const y = TIMELINE.rulerH + TIMELINE.eventH + i * TIMELINE.rowH + TIMELINE.rowH / 2;
        const selected = view.sel.indexOf(bone) >= 0;
        if (selected) {
          g.fillStyle = 'rgba(99, 210, 255, 0.10)';
          g.fillRect(0, y - TIMELINE.rowH / 2, w, TIMELINE.rowH);
        }
        g.fillStyle = selected ? ink : dim;
        g.fillText(bone.length > 12 ? bone.slice(0, 11) + '…' : bone, 4, y);

        const track = (c.tracks || {})[bone];
        if (!track) return;
        for (const channel of ['position', 'rotation', 'scale']) {
          const keys = track[channel];
          if (!keys) continue;
          for (const k of keys) {
            const x = timeToX(k.t, w);
            const isSel = view.key && view.key.bone === bone && view.key.channel === channel &&
                          Math.abs(view.key.t - k.t) < 1e-3;
            g.fillStyle = channelColour[channel];
            g.beginPath();
            g.moveTo(x, y - 4);
            g.lineTo(x + 4, y);
            g.lineTo(x, y + 4);
            g.lineTo(x - 4, y);
            g.closePath();
            g.fill();
            if (isSel) {
              g.strokeStyle = ink;
              g.lineWidth = 1.5;
              g.stroke();
              g.lineWidth = 1;
            }
          }
        }
      });

      // The playhead, last so it sits over everything.
      const px = timeToX(view.time, w);
      g.strokeStyle = accent;
      g.lineWidth = 1.5;
      g.beginPath();
      g.moveTo(px, 0);
      g.lineTo(px, h);
      g.stroke();
      g.lineWidth = 1;
      g.fillStyle = accent;
      g.fillRect(px - 14, 0, 28, TIMELINE.rulerH - 4);
      g.fillStyle = '#0a0c10';
      g.textAlign = 'center';
      g.fillText(view.time.toFixed(2), px, TIMELINE.rulerH / 2 - 2);
      g.textAlign = 'left';
    }

    // --- Timeline interaction ---

    /**
     * Finds whatever is under a point on the timeline.
     * @param {number} x - canvas x in CSS pixels
     * @param {number} y - canvas y
     * @returns {Object|null} - `{kind, ...}`: a key, an event, a row, or the ruler
     */
    function timelineHit(x, y) {
      const w = ui.timewrap.clientWidth;
      const c = clip();
      if (y < TIMELINE.rulerH) return { kind: 'ruler', t: xToTime(x, w) };

      if (y < TIMELINE.rulerH + TIMELINE.eventH) {
        for (const ev of (c.events || [])) {
          if (Math.abs(timeToX(ev.t, w) - x) <= 6) return { kind: 'event', event: ev };
        }
        return { kind: 'eventstrip', t: xToTime(x, w) };
      }

      const row = Math.floor((y - TIMELINE.rulerH - TIMELINE.eventH) / TIMELINE.rowH);
      const bones = timelineBones();
      if (row < 0 || row >= bones.length) return null;
      const bone = bones[row];
      const track = (c.tracks || {})[bone];
      if (track) {
        // Rotation first, because it is the channel almost every key belongs to and two keys at
        // the same time on the same row would otherwise be decided by object order.
        for (const channel of ['rotation', 'position', 'scale']) {
          const keys = track[channel];
          if (!keys) continue;
          for (const k of keys) {
            if (Math.abs(timeToX(k.t, w) - x) <= 6) return { kind: 'key', bone, channel, key: k };
          }
        }
      }
      return { kind: 'row', bone, t: xToTime(x, w) };
    }

    /**
     * Wires the timeline's pointer and menu behaviour.
     * @returns {void}
     */
    function bindTimeline() {
      const canvas = ui.tl;

      canvas.addEventListener('pointerdown', (ev) => {
        if (ev.button !== 0) return;
        const r = canvas.getBoundingClientRect();
        const hit = timelineHit(ev.clientX - r.left, ev.clientY - r.top);
        if (!hit) return;
        ev.preventDefault();
        canvas.setPointerCapture(ev.pointerId);

        if (hit.kind === 'ruler' || hit.kind === 'eventstrip' || hit.kind === 'row') {
          if (hit.kind === 'row') { view.sel = [hit.bone]; drawInspector(); }
          scrubFrom(ev, canvas, r);
          return;
        }
        if (hit.kind === 'key') {
          view.sel = [hit.bone];
          view.key = { bone: hit.bone, channel: hit.channel, t: hit.key.t };
          // Scrubbing to a key you just selected is what everyone expects and what makes the
          // viewport show the pose the key describes.
          view.time = hit.key.t;
          dragKeyFrom(ev, canvas, r, hit);
          drawInspector();
          drawTimeline();
          return;
        }
        if (hit.kind === 'event') {
          dragEventFrom(ev, canvas, r, hit.event);
        }
      });

      canvas.addEventListener('contextmenu', (ev) => {
        ev.preventDefault();
        const r = canvas.getBoundingClientRect();
        const hit = timelineHit(ev.clientX - r.left, ev.clientY - r.top);
        if (!hit) return;
        const c = clip();

        if (hit.kind === 'key') {
          openMenu(ev.clientX, ev.clientY, hit.bone + ' · ' + hit.channel + ' · ' + hit.key.t.toFixed(3), [
            { label: 'easing from here', head: true },
          ].concat(Alloy.easings.map((e) => ({
            label: ((hit.key.ease || 'linear') === e ? '· ' : '') + e,
            fn: () => {
              if (e === 'linear') delete hit.key.ease;
              else hit.key.ease = e;
              edited('key easing');
            },
          }))).concat([
            { sep: true },
            { label: 'Delete this key', danger: true, fn: () => {
              removeClipKey(c, hit.bone, hit.channel, hit.key.t);
              view.key = null;
              edited('delete key');
            } },
          ]));
          return;
        }

        if (hit.kind === 'event') {
          openMenu(ev.clientX, ev.clientY, 'event · ' + hit.event.name, [
            { label: 'Rename…', fn: () => askText(ev.clientX, ev.clientY, 'Event name',
              hit.event.name, (v) => { hit.event.name = v; edited('rename event'); }) },
            { sep: true },
            { label: 'Delete', danger: true, fn: () => {
              c.events.splice(c.events.indexOf(hit.event), 1);
              edited('delete event');
            } },
          ]);
          return;
        }

        if (hit.kind === 'eventstrip' || hit.kind === 'ruler') {
          openMenu(ev.clientX, ev.clientY, 'Timeline', [
            { label: 'Add an event here…', fn: () => askText(ev.clientX, ev.clientY,
              'Event name', 'footstep', (v) => {
                c.events = c.events || [];
                c.events.push({ t: tidyTime(snapTime(hit.t)), name: v });
                c.events.sort((a, b) => a.t - b.t);
                edited('add event');
              }) },
          ]);
          return;
        }

        if (hit.kind === 'row') {
          openMenu(ev.clientX, ev.clientY, hit.bone, [
            { label: 'Key this bone here', fn: () => keyBone(hit.bone) },
            { label: 'Key its rest pose here', fn: () => keyBone(hit.bone, true) },
            { sep: true },
            { label: 'Clear this track', danger: true, fn: () => {
              if (c.tracks) delete c.tracks[hit.bone];
              edited('clear track');
            } },
          ]);
        }
      });
    }

    /**
     * Drags the playhead while the pointer is down.
     * @param {PointerEvent} ev - the pointerdown
     * @param {HTMLElement} canvas - the timeline canvas
     * @param {DOMRect} r - its rect
     * @returns {void}
     */
    function scrubFrom(ev, canvas, r) {
      view.playing = false;
      /**
       * @param {PointerEvent} e - the pointer event
       * @returns {void}
       */
      function move(e) {
        view.time = snapTime(xToTime(e.clientX - r.left, ui.timewrap.clientWidth));
        drawTimeline();
        drawInspector();
      }
      move(ev);
      endDrag(canvas, move, () => { drawTools(); });
    }

    /**
     * Drags a keyframe along the timeline.
     * @param {PointerEvent} ev - the pointerdown
     * @param {HTMLElement} canvas - the timeline canvas
     * @param {DOMRect} r - its rect
     * @param {Object} hit - the key that was grabbed
     * @returns {void}
     */
    function dragKeyFrom(ev, canvas, r, hit) {
      const c = clip();
      let moved = false;
      /**
       * @param {PointerEvent} e - the pointer event
       * @returns {void}
       */
      function move(e) {
        const t = snapTime(xToTime(e.clientX - r.left, ui.timewrap.clientWidth));
        if (Math.abs(t - hit.key.t) < 1e-4) return;
        moved = true;
        hit.key.t = tidyTime(t);
        // Re-sorted on every move, because a key dragged past its neighbour has genuinely changed
        // places and a track that is out of order samples nonsense.
        c.tracks[hit.bone][hit.channel].sort((a, b) => a.t - b.t);
        view.key.t = hit.key.t;
        view.time = hit.key.t;
        dirtyKey = null;
        sync();
        drawTimeline();
      }
      endDrag(canvas, move, () => { if (moved) edited('move key'); });
    }

    /**
     * Drags an event marker along the timeline.
     * @param {PointerEvent} ev - the pointerdown
     * @param {HTMLElement} canvas - the timeline canvas
     * @param {DOMRect} r - its rect
     * @param {Object} event - the marker
     * @returns {void}
     */
    function dragEventFrom(ev, canvas, r, event) {
      const c = clip();
      let moved = false;
      /**
       * @param {PointerEvent} e - the pointer event
       * @returns {void}
       */
      function move(e) {
        const t = snapTime(xToTime(e.clientX - r.left, ui.timewrap.clientWidth));
        if (Math.abs(t - event.t) < 1e-4) return;
        moved = true;
        event.t = tidyTime(t);
        c.events.sort((a, b) => a.t - b.t);
        drawTimeline();
      }
      endDrag(canvas, move, () => { if (moved) edited('move event'); });
    }

    /**
     * Runs a pointer drag until release. One place, so every timeline drag releases its capture
     * and cleans up its listeners the same way.
     * @param {HTMLElement} el - the element holding the capture
     * @param {function(PointerEvent): void} move - the move handler
     * @param {function(): void} done - what to do on release
     * @returns {void}
     */
    function endDrag(el, move, done) {
      /**
       * @param {PointerEvent} e - the pointerup
       * @returns {void}
       */
      function up(e) {
        if (el.hasPointerCapture && el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
        done();
      }
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    }

    /**
     * Writes the bone's pose at the playhead as keys on every channel it already animates, or on
     * rotation when it animates nothing yet.
     *
     * Keying only the channels a bone already uses is what keeps a clip sparse: a rotation-only
     * arm should not gain a position track the first time somebody presses the key button.
     *
     * Passing `rest` writes the bone's REST pose instead of what the clip currently says. That
     * is the action a clip needs at both ends — a raise that starts and finishes at rest — and
     * without it the only way to get back to rest is to type the numbers, because keying "the
     * current pose" of a one-key track faithfully records the pose that one key describes.
     *
     * @param {string} bone - the bone's name
     * @param {boolean} [rest] - true to key the rest pose rather than the current one
     * @returns {void}
     */
    function keyBone(bone, rest) {
      if (!anim) return;
      const c = clip();
      const local = anim.sampleLocal(rest ? '' : name, bone, view.time);
      if (!local) return;
      const track = (c.tracks || {})[bone];
      const channels = track ? Object.keys(track) : ['rotation'];
      for (const channel of channels) {
        const value = channel === 'rotation' ? Alloy.quat.toEuler([], local.rotation)
          : channel === 'position' ? local.position : local.scale;
        setClipKey(c, bone, channel, view.time, value);
      }
      view.key = { bone, channel: channels[0], t: tidyTime(view.time) };
      edited('key bone');
    }

    // --- The inspector, and the curve ---

    /**
     * Rebuilds the right-hand panel.
     * @returns {void}
     */
    function drawInspector() { redrawKeepingFocus(ui.insp, drawInspectorNow); }

    /**
     * Rebuilds the right-hand panel, right now.
     * @returns {void}
     */
    function drawInspectorNow() {
      ui.insp.innerHTML = '';
      const c = clip();
      if (!c) return;

      ui.insp.appendChild(sectionHead('clip'));
      const modelNames = [''].concat(Object.keys(pkg.models || {}).sort());
      ui.insp.appendChild(paramRow('model', { type: 'enum', options: modelNames, label: 'Drives model' },
        c.model || '', (v) => { c.model = v; edited('clip model'); }));
      ui.insp.appendChild(paramRow('duration',
        { type: 'number', min: 0.05, max: 60, step: 0.05, label: 'Duration (s)' },
        c.duration, (v) => {
          c.duration = Math.max(0.05, v);
          view.time = Math.min(view.time, c.duration);
          edited('clip duration');
        }));
      ui.insp.appendChild(paramRow('loop', { type: 'boolean', label: 'Loop' },
        c.loop !== false, (v) => { c.loop = v; edited('clip loop'); }));

      if (!model()) {
        const note = document.createElement('div');
        note.className = 'prow note';
        note.style.color = 'var(--bad)';
        note.textContent = 'This clip names no model, so there is no skeleton to animate. Pick one above.';
        ui.insp.appendChild(note);
        return;
      }

      // --- The selected key ---
      ui.insp.appendChild(sectionHead('keyframe'));
      const key = selectedKey();
      if (!key) {
        const note = document.createElement('div');
        note.className = 'prow note';
        note.textContent = view.sel.length
          ? 'Drag a gizmo in the viewport to key ' + view.sel[0] + ' at the playhead, or press K.'
          : 'Click a bone in the viewport, or a row on the timeline, to choose what to animate.';
        ui.insp.appendChild(note);
      } else {
        const info = document.createElement('div');
        info.className = 'prow note';
        info.textContent = view.key.bone + ' · ' + view.key.channel + ' at ' + key.t.toFixed(3) + 's';
        ui.insp.appendChild(info);
        ui.insp.appendChild(paramRow('t', { type: 'number', min: 0, max: c.duration, step: 0.01, label: 'Time' },
          key.t, (v) => {
            key.t = tidyTime(clamp(v, 0, c.duration));
            c.tracks[view.key.bone][view.key.channel].sort((a, b) => a.t - b.t);
            view.key.t = key.t;
            view.time = key.t;
            edited('move key');
          }));
        vectorRow(view.key.channel === 'rotation' ? 'Value °' : 'Value', key.v,
          view.key.channel === 'rotation' ? 1 : 0.05, (v) => {
            key.v = v.map((n) => Math.round(n * 1e4) / 1e4);
            edited('key value');
          });
        ui.insp.appendChild(paramRow('ease', { type: 'enum', options: Alloy.easings, label: 'Ease from here' },
          key.ease || 'linear', (v) => {
            if (v === 'linear') delete key.ease;
            else key.ease = v;
            edited('key easing');
          }));
        // A long turn. Rotations are blended as quaternions, which always take the short way
        // round: a 0° key followed by a 360° key is the SAME orientation twice and plays as no
        // turn at all, and 200° plays as 160° the other way. Nothing in the maths can say so, so
        // the inspector does, and offers the fix — the turn keyed in steps small enough to be
        // unambiguous.
        const keys = c.tracks[view.key.bone][view.key.channel];
        const prevKey = keys[keys.indexOf(key) - 1] || null;
        const turn = view.key.channel === 'rotation' && prevKey && key.v.length === 3 && prevKey.v.length === 3
          ? Math.max.apply(null, key.v.map((n, i) => Math.abs(n - prevKey.v[i]))) : 0;
        if (turn >= 180) {
          const warn = document.createElement('div');
          warn.className = 'prow note';
          warn.style.color = 'var(--accent2)';
          warn.textContent = 'This key is ' + Math.round(turn) + '° from the one before it. Rotations ' +
            'blend the short way round, so a turn of 180° or more plays as a stop or as a turn the ' +
            'other way — 360° is no turn at all. Key it in steps under 120°.';
          ui.insp.appendChild(warn);
          const steps = Math.ceil(turn / 120);
          const split = document.createElement('div');
          split.className = 'prow';
          split.appendChild(miniButton('split this turn into ' + steps + ' steps',
            'insert keys between the two so the turn goes the long way', () => {
              for (let i = 1; i < steps; i++) {
                const f = i / steps;
                const t = prevKey.t + (key.t - prevKey.t) * f;
                setClipKey(c, view.key.bone, 'rotation', t, prevKey.v.map((n, j) => n + (key.v[j] - n) * f),
                           prevKey.ease);
              }
              edited('split turn');
              log('keyed the turn in ' + steps + ' steps');
            }));
          ui.insp.appendChild(split);
        }
        const del = document.createElement('div');
        del.className = 'prow';
        del.appendChild(miniButton('delete this key', 'remove it', () => {
          removeClipKey(c, view.key.bone, view.key.channel, key.t);
          view.key = null;
          edited('delete key');
        }));
        ui.insp.appendChild(del);
      }

      // --- The curve ---
      ui.insp.appendChild(sectionHead('curve'));
      const curveNote = document.createElement('div');
      curveNote.className = 'prow note';
      curveNote.textContent = view.key
        ? 'The value this channel actually takes across the clip, easing included.'
        : 'Select a key to plot its channel.';
      ui.insp.appendChild(curveNote);
      const curve = document.createElement('canvas');
      curve.className = 'curve';
      ui.insp.appendChild(curve);
      drawCurve(curve);

      // --- Blend preview ---
      ui.insp.appendChild(sectionHead('blend preview'));
      const others = [''].concat(Object.keys(pkg.clips || {})
        .filter((n) => n !== name && pkg.clips[n].model === c.model).sort());
      ui.insp.appendChild(paramRow('with', { type: 'enum', options: others, label: 'Against' },
        view.blendWith, (v) => { view.blendWith = v; dirtyKey = null; sync(); drawInspector(); }));
      if (view.blendWith) {
        ui.insp.appendChild(paramRow('mix', { type: 'number', min: 0, max: 1, step: 0.01, label: 'Mix' },
          view.blendMix, (v) => { view.blendMix = v; }));
        const bn = document.createElement('div');
        bn.className = 'prow note';
        bn.textContent = 'Both clips are sampled at the same PHASE, not the same second, so a one ' +
          'second walk compares against a three second idle the way a crossfade actually would.';
        ui.insp.appendChild(bn);
      }
    }

    /**
     * The key object the selection points at, or null if it has gone.
     * @returns {Object|null} - the key
     */
    function selectedKey() {
      const c = clip();
      if (!view.key || !c.tracks) return null;
      const track = c.tracks[view.key.bone];
      const keys = track && track[view.key.channel];
      if (!keys) return null;
      return keys.find((k) => Math.abs(k.t - view.key.t) < 1e-3) || null;
    }

    /**
     * Plots the selected channel's value across the whole clip.
     *
     * The actual sampled value, not an abstract easing shape: what an author wants to see is the
     * motion, and a curve that shows "easeOut" without showing what it eases between says nothing
     * about whether the arm arrives too fast.
     *
     * @param {HTMLCanvasElement} canvas - where to draw
     * @returns {void}
     */
    function drawCurve(canvas) {
      const w = ui.insp.clientWidth - 16, h = 84;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      const g = canvas.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);
      if (!view.key || !anim) return;

      const c = clip();
      const track = c.tracks && c.tracks[view.key.bone];
      const keys = track && track[view.key.channel];
      if (!keys || !keys.length) return;

      const dur = duration();
      const samples = Math.max(24, Math.min(240, Math.round(w)));
      const isRot = view.key.channel === 'rotation';
      const series = [[], [], []];
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i <= samples; i++) {
        const t = (i / samples) * dur;
        const local = anim.sampleLocal(name, view.key.bone, t);
        const v = isRot ? Alloy.quat.toEuler([], local.rotation)
          : view.key.channel === 'position' ? local.position : local.scale;
        for (let a = 0; a < 3; a++) {
          series[a].push(v[a]);
          lo = Math.min(lo, v[a]);
          hi = Math.max(hi, v[a]);
        }
      }
      if (!(hi > lo)) { hi = lo + 1; lo -= 1; }
      const pad = (hi - lo) * 0.12;
      lo -= pad; hi += pad;

      const css = getComputedStyle(document.documentElement);
      const colours = [css.getPropertyValue('--bad').trim() || '#ff6b6b',
                       '#6ee7a8',
                       css.getPropertyValue('--accent').trim() || '#63d2ff'];
      g.strokeStyle = css.getPropertyValue('--line').trim() || '#252d3a';
      g.strokeRect(0.5, 0.5, w - 1, h - 1);

      for (let a = 0; a < 3; a++) {
        g.strokeStyle = colours[a];
        g.beginPath();
        series[a].forEach((v, i) => {
          const x = (i / samples) * w;
          const y = h - ((v - lo) / (hi - lo)) * h;
          if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
        });
        g.stroke();
      }

      // The keys themselves, so the shape between them can be read against where they sit.
      g.fillStyle = css.getPropertyValue('--ink').trim() || '#dfe6ef';
      for (const k of keys) {
        const x = (k.t / dur) * w;
        g.fillRect(x - 1.5, 0, 3, 4);
      }
      // And the playhead.
      g.strokeStyle = css.getPropertyValue('--accent').trim() || '#63d2ff';
      g.beginPath();
      g.moveTo((view.time / dur) * w, 0);
      g.lineTo((view.time / dur) * w, h);
      g.stroke();
    }

    /**
     * Three numeric fields on one row.
     * @param {string} label - what it is
     * @param {number[]} value - the three numbers
     * @param {number} step - the spinner increment
     * @param {function(number[]): void} onChange - called with a new triple
     * @returns {void}
     */
    function vectorRow(label, value, step, onChange) {
      const row = document.createElement('div');
      row.className = 'prow';
      const lab = document.createElement('label');
      lab.textContent = label;
      const ctl = document.createElement('div');
      ctl.className = 'ctl';
      for (let i = 0; i < 3; i++) {
        const n = document.createElement('input');
        n.type = 'number';
        n.step = step;
        n.style.flex = '1 1 0';
        n.value = Math.round((value[i] || 0) * 1e4) / 1e4;
        n.addEventListener('input', () => {
          const v = parseFloat(n.value);
          if (!Number.isFinite(v)) return;
          const next = value.slice();
          next[i] = v;
          onChange(next);
        });
        ctl.appendChild(n);
      }
      row.append(lab, ctl);
      ui.insp.appendChild(row);
    }

    // --- The toolbar ---

    /**
     * Rebuilds the toolbar above the viewport.
     * @returns {void}
     */
    function drawTools() {
      ui.tools.innerHTML = '';
      const play = miniButton(view.playing ? 'stop' : 'play', 'run the clip (Space)', () => {
        view.playing = !view.playing;
        drawTools();
      });
      play.classList.toggle('on', view.playing);
      ui.tools.appendChild(play);
      ui.tools.appendChild(miniButton('|<', 'back to the start', () => {
        view.time = 0;
        drawTimeline();
        drawInspector();
      }));

      for (const mode of ['rotate', 'translate', 'scale']) {
        const b = miniButton(mode, mode + ' the selected bone (' + mode[0].toUpperCase() + ')', () => {
          view.mode = mode;
          drawTools();
        });
        b.classList.toggle('on', view.mode === mode);
        ui.tools.appendChild(b);
      }

      ui.tools.appendChild(miniButton('key', 'key the selected bone at the playhead (K)', () => {
        if (view.sel.length) keyBone(view.sel[0]);
        else log('<i>select a bone first</i>');
      }));

      const snap = miniButton('snap', 'round times to the frame grid', () => {
        view.snapping = !view.snapping;
        drawTools();
      });
      snap.classList.toggle('on', view.snapping);
      ui.tools.appendChild(snap);

      const fps = document.createElement('input');
      fps.type = 'number';
      fps.min = 1; fps.max = 120; fps.step = 1;
      fps.value = view.snapFrames;
      fps.title = 'frames per second the grid snaps to';
      fps.style.cssText = 'flex:0 0 52px;font:inherit;font-size:11px;color:var(--ink);' +
        'background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:1px 4px';
      fps.addEventListener('input', () => {
        const v = parseInt(fps.value, 10);
        if (Number.isFinite(v) && v > 0) view.snapFrames = v;
      });
      ui.tools.appendChild(fps);

      const onion = miniButton('onion', 'ghost the pose either side of the playhead', () => {
        view.onion = view.onion > 0 ? 0 : 0.12;
        drawTools();
      });
      onion.classList.toggle('on', view.onion > 0);
      ui.tools.appendChild(onion);

      const grid = miniButton('grid', 'show the ground grid', () => {
        if (vp) vp.showGrid = !vp.showGrid;
        drawTools();
      });
      grid.classList.toggle('on', !vp || vp.showGrid);
      ui.tools.appendChild(grid);
      ui.tools.appendChild(miniButton('frame', 'fit the camera to the model', () => {
        if (vp && built) vp.camera.frameBounds(built.bounds.min, built.bounds.max, 1.5);
      }));

      const info = document.createElement('span');
      info.style.color = 'var(--dim2)';
      info.style.marginLeft = '4px';
      const c = clip();
      const boneCount = Object.keys((c && c.tracks) || {}).length;
      info.textContent = view.sel.length ? view.sel[0] + ' selected · ' + boneCount + ' animated'
        : boneCount + ' bone' + (boneCount === 1 ? '' : 's') + ' animated';
      ui.tools.appendChild(info);
    }

    sync();
    bindTimeline();
    drawTools();
    drawTimeline();
    drawInspector();
    if (vp && built) vp.camera.frameBounds(built.bounds.min, built.bounds.max, 1.5);

    return {
      /**
       * Re-reads the clip from the package, after an undo or an edit elsewhere.
       * @returns {void}
       */
      refresh() {
        const c = clip();
        if (!c) return;
        view.time = clamp(view.time, 0, duration());
        if (view.key && !selectedKey()) view.key = null;
        dirtyKey = null;
        sync();
        drawTools();
        drawTimeline();
        drawInspector();
      },
      /**
       * Refits the timeline after the window changed size.
       * @returns {void}
       */
      onResize() { drawTimeline(); drawInspector(); },
      /**
       * The keys this editor claims while it has focus.
       * @param {KeyboardEvent} ev - the keydown
       * @returns {boolean} - true when it was consumed
       */
      onKey(ev) {
        if (ev.ctrlKey || ev.metaKey || ev.altKey) return false;
        const k = ev.key.toLowerCase();
        if (ev.key === ' ') { view.playing = !view.playing; drawTools(); return true; }
        if (k === 'k') { if (view.sel.length) keyBone(view.sel[0]); return true; }
        if (activeDrag) return false;
        if (k === 'w') { view.mode = 'translate'; drawTools(); return true; }
        if (k === 'e') { view.mode = 'rotate'; drawTools(); return true; }
        if (k === 'r') { view.mode = 'scale'; drawTools(); return true; }
        if (k === 'o') { view.onion = view.onion > 0 ? 0 : 0.12; drawTools(); return true; }
        if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
          const step = view.snapping && view.snapFrames > 0 ? 1 / view.snapFrames : 0.05;
          view.time = clamp(view.time + (ev.key === 'ArrowRight' ? step : -step), 0, duration());
          view.playing = false;
          drawTimeline();
          drawInspector();
          return true;
        }
        if ((ev.key === 'Delete' || ev.key === 'Backspace') && view.key) {
          removeClipKey(clip(), view.key.bone, view.key.channel, view.key.t);
          view.key = null;
          edited('delete key');
          return true;
        }
        return false;
      },
      /**
       * Lets go of the viewport.
       * @returns {void}
       */
      dispose() { if (vp) vp.dispose(); },
    };
  }

  //#endregion === Clip Editor ===


  // =====================================================================
  //           View Window — a texture on something with corners
  // =====================================================================
  //#region === View Window ===

  // *********************************************************************
  // MENTAL MODEL: this window answers one question a flat preview cannot — what does this
  // look like ON something, at an angle, under a light, turning. It shows whatever the rail has
  // selected: a texture wrapped on a cube or laid on a plate, next to itself where it tiles; a
  // material the same way, so an emissive or a cutout is seen lit rather than as a swatch; a
  // model turning on the spot, so a chair reads as a chair before anyone opens its editor.
  //
  // It edits nothing. The model editor is where a model is built and the texture editor is
  // where a texture is authored; this window follows the selection and stays out of the way.
  // *********************************************************************

  /**
   * Builds the preview window.
   * @param {HTMLElement} host - the window body
   * @returns {Object} - the editor
   */
  function makeViewEditor(host) {
    const state = {
      shape: 'cube',
      tex: null,        // the selected texture, or the selected material's, uploaded
      material: null,   // the selected material, resolved for a draw call
      built: null,      // the selected model, merged and uploaded
      matTex: {},       // the model's material textures
      key: null,        // what was last uploaded, so an unchanged selection uploads nothing
      subject: '',      // kind:name of what is shown
      wasModel: false,  // so leaving a model puts the camera back where the cube is
    };
    host.innerHTML =
      '<div class="tex">' +
        '<div class="tex-left" style="border:0">' +
          '<div class="tex-tools" data-ui="tools"></div>' +
          '<div data-ui="stage" style="flex:1 1 auto;min-height:0;position:relative"></div>' +
        '</div>' +
      '</div>';
    const ui = {};
    for (const el of host.querySelectorAll('[data-ui]')) ui[el.dataset.ui] = el;

    let cube = null, plate = null;
    const vp = makeViewport(ui.stage, {
      camera: { target: [0, 0.8, 0], distance: 5, yaw: 32, pitch: 18 },
      draw: (port) => {
        const mat4 = Alloy.mat4, quat = Alloy.quat;
        const q = quat.fromEuler([], 0, port.angle, 0);
        if (state.built) {
          port.engine.drawModel(state.built, mat4.compose(mat4.create(), [0, 0, 0], q, [1, 1, 1]),
            materialResolver(state.matTex));
          return;
        }
        if (!cube) return;
        const m = mat4.compose(mat4.create(), [0, state.shape === 'cube' ? 0.85 : 0.06, 0], q, [1, 1, 1]);
        port.engine.drawMesh(state.shape === 'cube' ? cube : plate, m,
          state.material || { color: [1, 1, 1], texture: state.tex });
      },
    });
    if (vp) {
      vp.spin = true;
      cube = vp.engine.makeMesh(Alloy.geometry.box({ width: 1.6, height: 1.6, depth: 1.6 }));
      plate = vp.engine.makeMesh(Alloy.geometry.box({ width: 2.6, height: 0.12, depth: 2.6 }));
    }

    /**
     * Uploads whatever is selected, if it changed.
     * @returns {void}
     */
    function sync() {
      if (!vp) return;
      const sel = selection;
      const kind = sel ? sel.kind : '';
      let t = null, material = null, model = null, key = null;
      if (kind === 'texture' && pkg.textures[sel.id]) {
        t = pkg.textures[sel.id];
        key = 'texture:' + sel.id + JSON.stringify(t);
      } else if (kind === 'material' && pkg.materials && pkg.materials[sel.id]) {
        material = pkg.materials[sel.id];
        t = material.texture ? pkg.textures[material.texture] || null : null;
        key = 'material:' + sel.id + JSON.stringify(material) + JSON.stringify(t);
      } else if (kind === 'model' && pkg.models && pkg.models[sel.id]) {
        model = pkg.models[sel.id];
        // A model shows its materials, which show their textures, so all three are in the key.
        key = 'model:' + sel.id + JSON.stringify(model) + JSON.stringify(pkg.materials) +
              Object.keys(pkg.textures).map((n) => n + JSON.stringify(pkg.textures[n])).join('');
      }
      if (key === state.key) return;
      state.key = key;
      const subject = key ? kind + ':' + sel.id : '';
      const newSubject = subject !== state.subject;
      state.subject = subject;

      if (state.tex) { vp.engine.disposeTexture(state.tex); state.tex = null; }
      if (state.built) { vp.engine.disposeModel(state.built); state.built = null; }
      state.material = null;
      try {
        if (model) {
          state.built = vp.engine.makeModel(model);
          state.matTex = uploadMaterialTextures(vp.engine, state.matTex);
          if (newSubject) vp.camera.frameBounds(state.built.bounds.min, state.built.bounds.max, 1.6);
          state.wasModel = true;
        } else {
          if (t) state.tex = vp.engine.makeTexture(texturePixels(t));
          if (material) {
            const lookup = {};
            if (state.tex) lookup[sel.id] = state.tex;
            state.material = materialResolver(lookup)(sel.id);
          }
          // Back from a model the camera is framed on it, which may be anywhere; the cube is
          // always at the origin, so put the camera back where it can see it.
          if (state.wasModel) vp.camera.reset();
          state.wasModel = false;
        }
      } catch (err) {
        logError(err);
      }
    }

    /**
     * Rebuilds the toolbar.
     * @returns {void}
     */
    function drawTools() {
      ui.tools.innerHTML = '';
      if (!state.built) {
        for (const shape of ['cube', 'plate']) {
          const b = miniButton(shape, 'show it on a ' + shape, () => {
            state.shape = shape;
            drawTools();
          });
          b.classList.toggle('on', state.shape === shape);
          ui.tools.appendChild(b);
        }
      }
      const spin = miniButton('spin', 'turn it', () => { if (vp) vp.spin = !vp.spin; drawTools(); });
      spin.classList.toggle('on', !vp || vp.spin);
      const grid = miniButton('grid', 'show the ground grid', () => {
        if (vp) vp.showGrid = !vp.showGrid;
        drawTools();
      });
      grid.classList.toggle('on', !vp || vp.showGrid);
      ui.tools.append(spin, grid);
      ui.tools.appendChild(miniButton('reset view', 'put the camera back', () => {
        if (!vp) return;
        if (state.built) vp.camera.frameBounds(state.built.bounds.min, state.built.bounds.max, 1.6);
        else vp.camera.reset();
      }));
      const label = document.createElement('span');
      label.style.color = 'var(--dim2)';
      label.style.marginLeft = '4px';
      label.textContent = state.subject
        ? state.subject.replace(':', ' · ')
        : 'select a texture, material or model in the rail';
      ui.tools.appendChild(label);
    }

    sync();
    drawTools();

    return {
      /**
       * Re-reads the selection.
       * @returns {void}
       */
      refresh() { sync(); drawTools(); },
      /**
       * Lets go of the viewport and everything uploaded to it.
       * @returns {void}
       */
      dispose() {
        if (!vp) return;
        if (state.tex) vp.engine.disposeTexture(state.tex);
        if (state.built) vp.engine.disposeModel(state.built);
        for (const k in state.matTex) vp.engine.disposeTexture(state.matTex[k]);
        vp.dispose();
      },
    };
  }

  //#endregion === View Window ===


  // =====================================================================
  //           Persistence — where a package lives
  // =====================================================================
  //#region === Persistence ===

  // *********************************************************************
  // MENTAL MODEL: EVERY FORM OF A PACKAGE IS THE SAME OBJECT; only the place differs. Browser
  // storage holds it, a `.alloy.json` file holds it, and a `managed-data` block in a game holds
  // it, and all three are `JSON.stringify` of the same thing. There is no ceremony around the
  // file format because there is no format: it is the package.
  //
  // THE LAST PLACE YOU SAVED IS THE HOME, which is what Ctrl+S means. A package fresh from New
  // has no home and Save asks where.
  //
  // Installing into a game file is deliberately NOT here; it is next door, in Export. That path
  // needs the OFCU splice discipline — scan the target, render the block for its indentation,
  // prove every byte outside the range is unchanged, validate, back up, write — and none of it
  // can happen from a web page against somebody else's file. What Export gives instead is the
  // exact text that path would write, on the clipboard, for pasting or for OFCU Manager to
  // install properly.
  // *********************************************************************

  const DB_NAME = 'alloy';
  const DB_STORE = 'projects';

  /**
   * Opens the IndexedDB database, creating the store on first use.
   * @returns {Promise<IDBDatabase>} - the database
   */
  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('IndexedDB refused to open'));
    });
  }

  /**
   * Runs one transaction against the project store.
   * @param {string} mode - 'readonly' or 'readwrite'
   * @param {function(IDBObjectStore): IDBRequest} fn - what to do with the store
   * @returns {Promise<*>} - the request's result
   */
  function withStore(mode, fn) {
    return openDb().then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, mode);
      const req = fn(tx.objectStore(DB_STORE));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }));
  }

  /**
   * Writes a package into browser storage.
   * @param {string} name - what to call it
   * @param {Object} p - the package
   * @returns {Promise<void>} - resolves when written
   */
  function storagePut(name, p) { return withStore('readwrite', (s) => s.put(JSON.stringify(p), name)); }

  /**
   * Lists what is in browser storage.
   * @returns {Promise<string[]>} - the names
   */
  function storageList() { return withStore('readonly', (s) => s.getAllKeys()); }

  /**
   * Reads one package out of browser storage.
   * @param {string} name - its name
   * @returns {Promise<Object>} - the package
   */
  function storageGet(name) { return withStore('readonly', (s) => s.get(name)).then((t) => JSON.parse(t)); }

  /**
   * Forgets one package.
   * @param {string} name - its name
   * @returns {Promise<void>} - resolves when gone
   */
  function storageDelete(name) { return withStore('readwrite', (s) => s.delete(name)); }

  let snapTimer = 0;

  /**
   * Keeps a crash-recovery copy in localStorage.
   *
   * Recovery only. The file or the browser-storage entry remains the truth: this exists so that a
   * closed tab and a crashed GPU process do not cost an afternoon, and it is cleared the moment a
   * real save happens.
   *
   * @returns {void}
   */
  function saveSnapshotSoon() {
    if (snapTimer) return;
    // On idle time, because the write is synchronous and proportional to the package — with a
    // few pasted PNGs it is megabytes — and it used to land a second and a half after the last
    // edit, exactly when the next one was starting. Skipped outright when nothing changed since
    // the last write.
    const later = window.requestIdleCallback
      ? (fn) => requestIdleCallback(fn, { timeout: 4000 }) : (fn) => setTimeout(fn, 1500);
    snapTimer = setTimeout(() => later(() => {
      snapTimer = 0;
      if (snapshotSavedGen === pkgGen) return;
      snapshotSavedGen = pkgGen;
      try {
        localStorage.setItem(SNAP_KEY, JSON.stringify({ at: Date.now(), pkg }));
      } catch (err) { /* a full quota is not worth interrupting anyone over */ }
    }), 1500);
  }
  let snapshotSavedGen = -1;

  /**
   * Saves to the current home, or asks for one.
   * @returns {void}
   */
  function save() {
    if (!home) { openSaveAsMenu(window.innerWidth / 2, 80); return; }
    if (home.kind === 'storage') {
      storagePut(home.name, pkg).then(() => {
        uiPrefs.lastStorage = home.name;
        savePrefs();
        markClean();
        try { localStorage.removeItem(SNAP_KEY); } catch (err) { /* fine */ }
        log('saved to browser storage as <em>' + escapeHtml(home.name) + '</em>');
      }, (err) => logError(err));
    } else if (home.kind === 'file') {
      writeFile(home.handle, pkg).then(() => {
        markClean();
        try { localStorage.removeItem(SNAP_KEY); } catch (err) { /* fine */ }
        log('saved to <em>' + escapeHtml(home.name) + '</em>');
      }, (err) => logError(err));
    }
  }

  /**
   * Writes the package into a file handle, or downloads it when the browser has no such API.
   * @param {Object|null} handle - a FileSystemFileHandle, or null to download
   * @param {Object} p - the package
   * @returns {Promise<void>} - resolves when written
   */
  function writeFile(handle, p) {
    const text = JSON.stringify(p, null, 2) + '\n';
    if (handle && handle.createWritable) {
      return handle.createWritable()
        .then((w) => w.write(text).then(() => w.close()));
    }
    // Firefox and Safari refuse the File System Access API on purpose, so the fallback is a
    // download. It is not a worse file, only a worse place: the browser picks where it lands.
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (p.name || 'package') + '.alloy.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return Promise.resolve();
  }

  /**
   * The Save-as menu: the three places a package can live.
   * @param {number} x - client x
   * @param {number} y - client y
   * @returns {void}
   */
  function openSaveAsMenu(x, y) {
    openMenu(x, y, 'Save as', [
      { label: 'Browser storage…', fn: () => {
        askText(x, y, 'Name it in browser storage', pkg.name || 'untitled', (name) => {
          // The home names the package (see histStep), so this is not an undo step.
          pkg.name = name;
          bumpPackage();
          home = { kind: 'storage', name };
          save();
          updateHeader();
        });
      } },
      { label: 'A file…', fn: saveToFile },
      { sep: true },
      { label: 'Export…', fn: () => openExportMenu(x, y) },
    ]);
  }

  /**
   * Saves to a file the person picks.
   * @returns {void}
   */
  function saveToFile() {
    const suggested = (pkg.name || 'package') + '.alloy.json';
    if (window.showSaveFilePicker) {
      window.showSaveFilePicker({
        suggestedName: suggested,
        types: [{ description: 'Alloy package', accept: { 'application/json': ['.json'] } }],
      }).then((handle) => {
        home = { kind: 'file', name: handle.name, handle };
        save();
        updateHeader();
      }, () => { /* the person cancelled the picker */ });
    } else {
      writeFile(null, pkg).then(() => {
        markClean();
        log('downloaded <em>' + escapeHtml(suggested) + '</em> — this browser cannot write in place');
      });
    }
  }

  /**
   * Copies the `managed-data` block a game file would carry.
   * @returns {void}
   */
  function copyDataBlock() {
    try {
      const text = Alloy.packageBlock(pkg, {
        project: pkg.name,
        changelog: ['Written by Alloy v' + Alloy.version + '. Textures: ' +
                    Object.keys(pkg.textures).join(', ') + '.'],
      });
      copyToClipboard(text, 'the data block');
    } catch (err) { logError(err); }
  }

  /**
   * Opens a package from a file.
   * @returns {void}
   */
  function openPackageFile() {
    if (window.showOpenFilePicker) {
      window.showOpenFilePicker({ types: [{ description: 'Alloy package', accept: { 'application/json': ['.json'] } }] })
        .then(([handle]) => handle.getFile().then((f) => f.text()).then((text) => {
          loadPackageText(text, { kind: 'file', name: handle.name, handle });
        }), () => { /* cancelled */ });
    } else {
      dom.fileIn.value = '';
      dom.fileIn.click();
    }
  }

  /**
   * Adopts a package from JSON text.
   * @param {string} text - the file's contents
   * @param {Object|null} nextHome - where it came from
   * @returns {void}
   */
  function loadPackageText(text, nextHome) {
    try {
      const parsed = JSON.parse(text);
      adoptPackage(parsed, { home: nextHome });
      log('opened <em>' + escapeHtml(parsed.name || 'package') + '</em> · ' +
          Object.keys(parsed.textures).length + ' textures');
    } catch (err) { logError(err); }
  }

  /**
   * The Projects menu, under the package's name.
   * @param {number} x - client x
   * @param {number} y - client y
   * @returns {void}
   */
  function openProjectsMenu(x, y) {
    const items = [
      { label: 'New package', fn: () => {
        const go = () => askText(x, y, 'Name the new package', 'untitled', (name) => {
          adoptPackage(Alloy.emptyPackage(name));
          log('new package <b>' + escapeHtml(name) + '</b>');
        });
        if (isDirty()) askConfirm(x, y, 'Discard unsaved changes and start a new package?', go);
        else go();
      } },
      { label: 'Open a file…', fn: openPackageFile },
      { label: 'Rename this package…', fn: () => {
        askText(x, y, 'Name this package', pkg.name || 'untitled', (name) => {
          // Not an undo step either: undo keeps the name (histStep). Dirty, though, because the
          // home has the old one until the next save.
          pkg.name = name;
          histTouch('rename package');
          updateHeader();
        });
      } },
      { sep: true },
    ];
    storageList().then((names) => {
      if (names.length) {
        items.push({ label: 'browser storage', head: true });
        for (const name of names) {
          items.push({ label: name, fn: () => {
            storageGet(name).then((p) => {
              adoptPackage(p, { home: { kind: 'storage', name } });
              log('opened <em>' + escapeHtml(name) + '</em> from browser storage');
            }, (err) => logError(err));
          } });
        }
        items.push({ sep: true });
      }
      items.push({ label: 'Export…', fn: () => openExportMenu(x, y) });
      openMenu(x, y, 'Package', items);
    }, () => {
      items.push({ label: 'Export…', fn: () => openExportMenu(x, y) });
      openMenu(x, y, 'Package', items);
    });
  }

  /**
   * Asks for a PNG and hands back its base64, with the data URL prefix removed.
   * @param {function(string): void} fn - called with the base64
   * @returns {void}
   */
  function pickImage(fn) {
    dom.imgIn.value = '';
    dom.imgIn.onchange = () => {
      const file = dom.imgIn.files && dom.imgIn.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const url = String(reader.result);
        const comma = url.indexOf(',');
        const base64 = comma >= 0 ? url.slice(comma + 1) : url;
        try {
          // Decoded here rather than at draw time so a file that is not really a PNG is refused
          // now, next to the button that took it, instead of silently blanking a layer later.
          Alloy.texture.decodePNG(base64);
        } catch (err) { logError(err); return; }
        fn(base64);
      };
      reader.readAsDataURL(file);
    };
    dom.imgIn.click();
  }

  /**
   * Imports a PNG file as a new texture with one raster layer.
   * @returns {void}
   */
  function importPngAsTexture() {
    pickImage((base64) => {
      try {
        const px = Alloy.texture.decodePNG(base64);
        const name = uniqueTextureName('imported');
        pkg.textures[name] = {
          name, width: px.width, height: px.height, seed: 1,
          layers: [{ type: 'raster', png: base64 }],
        };
        histTouch('import png');
        selection = { kind: 'texture', id: name };
        buildRail();
        openWindow('texture', name);
        log('imported <b>' + escapeHtml(name) + '</b> · ' + px.width + '×' + px.height);
      } catch (err) { logError(err); }
    });
  }
