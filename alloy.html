     * @property {number} time - the playhead, in seconds
     * @property {number} weight - how much of it lands in the pose, 0..1
     * @property {number} target - the weight it is fading toward
     * @property {number} fade - seconds remaining in the fade
     * @property {number} speed - a multiplier on time
     * @property {boolean} loop - whether it wraps
     * @property {boolean} pingPong - whether it reverses at the ends instead of wrapping
     * @property {boolean} additive - whether it adds its difference from rest instead of blending
     * @property {number} dir - 1 or -1, used by ping-pong
     * @property {boolean} done - true once a non-looping clip has finished and faded out
     */

    /**
     * Builds an animator for one model.
     *
     * Pure math with no GPU anywhere, which is how a walk cycle can be asserted about in Node. It
     * writes into a Float32Array the renderer happens to upload; it has never heard of a renderer.
     *
     * @param {Object} cfg - configuration
     * @param {Model} cfg.model - the model whose tree is being posed
     * @param {Array<Object>} cfg.bones - the bone list from mergeModel, slot 0 being the identity
     * @param {Object<string, Clip>} [cfg.clips] - clips by name
     * @returns {Object} - the animator
     */
    function makeAnimator(cfg) {
      if (!cfg || !cfg.model || !Array.isArray(cfg.bones)) {
        throw new Error('Alloy.makeAnimator: needs { model, bones } — bones come from mergeModel.');
      }
      const model = cfg.model;
      const bones = cfg.bones;
      const clips = {};
      for (const name in (cfg.clips || {})) {
        try {
          clips[name] = prepareClip(cfg.clips[name]);
        } catch (err) {
          throw new Error('Alloy.makeAnimator: clip "' + name + '" is unusable: ' + err.message);
        }
      }

      // --- The node index: every node, its rest transform decomposed, and where it sits ---
      const nodes = [];
      const byName = new Map();
      /**
       * @param {ModelNode} node - the node
       * @param {number} parent - the index of its parent, -1 at a root
       * @param {number} depth - guard against a cycle
       * @returns {void}
       */
      function walk(node, parent, depth) {
        if (depth > 64) throw new Error('Alloy.makeAnimator: the node tree is more than 64 deep.');
        const entry = {
          node, parent,
          name: node.name || '',
          // The REST pose, decomposed once. Everything downstream works in these three pieces
          // rather than in matrices, because blending a matrix is not a thing you can do.
          restPos: (node.position || [0, 0, 0]).slice(),
          restRot: nodeRotation([0, 0, 0, 1], node.rotation),
          restScale: (node.scale || [1, 1, 1]).slice(),
          pos: [0, 0, 0], rot: [0, 0, 0, 1], scale: [1, 1, 1],
          world: mat4.create(),
          bone: -1,
        };
        const at = nodes.length;
        nodes.push(entry);
        // First name wins. Two bones sharing a name is a model whose clips cannot say which they
        // mean, and silently animating the second one is worse than animating the first.
        if (entry.name && !byName.has(entry.name)) byName.set(entry.name, at);
        if (node.children) for (const c of node.children) walk(c, at, depth + 1);
      }
      for (const root of model.nodes) walk(root, -1, 0);

      // Bones are matched to nodes by NAME, which is what lets one clip drive any model whose
      // skeleton uses the same names. Slot 0 is the identity and belongs to no node.
      for (let i = 1; i < bones.length; i++) {
        const at = byName.get(bones[i].name);
        if (at !== undefined) nodes[at].bone = i;
      }

      /** @type {ClipState[]} everything currently contributing to the pose */
      const playing = [];
      /** @type {Array<function(Object): void>} event listeners */
      const listeners = [];
      /** @type {Map<string, Object>} per-bone look-at aims */
      const aims = new Map();
      /** @type {Map<string, Object>} per-bone springs */
      const springs = new Map();

      // Scratch, so a frame of animation allocates nothing.
      const sPos = [0, 0, 0], sRot = [0, 0, 0, 1], sScale = [1, 1, 1];
      const sDelta = [0, 0, 0, 1], sTmp = [0, 0, 0, 1];

      // Scratch for the look-at pass, which allocated seven arrays per aimed bone per frame.
      const sFrom = [0, 0, 0], sOrigin = [0, 0, 0], sTo = [0, 0, 0], sAxis = [0, 0, 0];
      const sPq = [0, 0, 0, 1], sPqInv = [0, 0, 0, 1], sTmp2 = [0, 0, 0, 1];
      const sMat = mat4.create(), sLocal = mat4.create();

      const api = {
        /** @type {Object<string, Clip>} the prepared clips, exposed so a UI can read durations */
        clips,
        /** @type {Array<Object>} the node index, for a workbench that wants to show the skeleton */
        nodes,

        /**
         * Starts a clip, optionally fading it in over the ones already playing.
         *
         * @param {string} name - which clip
         * @param {Object} [opts] - options
         * @param {boolean} [opts.loop] - override the clip's own loop flag
         * @param {boolean} [opts.pingPong] - reverse at the ends instead of wrapping
         * @param {number} [opts.speed] - a multiplier on time, default 1
         * @param {number} [opts.offset] - where to start, in seconds
         * @param {number} [opts.fade] - seconds to fade in, and to fade the others out
         * @param {number} [opts.weight] - the weight to reach, default 1
         * @param {boolean} [opts.additive] - add the difference from rest rather than blending
         * @returns {Object} - the clip state
         */
        play(name, opts) {
          const clip = clips[name];
          if (!clip) {
            throw new Error('Alloy animator: no clip called "' + name + '". Known clips: ' +
                            (Object.keys(clips).join(', ') || 'none') + '.');
          }
          const cfg2 = opts || {};
          const fade = cfg2.fade || 0;
          const weight = cfg2.weight === undefined ? 1 : cfg2.weight;

          // A clip already playing is retargeted rather than stacked. Playing "walk" twice should
          // be one walk, not two walks at half weight each drifting apart.
          let state = playing.find((p) => p.name === name && !p.done);
          if (!state) {
            state = { name, clip, time: 0, weight: fade > 0 ? 0 : weight, target: weight,
                      fade, speed: 1, loop: true, pingPong: false, additive: false, dir: 1,
                      done: false, lastTime: 0 };
            playing.push(state);
          }
          state.clip = clip;
          state.target = weight;
          state.fade = fade;
          if (fade <= 0) state.weight = weight;
          state.speed = cfg2.speed === undefined ? 1 : cfg2.speed;
          state.loop = cfg2.loop === undefined ? clip.loop : !!cfg2.loop;
          state.pingPong = !!cfg2.pingPong;
          state.additive = !!cfg2.additive;
          state.time = cfg2.offset === undefined ? 0 : cfg2.offset;
          state.lastTime = state.time;
          state.dir = 1;
          state.done = false;

          // Everything else that is not additive fades out over the same interval, which is what
          // "play this instead" means. Additive layers are left alone: a recoil layered over a
          // walk should survive the change from walk to run.
          if (!state.additive) {
            for (const other of playing) {
              if (other === state || other.additive) continue;
              other.target = 0;
              other.fade = fade;
              if (fade <= 0) other.weight = 0;
            }
          }
          return state;
        },

        /**
         * Crossfades to a clip. The reason this exists beside play() is that it reads as what it
         * does at the call site, which is most of what an API is for.
         * @param {string} name - which clip
         * @param {number} seconds - how long the crossfade takes
         * @param {Object} [opts] - anything play() takes
         * @returns {Object} - the clip state
         */
        blendTo(name, seconds, opts) {
          return api.play(name, Object.assign({}, opts, { fade: Math.max(0, seconds || 0) }));
        },

        /**
         * Fades a clip out, or everything when no name is given.
         * @param {string} [name] - which clip, or all of them
         * @param {number} [seconds] - the fade, immediate when omitted
         * @returns {void}
         */
        stop(name, seconds) {
          const fade = Math.max(0, seconds || 0);
          for (const p of playing) {
            if (name && p.name !== name) continue;
            p.target = 0;
            p.fade = fade;
            if (!fade) p.weight = 0;
          }
        },

        /**
         * Is a clip contributing anything, or about to?
         *
         * A clip that has just begun a crossfade has zero weight for one frame, and a clip that
         * is fading out still shows on screen. Both count: a caller asking "is the walk playing"
         * means "is it on its way in or out", not "is its weight above zero this instant" — and a
         * button that fails to light up when you press it is the visible form of the difference.
         *
         * @param {string} name - which clip
         * @returns {boolean} - true when it contributes now or is fading in
         */
        isPlaying(name) {
          return playing.some((p) => p.name === name && !p.done &&
            (p.weight > 0.0001 || p.target > 0.0001));
        },

        /**
         * What is playing right now, for a status line or a debug overlay.
         * @returns {Array<Object>} - `{name, time, weight, additive}` per live clip
         */
        state() {
          return playing.filter((p) => !p.done).map((p) => ({
            name: p.name, time: p.time, weight: p.weight,
            additive: p.additive, duration: p.clip.duration,
          }));
        },

        /**
         * Registers a listener for clip events.
         * @param {function(Object): void} fn - called with `{name, clip, t}`
         * @returns {function(): void} - call to stop listening
         */
        onEvent(fn) {
          listeners.push(fn);
          return function off() {
            const at = listeners.indexOf(fn);
            if (at >= 0) listeners.splice(at, 1);
          };
        },

        /**
         * Aims a bone at a world point, composed over whatever the clips are doing.
         *
         * @param {string} bone - the bone's name
         * @param {number[]|null} target - the world point, or null to stop aiming
         * @param {Object} [opts] - options
         * @param {number[]} [opts.axis] - the bone's local axis that should point at the target, default +Y
         * @param {number} [opts.weight] - 0 to 1, how much of the aim to apply
         * @param {number} [opts.maxAngle] - degrees the aim may turn the bone, default 80
         * @returns {void}
         */
        lookAt(bone, target, opts) {
          if (!target) { aims.delete(bone); return; }
          const o = opts || {};
          aims.set(bone, {
            target: target.slice(),
            axis: (o.axis || [0, 1, 0]).slice(),
            weight: o.weight === undefined ? 1 : o.weight,
            maxAngle: o.maxAngle === undefined ? 80 : o.maxAngle,
          });
        },

        /**
         * Kicks a bone, which then springs back. Recoil, impact, a head snapping round.
         *
         * The spring is critically damped by default: it returns without overshooting, which is
         * what almost everything physical does and what a wobble would have to be asked for.
         *
         * @param {string} bone - the bone's name
         * @param {number[]} axis - the axis to rotate about
         * @param {number} degrees - how hard
         * @param {Object} [opts] - `{stiffness, damping}`
         * @returns {void}
         */
        impulse(bone, axis, degrees, opts) {
          const o = opts || {};
          let s = springs.get(bone);
          if (!s) {
            s = { angle: 0, velocity: 0, axis: [0, 1, 0], stiffness: 120, damping: 0 };
            springs.set(bone, s);
          }
          s.axis = vec3.normalize([], axis);
          s.stiffness = o.stiffness === undefined ? 120 : o.stiffness;
          // Critical damping is 2*sqrt(k). Below it the spring rings; above it, it crawls home.
          s.damping = o.damping === undefined ? 2 * Math.sqrt(s.stiffness) : o.damping;
          s.velocity += degrees;
        },

        /**
         * Poses the model at an explicit set of clip times, without disturbing playback.
         *
         * This is what a timeline scrubs with, what a blend preview compares with, and what an
         * onion skin is drawn from. It deliberately skips the procedural layer: a look-at or a
         * spring is a runtime response to the world, and an author scrubbing a keyframe wants to
         * see what they authored, not what the world would do to it.
         *
         * @param {Array<Object>} specs - `{clip, time, weight, additive}`; clip is a name
         * @param {Float32Array} out - the bone matrix array to write
         * @returns {Float32Array} - out
         */
        poseAt(specs, out) {
          const list = [];
          for (const spec of specs || []) {
            const clip = clips[spec.clip];
            if (!clip) continue;
            list.push({
              clip, time: spec.time || 0,
              weight: spec.weight === undefined ? 1 : spec.weight,
              additive: !!spec.additive,
            });
          }
          buildPoseFrom(list);
          computeWorlds();
          writeDeltas(out);
          return out;
        },

        /**
         * What a clip says one bone's local transform is at a time.
         *
         * Falls back to the rest pose per CHANNEL, not per bone: a track that only animates
         * rotation must leave position and scale at rest rather than at zero, which is the
         * difference between a limb that turns and a limb that collapses to the origin.
         *
         * @param {string} clipName - which clip, or empty for the rest pose
         * @param {string} boneName - which bone
         * @param {number} time - when
         * @returns {Object|null} - `{position, rotation, scale}`, or null if the bone is unknown
         */
        sampleLocal(clipName, boneName, time) {
          const at = byName.get(boneName);
          if (at === undefined) return null;
          const n = nodes[at];
          const out = {
            position: n.restPos.slice(),
            rotation: n.restRot.slice(),
            scale: n.restScale.slice(),
          };
          const clip = clips[clipName];
          const track = clip && clip.tracks[boneName];
          if (!track) return out;
          if (track.position) sampleChannel(out.position, track.position, time, false);
          if (track.rotation) sampleChannel(out.rotation, track.rotation, time, true);
          if (track.scale) sampleChannel(out.scale, track.scale, time, false);
          return out;
        },

        /**
         * The bones this animator knows, in tree order, with their rest transforms.
         * @returns {Array<Object>} - `{name, index, restPos, restRot, restScale, parent}`
         */
        boneList() {
          return nodes.filter((n) => n.bone >= 0).map((n) => ({
            name: n.name, index: n.bone,
            restPos: n.restPos.slice(), restRot: n.restRot.slice(), restScale: n.restScale.slice(),
            parent: n.parent >= 0 ? nodes[n.parent].name : '',
          }));
        },

        /**
         * The world matrix a bone currently sits at, after the last pose.
         * @param {string} boneName - which bone
         * @returns {Float32Array|null} - its world matrix, or null
         */
        worldOf(boneName) {
          const at = byName.get(boneName);
          return at === undefined ? null : nodes[at].world;
        },

        /**
         * Advances time and writes the bone deltas.
         *
         * @param {number} dt - seconds since the last call
         * @param {Float32Array} out - the bone matrix array, 16 floats per bone
         * @returns {Float32Array} - out
         */
        update(dt, out) {
          advanceClips(dt);
          buildPose();
          applyProcedural(dt);
          computeWorlds();
          writeDeltas(out);
          return out;
        },
      };

      /**
       * Moves every playing clip's time on, fades weights, and fires events.
       * @param {number} dt - seconds
       * @returns {void}
       */
      function advanceClips(dt) {
        for (let i = playing.length - 1; i >= 0; i--) {
          const p = playing[i];
          const dur = p.clip.duration;

          if (p.fade > 0) {
            const step = Math.min(1, dt / p.fade);
            p.weight += (p.target - p.weight) * step;
            p.fade -= dt;
            if (p.fade <= 0) p.weight = p.target;
          } else {
            p.weight = p.target;
          }

          const before = p.time;
          // The un-wrapped end of this step, kept because the wrapped time cannot say whether the
          // playhead lapped: a step of 1.5 seconds on a one-second clip ends at 0.5, which looks
          // exactly like a step that never reached the end at all.
          const advance = dt * p.speed * p.dir;
          const rawEnd = before + advance;
          p.time = rawEnd;

          if (p.pingPong) {
            // Reflecting rather than wrapping. Done with a loop so a very large dt cannot walk
            // past both ends and leave the playhead outside the clip.
            while (p.time > dur || p.time < 0) {
              if (p.time > dur) { p.time = dur - (p.time - dur); p.dir = -1; }
              if (p.time < 0) { p.time = -p.time; p.dir = 1; }
            }
          } else if (p.loop) {
            if (dur > 0) p.time = ((p.time % dur) + dur) % dur;
          } else if (p.time >= dur) {
            p.time = dur;
            // A one-shot that has reached its end fades out rather than snapping off, so the
            // pose it was holding hands back to whatever is underneath.
            if (p.target > 0) { p.target = 0; p.fade = Math.max(p.fade, 0.12); }
          }

          fireEvents(p, before, rawEnd, advance);

          if (p.target === 0 && p.weight <= 0.0001) {
            p.done = true;
            playing.splice(i, 1);
          }
        }
      }

      /**
       * Fires any event markers the playhead crossed.
       *
       * Crossing rather than proximity: an event at 0.25s must fire exactly once per pass however
       * fast the clip is playing, and a test of "is the playhead near 0.25" fires several times at
       * a low speed and not at all at a high one.
       *
       * @param {ClipState} p - the clip state
       * @param {number} from - the playhead before this step
       * @param {number} rawEnd - where it ended before any wrapping
       * @param {number} advance - the signed time moved, which says whether it lapped
       * @returns {void}
       */
      function fireEvents(p, from, rawEnd, advance) {
        const events = p.clip.events;
        if (!events.length || !listeners.length || p.weight <= 0.0001) return;
        const dur = p.clip.duration;

        /**
         * Tells every listener about one marker.
         * @param {Object} ev - the marker
         * @returns {void}
         */
        function fire(ev) {
          for (const fn of listeners) fn({ name: ev.name, clip: p.name, t: ev.t, data: ev.data });
        }

        // A step that swallows the whole clip fires each marker ONCE, not once per lap. A frame
        // that took a second is a stall or a tab coming back from the background, and a footstep
        // sound firing eleven times is worse than a footstep sound firing once.
        if (Math.abs(advance) >= dur) {
          for (const ev of events) fire(ev);
          return;
        }

        const forward = advance >= 0;
        for (const ev of events) {
          let crossed;
          if (forward) {
            crossed = rawEnd <= dur
              ? (ev.t > from && ev.t <= rawEnd)
              : (ev.t > from || ev.t <= rawEnd - dur);      // it lapped
          } else {
            crossed = rawEnd >= 0
              ? (ev.t < from && ev.t >= rawEnd)
              : (ev.t < from || ev.t >= rawEnd + dur);
          }
          if (crossed) fire(ev);
        }
      }

      /**
       * Resets every node to its rest pose and blends the playing clips into it.
       * @returns {void}
       */
      function buildPose() { buildPoseFrom(playing); }

      /**
       * Blends an explicit list of clip-at-a-time into the pose.
       *
       * Split out from buildPose so the same code serves playback, scrubbing a timeline, a blend
       * preview and an onion skin. A workbench asking for "this clip at 0.4 seconds" is the same
       * question a playing clip asks; only where the numbers come from differs.
       *
       * @param {Array<Object>} list - `{clip, time, weight, additive}` entries
       * @returns {void}
       */
      function buildPoseFrom(list) {
        for (const n of nodes) {
          vec3.copy(n.pos, n.restPos);
          quat.copy(n.rot, n.restRot);
          vec3.copy(n.scale, n.restScale);
          n.acc = 0;
        }

        // Normal clips first, blended by weight; then additive ones on top. Two passes rather
        // than one because an additive layer adds to the blended result, not to a partial one.
        for (const pass of [false, true]) {
          for (const p of list) {
            if (p.additive !== pass || p.weight <= 0.0001) continue;
            for (const boneName in p.clip.tracks) {
              const at = byName.get(boneName);
              if (at === undefined) continue;
              const n = nodes[at];
              const track = p.clip.tracks[boneName];
              if (pass) applyAdditive(n, track, p);
              else applyBlend(n, track, p);
            }
          }
        }
      }

      /**
       * Blends one track into a node's pose by weight.
       * @param {Object} n - the node entry
       * @param {Object} track - the prepared track
       * @param {ClipState} p - the clip state
       * @returns {void}
       */
      function applyBlend(n, track, p) {
        // An incremental weighted mean: each contribution lands at its share of the total so far,
        // which gives the same answer as normalizing at the end without needing a second pass.
        const acc = n.acc || 0;
        const k = acc + p.weight > 0 ? p.weight / (acc + p.weight) : 0;
        if (track.position) {
          sampleChannel(sPos, track.position, p.time, false);
          vec3.lerp(n.pos, n.pos, sPos, k);
        }
        if (track.scale) {
          sampleChannel(sScale, track.scale, p.time, false);
          vec3.lerp(n.scale, n.scale, sScale, k);
        }
        if (track.rotation) {
          sampleChannel(sRot, track.rotation, p.time, true);
          quat.slerp(n.rot, n.rot, sRot, k);
        }
        n.acc = acc + p.weight;
      }

      /**
       * Adds a track's difference from rest on top of a node's pose.
       * @param {Object} n - the node entry
       * @param {Object} track - the prepared track
       * @param {ClipState} p - the clip state
       * @returns {void}
       */
      function applyAdditive(n, track, p) {
        if (track.position) {
          sampleChannel(sPos, track.position, p.time, false);
          for (let c = 0; c < 3; c++) n.pos[c] += (sPos[c] - n.restPos[c]) * p.weight;
        }
        if (track.scale) {
          sampleChannel(sScale, track.scale, p.time, false);
          for (let c = 0; c < 3; c++) n.scale[c] += (sScale[c] - n.restScale[c]) * p.weight;
        }
        if (track.rotation) {
          sampleChannel(sRot, track.rotation, p.time, true);
          // The difference from rest, scaled by weight, applied after the base pose. Slerping
          // from the identity is how a rotation gets multiplied by a fraction.
          quat.multiply(sDelta, quat.conjugate(sTmp, n.restRot), sRot);
          quat.slerp(sDelta, [0, 0, 0, 1], sDelta, p.weight);
          quat.multiply(n.rot, n.rot, sDelta);
        }
      }

      //#endregion === Animator ===

      /**
       * Applies look-at aims and springs on top of the blended pose.
       * @param {number} dt - seconds, for the springs
       * @returns {void}
       */
      function applyProcedural(dt) {
        // The springs first: they are a local rotation and need no world knowledge.
        for (const [boneName, s] of springs) {
          const at = byName.get(boneName);
          // A critically damped harmonic oscillator, integrated semi-implicitly: velocity first,
          // then position. The explicit form gains energy at large steps and a recoil that should
          // settle instead grows until the arm spins.
          s.velocity += (-s.stiffness * s.angle - s.damping * s.velocity) * dt;
          s.angle += s.velocity * dt;
          if (Math.abs(s.angle) < 1e-3 && Math.abs(s.velocity) < 1e-3) {
            s.angle = 0; s.velocity = 0;
            springs.delete(boneName);
            continue;
          }
          if (at === undefined) continue;
          quat.fromAxisAngle(sDelta, s.axis, s.angle);
          quat.multiply(nodes[at].rot, nodes[at].rot, sDelta);
        }

        if (!aims.size) return;
        // An aim needs the bone's world transform, which needs the tree walked. Doing it here and
        // again after means one extra pass in the rare frame that has an aim, rather than every
        // frame paying for a feature it is not using.
        computeWorlds();
        for (const [boneName, aim] of aims) {
          const at = byName.get(boneName);
          if (at === undefined) continue;
          const n = nodes[at];

          // Where the bone's chosen axis points now, and where it should point. Scratch vectors,
          // because a head that tracks the player does this every frame for the whole game.
          const from = vec3.normalize(sFrom, vec3.transformDir(sFrom, aim.axis, n.world));
          sOrigin[0] = n.world[12]; sOrigin[1] = n.world[13]; sOrigin[2] = n.world[14];
          const to = vec3.sub(sTo, aim.target, sOrigin);
          if (vec3.sqrLen(to) < 1e-12) continue;
          vec3.normalize(to, to);

          const dot = clamp(vec3.dot(from, to), -1, 1);
          let angle = Math.acos(dot) * RAD2DEG;
          if (angle < 1e-4) continue;
          const axis = vec3.cross(sAxis, from, to);
          if (vec3.sqrLen(axis) < 1e-12) continue;      // exactly opposite: no unique way round
          vec3.normalize(axis, axis);
          // Clamped so a head does not turn all the way round to follow something behind it.
          angle = Math.min(angle, aim.maxAngle) * clamp(aim.weight, 0, 1);

          // The turn is in world space; the node's rotation is in its parent's. Converting it
          // through the parent is what keeps an aimed bone aimed while its parent moves.
          quat.fromAxisAngle(sDelta, axis, angle);
          const parent = n.parent >= 0 ? nodes[n.parent] : null;
          if (parent) {
            const pq = quat.normalize(sPq, matToQuat(sTmp, parent.world));
            quat.multiply(sDelta, quat.multiply(sTmp2, quat.conjugate(sPqInv, pq), sDelta), pq);
          }
          quat.multiply(n.rot, sDelta, n.rot);
        }
      }

      /**
       * Walks the tree once, turning every node's posed local transform into a world matrix.
       * @returns {void}
       */
      function computeWorlds() {
        for (const n of nodes) {
          mat4.compose(sLocal, n.pos, n.rot, n.scale);
          if (n.parent < 0) mat4.copy(n.world, sLocal);
          // Parents always precede their children in the index, because it was built by walking
          // the tree depth first. That is what makes one forward pass enough.
          else mat4.multiply(n.world, nodes[n.parent].world, sLocal);
        }
      }

      /**
       * Writes each bone's delta into the matrix array the shader reads.
       * @param {Float32Array} out - 16 floats per bone
       * @returns {void}
       */
      function writeDeltas(out) {
        // Slot 0 is the identity, always, and belongs to no node.
        mat4.identity(sMat);
        out.set(sMat, 0);
        for (const n of nodes) {
          if (n.bone < 0) continue;
          mat4.multiply(sMat, n.world, bones[n.bone].invRest);
          out.set(sMat, n.bone * 16);
        }
      }

      return api;
    }

    /**
     * Pulls the rotation out of a transform, ignoring its scale.
     *
     * Shepperd's method: pick whichever of the four components the trace says is largest and solve
     * from there. The naive formula divides by something near zero for a rotation of about 180
     * degrees and produces a quaternion of infinities, which is a limb that vanishes at exactly
     * one angle and nowhere else.
     *
     * @param {number[]} out - destination quaternion
     * @param {Float32Array} m - the matrix
     * @returns {number[]} - out
     */
    function matToQuat(out, m) {
      // Normalize the basis first, or a scaled node's rotation comes out scaled too.
      const sx = Math.hypot(m[0], m[1], m[2]) || 1;
      const sy = Math.hypot(m[4], m[5], m[6]) || 1;
      const sz = Math.hypot(m[8], m[9], m[10]) || 1;
      const m00 = m[0] / sx, m01 = m[1] / sx, m02 = m[2] / sx;
      const m10 = m[4] / sy, m11 = m[5] / sy, m12 = m[6] / sy;
      const m20 = m[8] / sz, m21 = m[9] / sz, m22 = m[10] / sz;

      const trace = m00 + m11 + m22;
      if (trace > 0) {
        const s = Math.sqrt(trace + 1) * 2;
        out[3] = 0.25 * s;
        out[0] = (m12 - m21) / s;
        out[1] = (m20 - m02) / s;
        out[2] = (m01 - m10) / s;
      } else if (m00 > m11 && m00 > m22) {
        const s = Math.sqrt(1 + m00 - m11 - m22) * 2;
        out[3] = (m12 - m21) / s;
        out[0] = 0.25 * s;
        out[1] = (m10 + m01) / s;
        out[2] = (m20 + m02) / s;
      } else if (m11 > m22) {
        const s = Math.sqrt(1 + m11 - m00 - m22) * 2;
        out[3] = (m20 - m02) / s;
        out[0] = (m10 + m01) / s;
        out[1] = 0.25 * s;
        out[2] = (m21 + m12) / s;
      } else {
        const s = Math.sqrt(1 + m22 - m00 - m11) * 2;
        out[3] = (m01 - m10) / s;
        out[0] = (m20 + m02) / s;
        out[1] = (m21 + m12) / s;
        out[2] = 0.25 * s;
      }
      return quat.normalize(out, out);
    }

    /**
     * Makes an empty clip for a model: one second, looping, no tracks.
     * @param {string} name - the clip's name
     * @param {string} modelName - which model's bones it will name
     * @returns {Clip} - a new clip
     */
    function emptyClip(name, modelName) {
      return { name, model: modelName || '', duration: 1, loop: true, tracks: {}, events: [] };
    }

    //#endregion === Animation ===



    // =====================================================================
    //           Texture — an instruction set that becomes pixels
    // =====================================================================
    //#region === Texture ===

    // *********************************************************************
    // MENTAL MODEL: A TEXTURE IS NOT AN IMAGE. It is an ordered stack of LAYERS — a recipe —
    // and the pixels are what you get when you run it. There is no separate "static texture"
    // type anywhere in this engine: a hand-painted poster is a stack with one raster layer, and
    // it goes through exactly the same evaluator as a procedural brick wall.
    //
    // That single idea is what makes the no-asset-files rule survivable. A game file carries a
    // few hundred bytes of JSON saying "perlin, these octaves, this seed, tinted, with bricks
    // multiplied over it" and computes a wall on load. It also means a texture is EDITABLE
    // forever: nothing is ever flattened behind your back, so the seed that made a wall is still
    // there three months later when the wall needs to be a different colour.
    //
    // Two rules hold the whole thing up, and both are load-bearing:
    //
    //   DETERMINISM. The same JSON produces the same pixels, on every machine, forever. So
    //   randomness is a hash of coordinates and a seed, never a stateful generator whose output
    //   depends on how many times it has been called. Nothing here reads a clock, and the
    //   evaluation path avoids transcendental functions, which are the one part of IEEE-754 that
    //   implementations are allowed to disagree about.
    //
    //   NO CANVAS. Evaluation is pure JavaScript over a Float32Array. It never touches
    //   CanvasRenderingContext2D, which would tie textures to a browser, make output depend on
    //   somebody's antialiasing, and put a whole category of bug beyond the reach of a test. The
    //   consequence is that this section carries its own rasterizer, its own font and its own PNG
    //   codec, which is more code and exactly the right trade: every pixel in this engine can be
    //   asserted about in Node.
    //
    // Buffers are Float32Array RGBA in 0..1 with STRAIGHT (non-premultiplied) alpha, converted to
    // bytes only at the very end. Twelve layers of 8-bit rounding is visible banding; twelve
    // layers of float is not.
    // *********************************************************************

    // *********************************************************************
    //           Pixels — the buffer everything writes into
    // *********************************************************************
    //#region === Pixels ===

    /**
     * @typedef {Object} Pixels
     * @property {number} width - width in pixels
     * @property {number} height - height in pixels
     * @property {Float32Array} data - RGBA, 4 floats per pixel, 0..1, straight alpha, row 0 on top
     */

    // The largest texture this engine will build. Not a GPU limit — a mistake limit. A stray zero
    // in a JSON file asking for a 65536-square texture is 16GB of Float32Array and a dead tab,
    // and the difference between that and an error message is this constant.
    const MAX_TEXTURE_SIZE = 4096;

    /**
     * Allocates a pixel buffer.
     *
     * Row 0 is the TOP row, which is the image convention every drawing tool and every person
     * uses. The GL upload flips it, so texture coordinate v = 0 samples the bottom of the image
     * and a texture applied to a wall is the right way up.
     *
     * @param {number} width - width in pixels
     * @param {number} height - height in pixels
     * @param {number[]} [fill] - rgba to fill with, transparent black when omitted
     * @returns {Pixels} - a new buffer
     */
    function makePixels(width, height, fill) {
      if (!Number.isInteger(width) || !Number.isInteger(height) || width < 1 || height < 1) {
        throw new Error('Alloy texture: size must be whole numbers of at least 1, got ' +
                        width + ' by ' + height + '.');
      }
      if (width > MAX_TEXTURE_SIZE || height > MAX_TEXTURE_SIZE) {
        throw new Error('Alloy texture: ' + width + ' by ' + height + ' is past the ' +
                        MAX_TEXTURE_SIZE + ' pixel limit. That is almost always a typo; raise ' +
                        'MAX_TEXTURE_SIZE if it genuinely is not.');
      }
      const px = { width, height, data: new Float32Array(width * height * 4) };
      if (fill) fillPixels(px, fill);
      return px;
    }

    /**
     * Fills a whole buffer with one colour.
     * @param {Pixels} px - the buffer
     * @param {number[]} rgba - colour, rgb or rgba; alpha defaults to 1
     * @returns {Pixels} - px
     */
    function fillPixels(px, rgba) {
      const r = rgba[0], g = rgba[1], b = rgba[2], a = rgba.length > 3 ? rgba[3] : 1;
      const d = px.data;
      for (let i = 0; i < d.length; i += 4) { d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = a; }
      return px;
    }

    /**
     * Copies a pixel buffer.
     * @param {Pixels} px - source
     * @returns {Pixels} - a new buffer with the same contents
     */
    function clonePixels(px) {
      return { width: px.width, height: px.height, data: new Float32Array(px.data) };
    }

    /**
     * Converts a float buffer to 8-bit RGBA, which is what the GPU and PNG both want.
     * @param {Pixels} px - source
     * @returns {Uint8ClampedArray} - RGBA bytes, row 0 on top
     */
    function pixelsToBytes(px) {
      const d = px.data, out = new Uint8ClampedArray(d.length);
      // Rounding, not truncation. Truncating costs half a level on every channel, which is
      // invisible once and a measurable darkening after a stack of bakes.
      for (let i = 0; i < d.length; i++) out[i] = Math.round(d[i] * 255);
      return out;
    }

    /**
     * Wraps 8-bit RGBA back into a float buffer.
     * @param {Uint8ClampedArray|Uint8Array} bytes - RGBA bytes, row 0 on top
     * @param {number} width - width in pixels
     * @param {number} height - height in pixels
     * @returns {Pixels} - a new buffer
     */
    function pixelsFromBytes(bytes, width, height) {
      if (bytes.length !== width * height * 4) {
        throw new Error('Alloy texture: ' + bytes.length + ' bytes is not ' + width + ' by ' +
                        height + ' RGBA (' + (width * height * 4) + ' expected).');
      }
      const px = makePixels(width, height);
      for (let i = 0; i < bytes.length; i++) px.data[i] = bytes[i] / 255;
      return px;
    }

    //#endregion === Pixels ===


    // *********************************************************************
    //           Random — hashed, seeded, and stateless
    // *********************************************************************
    //#region === Random ===

    // *********************************************************************
    // MENTAL MODEL: RANDOMNESS HERE IS A PURE FUNCTION OF COORDINATES, never a sequence. Ask for
    // the value at pixel (91, 17) and you get the same number whether it is the first pixel
    // evaluated or the last, whether the layer above it exists, and whether anything else in the
    // texture changed.
    //
    // A stateful generator — even a seeded one — cannot promise that. Its output at a given pixel
    // depends on how many times it has been called, so inserting a layer that consumes one extra
    // number reshuffles everything below it. Authors experience that as "I nudged the mortar
    // width and the whole wall changed", and there is no way to explain it that makes it stop
    // being infuriating.
    //
    // So every generator hashes (x, y, seed) and reads its randomness out of the hash. The only
    // stateful RNG in this file is `makeRng`, which exists for the few places that genuinely want
    // a sequence — a per-brick jitter walked in a fixed order, an atlas shuffle — and it is never
    // used per pixel.
    // *********************************************************************

    /**
     * Mixes a 32-bit integer into a well-distributed 32-bit integer. This is splitmix32's
     * finalizer: three shift-xor-multiply rounds, which is enough avalanche that flipping one
     * input bit changes about half the output bits.
     *
     * Everything random in this section is built on this one function, so it is worth saying what
     * "good enough" means: the failure mode of a weak hash is not statistical, it is VISIBLE.
     * Correlated neighbouring cells show up as diagonal streaks in value noise and as a plaid in
     * anything cellular, and once you have seen it you cannot unsee it.
     *
     * @param {number} x - any 32-bit integer
     * @returns {number} - a well-mixed unsigned 32-bit integer
     */
    function hash32(x) {
      x = x | 0;
      x = Math.imul(x ^ (x >>> 16), 0x21f0aaad);
      x = Math.imul(x ^ (x >>> 15), 0x735a2d97);
      x = x ^ (x >>> 15);
      return x >>> 0;
    }

    /**
     * Hashes two coordinates and a seed into a 32-bit integer.
     * @param {number} x - first coordinate, integer
     * @param {number} y - second coordinate, integer
     * @param {number} seed - the seed
     * @returns {number} - unsigned 32-bit
     */
    function hash2(x, y, seed) {
      // The odd multipliers are large primes, so two coordinates cannot collide by being small
      // multiples of each other -- which is exactly the case a texture is full of.
      return hash32(Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ (seed | 0));
    }

    /**
     * Hashes two coordinates and a seed into a float in [0, 1).
     * @param {number} x - first coordinate, integer
     * @param {number} y - second coordinate, integer
     * @param {number} seed - the seed
     * @returns {number} - a value in [0, 1)
     */
    function hash2f(x, y, seed) { return hash2(x, y, seed) / 4294967296; }

    /**
     * Makes a stateful pseudo-random sequence. For ordered walks only — never per pixel, for the
     * reason in the mental model above.
     * @param {number} seed - the starting seed
     * @returns {function(): number} - call for the next value in [0, 1)
     */
    function makeRng(seed) {
      let s = (seed | 0) >>> 0;
      return function next() {
        s = (s + 0x9e3779b9) >>> 0;      // the golden-ratio increment splitmix walks by
        return hash32(s) / 4294967296;
      };
    }

    //#endregion === Random ===


    // *********************************************************************
    //           Noise — value, perlin and worley, all of them tileable
    // *********************************************************************
    //#region === Noise ===

    // *********************************************************************
    // MENTAL MODEL: EVERY NOISE FUNCTION HERE TILES, and that is not a bonus feature. A texture
    // goes on a model and wraps; noise that does not tile puts a visible seam down every wall in
    // the game, and no amount of authoring hides it.
    //
    // Tiling costs one line: the integer lattice coordinate is taken modulo a PERIOD before it is
    // hashed, so the lattice on the left edge is literally the same lattice as the right. The
    // period is in lattice cells, so a period of 4 over a 128 pixel texture means the pattern
    // repeats every 32 pixels within the texture, and the texture itself repeats seamlessly.
    //
    // For fractal noise, each octave doubles the period along with the frequency. That keeps
    // every octave tiling over the SAME domain, which is the whole trick — an octave whose period
    // did not double would seam on its own and take the sum with it.
    // *********************************************************************

    // Eight unit-ish gradients for perlin: the four axes and the four diagonals. Using a small
    // fixed set rather than a random direction per lattice point is the standard choice, and it
    // is faster and looks the same.
    const PERLIN_GRADS = [
      [1, 0], [-1, 0], [0, 1], [0, -1],
      [0.70710678, 0.70710678], [-0.70710678, 0.70710678],
      [0.70710678, -0.70710678], [-0.70710678, -0.70710678],
    ];

    /**
     * Wraps an integer into [0, period), correctly for negatives.
     * @param {number} v - the value
     * @param {number} period - the period, at least 1
     * @returns {number} - v modulo period, never negative
     */
    function wrapInt(v, period) {
      const m = v % period;
      return m < 0 ? m + period : m;
    }

    /**
     * The quintic smoothstep 6t^5 - 15t^4 + 10t^3.
     *
     * Perlin's original cubic (3t^2 - 2t^3) has a discontinuous second derivative at the lattice
     * points, which shows up as faint grid-aligned creases once the noise is used as a height or
     * a normal. The quintic is flat to the second derivative at both ends and the creases go away.
     *
     * @param {number} t - interpolant in 0..1
     * @returns {number} - the eased value
     */
    function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }

    /**
     * Tileable value noise: a random value per lattice point, smoothly interpolated.
     *
     * Blobbier and softer than perlin because the extremes land ON the lattice points rather than
     * between them. That makes it the better base for clouds, rust and dirt, and the worse one
     * for anything that should look like it has a direction.
     *
     * @param {number} x - x in lattice units
     * @param {number} y - y in lattice units
     * @param {number} periodX - lattice cells before the pattern repeats across
     * @param {number} periodY - lattice cells before the pattern repeats down
     * @param {number} seed - the seed
     * @returns {number} - a value in 0..1
     */
    function valueNoise2(x, y, periodX, periodY, seed) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const tx = fade(x - xi), ty = fade(y - yi);
      const x0 = wrapInt(xi, periodX), x1 = wrapInt(xi + 1, periodX);
      const y0 = wrapInt(yi, periodY), y1 = wrapInt(yi + 1, periodY);

      const v00 = hash2f(x0, y0, seed), v10 = hash2f(x1, y0, seed);
      const v01 = hash2f(x0, y1, seed), v11 = hash2f(x1, y1, seed);

      const a = v00 + (v10 - v00) * tx;
      const b = v01 + (v11 - v01) * tx;
      return a + (b - a) * ty;
    }

    /**
     * Tileable perlin noise: a random gradient per lattice point, dotted with the offset.
     *
     * Returns 0..1, remapped from perlin's natural range. The natural range of 2D perlin is
     * bounded by +/-sqrt(2)/2, NOT +/-1, and scaling by the wrong one is why so much perlin looks
     * washed out and never reaches black or white.
     *
     * @param {number} x - x in lattice units
     * @param {number} y - y in lattice units
     * @param {number} periodX - lattice cells before the pattern repeats across
     * @param {number} periodY - lattice cells before the pattern repeats down
     * @param {number} seed - the seed
     * @returns {number} - a value in 0..1, centred on 0.5
     */
    function perlin2(x, y, periodX, periodY, seed) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const fx = x - xi, fy = y - yi;
      const tx = fade(fx), ty = fade(fy);
      const x0 = wrapInt(xi, periodX), x1 = wrapInt(xi + 1, periodX);
      const y0 = wrapInt(yi, periodY), y1 = wrapInt(yi + 1, periodY);

      const g00 = PERLIN_GRADS[hash2(x0, y0, seed) & 7];
      const g10 = PERLIN_GRADS[hash2(x1, y0, seed) & 7];
      const g01 = PERLIN_GRADS[hash2(x0, y1, seed) & 7];
      const g11 = PERLIN_GRADS[hash2(x1, y1, seed) & 7];

      const n00 = g00[0] * fx + g00[1] * fy;
      const n10 = g10[0] * (fx - 1) + g10[1] * fy;
      const n01 = g01[0] * fx + g01[1] * (fy - 1);
      const n11 = g11[0] * (fx - 1) + g11[1] * (fy - 1);

      const a = n00 + (n10 - n00) * tx;
      const b = n01 + (n11 - n01) * tx;
      const v = a + (b - a) * ty;
      // 0.7071 is sqrt(2)/2, the bound of 2D perlin with unit gradients.
      return clamp(v * 0.70710678 + 0.5, 0, 1);
    }

    /**
     * Tileable worley (cellular) noise: distance to scattered feature points.
     *
     * Returns the two nearest distances and the cell id of the nearest, because the interesting
     * results are combinations. F1 alone is bubbles; F2 minus F1 is the ridge BETWEEN cells,
     * which is cracked mud, stained glass and paving; and the id is what lets every cell take its
     * own colour, which is what turns a tile pattern into a tile pattern somebody would use.
     *
     * @param {number} x - x in cell units
     * @param {number} y - y in cell units
     * @param {number} periodX - cells before the pattern repeats across
     * @param {number} periodY - cells before the pattern repeats down
     * @param {number} seed - the seed
     * @param {number[]} out - a 3-element array receiving [f1, f2, cellId]
     * @returns {number[]} - out
     */
    function worley2(x, y, periodX, periodY, seed, out) {
      const xi = Math.floor(x), yi = Math.floor(y);
      let f1 = Infinity, f2 = Infinity, id = 0;

      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const cx = xi + dx, cy = yi + dy;
          const wx = wrapInt(cx, periodX), wy = wrapInt(cy, periodY);
          const h = hash2(wx, wy, seed);
          // Two independent offsets out of one hash: the low and high halves.
          const px = cx + (h & 0xffff) / 65536;
          const py = cy + ((h >>> 16) & 0xffff) / 65536;
          const ddx = px - x, ddy = py - y;
          const d = Math.sqrt(ddx * ddx + ddy * ddy);
          if (d < f1) { f2 = f1; f1 = d; id = h; }
          else if (d < f2) { f2 = d; }
        }
      }
      out[0] = f1; out[1] = f2; out[2] = id;
      return out;
    }

    /**
     * Sums octaves of a noise function, each at double the frequency and half the weight.
     *
     * The period doubles with the frequency, which is what keeps the sum tileable. `gain` below
     * 0.5 gives a smooth result dominated by the base octave; above 0.5 gives a rough, detailed
     * one. 0.5 is the classic and is where the sum's range stays predictable.
     *
     * @param {function(number, number, number, number, number): number} fn - a noise function taking (x, y, periodX, periodY, seed)
     * @param {number} x - x in lattice units
     * @param {number} y - y in lattice units
     * @param {number} periodX - base period across, in lattice cells
     * @param {number} periodY - base period down, in lattice cells
     * @param {number} seed - the seed
     * @param {number} octaves - how many, at least 1
     * @param {number} gain - amplitude multiplier per octave
     * @returns {number} - a value in 0..1
     */
    function fbm(fn, x, y, periodX, periodY, seed, octaves, gain) {
      let sum = 0, amp = 1, total = 0, freq = 1;
      for (let o = 0; o < octaves; o++) {
        sum += fn(x * freq, y * freq, periodX * freq, periodY * freq, seed + o * 0x9e37) * amp;
        total += amp;
        amp *= gain;
        freq *= 2;
      }
      return total > 0 ? sum / total : 0;
    }

    //#endregion === Noise ===


    // *********************************************************************
    //           Colour — the one place a colour is read
    // *********************************************************************
    //#region === Colour ===

    /**
     * Normalizes any colour a texture may name into [r, g, b, a] floats in 0..1.
     *
     * Both spellings are allowed on purpose. Arrays are what the UI writes and what arithmetic
     * wants; hex strings are what a person hand-authoring JSON writes, and a format that a human
     * cannot comfortably type is a format that gets a UI built for it out of spite.
     *
     * @param {number[]|string} c - [r,g,b], [r,g,b,a], '#rgb', '#rrggbb' or '#rrggbbaa'
     * @param {number[]} [out] - destination, a new array when omitted
     * @returns {number[]} - [r, g, b, a] in 0..1
     */
    function toRGBA(c, out) {
      const o = out || [0, 0, 0, 1];
      if (Array.isArray(c)) {
        o[0] = c[0] || 0; o[1] = c[1] || 0; o[2] = c[2] || 0;
        o[3] = c.length > 3 ? c[3] : 1;
        return o;
      }
      if (typeof c === 'string' && c.charCodeAt(0) === 35) {
        const h = c.slice(1);
        const n = h.length;
        if (n !== 3 && n !== 4 && n !== 6 && n !== 8) {
          throw new Error('Alloy colour: "' + c + '" is not #rgb, #rgba, #rrggbb or #rrggbbaa.');
        }
        const step = n <= 4 ? 1 : 2;
        const scale = n <= 4 ? 15 : 255;
        for (let i = 0; i < 4; i++) {
          const at = i * step;
          if (at >= n) { o[i] = 1; continue; }
          const part = h.substr(at, step);
          const v = parseInt(step === 1 ? part + part : part, 16);
          if (Number.isNaN(v)) {
            throw new Error('Alloy colour: "' + c + '" has a non-hex digit in it.');
          }
          o[i] = v / (step === 1 ? 255 : scale);
        }
        // The single-digit form was widened to two digits above, so it already divided by 255.
        return o;
      }
      throw new Error('Alloy colour: expected [r,g,b] or a #hex string, got ' +
                      (c === undefined ? 'undefined' : JSON.stringify(c)) + '.');
    }

    //#endregion === Colour ===


    // *********************************************************************
    //           Generators — parameters in, a whole layer of pixels out
    // *********************************************************************
    //#region === Generators ===

    // *********************************************************************
    // MENTAL MODEL: a generator FILLS A BUFFER and knows nothing about the stack it is part of.
    // It does not blend, it does not read what is underneath it, and it never allocates. Opacity,
    // blend mode and masking are the compositor's job, one level up, which is why adding a
    // generator does not require touching any of them.
    //
    // Most generators are a SCALAR FIELD plus two colours. That is not laziness, it is what makes
    // them compose: every noise is a height, every pattern is a mask, and an author reaches for
    // `low` and `high` the same way whatever they picked. The ones that break the rule -- bricks
    // and tiles, which colour each cell individually -- break it because per-cell variation is
    // the entire point of them.
    // *********************************************************************

    /**
     * Writes one pixel from a scalar and a pair of colours.
     * @param {Float32Array} d - the destination data array
     * @param {number} i - the pixel's base index
     * @param {number} t - the scalar, 0 selects lo and 1 selects hi
     * @param {number[]} lo - rgba at t = 0
     * @param {number[]} hi - rgba at t = 1
     * @returns {void}
     */
    function writeRamp(d, i, t, lo, hi) {
      d[i]     = lo[0] + (hi[0] - lo[0]) * t;
      d[i + 1] = lo[1] + (hi[1] - lo[1]) * t;
      d[i + 2] = lo[2] + (hi[2] - lo[2]) * t;
      d[i + 3] = lo[3] + (hi[3] - lo[3]) * t;
    }

    /**
     * Applies contrast about the midpoint, then clamps.
     * @param {number} t - the scalar in 0..1
     * @param {number} contrast - 1 leaves it alone, higher is harder, 0 flattens to grey
     * @returns {number} - the adjusted scalar in 0..1
     */
    function applyContrast(t, contrast) {
      return contrast === 1 ? t : clamp((t - 0.5) * contrast + 0.5, 0, 1);
    }

    /**
     * Rounds a cell count to a whole number of at least 1. Fractional counts do not tile, which
     * is a seam rather than an error, so this rounds rather than throwing and the schema says so.
     * @param {number} v - the requested count
     * @returns {number} - a whole number of at least 1
     */
    function cellCount(v) { return Math.max(1, Math.round(v)); }

    /**
     * Fills a buffer with one flat colour.
     * @param {Pixels} px - destination
     * @param {Object} p - parameters
     * @param {number} seed - unused
     * @returns {void}
     */
    function genSolid(px, p, seed) { fillPixels(px, toRGBA(p.color)); }

    /**
     * Fills a buffer with fractal value noise.
     * @param {Pixels} px - destination
     * @param {Object} p - parameters
     * @param {number} seed - the effective seed
     * @returns {void}
     */
    function genValue(px, p, seed) { fillNoise(px, p, seed, valueNoise2); }

    /**
     * Fills a buffer with fractal perlin noise.
     * @param {Pixels} px - destination
     * @param {Object} p - parameters
     * @param {number} seed - the effective seed
     * @returns {void}
     */
    function genPerlin(px, p, seed) { fillNoise(px, p, seed, perlin2); }

    /**
     * The body shared by the two lattice noises.
     *
     * Note that x and y are scaled by the SAME number of cells rather than by cells-per-pixel in
     * each axis. A 256 by 64 texture with scale 8 therefore gets 8 cells across and 2 down: the
     * noise stays square, and a stretched texture does not get stretched noise. It also keeps the
     * result tileable in both axes, which per-axis scaling only manages when the aspect ratio
     * happens to be a whole number.
     *
     * @param {Pixels} px - destination
     * @param {Object} p - parameters
     * @param {number} seed - the effective seed
     * @param {function(number, number, number, number): number} fn - the noise function
     * @returns {void}
     */
    function fillNoise(px, p, seed, fn) {
      const cells = cellCount(p.scale);
      const octaves = Math.max(1, Math.round(p.octaves));
      const lo = toRGBA(p.low), hi = toRGBA(p.high);
      const d = px.data, w = px.width, h = px.height;
      // Cells are square: the shorter axis gets `cells`, the longer gets proportionally more.
      const unit = cells / Math.min(w, h);
      const cellsX = cellCount(w * unit), cellsY = cellCount(h * unit);

      let i = 0;
      for (let y = 0; y < h; y++) {
        const ny = (y / h) * cellsY;
        for (let x = 0; x < w; x++, i += 4) {
          const nx = (x / w) * cellsX;
          // Each axis wraps at its OWN cell count. Using one period for both is the bug that
          // makes a 128 by 64 texture tile across and seam down, which is invisible on the
          // square textures everybody tests with.
          let t = octaves === 1 ? fn(nx, ny, cellsX, cellsY, seed)
                                : fbm(fn, nx, ny, cellsX, cellsY, seed, octaves, p.gain);
          writeRamp(d, i, applyContrast(t, p.contrast), lo, hi);
        }
      }
    }

    /**
     * Fills a buffer with worley cellular noise.
     * @param {Pixels} px - destination
     * @param {Object} p - parameters
     * @param {number} seed - the effective seed
     * @returns {void}
     */
    function genWorley(px, p, seed) {
      const cells = cellCount(p.scale);
      const lo = toRGBA(p.low), hi = toRGBA(p.high);
      const d = px.data, w = px.width, h = px.height;
      const unit = cells / Math.min(w, h);
      const cellsX = cellCount(w * unit), cellsY = cellCount(h * unit);
      const scratch = [0, 0, 0];
      const mode = p.mode;

      let i = 0;
      for (let y = 0; y < h; y++) {
        const ny = (y / h) * cellsY;
        for (let x = 0; x < w; x++, i += 4) {
          const nx = (x / w) * cellsX;
          worley2(nx, ny, cellsX, cellsY, seed, scratch);
          let t;
          if (mode === 'f1') {
            t = clamp(scratch[0], 0, 1);
          } else if (mode === 'ridge') {
            // F2 - F1 is zero at a cell's centre and largest on the border between two cells,
            // which draws the WALLS rather than the cells. Cracked mud, paving, stained glass.
            t = clamp(scratch[1] - scratch[0], 0, 1);
          } else {
            // 'cells': one flat random value per cell, from the winner's hash.
            t = (scratch[2] >>> 8) / 16777216;
          }
          writeRamp(d, i, applyContrast(t, p.contrast), lo, hi);
        }
      }
    }

    /**
     * Fills a buffer with a checkerboard.
     * @param {Pixels} px - destination
     * @param {Object} p - parameters
     * @param {number} seed - unused
     * @returns {void}
     */
    function genChecker(px, p, seed) {
      const cols = cellCount(p.cols), rows = cellCount(p.rows);
      const a = toRGBA(p.colorA), b = toRGBA(p.colorB);
      const d = px.data, w = px.width, h = px.height;

      let i = 0;
      for (let y = 0; y < h; y++) {
        const ry = Math.floor((y / h) * rows);
        for (let x = 0; x < w; x++, i += 4) {
          const rx = Math.floor((x / w) * cols);
          const c = ((rx + ry) & 1) ? b : a;
          d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = c[3];
        }
      }
    }

    /**
     * Fills a buffer with stripes at an angle.
     *
     * The three waves are square, triangle and sawtooth, and there is no sine on purpose: a sine
     * would be the only transcendental function in a per-pixel path, and a triangle wave looks
     * identical once it has been through a contrast curve.
     *
     * @param {Pixels} px - destination
     * @param {Object} p - parameters
     * @param {number} seed - unused
     * @returns {void}
     */
    function genStripes(px, p, seed) {
      const count = cellCount(p.count);
      const a = toRGBA(p.colorA), b = toRGBA(p.colorB);
      const d = px.data, w = px.width, h = px.height;
      // One trig evaluation per layer, not per pixel. An angle that is not a multiple of 90
      // degrees will not tile, and the schema says so.
      const rad = p.angle * DEG2RAD;
      const dx = Math.cos(rad), dy = Math.sin(rad);
      const duty = clamp(p.duty, 0, 1);
      const wave = p.wave;

      let i = 0;
      for (let y = 0; y < h; y++) {
        const v = y / h;
        for (let x = 0; x < w; x++, i += 4) {
          const u = x / w;
          let s = (u * dx + v * dy) * count;
          s = s - Math.floor(s);                    // 0..1 within one stripe
          let t;
          if (wave === 'square') t = s < duty ? 0 : 1;
          else if (wave === 'saw') t = s;
          else t = s < 0.5 ? s * 2 : 2 - s * 2;     // 'triangle'
          writeRamp(d, i, applyContrast(t, p.contrast), a, b);
        }
      }
    }

    /**
     * Fills a buffer with a linear or radial gradient.
     * @param {Pixels} px - destination
     * @param {Object} p - parameters
     * @param {number} seed - unused
     * @returns {void}
     */
    function genGradient(px, p, seed) {
      const a = toRGBA(p.colorA), b = toRGBA(p.colorB);
      const d = px.data, w = px.width, h = px.height;
      const rad = p.angle * DEG2RAD;
      const dx = Math.cos(rad), dy = Math.sin(rad);
      const radial = p.kind === 'radial';
      const cx = p.centerX, cy = p.centerY;

      let i = 0;
      for (let y = 0; y < h; y++) {
        const v = y / h;
        for (let x = 0; x < w; x++, i += 4) {
          const u = x / w;
          let t;
          if (radial) {
            const ux = u - cx, uy = v - cy;
            t = Math.sqrt(ux * ux + uy * uy) / Math.max(p.radius, 1e-6);
          } else {
            // Projected onto the direction and remapped so the texture spans exactly 0..1 no
            // matter which way the gradient points.
            t = ((u - 0.5) * dx + (v - 0.5) * dy) / (Math.abs(dx) + Math.abs(dy)) + 0.5;
          }
          writeRamp(d, i, applyContrast(clamp(t, 0, 1), p.contrast), a, b);
        }
      }
    }

    /**
     * Fills a buffer with a running-bond brick wall.
     *
     * Every brick takes its own brightness from a hash of its wrapped cell coordinates, which is
     * the whole reason this is a generator rather than a checker with extra steps: a wall of
     * identical bricks reads as wallpaper, and a wall where each brick is a little different
     * reads as a wall. `vary` is the single knob for that, and it is the one to reach for first.
     *
     * Edges are crisp, not antialiased. Softening them makes a wall look photographed rather than
     * built, and the aesthetic this engine serves wants the pixel grid visible.
     *
     * @param {Pixels} px - destination
     * @param {Object} p - parameters
     * @param {number} seed - the effective seed
     * @returns {void}
     */
    function genBricks(px, p, seed) {
      const cols = cellCount(p.cols), rows = cellCount(p.rows);
      const brick = toRGBA(p.brick), mortar = toRGBA(p.mortar);
      const d = px.data, w = px.width, h = px.height;
      const cw = w / cols, ch = h / rows;
      // Mortar is a fraction of the smaller cell dimension, so a wide brick does not get a
      // fat vertical joint and a thin horizontal one.
      const m = Math.max(0, p.mortar_width) * Math.min(cw, ch);
      const offset = p.offset;
      const vary = clamp(p.vary, 0, 1);

      let i = 0;
      for (let y = 0; y < h; y++) {
        const row = Math.floor(y / ch);
        const yIn = y - row * ch;
        // Every other course slides along by `offset` of a brick. Because `cols` is a whole
        // number the shift wraps cleanly at the texture edge, so the wall still tiles.
        const shift = wrapInt(row, 2) === 1 ? offset * cw : 0;
        for (let x = 0; x < w; x++, i += 4) {
          const xs = x + shift;
          const col = Math.floor(xs / cw);
          const xIn = xs - col * cw;

          if (xIn < m || yIn < m) {
            d[i] = mortar[0]; d[i + 1] = mortar[1]; d[i + 2] = mortar[2]; d[i + 3] = mortar[3];
            continue;
          }
          // Wrapped so the brick at the right edge is the same brick as the one at the left.
          const k = hash2f(wrapInt(col, cols), wrapInt(row, rows), seed);
          const f = 1 + (k - 0.5) * 2 * vary;
          d[i]     = clamp(brick[0] * f, 0, 1);
          d[i + 1] = clamp(brick[1] * f, 0, 1);
          d[i + 2] = clamp(brick[2] * f, 0, 1);
          d[i + 3] = brick[3];
        }
      }
    }

    /**
     * Fills a buffer with a grid of tiles, optionally bevelled.
     *
     * The bevel is two flat shades rather than a gradient — light along the top and left edges,
     * dark along the bottom and right — which is exactly how a tile was drawn in 1998 and reads
     * as depth at sixteen pixels a side, where a smooth bevel reads as blur.
     *
     * @param {Pixels} px - destination
     * @param {Object} p - parameters
     * @param {number} seed - the effective seed
     * @returns {void}
     */
    function genTiles(px, p, seed) {
      const cols = cellCount(p.cols), rows = cellCount(p.rows);
      const tile = toRGBA(p.tile), grout = toRGBA(p.grout);
      const d = px.data, w = px.width, h = px.height;
      const cw = w / cols, ch = h / rows;
      const g = Math.max(0, p.grout_width) * Math.min(cw, ch);
      const bevel = Math.max(0, p.bevel) * Math.min(cw, ch);
      const vary = clamp(p.vary, 0, 1);
      const light = 1 + p.bevel_strength;
      const dark = 1 - p.bevel_strength;

      let i = 0;
      for (let y = 0; y < h; y++) {
        const row = Math.floor(y / ch);
        const yIn = y - row * ch;
        for (let x = 0; x < w; x++, i += 4) {
          const col = Math.floor(x / cw);
          const xIn = x - col * cw;

          if (xIn < g || yIn < g) {
            d[i] = grout[0]; d[i + 1] = grout[1]; d[i + 2] = grout[2]; d[i + 3] = grout[3];
            continue;
          }
          const k = hash2f(wrapInt(col, cols), wrapInt(row, rows), seed);
          let f = 1 + (k - 0.5) * 2 * vary;
          if (bevel > 0) {
            if (xIn < g + bevel || yIn < g + bevel) f *= light;
            else if (xIn >= cw - bevel || yIn >= ch - bevel) f *= dark;
          }
          d[i]     = clamp(tile[0] * f, 0, 1);
          d[i + 1] = clamp(tile[1] * f, 0, 1);
          d[i + 2] = clamp(tile[2] * f, 0, 1);
          d[i + 3] = tile[3];
        }
      }
    }

    //#endregion === Generators ===


    // *********************************************************************
    //           Draw Ops — a signed-distance rasterizer
    // *********************************************************************
    //#region === Draw Ops ===

    // *********************************************************************
    // MENTAL MODEL: EVERY SHAPE IS A SIGNED DISTANCE FUNCTION, and everything else falls out of
    // that one decision.
    //
    // An SDF answers "how far is this pixel from the edge, and which side is it on" in pixels.
    // From that single number:
    //
    //   the FILL is  coverage = clamp(0.5 - sd)          — inside, with a one-pixel soft edge
    //   the STROKE is coverage of  abs(sd) - halfWidth   — a band straddling the same edge
    //   ANTIALIASING is free, analytically, with no supersampling and no guessing
    //
    // So a new shape is one function returning a distance, and it arrives with fill, stroke and
    // antialiasing already working. Compare the alternative — an inside/outside test plus a
    // supersampling grid — which needs sixteen samples a pixel to look as good, has no notion of
    // a stroke, and has to be written again for every shape.
    //
    // Coordinates in the DATA are normalized: x and y in 0..1 across the texture, so art survives
    // a change of resolution. Lengths — radii, stroke widths, text size — are in units of the
    // SHORTER axis, which is what keeps a circle round on a texture that is not square. All of it
    // is converted to pixels once, at the top of each op, and the SDF math is pure pixels.
    // *********************************************************************

    /**
     * Composites one straight-alpha source colour over a pixel, in place.
     * @param {Float32Array} d - the destination data
     * @param {number} i - the pixel's base index
     * @param {number[]} c - source rgba
     * @param {number} cov - coverage in 0..1, multiplied into the source alpha
     * @returns {void}
     */
    function overPixel(d, i, c, cov) {
      const sa = c[3] * cov;
      if (sa <= 0) return;
      const da = d[i + 3];
      const outA = sa + da * (1 - sa);
      if (outA <= 0) { d[i + 3] = 0; return; }
      const inv = 1 / outA;
      d[i]     = (c[0] * sa + d[i]     * da * (1 - sa)) * inv;
      d[i + 1] = (c[1] * sa + d[i + 1] * da * (1 - sa)) * inv;
      d[i + 2] = (c[2] * sa + d[i + 2] * da * (1 - sa)) * inv;
      d[i + 3] = outA;
    }

    /**
     * Signed distance to an axis-aligned box with rounded corners.
     * @param {number} px - point x, pixels, relative to the box centre
     * @param {number} py - point y, pixels, relative to the box centre
     * @param {number} hx - half width, pixels
     * @param {number} hy - half height, pixels
     * @param {number} r - corner radius, pixels
     * @returns {number} - distance, negative inside
     */
    function sdRoundBox(px, py, hx, hy, r) {
      const qx = Math.abs(px) - hx + r;
      const qy = Math.abs(py) - hy + r;
      const ox = Math.max(qx, 0), oy = Math.max(qy, 0);
      return Math.hypot(ox, oy) + Math.min(Math.max(qx, qy), 0) - r;
    }

    /**
     * Signed distance to a line segment.
     * @param {number} px - point x, pixels
     * @param {number} py - point y, pixels
     * @param {number} ax - start x, pixels
     * @param {number} ay - start y, pixels
     * @param {number} bx - end x, pixels
     * @param {number} by - end y, pixels
     * @returns {number} - distance, always positive
     */
    function sdSegment(px, py, ax, ay, bx, by) {
      const pax = px - ax, pay = py - ay;
      const bax = bx - ax, bay = by - ay;
      const denom = bax * bax + bay * bay;
      const t = denom > 0 ? clamp((pax * bax + pay * bay) / denom, 0, 1) : 0;
      return Math.hypot(pax - bax * t, pay - bay * t);
    }

    /**
     * Signed distance to a closed polygon, negative inside.
     *
     * The magnitude is the distance to the nearest edge; the sign comes from a separate
     * crossing-number test. Doing the sign with winding rather than with edge normals is what
     * makes this correct for concave polygons, which is most of the interesting ones.
     *
     * @param {number} px - point x, pixels
     * @param {number} py - point y, pixels
     * @param {Float64Array} pts - flat x,y pairs in pixels
     * @returns {number} - distance, negative inside
     */
    function sdPolygon(px, py, pts) {
      const n = pts.length / 2;
      let d = Infinity, inside = false;
      for (let i = 0, j = n - 1; i < n; j = i++) {
        const ix = pts[i * 2], iy = pts[i * 2 + 1];
        const jx = pts[j * 2], jy = pts[j * 2 + 1];
        const dist = sdSegment(px, py, jx, jy, ix, iy);
        if (dist < d) d = dist;
        // Crossing number: does a ray going right from the point cross this edge?
        if ((iy > py) !== (jy > py) && px < (jx - ix) * (py - iy) / (jy - iy) + ix) {
          inside = !inside;
        }
      }
      return inside ? -d : d;
    }

    /**
     * Rasterizes a shape from its signed distance function over a bounding box.
     *
     * This is the single loop every shape goes through. It draws the fill first and the stroke
     * second, so a stroke always sits on top of its own fill, which is what everyone expects and
     * what makes a translucent fill with a solid outline look right.
     *
     * @param {Pixels} px - destination
     * @param {number[]} bounds - [x0, y0, x1, y1] in pixels, clipped here
     * @param {function(number, number): number} sdf - distance in pixels for a pixel centre
     * @param {number[]|null} fill - rgba, or null for no fill
     * @param {number[]|null} stroke - rgba, or null for no stroke
     * @param {number} halfStroke - half the stroke width in pixels
     * @returns {void}
     */
    function rasterizeSDF(px, bounds, sdf, fill, stroke, halfStroke) {
      const w = px.width, h = px.height, d = px.data;
      const x0 = Math.max(0, Math.floor(bounds[0]));
      const y0 = Math.max(0, Math.floor(bounds[1]));
      const x1 = Math.min(w - 1, Math.ceil(bounds[2]));
      const y1 = Math.min(h - 1, Math.ceil(bounds[3]));

      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          // Sample at the pixel CENTRE. Sampling at the corner shifts every shape half a pixel
          // up and left, which nobody notices until two shapes are supposed to touch.
          const sd = sdf(x + 0.5, y + 0.5);
          const i = (y * w + x) * 4;
          if (fill) {
            const cov = clamp(0.5 - sd, 0, 1);
            if (cov > 0) overPixel(d, i, fill, cov);
          }
          if (stroke && halfStroke > 0) {
            const cov = clamp(0.5 - (Math.abs(sd) - halfStroke), 0, 1);
            if (cov > 0) overPixel(d, i, stroke, cov);
          }
        }
      }
    }

    /**
     * Converts an op's normalized points into a flat pixel array.
     * @param {Array<number[]>} points - [[x, y], ...] in 0..1
     * @param {number} w - texture width
     * @param {number} h - texture height
     * @param {string} where - the op name, for the error message
     * @returns {Float64Array} - flat x, y pairs in pixels
     */
    function pointsToPixels(points, w, h, where) {
      if (!Array.isArray(points) || points.length < 2) {
        throw new Error('Alloy draw op "' + where + '": needs at least 2 points, got ' +
                        (Array.isArray(points) ? points.length : typeof points) + '.');
      }
      const out = new Float64Array(points.length * 2);
      for (let i = 0; i < points.length; i++) {
        out[i * 2] = points[i][0] * w;
        out[i * 2 + 1] = points[i][1] * h;
      }
      return out;
    }

    /**
     * Runs one draw op onto a buffer.
     *
     * @param {Pixels} px - destination, painted in place
     * @param {Object} op - the op, `op.op` naming which one
     * @returns {void}
     */
    function runDrawOp(px, op) {
      const spec = DRAW_OPS[op.op];
      if (!spec) {
        throw new Error('Alloy draw op: unknown op "' + op.op + '". Known ops: ' +
                        Object.keys(DRAW_OPS).join(', ') + '.');
      }
      const p = withDefaults(spec.defaults, op);
      const w = px.width, h = px.height;
      const unit = Math.min(w, h);                     // lengths are in short-axis units
      const fill = p.fill ? toRGBA(p.fill) : null;
      const stroke = p.stroke ? toRGBA(p.stroke) : null;
      const halfStroke = (p.width * unit) / 2;
      // How far past the shape a stroke and its antialiasing can reach.
      const pad = halfStroke + 2;

      if (op.op === 'fill') {
        if (!fill) return;
        const d = px.data;
        for (let i = 0; i < d.length; i += 4) overPixel(d, i, fill, 1);
        return;
      }

      if (op.op === 'rect') {
        const cx = (p.x + p.w / 2) * w, cy = (p.y + p.h / 2) * h;
        const hx = (p.w / 2) * w, hy = (p.h / 2) * h;
        const r = Math.min(p.radius * unit, Math.min(hx, hy));
        rasterizeSDF(px, [cx - hx - pad, cy - hy - pad, cx + hx + pad, cy + hy + pad],
          (sx, sy) => sdRoundBox(sx - cx, sy - cy, hx, hy, r), fill, stroke, halfStroke);
        return;
      }

      if (op.op === 'circle' || op.op === 'ellipse') {
        const cx = p.x * w, cy = p.y * h;
        const rx = (op.op === 'circle' ? p.r : p.rx) * unit;
        const ry = (op.op === 'circle' ? p.r : p.ry) * unit;
        rasterizeSDF(px, [cx - rx - pad, cy - ry - pad, cx + rx + pad, cy + ry + pad],
          (sx, sy) => {
            const ux = (sx - cx) / rx, uy = (sy - cy) / ry;
            // The standard cheap ellipse SDF. Exact for a circle, and slightly wrong on a very
            // eccentric ellipse in a way that is under a pixel at any size a texture uses.
            return (Math.hypot(ux, uy) - 1) * Math.min(rx, ry);
          }, fill, stroke, halfStroke);
        return;
      }

      if (op.op === 'line') {
        const pts = pointsToPixels(p.points, w, h, 'line');
        const n = pts.length / 2;
        let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
        for (let i = 0; i < n; i++) {
          bx0 = Math.min(bx0, pts[i * 2]); bx1 = Math.max(bx1, pts[i * 2]);
          by0 = Math.min(by0, pts[i * 2 + 1]); by1 = Math.max(by1, pts[i * 2 + 1]);
        }
        const last = p.closed ? n : n - 1;
        // A polyline has no inside, so it is stroke only: the distance is to the path itself and
        // the "fill" of that distance IS the line. Passing it as the fill colour with a radius
        // built into the SDF gives round caps and joins for free.
        const col = stroke || fill;
        rasterizeSDF(px, [bx0 - pad, by0 - pad, bx1 + pad, by1 + pad],
          (sx, sy) => {
            let dmin = Infinity;
            for (let i = 0; i < last; i++) {
              const j = (i + 1) % n;
              const dd = sdSegment(sx, sy, pts[i * 2], pts[i * 2 + 1], pts[j * 2], pts[j * 2 + 1]);
              if (dd < dmin) dmin = dd;
            }
            return dmin - halfStroke;
          }, col, null, 0);
        return;
      }

      if (op.op === 'polygon') {
        const pts = pointsToPixels(p.points, w, h, 'polygon');
        const n = pts.length / 2;
        let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
        for (let i = 0; i < n; i++) {
          bx0 = Math.min(bx0, pts[i * 2]); bx1 = Math.max(bx1, pts[i * 2]);
          by0 = Math.min(by0, pts[i * 2 + 1]); by1 = Math.max(by1, pts[i * 2 + 1]);
        }
        rasterizeSDF(px, [bx0 - pad, by0 - pad, bx1 + pad, by1 + pad],
          (sx, sy) => sdPolygon(sx, sy, pts), fill, stroke, halfStroke);
        return;
      }

      if (op.op === 'text') { drawText(px, p); return; }

      throw new Error('Alloy draw op: "' + op.op + '" is in the registry but has no code path. ' +
                      'That is a bug in the engine, not in your data.');
    }

    //#endregion === Draw Ops ===


    // *********************************************************************
    //           The Font — five by seven, hand-drawn, no dependencies
    // *********************************************************************
    //#region === Font ===

    // *********************************************************************
    // MENTAL MODEL: THE FONT IS DATA IN THIS FILE, drawn by hand, one glyph per line, because
    // there is no other way to have text.
    //
    // The alternatives were all worse. Canvas2D's `fillText` would tie textures to a browser and
    // make the output depend on the platform's font stack and hinting, so the same JSON would
    // produce different pixels on a different machine — the one promise this whole section is
    // built on. An embedded TrueType file would be an asset, which the rules forbid, and would
    // need a rasterizer far larger than the entire texture engine.
