  // =====================================================================
  //           Export — getting Alloy and a package into somebody's game
  // =====================================================================
  //#region === Export ===

  // *********************************************************************
  // MENTAL MODEL: SHIPPING IS COPYING TEXT. There is no bundler, no build, no artifact. A game
  // that wants Alloy gets three blocks of text — the engine, the package, and some code that uses
  // them — and every one of them is something you can read before you paste it.
  //
  // The proper path is OFCU Manager: it scans the target, renders the block at the target's own
  // indentation, proves every byte outside the spliced range is unchanged, backs the file up and
  // validates the result. That runs in Node, against files on disk, and this app is a web page. So
  // what lives here is the same text that path would write, handed to the clipboard instead of to
  // a file. The two must not drift: the block this copies is byte-identical to the block the
  // manager installs, which is why the engine block is emitted VERBATIM rather than re-indented.
  //
  // WHY A WHOLE STARTER FILE AND NOT JUST A SNIPPET. Because the gap between "here is the API" and
  // "here is a thing that runs" is where a toolkit loses people. The starter is a complete OFCU
  // file: blocks in the right order, an app block that draws the package it was exported with, and
  // nothing to install. Save it as .html, open it, see the models. Then delete what you do not
  // want. Starting from something that runs is a different experience from starting from a blank
  // file and a reference page, and it costs this app about sixty lines.
  // *********************************************************************

  /**
   * The engine, as the `managed-package` block a consuming file carries.
   *
   * Read out of this very document, which is the only honest source — the engine that gets
   * shipped has to be the engine that is running, not a copy of it kept somewhere else that
   * somebody forgot to update.
   *
   * The content is emitted verbatim. OFCU Manager hashes NORMALIZED content, so a verbatim copy
   * hashes identically to the installed one, and re-indenting here would be work that only risks
   * disagreeing with the manager.
   *
   * @returns {string} - the block, opening tag to closing tag
   */
  function engineBlockText() {
    const tag = document.querySelector('script[data-ofcu-type="exportable"][data-ofcu-package="alloy"]');
    if (!tag) throw new Error('Alloy: this document has no exportable block, which cannot happen ' +
                              'in alloy.html and means you are running a copy that was cut up.');
    const attrs = [
      ['data-ofcu-type', 'managed-package'],
      ['data-ofcu-package', 'alloy'],
      ['data-ofcu-version', tag.getAttribute('data-ofcu-version')],
      ['data-ofcu-built', tag.getAttribute('data-ofcu-built')],
      ['data-ofcu-hash', tag.getAttribute('data-ofcu-hash')],
      ['data-ofcu-source', 'alloy.html'],
    ].filter((a) => a[1]);
    const open = '<' + 'script ' + attrs.map((a, i) =>
      (i ? '        ' : '') + a[0] + '="' + a[1] + '"').join('\n') + '>';
    return open + tag.textContent.replace(/\s+$/, '\n') + '<' + '/' + 'script>';
  }

  /**
   * A complete, runnable OFCU game file carrying this package.
   *
   * Blocks in convention order: the engine, then the data it consumes, then the app that uses
   * both. The app block is generated against the package that is open, so the names in it are
   * real and it draws something the moment it is loaded.
   *
   * @returns {string} - a whole HTML file
   */
  function starterFileText() {
    const project = pkg.name || 'untitled';
    const constName = Alloy.packageIdent(project);
    const models = Object.keys(pkg.models || {});
    if (!models.length) {
      throw new Error('Alloy: a starter file with no models would open on an empty room. Make a ' +
                      'model first, or copy the package data block on its own.');
    }
    const clip = Object.keys(pkg.clips || {}).find((c) => {
      const m = pkg.clips[c].model;
      return !m || models.indexOf(m) >= 0;
    }) || '';

    const dataBlock = Alloy.packageBlock(pkg, {
      project,
      changelog: ['Written by Alloy v' + Alloy.version + ' as part of a starter file.',
                  'This block is data. Edit it by hand, or open it in alloy.html and re-export.'],
    });

    // Spread the models out along X so a package with several does not stack them at the origin.
    const placements = models.map((name, i) => {
      const x = (i - (models.length - 1) / 2) * 3;
      return "    stage.createInstance(" + JSON.stringify(name) +
             ", { position: [" + x.toFixed(2) + ", 0, 0] }),";
    }).join('\n');

    const play = clip
      ? "\n    // Whatever the package animates, animate it. Every instance holds its own pose, so\n" +
        "    // two of the same model can be at different points in the same clip.\n" +
        "    for (const inst of cast) {\n" +
        "      if (inst.animator) inst.play(" + JSON.stringify(clip) + ", { loop: true });\n" +
        "    }\n"
      : '';

    return [
      '<!DOCTYPE html>',
      '<html lang="en">',
      '<head>',
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<title>' + escapeHtml(project) + '</title>',
      '<style>',
      '  html, body { margin: 0; height: 100%; background: #0a0c10; overflow: hidden; }',
      '  canvas { display: block; width: 100%; height: 100%; }',
      '<' + '/' + 'style>',
      '<' + '/' + 'head>',
      '<body>',
      '<canvas id="view"><' + '/' + 'canvas>',
      '',
      engineBlockText(),
      '',
      dataBlock,
      '',
      '<' + 'script data-ofcu-type="app" data-ofcu-project="' + project + '">',
      appBlockText(constName, placements, play),
      '<' + '/' + 'script>',
      '<' + '/' + 'body>',
      '<' + '/' + 'html>',
      '',
    ].join('\n');
  }

  /**
   * The app block of a starter file: the whole runtime API, used once each, in order.
   * @param {string} constName - the global the data block declares
   * @param {string} placements - the createInstance lines, already indented
   * @param {string} play - the clip-playing lines, or empty
   * @returns {string} - the block's contents
   */
  function appBlockText(constName, placements, play) {
    return [
      '  "use strict";',
      '',
      '  // Alloy renders this. The engine block above is a managed package: do not hand-edit it,',
      '  // update it with OFCU Manager. The data block above it is yours to edit or to re-export',
      '  // from alloy.html. This block is the only part that is really your game.',
      '',
      '  const canvas = document.getElementById("view");',
      '',
      '  // One call. The stage owns the GPU resources; this file owns where everything is.',
      '  const stage = Alloy.init(canvas, {',
      '    package: ' + constName + ',',
      '    camera: { distance: 9, yaw: 30, pitch: 18 },',
      '  });',
      '',
      '  // Dragging orbits, the wheel dollies. Remove this line and the camera is yours to drive.',
      '  stage.camera.attach(canvas);',
      '',
      '  const cast = [',
      placements,
      '  ];',
      play,
      '  // Frame everything, once, so nothing opens off screen. Rest bounds plus position is',
      '  // near enough for an opening shot; it ignores rotation and scale.',
      '  {',
      '    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];',
      '    for (const inst of cast) {',
      '      for (let i = 0; i < 3; i++) {',
      '        min[i] = Math.min(min[i], inst.bounds.min[i] + inst.position[i]);',
      '        max[i] = Math.max(max[i], inst.bounds.max[i] + inst.position[i]);',
      '      }',
      '    }',
      '    stage.camera.frameBounds(min, max);',
      '    stage.camera.update(Infinity);',
      '  }',
      '',
      '  // Clicking picks, and lights up what was picked. Bounding boxes, not triangles — see',
      '  // Stage.instanceAt. The highlight is a per-instance material override: the resolved',
      '  // material with its emissive raised, which touches nothing any other instance draws.',
      '  canvas.addEventListener("click", (ev) => {',
      '    const r = canvas.getBoundingClientRect();',
      '    const hit = stage.instanceAt(ev.clientX - r.left, ev.clientY - r.top);',
      '    for (const inst of cast) inst.materials = null;',
      '    if (hit) {',
      '      const glow = {};',
      '      for (const name of hit.instance.materialNames) {',
      '        glow[name] = Object.assign({}, stage.material(name), { emissive: [0.3, 0.24, 0.08] });',
      '      }',
      '      hit.instance.materials = glow;',
      '    }',
      '  });',
      '',
      '  // The loop. `dt` in SECONDS, capped, because a backgrounded tab hands you a whole minute',
      '  // and every clip in the scene would jump a minute forward at once.',
      '  let last = performance.now();',
      '  function frame(now) {',
      '    const dt = Math.min((now - last) / 1000, 0.1);',
      '    last = now;',
      '    stage.render(dt);',
      '    requestAnimationFrame(frame);',
      '  }',
      '  requestAnimationFrame(frame);',
    ].join('\n');
  }

  /**
   * The menu of ways to get this package somewhere else.
   * @param {number} x - client x
   * @param {number} y - client y
   * @returns {void}
   */
  function openExportMenu(x, y) {
    openMenu(x, y, 'Export', [
      { label: 'Copy a whole starter file', fn: () => {
        try { copyToClipboard(starterFileText(), 'a starter file'); } catch (err) { logError(err); }
      } },
      { sep: true },
      { label: 'Copy the engine block', fn: () => {
        try { copyToClipboard(engineBlockText(), 'the engine block'); } catch (err) { logError(err); }
      } },
      { label: 'Copy the package data block', fn: copyDataBlock },
    ]);
  }

  //#endregion === Export ===


  // =====================================================================
  //           The Starter Package — the cookbook, written as data
  // =====================================================================
  //#region === Starter Package ===

  // *********************************************************************
  // MENTAL MODEL: these are DATA, not code. Every one is a plain object that could be pasted into
  // a game's managed-data block, typed by hand, or written by an AI that asked the engine what a
  // generator takes. Nothing here calls a drawing function; the whole visible result is a list of
  // layers.
  //
  // They exist to be READ AND COPIED. Opening the tool to an empty rail teaches nothing, and a
  // demo that shows one generator teaches nearly as little — so between them these cover every
  // layer kind, most of the generators, masks, blend modes, adjustments and the draw ops.
  // *********************************************************************

  /**
   * Builds the package the tool opens with the first time.
   * @returns {Object} - a package
   */
  function starterPackage() {
    const p = Alloy.emptyPackage('starter');
    p.textures = {
      brick: {
        name: 'brick', width: 128, height: 128, seed: 17,
        layers: [
          // `vary` is doing most of the work here: without it this is wallpaper, not a wall.
          { type: 'generator', generator: 'bricks',
            params: { cols: 4, rows: 8, mortar_width: 0.1, offset: 0.5, vary: 0.22,
                      brick: '#8f4a33', mortar: '#a8a091' } },
          // Grime, multiplied on and masked by a second noise so it pools in patches. That mask
          // is the difference between dirt and a filter over the whole wall.
          { type: 'generator', generator: 'value',
            params: { scale: 6, octaves: 4, gain: 0.55, contrast: 1.4, low: '#3a2a20', high: '#ffffff' },
            blend: 'multiply', opacity: 0.55,
            mask: { type: 'generator', generator: 'perlin', params: { scale: 3, octaves: 2, contrast: 1.8 } } },
          { type: 'adjust', adjust: 'levels', params: { inLow: 0.04, inHigh: 0.92, gamma: 0.95 } },
        ],
      },
      tiles: {
        name: 'tiles', width: 128, height: 128, seed: 4,
        layers: [
          { type: 'generator', generator: 'tiles',
            params: { cols: 4, rows: 4, grout_width: 0.07, bevel: 0.12, bevel_strength: 0.22,
                      vary: 0.1, tile: '#3f6b78', grout: '#23272c' } },
          // Worley ridges read as crazing in the glaze. Screened, so it lightens rather than dirties.
          { type: 'generator', generator: 'worley',
            params: { scale: 10, mode: 'ridge', contrast: 2.4, low: '#000000', high: '#9fd8e8' },
            blend: 'screen', opacity: 0.3 },
          { type: 'adjust', adjust: 'hsv', params: { hue: -4, saturation: 1.15, value: 1 } },
        ],
      },
      crate: {
        name: 'crate', width: 128, height: 128, seed: 31,
        layers: [
          { type: 'generator', generator: 'solid', params: { color: '#9a6b3c' } },
          { type: 'generator', generator: 'stripes',
            params: { count: 5, angle: 90, wave: 'triangle', contrast: 0.6,
                      colorA: '#7d5530', colorB: '#a9784a' },
            blend: 'multiply', opacity: 0.8 },
          { type: 'generator', generator: 'perlin',
            params: { scale: 16, octaves: 3, gain: 0.6, contrast: 1.3, low: '#5c3d20', high: '#ffffff' },
            blend: 'multiply', opacity: 0.4 },
          // The frame, drawn rather than generated: one shape per row, folded together. This is
          // the escape hatch earning its place.
          { type: 'shape', folder: 'frame',
            op: { op: 'rect', x: 0.02, y: 0.02, w: 0.96, h: 0.96, fill: null, stroke: '#5a3a1e', width: 0.05 } },
          { type: 'shape', folder: 'frame',
            op: { op: 'line', points: [[0.08, 0.08], [0.92, 0.92]], stroke: '#5a3a1e', width: 0.035 } },
          { type: 'shape', folder: 'frame',
            op: { op: 'line', points: [[0.92, 0.08], [0.08, 0.92]], stroke: '#5a3a1e', width: 0.035 } },
          { type: 'shape', folder: 'frame',
            op: { op: 'circle', x: 0.5, y: 0.5, r: 0.075, fill: '#c8a15e', stroke: '#4a2f18', width: 0.018 } },
          { type: 'shape', folder: 'frame',
            op: { op: 'text', x: 0.5, y: 0.115, text: 'OFCU', size: 0.1, spacing: 1, align: 'center', fill: '#f0d9a8' } },
        ],
      },
      quantized: {
        name: 'quantized', width: 128, height: 128, seed: 88,
        layers: [
          { type: 'generator', generator: 'perlin',
            params: { scale: 4, octaves: 5, gain: 0.55, contrast: 1.1, low: '#132033', high: '#dff0ff' } },
          { type: 'generator', generator: 'worley',
            params: { scale: 5, mode: 'f1', contrast: 1.6 }, blend: 'overlay', opacity: 0.5 },
          // The era, in one layer. A fixed palette plus an ordered dither is what a console with a
          // colour budget did, and the Bayer matrix tiles so the texture still wraps.
          { type: 'adjust', adjust: 'quantize',
            params: { dither: 0.8, palette: ['#0b1a2b', '#1d3a54', '#3c6e8f', '#79b4c9',
                                             '#c9e8f0', '#f2b263', '#8a4b2a'] } },
        ],
      },
      checker: {
        name: 'checker', width: 128, height: 128, seed: 1,
        layers: [
          // Kept deliberately plain: this is the one that tells you whether the UVs are right.
          { type: 'generator', generator: 'checker',
            params: { cols: 8, rows: 8, colorA: '#e8e8e8', colorB: '#2a2a2a' } },
          { type: 'shape', op: { op: 'text', x: 0.5, y: 0.42, text: 'UP', size: 0.16, align: 'center', fill: '#ff5f5f' } },
        ],
      },
    };
    // Materials are the join between a texture and a model: a model names a material, a material
    // names a texture. One more level of indirection than seems necessary right up to the moment
    // two hundred nodes want the same wall and one of them needs it tinted.
    p.materials = {
      wall:   { name: 'wall', color: '#ffffff', texture: 'brick', emissive: '#000000' },
      floor:  { name: 'floor', color: '#ffffff', texture: 'tiles', emissive: '#000000' },
      crate:  { name: 'crate', color: '#ffffff', texture: 'crate', emissive: '#000000' },
      metal:  { name: 'metal', color: '#8e97a6', texture: '', emissive: '#000000' },
      paint:  { name: 'paint', color: '#c4472f', texture: '', emissive: '#000000' },
      lamp:   { name: 'lamp', color: '#3a2a12', texture: '', emissive: '#ffb454' },
    };

    p.models = {
      // A hut: hierarchy, five of the six primitives, box projection so the texel density is the
      // same on the walls as on the floor, and one subdivided node for the lamp.
      hut: {
        name: 'hut',
        nodes: [
          { name: 'ground', primitive: 'plane', params: { width: 8, depth: 8 },
            material: 'floor', uv: { mode: 'planar', axis: 'y', scale: 2 } },
          { name: 'body', position: [0, 1, 0], children: [
            { name: 'walls', primitive: 'box', params: { width: 3, height: 2, depth: 3 },
              material: 'wall', uv: { mode: 'box', scale: 1.5 } },
            { name: 'roof', primitive: 'wedge', params: { width: 3.2, height: 1.2, depth: 3.2 },
              position: [0, 1.6, 0], material: 'paint' },
            { name: 'chimney', primitive: 'cylinder',
              params: { radiusTop: 0.18, radiusBottom: 0.22, height: 1.2, radialSegments: 10 },
              position: [0.9, 2.2, -0.6], material: 'metal' },
            { name: 'lamp', primitive: 'sphere', params: { radius: 0.16, widthSegments: 10, heightSegments: 7 },
              position: [0, 0.6, 1.62], material: 'lamp' },
          ] },
          { name: 'crate', primitive: 'box', params: { width: 0.9, height: 0.9, depth: 0.9 },
            position: [2.2, 0.45, 1.6], rotation: [0, 24, 0], material: 'crate' },
          { name: 'barrel', primitive: 'cylinder',
            params: { radiusTop: 0.34, radiusBottom: 0.38, height: 1, radialSegments: 14 },
            position: [-2.1, 0.5, 1.4], material: 'metal',
            uv: { mode: 'cylindrical', axis: 'y', scale: 1 } },
          { name: 'cone', primitive: 'cone', params: { radius: 0.3, height: 0.7, radialSegments: 12 },
            position: [-2.1, 1.35, 1.4], material: 'paint' },
          { name: 'pebble', primitive: 'sphere', params: { radius: 0.3, widthSegments: 6, heightSegments: 4 },
            position: [1.4, 0.24, -2 ], subdivide: 2, material: 'metal' },
        ],
      },
      // A figure: the bone door, exercised. The two arms are marked as bones, so everything under
      // each of them carries that bone's index and Phase 5 can move it without re-merging.
      figure: {
        name: 'figure',
        nodes: [
          { name: 'hips', position: [0, 1.05, 0], bone: true, children: [
            { name: 'pelvis', primitive: 'box', params: { width: 0.5, height: 0.3, depth: 0.3 }, material: 'paint' },
            { name: 'torso', primitive: 'box', params: { width: 0.62, height: 0.72, depth: 0.34 },
              position: [0, 0.5, 0], material: 'paint' },
            { name: 'head', primitive: 'sphere', params: { radius: 0.24, widthSegments: 12, heightSegments: 8 },
              position: [0, 1.08, 0], material: 'metal' },
            { name: 'armL', bone: true, position: [0.42, 0.72, 0], rotation: [0, 0, -18], children: [
              { name: 'upperL', primitive: 'cylinder',
                params: { radiusTop: 0.09, radiusBottom: 0.08, height: 0.5, radialSegments: 8 },
                position: [0, -0.25, 0], material: 'metal' },
              // A sphere at the joint: the era-appropriate way to hide the gap where two rigid
              // limbs meet, and the reason skinning is not needed for this look.
              { name: 'elbowL', primitive: 'sphere', params: { radius: 0.1, widthSegments: 8, heightSegments: 6 },
                position: [0, -0.5, 0], material: 'metal' },
              { name: 'foreL', primitive: 'cylinder',
                params: { radiusTop: 0.07, radiusBottom: 0.08, height: 0.44, radialSegments: 8 },
                position: [0, -0.74, 0], material: 'metal' },
            ] },
            { name: 'armR', bone: true, position: [-0.42, 0.72, 0], rotation: [0, 0, 18], children: [
              { name: 'upperR', primitive: 'cylinder',
                params: { radiusTop: 0.09, radiusBottom: 0.08, height: 0.5, radialSegments: 8 },
                position: [0, -0.25, 0], material: 'metal' },
              { name: 'elbowR', primitive: 'sphere', params: { radius: 0.1, widthSegments: 8, heightSegments: 6 },
                position: [0, -0.5, 0], material: 'metal' },
              { name: 'foreR', primitive: 'cylinder',
                params: { radiusTop: 0.07, radiusBottom: 0.08, height: 0.44, radialSegments: 8 },
                position: [0, -0.74, 0], material: 'metal' },
            ] },
            // The legs pivot at the hip, so the bone sits there and the cylinder hangs below it.
            // A bone at the middle of a limb would swing the limb about its waist.
            { name: 'legL', bone: true, position: [0.16, -0.12, 0], children: [
              { name: 'shinL', primitive: 'cylinder',
                params: { radiusTop: 0.11, radiusBottom: 0.09, height: 0.95, radialSegments: 8 },
                position: [0, -0.48, 0], material: 'metal' },
            ] },
            { name: 'legR', bone: true, position: [-0.16, -0.12, 0], children: [
              { name: 'shinR', primitive: 'cylinder',
                params: { radiusTop: 0.11, radiusBottom: 0.09, height: 0.95, radialSegments: 8 },
                position: [0, -0.48, 0], material: 'metal' },
            ] },
          ] },
        ],
      },
    };
    // Clips are keyed by BONE NAME, which is why one of these could drive any figure whose
    // skeleton uses the same names. Rotations are written as euler degrees because that is what a
    // person types; the engine turns them into quaternions once, when the clip is prepared.
    p.clips = {
      walk: {
        name: 'walk', model: 'figure', duration: 1, loop: true,
        tracks: {
          // Two bobs per stride: the hips rise on each leg's mid-swing, not once per cycle.
          hips: { position: [
            { t: 0, v: [0, 1.05, 0] }, { t: 0.25, v: [0, 1.11, 0] },
            { t: 0.5, v: [0, 1.05, 0] }, { t: 0.75, v: [0, 1.11, 0] },
            { t: 1, v: [0, 1.05, 0] },
          ] },
          legL: { rotation: [
            { t: 0, v: [28, 0, 0], ease: 'easeInOut' }, { t: 0.5, v: [-24, 0, 0], ease: 'easeInOut' },
            { t: 1, v: [28, 0, 0] },
          ] },
          legR: { rotation: [
            { t: 0, v: [-24, 0, 0], ease: 'easeInOut' }, { t: 0.5, v: [28, 0, 0], ease: 'easeInOut' },
            { t: 1, v: [-24, 0, 0] },
          ] },
          // The arms counter-swing against the legs, which is the thing that makes a walk read as
          // a walk rather than as a shuffle.
          armL: { rotation: [
            { t: 0, v: [-26, 0, -18], ease: 'easeInOut' }, { t: 0.5, v: [22, 0, -18], ease: 'easeInOut' },
            { t: 1, v: [-26, 0, -18] },
          ] },
          armR: { rotation: [
            { t: 0, v: [22, 0, 18], ease: 'easeInOut' }, { t: 0.5, v: [-26, 0, 18], ease: 'easeInOut' },
            { t: 1, v: [22, 0, 18] },
          ] },
        },
        events: [{ t: 0.25, name: 'footstep' }, { t: 0.75, name: 'footstep' }],
      },
      idle: {
        name: 'idle', model: 'figure', duration: 2.6, loop: true,
        tracks: {
          hips: { position: [
            { t: 0, v: [0, 1.05, 0], ease: 'easeInOut' }, { t: 1.3, v: [0, 1.02, 0], ease: 'easeInOut' },
            { t: 2.6, v: [0, 1.05, 0] },
          ] },
          armL: { rotation: [
            { t: 0, v: [0, 0, -18], ease: 'easeInOut' }, { t: 1.3, v: [4, 0, -22], ease: 'easeInOut' },
            { t: 2.6, v: [0, 0, -18] },
          ] },
          armR: { rotation: [
            { t: 0, v: [0, 0, 18], ease: 'easeInOut' }, { t: 1.3, v: [4, 0, 22], ease: 'easeInOut' },
            { t: 2.6, v: [0, 0, 18] },
          ] },
        },
      },
      // An additive layer: a shrug that can be dropped on top of a walk or an idle without
      // either of them knowing about it.
      shrug: {
        name: 'shrug', model: 'figure', duration: 0.9, loop: false,
        tracks: {
          armL: { rotation: [
            { t: 0, v: [0, 0, -18] }, { t: 0.3, v: [0, 0, -62], ease: 'easeOut' },
            { t: 0.9, v: [0, 0, -18], ease: 'easeInOut' },
          ] },
          armR: { rotation: [
            { t: 0, v: [0, 0, 18] }, { t: 0.3, v: [0, 0, 62], ease: 'easeOut' },
            { t: 0.9, v: [0, 0, 18], ease: 'easeInOut' },
          ] },
        },
      },
    };
    return p;
  }

  //#endregion === Starter Package ===


  // =====================================================================
  //           Shell — the header, the status bar, the keymap
  // =====================================================================
  //#region === Shell ===

  /**
   * Tells every open window that the package or the selection changed.
   *
   * Blunt on purpose. Working out which windows care about which change is bookkeeping that gets
   * one case wrong and leaves a stale editor on screen; refreshing all of them re-reads from the
   * package, which every editor is written to do cheaply.
   *
   * @returns {void}
   */
  function notifyViewers() {
    wake();
    for (const vp of viewports) vp.dirty = true;
    for (const rec of winOpen.values()) {
      if (rec.editor && rec.editor.refresh) rec.editor.refresh();
    }
  }

  /**
   * Refreshes the header: the unsaved dot, the package name, and where Save goes.
   * @returns {void}
   */
  function updateHeader() {
    dom.pkgName.textContent = pkg.name || 'untitled';
    dom.dot.classList.toggle('on', isDirty());
    dom.dot.title = isDirty() ? 'unsaved changes' : 'saved';
    dom.homeText.textContent = home
      ? (home.kind === 'storage' ? 'browser storage · ' + home.name : home.name)
      : 'no home yet';
    dom.btnRail.classList.toggle('on', !dom.rail.hidden);
    dom.btnView.classList.toggle('on', winOpen.has('view'));
    dom.stat.title = viewports.size + ' live 3D viewport' + (viewports.size === 1 ? '' : 's');
  }

  let statusAt = 0;

  /**
   * Refreshes the status bar, a few times a second rather than every frame.
   *
   * Called from the render loop because that is where the numbers come from. A counter that
   * changes sixty times a second is a smear, so this rate-limits itself rather than asking every
   * caller to remember to.
   *
   * @returns {void}
   */
  function statusTick() {
    const now = Date.now();
    if (now - statusAt < 250) return;
    statusAt = now;
    updateStatus();
  }

  /**
   * Refreshes the counters in the status bar.
   * @returns {void}
   */
  function updateStatus() {
    const parts = ['<b>' + Object.keys(pkg.textures).length + '</b> tex',
                   '<b>' + Object.keys(pkg.materials || {}).length + '</b> mat',
                   '<b>' + Object.keys(pkg.models || {}).length + '</b> models'];
    // The focused viewport's numbers, or the only one when nothing is focused. Summing every open
    // viewport would report a total nobody is looking at.
    const rec = winFocused ? winOpen.get(winFocused) : null;
    let vp = null;
    for (const port of viewports) {
      if (!vp) vp = port;
      if (rec && rec.el.contains(port.canvas)) { vp = port; break; }
    }
    if (vp) {
      parts.push('<b>' + vp.fps.toFixed(0) + '</b> fps');
      parts.push('<b>' + vp.engine.stats.draws + '</b> draws');
      parts.push('<b>' + Math.round(vp.engine.stats.triangles) + '</b> tris');
      if (vp.engine.stats.culled) parts.push('<b>' + vp.engine.stats.culled + '</b> culled');
    }
    parts.push('alloy <b>v' + Alloy.version + '</b>');
    dom.stat.innerHTML = parts.join(' &middot; ');
  }

  /**
   * The keymap. One dispatcher, and the table it carries has to match this comment:
   *
   *   Ctrl+Z / Ctrl+Y   undo, redo
   *   Ctrl+S            save to the home; a package with no home asks where
   *   Ctrl+Shift+S      save as
   *   Ctrl+V            paste a PNG into the focused window's raster layer
   *   Shift+B           the rail
   *   Shift+W           the window menu
   *   Shift+V           the 3D view
   *   Shift+T           tile the desk
   *   Shift+M           the selected model's window
   *   Shift+C           the selected clip's window
   *   W / E / R         in a model or clip window: move, rotate, scale
   *   L                 in a model window: gizmo along the world axes, or the parent's
   *   F                 in a model window: frame the model
   *   Ctrl+D            in a model window: duplicate the selected nodes (Shift+D too)
   *   Delete            in a model window: delete the selected nodes
   *   During a drag     Ctrl inverts snapping, Shift is precision, X / Y / Z lock an axis,
   *                     Escape or the right button cancels; Alt at the press lifts instead of slides;
   *                     digits type an exact amount (minus flips it), Enter keeps it
   *   M / Q / W / V / I in a texture window: marquee, lasso, wand, move, eyedropper
   *   Arrows, Delete    in a texture window with a selection: nudge it (the move tool nudges
   *                     its pixels; Shift is ten), clear its pixels
   *   Ctrl+C / X / V    in a texture window with a selection: the pixel clipboard
   *   B / E / G         in a texture window, on a paint row: pencil, eraser, bucket
   *   L / R / O / P / T in a texture window, on a shape row: line, rect, ellipse, polygon, text
   *   X, [ / ]          in a texture window: swap the colours, brush size (also Ctrl+wheel)
   *   Space             in a clip window: play or stop
   *   K                 in a clip window: key the selected bone at the playhead
   *   O                 in a clip window: onion skins
   *   Left / Right      in a clip window: step the playhead by one frame
   *   Escape            let go: a menu, a card
   *
   * Shell letters are shifted, matching Webposium, so that a future editor here can claim the
   * unshifted rows without a migration. A new shortcut is a new line in this comment and a new
   * branch below, in that order.
   *
   * @param {KeyboardEvent} ev - the keydown
   * @returns {void}
   */
  function onKey(ev) {
    // A person typing a texture name owns every key on the keyboard until they are done.
    const tag = ev.target && ev.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
      if (ev.key === 'Escape') ev.target.blur();
      return;
    }
    if (ev.key === 'Escape') {
      if (activeDrag) { activeDrag.cancel(); return; }
      closeFloaters();
      return;
    }

    // The focused editor sees a key before the shell does, so a model window can claim G, R and E
    // without every other window having to know they exist.
    const focused = winFocused ? winOpen.get(winFocused) : null;
    if (focused && focused.editor && focused.editor.onKey && focused.editor.onKey(ev)) {
      ev.preventDefault();
      return;
    }

    if (ev.ctrlKey || ev.metaKey) {
      // Not during a drag: an undo would replace the package under it and the drag would keep
      // writing into a model nobody is looking at.
      if (activeDrag) return;
      const k = ev.key.toLowerCase();
      if (k === 'z') { ev.preventDefault(); histStep(ev.shiftKey ? 1 : -1); return; }
      if (k === 'y') { ev.preventDefault(); histStep(1); return; }
      if (k === 's') {
        ev.preventDefault();
        if (ev.shiftKey) openSaveAsMenu(window.innerWidth / 2, 80);
        else save();
        return;
      }
      return;
    }

    if (!ev.shiftKey) return;
    const k = ev.key.toUpperCase();
    if (k === 'B') { ev.preventDefault(); toggleRail(); }
    else if (k === 'W') { ev.preventDefault(); openWindowMenu(window.innerWidth - 220, 44); }
    else if (k === 'V') { ev.preventDefault(); openWindow('view'); updateHeader(); }
    else if (k === 'T') { ev.preventDefault(); tileWindows(); }
    else if (k === 'M') {
      ev.preventDefault();
      if (selection && selection.kind === 'model') openWindow('model', selection.id);
      else log('select a model in the rail first');
    }
    else if (k === 'C') {
      ev.preventDefault();
      if (selection && selection.kind === 'clip') openWindow('clip', selection.id);
      else log('select a clip in the rail first');
    }
  }

  /**
   * Shows or hides the rail.
   * @returns {void}
   */
  function toggleRail() {
    dom.rail.hidden = !dom.rail.hidden;
    uiPrefs.rail = !dom.rail.hidden;
    savePrefs();
    updateHeader();
    // Every window's geometry is clamped to the desk, and the desk just changed width.
    for (const rec of winOpen.values()) {
      applyGeometry(rec);
      if (rec.editor && rec.editor.onResize) rec.editor.onResize();
    }
  }

  /**
   * Wires every piece of shell chrome.
   * @returns {void}
   */
  function bindShell() {
    dom.pkgName.addEventListener('click', (ev) => openProjectsMenu(ev.clientX, ev.clientY + 12));
    dom.saveBtn.addEventListener('click', save);
    dom.saveAs.addEventListener('click', (ev) => openSaveAsMenu(ev.clientX, ev.clientY + 12));
    dom.btnRail.addEventListener('click', toggleRail);
    dom.btnWindows.addEventListener('click', (ev) => openWindowMenu(ev.clientX, ev.clientY + 12));
    dom.btnView.addEventListener('click', () => { openWindow('view'); updateHeader(); });
    dom.desk.addEventListener('pointerdown', (ev) => { if (ev.target === dom.desk || ev.target === dom.deskHint) closeFloaters(); });

    window.addEventListener('keydown', onKey);
    for (const type of ['pointerdown', 'pointermove', 'pointerup', 'keydown', 'keyup', 'wheel', 'resize', 'focus']) {
      window.addEventListener(type, wake, { capture: true, passive: true });
    }
    window.addEventListener('pointerdown', (ev) => {
      // A click anywhere outside the menu or the card dismisses it. Inside, it does not.
      if (dom.menu.hidden && dom.card.hidden) return;
      if (dom.menu.contains(ev.target) || dom.card.contains(ev.target)) return;
      closeFloaters();
    }, true);
    window.addEventListener('contextmenu', (ev) => {
      // The browser's own menu is suppressed only where this app has one of its own to offer.
      if (ev.target.closest && ev.target.closest('#rail, .win, #menu')) ev.preventDefault();
    });
    window.addEventListener('resize', () => {
      for (const rec of winOpen.values()) {
        applyGeometry(rec);
        if (rec.editor && rec.editor.onResize) rec.editor.onResize();
      }
    });
    window.addEventListener('beforeunload', (ev) => {
      if (!isDirty()) return;
      ev.preventDefault();
      ev.returnValue = '';
    });
    window.addEventListener('paste', (ev) => {
      const items = ev.clipboardData && ev.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type !== 'image/png') continue;
        const file = item.getAsFile();
        if (!file) continue;
        ev.preventDefault();
        const reader = new FileReader();
        reader.onload = () => {
          const url = String(reader.result);
          const base64 = url.slice(url.indexOf(',') + 1);
          const rec = winFocused ? winOpen.get(winFocused) : null;
          if (rec && rec.editor && rec.editor.onPaste && rec.editor.onPaste(base64)) {
            log('pasted a PNG as an image row');
          } else {
            log('<i>focus a texture window first</i> — then paste');
          }
        };
        reader.readAsDataURL(file);
        return;
      }
    });

    dom.fileIn.addEventListener('change', () => {
      const file = dom.fileIn.files && dom.fileIn.files[0];
      if (!file) return;
      file.text().then((text) => loadPackageText(text, null));
    });

    // Save the set of open windows, so a session comes back the way it was left.
    setInterval(() => {
      const ids = Array.from(winOpen.keys());
      if (JSON.stringify(ids) === JSON.stringify(uiPrefs.open || [])) return;
      uiPrefs.open = ids;
      savePrefs();
    }, 2000);
  }

  //#endregion === Shell ===


  // =====================================================================
  //           Boot — build it, or say clearly why not
  // =====================================================================
  //#region === Boot ===

  dom.ver.textContent = 'v' + Alloy.version;
  dom.rail.hidden = !uiPrefs.rail;

  defineWindowKind('texture', {
    /**
     * @param {string} subject - the texture's name
     * @returns {string} - the window's title
     */
    title: (subject) => 'Texture · ' + subject,
    w: 820, h: 520,
    /**
     * @param {string} subject - the texture's name
     * @returns {boolean} - whether it is still in the package
     */
    exists: (subject) => !!pkg.textures[subject],
    make: makeTextureEditor,
  });

  defineWindowKind('view', {
    /**
     * @returns {string} - the window's title
     */
    title: () => '3D view',
    w: 560, h: 420,
    make: makeViewEditor,
  });

  defineWindowKind('model', {
    /**
     * @param {string} subject - the model's name
     * @returns {string} - the window's title
     */
    title: (subject) => 'Model · ' + subject,
    w: 900, h: 560,
    /**
     * @param {string} subject - the model's name
     * @returns {boolean} - whether it is still in the package
     */
    exists: (subject) => !!(pkg.models && pkg.models[subject]),
    make: makeModelEditor,
  });

  defineWindowKind('clip', {
    /**
     * @param {string} subject - the clip's name
     * @returns {string} - the window's title
     */
    title: (subject) => 'Clip · ' + subject,
    w: 940, h: 620,
    /**
     * @param {string} subject - the clip's name
     * @returns {boolean} - whether it is still in the package
     */
    exists: (subject) => !!(pkg.clips && pkg.clips[subject]),
    make: makeClipEditor,
  });

  defineWindowKind('material', {
    /**
     * @param {string} subject - the material's name
     * @returns {string} - the window's title
     */
    title: (subject) => 'Material · ' + subject,
    w: 620, h: 400,
    /**
     * @param {string} subject - the material's name
     * @returns {boolean} - whether it is still in the package
     */
    exists: (subject) => !!(pkg.materials && pkg.materials[subject]),
    make: makeMaterialEditor,
  });

  // A missing WebGL2 costs the 3D windows and nothing else — the texture engine never touches the
  // GPU — so each viewport reports its own failure in place rather than the app refusing to boot.
  bindShell();

  // What to open with: whatever was saved last, else the starter package. A crash snapshot newer
  // than the save wins, and says so, because the alternative is silently discarding work.
  (function boot() {
    /**
     * Loads the starter package and opens something, so the tool is never a blank room.
     * @returns {void}
     */
    function fallback() {
      adoptPackage(starterPackage());
      selection = { kind: 'model', id: 'hut' };
      buildRail();
      restoreWindows(['view', 'texture:brick']);
      log('alloy <b>v' + Alloy.version + '</b> &middot; the starter package &middot; ' +
          Alloy.primitiveTypes.length + ' primitives, ' + Alloy.generatorTypes.length +
          ' generators, ' + Alloy.drawOpTypes.length + ' ops, ' + Alloy.adjustmentTypes.length +
          ' adjustments');
    }

    /**
     * Selects something, so the 3D view has a subject the moment it opens. A tool that boots with
     * an empty preview and no explanation reads as broken before anyone has touched it.
     * @returns {void}
     */
    function selectFirstTexture() {
      if (selection && pkg.textures[selection.id]) return;
      const names = Object.keys(pkg.textures).sort();
      selection = names.length ? { kind: 'texture', id: names[0] } : null;
    }

    /**
     * Reopens the windows a previous session had open.
     * @param {string[]} fallbackIds - what to open when nothing was remembered
     * @returns {void}
     */
    function restoreWindows(fallbackIds) {
      const ids = (uiPrefs.open && uiPrefs.open.length) ? uiPrefs.open : fallbackIds;
      for (const id of ids) {
        const cut = id.indexOf(':');
        const kind = cut < 0 ? id : id.slice(0, cut);
        const subject = cut < 0 ? undefined : id.slice(cut + 1);
        if (!winKinds[kind]) continue;
        if (subject !== undefined) {
          const map = kind === 'texture' ? pkg.textures : kind === 'model' ? pkg.models
            : kind === 'clip' ? pkg.clips : pkg.materials;
          if (!map || !map[subject]) continue;
        }
        try { openWindow(kind, subject); } catch (err) { /* one bad id must not stop the rest */ }
      }
      updateHeader();
      updateStatus();
    }

    let recovered = null;
    try {
      const raw = localStorage.getItem(SNAP_KEY);
      if (raw) recovered = JSON.parse(raw);
    } catch (err) { recovered = null; }

    const last = uiPrefs.lastStorage;
    if (!last) {
      if (recovered && recovered.pkg) {
        adoptPackage(recovered.pkg, { home: null });
        selectFirstTexture();
        buildRail();
        restoreWindows([]);
        log('<em>recovered unsaved work</em> from ' + new Date(recovered.at).toLocaleTimeString() +
            ' &middot; Save it somewhere, or start a New package');
      } else {
        fallback();
      }
      return;
    }
    storageGet(last).then((p) => {
      adoptPackage(p, { home: { kind: 'storage', name: last } });
      selectFirstTexture();
      buildRail();
      restoreWindows([]);
      log('opened <em>' + escapeHtml(last) + '</em> from browser storage');
      if (recovered && recovered.pkg && recovered.at) {
        log('opened <em>' + escapeHtml(last) + '</em> &middot; <i>there is also unsaved work from ' +
            new Date(recovered.at).toLocaleTimeString() + '</i>');
      }
    }, () => fallback());
  })();

  requestAnimationFrame((t) => { clock.last = t; tickAll(t); });

  //#endregion === Boot ===

</script>
</body>
</html>
