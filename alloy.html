     * default. A wall is this rotated, which is one number in the node's transform.
     *
     * @param {Object} [params] - plane parameters
     * @returns {Geometry} - a triangles geometry
     */
    function plane(params) {
      const p = withDefaults(GEOMETRY_SPECS.plane.defaults, params);
      const su = segCount(p.segmentsX, 1), sv = segCount(p.segmentsZ, 1);
      const b = makeBuilder();
      const pw = sizeOf(p.width), pd = sizeOf(p.depth);
      pushGrid(b, su, sv, (i, j) => {
        const x = (i / su - 0.5) * pw;
        const z = -(j / sv - 0.5) * pd;
        return [x, 0, z, 0, 1, 0, i / su, j / sv];
      });
      return b.done();
    }

    /**
     * Builds a tube: a cylinder, a cone or a truncated cone, depending on the two radii.
     *
     * One builder for all three because they are one shape. A cone is a cylinder whose top radius
     * is zero, and writing it separately would mean two places to fix a normal.
     *
     * The side normals are SMOOTH by default and the caps are always flat. That is the right
     * default for the look: a smooth-shaded barrel with eight sides reads as a barrel, while a
     * flat-shaded one reads as an octagonal prism, and the cap of either reads as a lid.
     *
     * @param {Object} p - already merged parameters
     * @returns {Geometry} - a triangles geometry
     */
    function buildTube(p) {
      const radial = segCount(p.radialSegments, 3);
      const heights = segCount(p.heightSegments, 1);
      const rTop = Math.max(0, p.radiusTop), rBot = Math.max(0, p.radiusBottom);
      // A height of zero divides the slope by zero and fills every side normal with NaN, which
      // then rides all the way into the vertex buffer. Vanishingly thin is fine; zero is not.
      const h = Math.max(1e-6, Math.abs(p.height)), half = h / 2;
      const b = makeBuilder();

      const slope = (rBot - rTop) / h;
      const nScale = 1 / Math.hypot(1, slope);

      /**
       * One point on the side surface.
       * @param {number} i - the radial step
       * @param {number} j - the height step
       * @param {number} normalAt - the radial step to take the normal from
       * @returns {number[]} - a vertex tuple
       */
      function sidePoint(i, j, normalAt) {
        const t = i / radial;
        const angle = t * Math.PI * 2;
        const v = j / heights;
        const r = rBot + (rTop - rBot) * v;
        const y = -half + h * v;
        const na = (normalAt / radial) * Math.PI * 2;
        // Facing outward, and tilted by the slope: a cone's surface normal leans away from
        // horizontal by the same angle its silhouette does. A horizontal normal is the classic
        // mistake that makes a cone shade like a squashed cylinder.
        return [Math.sin(angle) * r, y, Math.cos(angle) * r,
                Math.sin(na) * nScale, slope * nScale, Math.cos(na) * nScale, t, v];
      }

      if (p.smooth) {
        // Columns share their vertices, so the normals blend and an eight-sided barrel reads as
        // a barrel rather than as an octagonal prism.
        pushGrid(b, radial, heights, (i, j) => sidePoint(i, j, i));
      } else {
        // Each facet gets its own four vertices and one normal, taken from the middle of the
        // facet so the flat shading is symmetric.
        for (let i = 0; i < radial; i++) {
          for (let j = 0; j < heights; j++) {
            const mid = i + 0.5;
            const a = sidePoint(i, j, mid), c = sidePoint(i + 1, j, mid);
            const d = sidePoint(i, j + 1, mid), e = sidePoint(i + 1, j + 1, mid);
            const i0 = b.vert(a[0], a[1], a[2], a[3], a[4], a[5], a[6], a[7]);
            const i1 = b.vert(c[0], c[1], c[2], c[3], c[4], c[5], c[6], c[7]);
            const i2 = b.vert(d[0], d[1], d[2], d[3], d[4], d[5], d[6], d[7]);
            const i3 = b.vert(e[0], e[1], e[2], e[3], e[4], e[5], e[6], e[7]);
            b.quad(i0, i1, i2, i3);
          }
        }
      }

      if (p.capped) {
        for (const top of [false, true]) {
          const r = top ? rTop : rBot;
          if (r <= 0) continue;              // a cone's point needs no lid
          const y = top ? half : -half;
          const ny = top ? 1 : -1;
          const centre = b.vert(0, y, 0, 0, ny, 0, 0.5, 0.5);
          const ring = [];
          for (let i = 0; i <= radial; i++) {
            const angle = (i / radial) * Math.PI * 2;
            const sin = Math.sin(angle), cos = Math.cos(angle);
            ring.push(b.vert(sin * r, y, cos * r, 0, ny, 0, 0.5 + sin * 0.5, 0.5 + cos * 0.5));
          }
          for (let i = 0; i < radial; i++) {
            // The two caps face opposite ways, so their triangles wind opposite ways too.
            if (top) b.tri(centre, ring[i], ring[i + 1]);
            else b.tri(centre, ring[i + 1], ring[i]);
          }
        }
      }
      return b.done();
    }

    /**
     * Builds a cylinder.
     * @param {Object} [params] - cylinder parameters
     * @returns {Geometry} - a triangles geometry
     */
    function cylinder(params) { return buildTube(withDefaults(GEOMETRY_SPECS.cylinder.defaults, params)); }

    /**
     * Builds a cone, which is a tube with no top.
     * @param {Object} [params] - cone parameters
     * @returns {Geometry} - a triangles geometry
     */
    function cone(params) {
      const p = withDefaults(GEOMETRY_SPECS.cone.defaults, params);
      return buildTube(Object.assign({}, p, { radiusTop: 0, radiusBottom: p.radius }));
    }

    /**
     * Builds a UV sphere.
     *
     * Poles are where every UV sphere is ugly: the rings converge, so the triangles there are
     * slivers and the texture pinches. That is accepted rather than solved, because the
     * alternatives (an icosphere, a cube sphere) have no natural UV layout at all, and at the
     * segment counts this engine is built for the pinch is a few pixels.
     *
     * @param {Object} [params] - sphere parameters
     * @returns {Geometry} - a triangles geometry
     */
    function sphere(params) {
      const p = withDefaults(GEOMETRY_SPECS.sphere.defaults, params);
      const su = segCount(p.widthSegments, 3), sv = segCount(p.heightSegments, 2);
      const r = sizeOf(p.radius);
      const b = makeBuilder();
      pushGrid(b, su, sv, (i, j) => {
        const u = i / su, v = j / sv;
        const theta = u * Math.PI * 2;
        // v = 0 is the south pole, so the texture's bottom edge lands at the bottom of the ball.
        const phi = (1 - v) * Math.PI;
        const sinPhi = Math.sin(phi);
        const nx = Math.sin(theta) * sinPhi;
        const ny = Math.cos(phi);
        const nz = Math.cos(theta) * sinPhi;
        return [nx * r, ny * r, nz * r, nx, ny, nz, u, v];
      });
      return b.done();
    }

    /**
     * Builds a wedge: a box with one face sloped away, which is every ramp, roof and buttress.
     *
     * Five faces, all flat, and the sloped one gets a real normal rather than a guessed one — a
     * ramp lit as though it were vertical is the giveaway that somebody typed a normal in.
     *
     * @param {Object} [params] - wedge parameters
     * @returns {Geometry} - a triangles geometry
     */
    function wedge(params) {
      const p = withDefaults(GEOMETRY_SPECS.wedge.defaults, params);
      const hw = sizeOf(p.width) / 2, hh = sizeOf(p.height) / 2, hd = sizeOf(p.depth) / 2;
      const b = makeBuilder();


      /**
       * Emits one flat face from corners given counter-clockwise as seen from outside.
       *
       * The normal is COMPUTED from the corners rather than passed in, which is what makes this
       * impossible to get wrong: a face wound the other way would produce a normal pointing into
       * the solid, and the winding and the shading would agree with each other while both being
       * backwards. Deriving one from the other means there is only one thing to get right.
       *
       * @param {Array<number[]>} ring - three or four corners, counter-clockwise from outside
       * @returns {void}
       */
      function face(ring) {
        const e1 = [ring[1][0] - ring[0][0], ring[1][1] - ring[0][1], ring[1][2] - ring[0][2]];
        const e2 = [ring[2][0] - ring[0][0], ring[2][1] - ring[0][1], ring[2][2] - ring[0][2]];
        const n = vec3.normalize([], vec3.cross([], e1, e2));
        // UVs run around the ring, which is enough for a flat face and is replaced the moment
        // anybody projects onto it anyway.
        const uv = ring.length === 4 ? [[0, 0], [1, 0], [1, 1], [0, 1]] : [[0, 0], [1, 0], [0.5, 1]];
        const v = ring.map((p, i) => b.vert(p[0], p[1], p[2], n[0], n[1], n[2], uv[i][0], uv[i][1]));
        for (let i = 1; i + 1 < v.length; i++) b.tri(v[0], v[i], v[i + 1]);
      }

      // A is the low back-left corner and the slope rises toward +Z, so E and F are the top edge.
      const A = [-hw, -hh, -hd], B = [hw, -hh, -hd], C = [hw, -hh, hd], D = [-hw, -hh, hd];
      const E = [-hw, hh, hd], F = [hw, hh, hd];

      // Every ring runs counter-clockwise as seen from OUTSIDE the solid. Read one by standing
      // where its normal points and walking the corners in order; if that walk is clockwise, the
      // face is inside out, and under backface culling an inside-out face is a hole.
      face([A, B, C, D]);      // the bottom, seen from below
      face([E, F, B, A]);      // the slope, facing up and toward the low end
      face([D, C, F, E]);      // the tall back at +Z
      face([B, F, C]);         // the right triangle
      face([D, E, A]);         // the left triangle
      return b.done();
    }

    //#endregion === Primitives ===

    /**
     * Builds the ground grid as coloured line segments, on the XZ plane at y = 0.
     *
     * Three tiers of line, because a grid that is all one colour tells you where the floor is and
     * nothing else. Minor lines give scale, major lines every `majorEvery` steps give a countable
     * unit, and the two lines through the origin take the axis colours so the world's handedness
     * is readable without a legend.
     *
     * @param {Object} [params] - grid parameters
     * @param {number} [params.size] - total extent of the grid, default 20
     * @param {number} [params.step] - distance between minor lines, default 1
     * @param {number} [params.majorEvery] - a major line every N steps, default 5
     * @param {number[]} [params.minor] - rgb of a minor line
     * @param {number[]} [params.major] - rgb of a major line
     * @param {number[]} [params.axisX] - rgb of the line along X
     * @param {number[]} [params.axisZ] - rgb of the line along Z
     * @returns {Geometry} - a lines geometry with positions and colors
     */
    function gridLines(params) {
      const p = withDefaults(GEOMETRY_SPECS.grid.defaults, params);
      const half = p.size / 2;
      const n = Math.floor(half / p.step);          // lines each side of the origin

      const lineCount = (n * 2 + 1) * 2;            // both directions
      const positions = new Float32Array(lineCount * 2 * 3);
      const colors    = new Float32Array(lineCount * 2 * 3);

      let vi = 0;

      /**
       * Appends one segment and its colour.
       * @param {number} x1 - start x
       * @param {number} z1 - start z
       * @param {number} x2 - end x
       * @param {number} z2 - end z
       * @param {number[]} c - rgb colour for both ends
       * @returns {void}
       */
      function segment(x1, z1, x2, z2, c) {
        positions[vi] = x1; positions[vi + 1] = 0; positions[vi + 2] = z1;
        colors[vi] = c[0]; colors[vi + 1] = c[1]; colors[vi + 2] = c[2];
        vi += 3;
        positions[vi] = x2; positions[vi + 1] = 0; positions[vi + 2] = z2;
        colors[vi] = c[0]; colors[vi + 1] = c[1]; colors[vi + 2] = c[2];
        vi += 3;
      }

      for (let i = -n; i <= n; i++) {
        const d = i * p.step;
        const major = (i % p.majorEvery) === 0;
        // A line at d === 0 running along Z is the X axis seen edge-on, and vice versa.
        segment(d, -half, d, half, i === 0 ? p.axisZ : (major ? p.major : p.minor));
        segment(-half, d, half, d, i === 0 ? p.axisX : (major ? p.major : p.minor));
      }

      return { positions, colors, mode: 'lines' };
    }

    /**
     * Turns a triangle geometry into its unique edges, as a lines geometry.
     *
     * Every edge appears in two triangles, so the pairs are deduplicated by their sorted vertex
     * indices — without that a wireframe is drawn twice, which costs double and shows as a
     * heavier line wherever two faces meet.
     *
     * The joint attribute is carried across, which is the whole point: a wireframe of a skinned
     * model has to be posed by the same bones the solid one is, or the ghost stands still while
     * the model walks away from it.
     *
     * @param {Geometry} g - a triangles geometry
     * @param {number[]} [color] - rgb for every vertex, default mid grey
     * @returns {Geometry} - a lines geometry
     */
    function edgeLines(g, color) {
      const col = color || [0.5, 0.5, 0.5];
      const seen = new Set();
      const idx = [];
      for (let t = 0; t < g.indices.length; t += 3) {
        const tri = [g.indices[t], g.indices[t + 1], g.indices[t + 2]];
        for (let e = 0; e < 3; e++) {
          const a = tri[e], b = tri[(e + 1) % 3];
          const key = a < b ? a + '_' + b : b + '_' + a;
          if (seen.has(key)) continue;
          seen.add(key);
          idx.push(a, b);
        }
      }
      const positions = new Float32Array(idx.length * 3);
      const colors = new Float32Array(idx.length * 3);
      const joints = g.joints ? new Float32Array(idx.length) : null;
      idx.forEach((v, i) => {
        positions[i * 3] = g.positions[v * 3];
        positions[i * 3 + 1] = g.positions[v * 3 + 1];
        positions[i * 3 + 2] = g.positions[v * 3 + 2];
        colors[i * 3] = col[0];
        colors[i * 3 + 1] = col[1];
        colors[i * 3 + 2] = col[2];
        if (joints) joints[i] = g.joints[v];
      });
      const out = { positions, colors, mode: 'lines' };
      if (joints) out.joints = joints;
      computeBounds(out);
      return out;
    }

    /**
     * Builds three coloured lines from the origin along +X, +Y and +Z.
     *
     * X red, Y green, Z blue, which is the convention every 3D tool shares and the one thing in
     * a viewport nobody should have to look up.
     *
     * @param {Object} [params] - axis parameters
     * @param {number} [params.length] - how far each axis reaches, default 1
     * @returns {Geometry} - a lines geometry with positions and colors
     */
    function axisLines(params) {
      const p = withDefaults(GEOMETRY_SPECS.axes.defaults, params);
      const L = p.length;
      const positions = new Float32Array([
        0, 0, 0,  L, 0, 0,
        0, 0, 0,  0, L, 0,
        0, 0, 0,  0, 0, L,
      ]);
      const colors = new Float32Array([
        1.00, 0.29, 0.31,   1.00, 0.29, 0.31,
        0.44, 0.90, 0.42,   0.44, 0.90, 0.42,
        0.35, 0.61, 1.00,   0.35, 0.61, 1.00,
      ]);
      return { positions, colors, mode: 'lines' };
    }

    // The geometry registry. `defaults` is the object withDefaults merges over, and `params` is
    // what a UI or an AI reads to know what may be set and within what range.
    //
    // Keeping the two side by side in one table is what stops them drifting: a parameter added to
    // the builder and forgotten here has no editor and no documentation, and a parameter listed
    // here that the builder ignores is a control that does nothing. The checker asserts they match
    // for every entry.
    const GEOMETRY_SPECS = {
      box: {
        build: box,
        description: 'An axis-aligned box with flat-shaded faces and one UV square per face.',
        defaults: { width: 1, height: 1, depth: 1, segments: 1 },
        params: {
          width:    { type: 'number', min: 0.001, max: 1000, step: 0.1, label: 'Width (X)' },
          height:   { type: 'number', min: 0.001, max: 1000, step: 0.1, label: 'Height (Y)' },
          depth:    { type: 'number', min: 0.001, max: 1000, step: 0.1, label: 'Depth (Z)' },
          segments: { type: 'number', min: 1, max: 64, step: 1, label: 'Cells per face edge' },
        },
      },
      plane: {
        build: plane,
        description: 'A flat sheet on the ground plane, facing up. Floors, walls once turned, decals.',
        defaults: { width: 1, depth: 1, segmentsX: 1, segmentsZ: 1 },
        params: {
          width:     { type: 'number', min: 0.001, max: 1000, step: 0.1, label: 'Width (X)' },
          depth:     { type: 'number', min: 0.001, max: 1000, step: 0.1, label: 'Depth (Z)' },
          segmentsX: { type: 'number', min: 1, max: 256, step: 1, label: 'Cells across' },
          segmentsZ: { type: 'number', min: 1, max: 256, step: 1, label: 'Cells down' },
        },
      },
      cylinder: {
        build: cylinder,
        description: 'A tube. Different top and bottom radii make a truncated cone.',
        defaults: {
          radiusTop: 0.5, radiusBottom: 0.5, height: 1,
          radialSegments: 12, heightSegments: 1, capped: true, smooth: true,
        },
        params: {
          radiusTop:      { type: 'number', min: 0, max: 1000, step: 0.05, label: 'Top radius' },
          radiusBottom:   { type: 'number', min: 0, max: 1000, step: 0.05, label: 'Bottom radius' },
          height:         { type: 'number', min: 0.001, max: 1000, step: 0.1, label: 'Height' },
          radialSegments: { type: 'number', min: 3, max: 128, step: 1, label: 'Sides' },
          heightSegments: { type: 'number', min: 1, max: 64, step: 1, label: 'Rings' },
          capped:         { type: 'boolean', label: 'Caps' },
          smooth:         { type: 'boolean', label: 'Smooth sides' },
        },
      },
      cone: {
        build: cone,
        description: 'A cone. A cylinder whose top has closed to a point.',
        defaults: { radius: 0.5, height: 1, radialSegments: 12, heightSegments: 1, capped: true, smooth: true },
        params: {
          radius:         { type: 'number', min: 0.001, max: 1000, step: 0.05, label: 'Base radius' },
          height:         { type: 'number', min: 0.001, max: 1000, step: 0.1, label: 'Height' },
          radialSegments: { type: 'number', min: 3, max: 128, step: 1, label: 'Sides' },
          heightSegments: { type: 'number', min: 1, max: 64, step: 1, label: 'Rings' },
          capped:         { type: 'boolean', label: 'Base cap' },
          smooth:         { type: 'boolean', label: 'Smooth sides' },
        },
      },
      sphere: {
        build: sphere,
        description: 'A UV sphere: rings of longitude and latitude, smooth shaded.',
        defaults: { radius: 0.5, widthSegments: 16, heightSegments: 10 },
        params: {
          radius:         { type: 'number', min: 0.001, max: 1000, step: 0.05, label: 'Radius' },
          widthSegments:  { type: 'number', min: 3, max: 128, step: 1, label: 'Segments around' },
          heightSegments: { type: 'number', min: 2, max: 128, step: 1, label: 'Segments top to bottom' },
        },
      },
      wedge: {
        build: wedge,
        description: 'A triangular prism sloping up toward +Z. Ramps, roofs, buttresses.',
        defaults: { width: 1, height: 1, depth: 1 },
        params: {
          width:  { type: 'number', min: 0.001, max: 1000, step: 0.1, label: 'Width (X)' },
          height: { type: 'number', min: 0.001, max: 1000, step: 0.1, label: 'Height (Y)' },
          depth:  { type: 'number', min: 0.001, max: 1000, step: 0.1, label: 'Depth (Z)' },
        },
      },
      grid: {
        build: gridLines,
        description: 'The ground grid, as coloured line segments on the XZ plane.',
        defaults: {
          size: 20, step: 1, majorEvery: 5,
          minor:  [0.16, 0.19, 0.24],
          major:  [0.26, 0.31, 0.39],
          axisX:  [0.52, 0.20, 0.22],
          axisZ:  [0.20, 0.32, 0.52],
        },
        params: {
          size:       { type: 'number', min: 1, max: 1000, step: 1, label: 'Extent' },
          step:       { type: 'number', min: 0.01, max: 100, step: 0.1, label: 'Spacing' },
          majorEvery: { type: 'number', min: 1, max: 100, step: 1, label: 'Major every' },
          minor:      { type: 'color', label: 'Minor line' },
          major:      { type: 'color', label: 'Major line' },
          axisX:      { type: 'color', label: 'X axis line' },
          axisZ:      { type: 'color', label: 'Z axis line' },
        },
      },
      axes: {
        build: axisLines,
        description: 'Three coloured lines from the origin: X red, Y green, Z blue.',
        defaults: { length: 1 },
        params: {
          length: { type: 'number', min: 0.01, max: 1000, step: 0.1, label: 'Length' },
        },
      },
    };

    // Which geometry types are solid shapes a model may be built from. The grid and the axes are
    // in the registry because they are geometry, but a node cannot be made of them, and a mesh
    // workbench listing "grid" as a primitive would be offering nonsense.
    const PRIMITIVE_TYPES = ['box', 'plane', 'cylinder', 'cone', 'sphere', 'wedge'];

    /**
     * Builds a geometry by name, the way a model file names its primitives.
     *
     * This is the door Phase 3's node tree walks through: a node says `{ primitive: 'box',
     * params: {...} }` and never holds a builder function, because a function in a data block is
     * a function that cannot be serialized, undone, or trusted (see the OFCU Bible).
     *
     * @param {string} type - a key of GEOMETRY_SPECS
     * @param {Object} [params] - parameters, merged over the type's defaults
     * @returns {Geometry} - the built geometry
     */
    function buildGeometry(type, params) {
      const spec = GEOMETRY_SPECS[type];
      if (!spec) {
        throw new Error('Alloy.buildGeometry: unknown geometry type "' + type + '". Known types: ' +
                        Object.keys(GEOMETRY_SPECS).join(', ') + '.');
      }
      return spec.build(params);
    }

    /**
     * Describes a geometry type: what it is, what it takes, and what it defaults to.
     * @param {string} type - a key of GEOMETRY_SPECS
     * @returns {Object} - { type, description, defaults, params }, all freshly copied
     */
    function describeGeometry(type) {
      const spec = GEOMETRY_SPECS[type];
      if (!spec) {
        throw new Error('Alloy.describeGeometry: unknown geometry type "' + type + '". Known ' +
                        'types: ' + Object.keys(GEOMETRY_SPECS).join(', ') + '.');
      }
      return {
        type,
        description: spec.description,
        defaults: JSON.parse(JSON.stringify(spec.defaults)),
        params: JSON.parse(JSON.stringify(spec.params)),
      };
    }



    // *********************************************************************
    //           UV Projection — texels the same size on everything
    // *********************************************************************
    //#region === UV Projection ===

    // *********************************************************************
    // MENTAL MODEL: A PRIMITIVE'S OWN UVs GIVE EVERY FACE A FULL 0-TO-1 SQUARE, which is exactly
    // wrong for a world built out of stretched boxes. A wall three units long and one high gets
    // the same texture as a one-by-one crate, so the bricks on the wall are three times as wide
    // as the bricks on the crate standing next to it.
    //
    // Projection fixes it by deciding UVs from POSITION rather than from the surface's own
    // parameters, with a scale in WORLD UNITS PER REPEAT. Set the scale to 1 and every texel is
    // the same size on every object in the scene, however each object is shaped. That is the one
    // number that makes a set of primitives look like one building rather than six props.
    //
    // Three modes, and the choice is about the shape, not about taste:
    //   BOX         each vertex takes the plane its normal points most along. Everything boxy.
    //   PLANAR      one plane for the whole surface. Floors, walls, decals, anything flat.
    //   CYLINDRICAL angle around an axis. Barrels, columns, tree trunks, limbs.
    //
    // Cylindrical projection has one honest limitation: a surface ON the axis has no angle,
    // and the centre of a cylinder's cap is exactly such a point, so a cap gets an arbitrary
    // answer. That is a property of the projection rather than a bug, and it is the same in
    // every tool that offers one. Project the sides cylindrically and leave the primitive's own
    // UVs on the caps, which already fit them.
    //
    // Projection happens at build time on the object's own coordinates, so it is baked into the
    // vertex buffer and costs nothing at draw time.
    // *********************************************************************

    /**
     * Rewrites a geometry's UVs by projecting its positions.
     *
     * @param {Geometry} g - the geometry, whose uvs are replaced in place
     * @param {Object} [opts] - projection options
     * @param {string} [opts.mode] - 'box', 'planar' or 'cylindrical'; anything else leaves the UVs alone
     * @param {string} [opts.axis] - 'x', 'y' or 'z'; the plane's normal, or the cylinder's axis
     * @param {number|number[]} [opts.scale] - world units per repeat, one number or [u, v]
     * @param {number[]} [opts.offset] - added after scaling, in repeats
     * @returns {Geometry} - g
     */
    function projectUVs(g, opts) {
      const cfg = opts || {};
      const mode = cfg.mode;
      if (!mode || mode === 'default') return g;
      if (mode !== 'box' && mode !== 'planar' && mode !== 'cylindrical') {
        throw new Error('Alloy.projectUVs: unknown mode "' + mode + '". Use default, box, planar ' +
                        'or cylindrical.');
      }
      const scale = Array.isArray(cfg.scale) ? cfg.scale : [cfg.scale || 1, cfg.scale || 1];
      const su = scale[0] || 1, sv = scale[1] || 1;
      const off = cfg.offset || [0, 0];
      const axis = cfg.axis || 'y';
      const p = g.positions, n = g.normals, uv = g.uvs;
      if (!uv || uv.length !== (p.length / 3) * 2) {
        g.uvs = new Float32Array((p.length / 3) * 2);
      }
      const out = g.uvs;

      for (let i = 0, k = 0; i < p.length; i += 3, k += 2) {
        const x = p[i], y = p[i + 1], z = p[i + 2];
        let u = 0, v = 0;

        if (mode === 'box') {
          const nx = n ? Math.abs(n[i]) : 0, ny = n ? Math.abs(n[i + 1]) : 1, nz = n ? Math.abs(n[i + 2]) : 0;
          // The signs are chosen so opposite faces are not mirror images of each other, which is
          // what a naive projection produces and what makes text on a crate read backwards on the
          // far side. They match the u and v axes in BOX_FACES exactly.
          if (nx >= ny && nx >= nz) {
            u = n[i] > 0 ? -z : z;
            v = y;
          } else if (ny >= nz) {
            u = x;
            v = n[i + 1] > 0 ? -z : z;
          } else {
            u = n[i + 2] > 0 ? x : -x;
            v = y;
          }
        } else if (mode === 'planar') {
          if (axis === 'x') { u = -z; v = y; }
          else if (axis === 'z') { u = x; v = y; }
          else { u = x; v = -z; }
        } else {
          // Cylindrical. atan2 is the one transcendental in this path; it runs at build time, not
          // per frame, and a last-bit difference between engines moves a UV by less than a texel.
          if (axis === 'x') { u = Math.atan2(z, y) / (Math.PI * 2); v = x; }
          else if (axis === 'z') { u = Math.atan2(x, y) / (Math.PI * 2); v = z; }
          else { u = Math.atan2(x, z) / (Math.PI * 2); v = y; }
          // Wrapped into 0..1 rather than left at -0.5..0.5, so the discontinuity sits at one
          // known place and mendCylindricalSeam below knows where to look for it.
          if (u < 0) u += 1;
          // The angle is already a full turn per repeat, so only the height takes the scale.
          out[k] = u + off[0];
          out[k + 1] = v / sv + off[1];
          continue;
        }
        out[k] = u / su + off[0];
        out[k + 1] = v / sv + off[1];
      }
      if (mode === 'cylindrical') mendCylindricalSeam(g);
      return g;
    }

    /**
     * Repairs the seam a cylindrical projection leaves behind.
     *
     * Going all the way round, u climbs to 1 and then drops to 0. The triangles that straddle
     * that drop interpolate u backwards across the entire texture, so a single column of faces
     * shows the whole image squeezed into it, mirrored. It is the most recognisable artifact in
     * texturing and it is invisible until the model turns.
     *
     * The repair is to give those triangles their own copies of the low vertices, at u + 1. It
     * costs a handful of duplicated vertices per ring and nothing at all at draw time.
     *
     * @param {Geometry} g - the geometry, whose uvs and indices may grow
     * @returns {void}
     */
    function mendCylindricalSeam(g) {
      const idx = g.indices;
      if (!idx) return;
      const pos = Array.from(g.positions);
      const nrm = g.normals ? Array.from(g.normals) : null;
      const uv = Array.from(g.uvs);
      const clones = new Map();
      let grew = false;

      for (let t = 0; t < idx.length; t += 3) {
        const a = idx[t], b = idx[t + 1], c = idx[t + 2];
        const ua = uv[a * 2], ub = uv[b * 2], uc = uv[c * 2];
        // Half a turn is the threshold: a triangle genuinely spanning more than half the
        // circumference does not exist on any cylinder anyone will build.
        if (Math.max(ua, ub, uc) - Math.min(ua, ub, uc) <= 0.5) continue;
        grew = true;
        for (const slot of [0, 1, 2]) {
          const v = idx[t + slot];
          if (uv[v * 2] >= 0.5) continue;
          let clone = clones.get(v);
          if (clone === undefined) {
            clone = pos.length / 3;
            pos.push(g.positions[v * 3], g.positions[v * 3 + 1], g.positions[v * 3 + 2]);
            if (nrm) nrm.push(g.normals[v * 3], g.normals[v * 3 + 1], g.normals[v * 3 + 2]);
            uv.push(uv[v * 2] + 1, uv[v * 2 + 1]);
            clones.set(v, clone);
          }
          idx[t + slot] = clone;
        }
      }
      if (!grew) return;
      g.positions = new Float32Array(pos);
      if (nrm) g.normals = new Float32Array(nrm);
      g.uvs = new Float32Array(uv);
      // The clones pushed the vertex count up, which can cross the 16-bit index ceiling.
      if (pos.length / 3 > 65535 && !(idx instanceof Uint32Array)) {
        g.indices = new Uint32Array(idx);
      }
    }

    //#endregion === UV Projection ===

    // *********************************************************************
    //           Subdivision — Catmull-Clark, for when a box should be a pebble
    // *********************************************************************
    //#region === Subdivision ===

    // *********************************************************************
    // MENTAL MODEL: SUBDIVISION NEEDS TOPOLOGY, AND A PRIMITIVE HAS NONE. A box arrives here as
    // twenty-four vertices in six unconnected islands, because that is what gives it crisp
    // shading. Smoothing that box face by face would round each face into nothing and leave the
    // cracks between them exactly where they were.
    //
    // So the first thing this does is WELD: merge vertices that share a position, and build faces
    // and edges out of the result. Only then is there a surface to smooth.
    //
    // Catmull-Clark itself is three averages and one weighted sum:
    //   FACE POINT    the centre of each face
    //   EDGE POINT    the average of an edge's two ends and the two faces beside it
    //   VERTEX POINT  (F + 2R + (n-3)P) / n, pulling each old vertex toward its neighbours
    // and then every face becomes one quad per corner. Each level roughly quadruples the
    // triangles, which is why two levels is usually the most anyone wants.
    //
    // UVs TRAVEL WITH FACES, NOT WITH VERTICES, all the way through. That is the one thing worth
    // being careful about: welding deliberately merges the three corners of a box that meet at a
    // point, and those three corners have three different UVs. Storing UVs per vertex would keep
    // whichever was written last and smear the texture across the seam. Storing them per face
    // corner keeps all three, and the final split hands each face its own.
    //
    // BOUNDARIES get their own rule — an open edge smooths along itself and ignores the surface —
    // without which a subdivided plane pulls its own border inward and shrinks.
    // *********************************************************************

    /**
     * Welds vertices that share a position and builds the face list that implies.
     *
     * The tolerance is a quantization rather than a search: positions are rounded to a grid and
     * keyed by the result, which is one pass instead of the quadratic comparison the obvious
     * implementation uses. A grid of 1e-5 is far finer than any primitive's own rounding and far
     * coarser than the float noise that separates two vertices meant to be the same.
     *
     * @param {Geometry} g - the source geometry
     * @returns {Object} - `{positions, faces}`; each face is welded indices carrying `uv` per corner
     */
    function weldGeometry(g) {
      const p = g.positions;
      const uvs = g.uvs;
      const map = new Map();
      const positions = [];
      const remap = new Int32Array(p.length / 3);

      for (let i = 0, v = 0; i < p.length; i += 3, v++) {
        const key = Math.round(p[i] * 1e5) + ',' + Math.round(p[i + 1] * 1e5) + ',' +
                    Math.round(p[i + 2] * 1e5);
        let at = map.get(key);
        if (at === undefined) {
          at = positions.length / 3;
          map.set(key, at);
          positions.push(p[i], p[i + 1], p[i + 2]);
        }
        remap[v] = at;
      }

      // Prefer the quads the builder recorded; fall back to triangles for a geometry that
      // arrived from somewhere else.
      const source = g.faces && g.faces.length
        ? g.faces
        : (function trianglesAsFaces() {
            const out = [];
            for (let i = 0; i < g.indices.length; i += 3) {
              out.push([g.indices[i], g.indices[i + 1], g.indices[i + 2]]);
            }
            return out;
          })();

      const faces = [];
      for (const src of source) {
        const welded = src.map((v) => remap[v]);
        // Drop corners that welded onto the one before them, then discard anything left with
        // fewer than three distinct corners: it has no area, contributes nothing, and would
        // divide by zero in the normal pass.
        const uniq = [], keep = [];
        for (let i = 0; i < welded.length; i++) {
          if (uniq.indexOf(welded[i]) >= 0) continue;
          uniq.push(welded[i]);
          keep.push(i);
        }
        if (uniq.length < 3) continue;
        const face = uniq;
        face.uv = keep.map((i) => (uvs ? [uvs[src[i] * 2], uvs[src[i] * 2 + 1]] : [0, 0]));
        faces.push(face);
      }
      return { positions, faces };
    }

    /**
     * Runs one level of Catmull-Clark.
     * @param {number[]} positions - flat xyz, welded
     * @param {Array<number[]>} faces - vertex indices per face, each carrying `uv` per corner
     * @returns {Object} - `{positions, faces}` for the next level
     */
    function catmullClarkStep(positions, faces) {
      const vCount = positions.length / 3;

      /**
       * Averages a list of vertices into a point.
       * @param {number[]} list - vertex indices
       * @returns {number[]} - the centroid
       */
      function centroid(list) {
        let x = 0, y = 0, z = 0;
        for (const v of list) { x += positions[v * 3]; y += positions[v * 3 + 1]; z += positions[v * 3 + 2]; }
        const k = 1 / list.length;
        return [x * k, y * k, z * k];
      }

      /**
       * Averages a list of uv pairs.
       * @param {Array<number[]>} list - uv pairs
       * @returns {number[]} - the average
       */
      function centroidUV(list) {
        let u = 0, v = 0;
        for (const t of list) { u += t[0]; v += t[1]; }
        return [u / list.length, v / list.length];
      }

      const facePoints = faces.map((f) => centroid(f));
      const faceUV = faces.map((f) => centroidUV(f.uv));

      // --- Edges: which faces touch each ---
      const edges = new Map();
      /**
       * The key two endpoints share whichever way round they arrive.
       * @param {number} a - one endpoint
       * @param {number} b - the other
       * @returns {string} - the key
       */
      function edgeKey(a, b) { return a < b ? a + '_' + b : b + '_' + a; }

      faces.forEach((f, fi) => {
        for (let i = 0; i < f.length; i++) {
          const a = f[i], b = f[(i + 1) % f.length];
          const key = edgeKey(a, b);
          let e = edges.get(key);
          if (!e) { e = { a, b, faces: [] }; edges.set(key, e); }
          e.faces.push(fi);
        }
      });

      // --- What each old vertex is surrounded by, gathered before anything is appended ---
      const vFaceSum = [], vEdgeSum = [], vBoundary = [];
      const vFaceCount = new Int32Array(vCount), vEdgeCount = new Int32Array(vCount);
      for (let v = 0; v < vCount; v++) { vFaceSum.push([0, 0, 0]); vEdgeSum.push([0, 0, 0]); vBoundary.push(null); }

      faces.forEach((f, fi) => {
        for (const v of f) {
          vFaceSum[v][0] += facePoints[fi][0];
          vFaceSum[v][1] += facePoints[fi][1];
          vFaceSum[v][2] += facePoints[fi][2];
          vFaceCount[v]++;
        }
      });
      for (const e of edges.values()) {
        const mid = centroid([e.a, e.b]);
        for (const v of [e.a, e.b]) {
          vEdgeSum[v][0] += mid[0]; vEdgeSum[v][1] += mid[1]; vEdgeSum[v][2] += mid[2];
          vEdgeCount[v]++;
        }
        if (e.faces.length === 1) {
          // An open edge. Its two ends move along the boundary curve and ignore the surface
          // entirely — otherwise the border of an open mesh is dragged inward at every level and
          // a subdivided plane quietly shrinks.
          for (const v of [e.a, e.b]) {
            if (!vBoundary[v]) vBoundary[v] = [];
            vBoundary[v].push(mid);
          }
        }
      }

      const newPositions = [];
      /**
       * Appends a point and returns its index.
       * @param {number[]} pt - xyz
       * @returns {number} - the index
       */
      function push(pt) { newPositions.push(pt[0], pt[1], pt[2]); return newPositions.length / 3 - 1; }

      const vertexNew = [];
      for (let v = 0; v < vCount; v++) {
        const P = [positions[v * 3], positions[v * 3 + 1], positions[v * 3 + 2]];
        let moved;
        if (vBoundary[v] && vBoundary[v].length >= 2) {
          const m1 = vBoundary[v][0], m2 = vBoundary[v][1];
          moved = [(P[0] * 6 + m1[0] + m2[0]) / 8,
                   (P[1] * 6 + m1[1] + m2[1]) / 8,
                   (P[2] * 6 + m1[2] + m2[2]) / 8];
        } else if (vFaceCount[v] > 0 && vEdgeCount[v] > 0) {
          const n = vFaceCount[v];
          const F = [vFaceSum[v][0] / n, vFaceSum[v][1] / n, vFaceSum[v][2] / n];
          const R = [vEdgeSum[v][0] / vEdgeCount[v], vEdgeSum[v][1] / vEdgeCount[v],
                     vEdgeSum[v][2] / vEdgeCount[v]];
          moved = [(F[0] + 2 * R[0] + (n - 3) * P[0]) / n,
                   (F[1] + 2 * R[1] + (n - 3) * P[1]) / n,
                   (F[2] + 2 * R[2] + (n - 3) * P[2]) / n];
        } else {
          moved = P;
        }
        vertexNew.push(push(moved));
      }
      const faceNew = facePoints.map(push);
      const edgeNew = new Map();
      for (const [key, e] of edges) {
        let pt;
        if (e.faces.length === 2) {
          const f0 = facePoints[e.faces[0]], f1 = facePoints[e.faces[1]];
          pt = [(positions[e.a * 3] + positions[e.b * 3] + f0[0] + f1[0]) / 4,
                (positions[e.a * 3 + 1] + positions[e.b * 3 + 1] + f0[1] + f1[1]) / 4,
                (positions[e.a * 3 + 2] + positions[e.b * 3 + 2] + f0[2] + f1[2]) / 4];
        } else {
          pt = centroid([e.a, e.b]);          // a boundary edge simply splits in half
        }
        edgeNew.set(key, push(pt));
      }

      // --- One quad per corner of every old face, keeping that corner's own UVs ---
      const outFaces = [];
      faces.forEach((f, fi) => {
        for (let i = 0; i < f.length; i++) {
          const prev = (i + f.length - 1) % f.length, next = (i + 1) % f.length;
          const quad = [
            vertexNew[f[i]],
            edgeNew.get(edgeKey(f[i], f[next])),
            faceNew[fi],
            edgeNew.get(edgeKey(f[prev], f[i])),
          ];
          quad.uv = [
            f.uv[i],
            centroidUV([f.uv[i], f.uv[next]]),
            faceUV[fi],
            centroidUV([f.uv[prev], f.uv[i]]),
          ];
          outFaces.push(quad);
        }
      });

      return { positions: newPositions, faces: outFaces };
    }

    /**
     * Subdivides a geometry with Catmull-Clark.
     *
     * @param {Geometry} g - the source geometry
     * @param {number} levels - how many times; 1 or 2 in practice, capped at 4
     * @returns {Geometry} - a new geometry with smooth normals, or g itself at zero levels
     */
    function subdivide(g, levels) {
      const n = Math.max(0, Math.min(4, Math.round(levels || 0)));
      if (!n) return g;

      const welded = weldGeometry(g);
      let positions = welded.positions;
      let faces = welded.faces;
      for (let level = 0; level < n; level++) {
        const step = catmullClarkStep(positions, faces);
        positions = step.positions;
        faces = step.faces;
      }

      // Smooth normals from the final topology, area weighted: a cross product's length is twice
      // the triangle's area, so not normalizing before accumulating gives large faces the
      // influence they should have and slivers almost none.
      const vCount = positions.length / 3;
      const normals = new Float32Array(vCount * 3);
      for (const f of faces) {
        for (let i = 1; i + 1 < f.length; i++) {
          const a = f[0], b = f[i], c = f[i + 1];
          const ax = positions[b * 3] - positions[a * 3];
          const ay = positions[b * 3 + 1] - positions[a * 3 + 1];
          const az = positions[b * 3 + 2] - positions[a * 3 + 2];
          const bx = positions[c * 3] - positions[a * 3];
          const by = positions[c * 3 + 1] - positions[a * 3 + 1];
          const bz = positions[c * 3 + 2] - positions[a * 3 + 2];
          const cx = ay * bz - az * by, cy = az * bx - ax * bz, cz = ax * by - ay * bx;
          for (const v of [a, b, c]) {
            normals[v * 3] += cx; normals[v * 3 + 1] += cy; normals[v * 3 + 2] += cz;
          }
        }
      }
      for (let v = 0; v < vCount; v++) {
        const l = Math.hypot(normals[v * 3], normals[v * 3 + 1], normals[v * 3 + 2]);
        if (l > 0) { normals[v * 3] /= l; normals[v * 3 + 1] /= l; normals[v * 3 + 2] /= l; }
        else normals[v * 3 + 1] = 1;
      }

      // Split per face corner, so the UVs that were kept per face survive into the buffer.
      const b = makeBuilder();
      for (const f of faces) {
        const ring = f.map((v, i) => b.vert(
          positions[v * 3], positions[v * 3 + 1], positions[v * 3 + 2],
          normals[v * 3], normals[v * 3 + 1], normals[v * 3 + 2],
          f.uv[i][0], f.uv[i][1]));
        for (let i = 1; i + 1 < ring.length; i++) b.tri(ring[0], ring[i], ring[i + 1]);
      }
      return b.done();
    }

    //#endregion === Subdivision ===


    // *********************************************************************
    //           Frustum — what the camera can actually see
    // *********************************************************************
    //#region === Frustum ===

    // *********************************************************************
    // MENTAL MODEL: CULLING IS A COMPARISON, NOT AN OPTIMIZATION YOU TURN ON LATER. Six planes
    // come straight out of the view-projection matrix, and an object is skipped when its bounding
    // box is entirely behind any one of them.
    //
    // The test is conservative in the one direction that is safe: a box straddling a plane is
    // drawn. A false positive costs a draw call nobody sees; a false negative is geometry that
    // vanishes when you look at it from the wrong angle, which is the bug people spend an evening
    // on before they suspect the culling.
    // *********************************************************************

    /**
     * Extracts the six frustum planes from a view-projection matrix.
     *
     * The rows of the matrix, not the columns. In column-major storage the i-th row is
     * `[m[i], m[4+i], m[8+i], m[12+i]]`, and reading columns instead is the mistake that produces
     * a frustum rotated ninety degrees from the camera — which culls correctly right up to the
     * moment you turn.
     *
     * @param {Float32Array} out - destination, 24 floats: six planes of [a, b, c, d]
     * @param {Float32Array} m - the view-projection matrix
     * @returns {Float32Array} - out
     */
    function frustumFromMatrix(out, m) {
      // Written straight into `out` with scalar locals: this runs every frame and used to build
      // eleven throwaway arrays doing it, which at 165 frames a second is a steady drip for the
      // collector. Plane i is row 3 plus or minus row r, for r = 0 (left, right), 1 (bottom,
      // top), 2 (near, far).
      for (let i = 0; i < 6; i++) {
        const r = i >> 1, sign = (i & 1) ? -1 : 1;
        const a = m[3] + sign * m[r];
        const b = m[7] + sign * m[4 + r];
        const c = m[11] + sign * m[8 + r];
        const d = m[15] + sign * m[12 + r];
        // Normalizing makes the fourth component a real signed distance, which is what lets the
        // same planes be used for anything else that needs one.
        const l = Math.hypot(a, b, c) || 1;
        out[i * 4] = a / l;
        out[i * 4 + 1] = b / l;
        out[i * 4 + 2] = c / l;
        out[i * 4 + 3] = d / l;
      }
      return out;
    }

    /**
     * Is any part of a world-space box inside the frustum?
     * @param {Float32Array} planes - six planes from frustumFromMatrix
     * @param {number[]} min - the box's low corner
     * @param {number[]} max - the box's high corner
     * @returns {boolean} - false only when the box is entirely outside one plane
     */
    function aabbInFrustum(planes, min, max) {
      for (let i = 0; i < 6; i++) {
        const a = planes[i * 4], b = planes[i * 4 + 1], c = planes[i * 4 + 2], d = planes[i * 4 + 3];
        // The corner furthest along the plane's normal. If even that one is behind the plane,
        // every other corner is too.
        const x = a >= 0 ? max[0] : min[0];
        const y = b >= 0 ? max[1] : min[1];
        const z = c >= 0 ? max[2] : min[2];
        if (a * x + b * y + c * z + d < 0) return false;
      }
      return true;
    }

    /**
     * Transforms a local bounding box by a matrix and returns the box that contains the result.
     *
     * Transforming the eight corners and re-bounding, rather than transforming min and max, which
     * is only correct for an axis-aligned transform and gives a box that is too small the moment
     * anything rotates — culling objects that are plainly on screen.
     *
     * @param {Object} out - destination `{min, max}`
     * @param {Object} bounds - the local bounds
     * @param {Float32Array} m - the transform
     * @returns {Object} - out
     */
    const TRANSFORM_BOUNDS_SCRATCH = [0, 0, 0];
    function transformBounds(out, bounds, m) {
      const lo = bounds.min, hi = bounds.max;
      // One scratch point for every call: this runs once per culled draw, every frame.
      const p = TRANSFORM_BOUNDS_SCRATCH;
      out.min[0] = out.min[1] = out.min[2] = Infinity;
      out.max[0] = out.max[1] = out.max[2] = -Infinity;
      for (let i = 0; i < 8; i++) {
        p[0] = (i & 1) ? hi[0] : lo[0];
        p[1] = (i & 2) ? hi[1] : lo[1];
        p[2] = (i & 4) ? hi[2] : lo[2];
        vec3.transformMat4(p, p, m);
        vec3.min(out.min, out.min, p);
        vec3.max(out.max, out.max, p);
      }
      return out;
    }

    //#endregion === Frustum ===


    // *********************************************************************
    //           Picking — from a pixel back into the world
    // *********************************************************************
    //#region === Picking ===

    // *********************************************************************
    // MENTAL MODEL: EVERY POINTER INTERACTION IN 3D IS A RAY. A click is not a point on an object,
    // it is a line through the scene, and what got clicked is whatever that line hits first.
    //
    // Both directions are needed and they are not the same problem. PROJECT takes a world point to
    // a pixel, which is how a gizmo handle knows where to draw itself and how far the pointer is
    // from it. UNPROJECT takes a pixel to a ray, which is how a drag knows what the pointer means
    // in world units.
    //
    // These live in the engine rather than the workbench because a game needs them too: clicking
    // on a thing is not an authoring problem.
    // *********************************************************************

    /**
     * Projects a world point to pixel coordinates, with the origin at the TOP left, which is what
     * the DOM means by a coordinate.
     *
     * @param {number[]} out - destination [x, y, depth]; depth is the NDC z, -1 near to 1 far
     * @param {number[]} p - the world point
     * @param {Float32Array} viewProj - projection times view
     * @param {number} width - viewport width in the same pixels the caller uses
     * @param {number} height - viewport height
     * @returns {number[]} - out
     */
    function project(out, p, viewProj, width, height) {
      const x = p[0], y = p[1], z = p[2];
      const w = viewProj[3] * x + viewProj[7] * y + viewProj[11] * z + viewProj[15];
      const cx = viewProj[0] * x + viewProj[4] * y + viewProj[8] * z + viewProj[12];
      const cy = viewProj[1] * x + viewProj[5] * y + viewProj[9] * z + viewProj[13];
      const cz = viewProj[2] * x + viewProj[6] * y + viewProj[10] * z + viewProj[14];
      // A point exactly on or behind the eye has w at or below zero and no screen position at all.
      // Returning NaN rather than a plausible number is deliberate: a gizmo handle behind the
      // camera must fail a distance test, not win it.
      if (w <= 1e-6) { out[0] = NaN; out[1] = NaN; out[2] = 1; return out; }
      out[0] = (cx / w * 0.5 + 0.5) * width;
      out[1] = (0.5 - cy / w * 0.5) * height;
      out[2] = cz / w;
      return out;
    }

    /**
     * Turns a pixel into a world-space ray.
     * @param {Object} out - destination `{origin, dir}` of vec3s
     * @param {number} sx - pixel x, origin top left
     * @param {number} sy - pixel y
     * @param {Float32Array} invViewProj - the inverse of projection times view
     * @param {number} width - viewport width
     * @param {number} height - viewport height
     * @returns {Object} - out
     */
    function unproject(out, sx, sy, invViewProj, width, height) {
      const ndcX = (sx / width) * 2 - 1;
      const ndcY = 1 - (sy / height) * 2;
      vec3.transformMat4(out.origin, [ndcX, ndcY, -1], invViewProj);
      vec3.transformMat4(out.dir, [ndcX, ndcY, 1], invViewProj);
      vec3.normalize(out.dir, vec3.sub(out.dir, out.dir, out.origin));
      return out;
    }

    /**
     * Intersects a ray with an axis-aligned box, by the slab method.
     * @param {number[]} origin - the ray's start
     * @param {number[]} dir - the ray's direction, unit length
     * @param {number[]} min - the box's low corner
     * @param {number[]} max - the box's high corner
     * @returns {number} - the distance along the ray, or -1 for a miss
     */
    function rayAABB(origin, dir, min, max) {
      let tMin = -Infinity, tMax = Infinity;
      for (let i = 0; i < 3; i++) {
        // A ray parallel to a slab either misses it entirely or is inside it for all t. Dividing
        // by a zero direction gives infinities that happen to say exactly that, so the parallel
        // case needs no branch of its own.
        const inv = 1 / dir[i];
        let t1 = (min[i] - origin[i]) * inv;
        let t2 = (max[i] - origin[i]) * inv;
        if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
        if (t1 > tMin) tMin = t1;
        if (t2 < tMax) tMax = t2;
        if (tMin > tMax) return -1;
      }
      if (tMax < 0) return -1;
      return tMin >= 0 ? tMin : tMax;
    }

    /**
     * The point on a ray closest to a line, which is how an axis-drag turns a pointer into a
     * distance along that axis.
     *
     * @param {number[]} out - destination point on the LINE
     * @param {number[]} ro - the ray's origin
     * @param {number[]} rd - the ray's direction, unit
     * @param {number[]} lo - a point on the line
     * @param {number[]} ld - the line's direction, unit
     * @returns {number} - the signed distance along the line from lo, or 0 when they are parallel
     */
    function closestOnLine(out, ro, rd, lo, ld) {
      // From the LINE's origin to the RAY's, in that order. The other way round negates the
      // result, which is a gizmo that moves everything the wrong way — visible immediately and
      // not at all obvious from reading the formula.
      const w0 = vec3.sub([], ro, lo);
      const a = vec3.dot(rd, rd), b = vec3.dot(rd, ld), c = vec3.dot(ld, ld);
      const d = vec3.dot(rd, w0), e = vec3.dot(ld, w0);
      const denom = a * c - b * b;
      // Parallel: every point on the line is equally close, so there is no answer to give and the
      // caller's drag should simply not move.
      const t = Math.abs(denom) < 1e-8 ? 0 : (a * e - b * d) / denom;
      vec3.scaleAndAdd(out, lo, ld, t);
      return t;
    }

    /**
     * Intersects a ray with a plane.
     * @param {number[]} out - destination point
     * @param {number[]} ro - the ray's origin
     * @param {number[]} rd - the ray's direction
     * @param {number[]} po - a point on the plane
     * @param {number[]} pn - the plane's normal
     * @returns {boolean} - false when the ray runs parallel to the plane
     */
    function rayPlane(out, ro, rd, po, pn) {
      const denom = vec3.dot(rd, pn);
      if (Math.abs(denom) < 1e-6) return false;
      const t = vec3.dot(vec3.sub([], po, ro), pn) / denom;
      vec3.scaleAndAdd(out, ro, rd, t);
      return true;
    }

    //#endregion === Picking ===

    //#endregion === Geometry ===


    // =====================================================================
    //           Model — a tree of primitives, flattened for the GPU
    // =====================================================================
    //#region === Model ===

    // *********************************************************************
    // MENTAL MODEL: A MODEL IS A NODE TREE AND NOTHING ELSE. Each node has a transform, optionally
    // a primitive with its parameters, optionally a material, and children. There is no mesh in
    // the data — a mesh is what you get when you build one.
    //
    // That is the whole modeling paradigm: a phone booth is four boxes and a cylinder, a character
    // is a stack of them, and the file that describes either is a few hundred bytes of readable
    // JSON that can be typed by hand. Nothing is ever a vertex list, so nothing is ever a thing
    // that cannot be adjusted.
    //
    // MERGING is what makes it fast. A tree of forty nodes drawn one at a time is forty draw
    // calls; the same tree flattened into one vertex buffer, sorted by material, is one draw call
    // per material. Each node's rest transform is BAKED into its vertices during the merge, so the
    // GPU never sees the tree at all.
    //
    // THE BONE PATH IS BUILT EVEN THOUGH NOTHING ANIMATES YET, and this is the door the plan asked
    // to leave open. Every vertex carries a bone index; every bone carries the inverse of its rest
    // transform; the shader multiplies by `uBones[index]`. For a static model every bone matrix is
    // the identity and the whole thing costs one uniform upload. When Phase 5 animates a node, it
    // writes `animatedWorld * inverseRest` into that slot and the vertices follow, with no change
    // to the merge, the buffer layout or the shader.
    //
    // Rigid animation is therefore the case where every vertex has exactly one bone at weight 1.0,
    // which is what the plan asked for. Skinning later means letting a vertex name a second bone
    // and a weight — a change to this merge and to the shader, and to nothing else.
    // *********************************************************************

    /**
     * @typedef {Object} ModelNode
     * @property {string} [name] - what to call it
     * @property {string} [primitive] - a key of GEOMETRY_SPECS; a node without one is a pure transform
     * @property {Object} [params] - the primitive's parameters
     * @property {number[]} [position] - local translation, default [0, 0, 0]
     * @property {number[]} [rotation] - three euler degrees, or four quaternion components
     * @property {number[]} [scale] - local scale, default [1, 1, 1]
     * @property {string} [material] - a key of the package's materials
     * @property {Object} [uv] - a projection: `{mode, axis, scale, offset}`
     * @property {number} [subdivide] - Catmull-Clark levels for this node's primitive
     * @property {boolean} [bone] - true to make this node a bone the runtime can move
     * @property {ModelNode[]} [children] - nodes in this node's space
     */

    /**
     * @typedef {Object} Model
     * @property {string} [name] - the model's name in the package
     * @property {ModelNode[]} nodes - the roots
     */

    /**
     * Turns a node's rotation into a quaternion, accepting either spelling.
     *
     * Three numbers are euler DEGREES, which is what a person hand-writing a model types and what
     * a workbench shows. Four are a quaternion, which is what an exporter and an animation clip
     * produce. Accepting both costs one branch and means neither audience has to convert.
     *
     * @param {number[]} out - destination quaternion
     * @param {number[]} [r] - the rotation as written
     * @returns {number[]} - out
     */
    function nodeRotation(out, r) {
      if (!r) return quat.identity(out);
      if (r.length === 4) return quat.normalize(out, r);
      if (r.length === 3) return quat.fromEuler(out, r[0], r[1], r[2]);
      throw new Error('Alloy model: a rotation must be three euler degrees or four quaternion ' +
                      'components, got ' + r.length + ' numbers.');
    }

    /**
     * Composes a node's local matrix.
     * @param {Float32Array} out - destination
     * @param {ModelNode} node - the node
     * @returns {Float32Array} - out
     */
    function nodeMatrix(out, node) {
      const q = nodeRotation([0, 0, 0, 1], node.rotation);
      return mat4.compose(out, node.position || [0, 0, 0], q, node.scale || [1, 1, 1]);
    }

    // Built geometry by shape, shared by every merge. A model with forty identical crates builds
    // one crate; a drag that moves one node rebuilds none. See nodeGeometry.
    const GEOMETRY_CACHE = new Map();
    const GEOMETRY_CACHE_LIMIT = 256;

    /**
     * Builds one node's geometry: the primitive, subdivided, then projected.
     *
     * The order matters and is not interchangeable. Subdividing first means the projection sees
     * the smoothed surface and its real normals; projecting first would have the UVs smoothed
     * along with everything else, which drags them off the surface they were computed for.
     *
     * @param {ModelNode} node - the node
     * @returns {Geometry|null} - its geometry, or null when the node carries no primitive
     */
    function nodeGeometry(node) {
      if (!node.primitive) return null;
      // Keyed on everything that shapes the geometry and nothing that places it, so dragging one
      // node re-merges the model from cached geometry for every other node — and for the dragged
      // one too, since a move changes its transform and not its shape. Nothing downstream mutates
      // a part's geometry: the merge reads it into fresh buffers. Bounded, oldest out first.
      const key = node.primitive + '|' + JSON.stringify(node.params || null) + '|' +
                  (node.subdivide || 0) + '|' + JSON.stringify(node.uv || null);
      const hit = GEOMETRY_CACHE.get(key);
      if (hit) return hit;
      let g = buildGeometry(node.primitive, node.params);
      if (node.subdivide) g = subdivide(g, node.subdivide);
      if (node.uv) projectUVs(g, node.uv);
      if (GEOMETRY_CACHE.size >= GEOMETRY_CACHE_LIMIT) GEOMETRY_CACHE.delete(GEOMETRY_CACHE.keys().next().value);
      GEOMETRY_CACHE.set(key, g);
      return g;
    }

    /**
     * @typedef {Object} MergedModel
     * @property {Geometry} geometry - one buffer, rest pose baked, with a `joints` attribute
     * @property {Array<Object>} groups - `{material, start, count}` index ranges, one per material
     * @property {Array<Object>} bones - `{name, index, rest, invRest}`; slot 0 is always the identity
     * @property {Object} bounds - the whole model's axis-aligned bounds
     * @property {number} nodes - how many nodes contributed geometry
     */

    /**
     * Flattens a model's node tree into one vertex buffer.
     *
     * @param {Model} model - the model
     * @param {Object} [opts] - merge options
     * @param {string} [opts.defaultMaterial] - the material a node without one gets
     * @returns {MergedModel} - the merged result
     */
    function mergeModel(model, opts) {
      const cfg = opts || {};
      if (!model || !Array.isArray(model.nodes)) {
        throw new Error('Alloy.mergeModel: a model needs a `nodes` array.');
      }
      const defaultMaterial = cfg.defaultMaterial || '';

      // Bone slot 0 is the identity, so a node governed by nothing needs no special case anywhere
      // downstream: its vertices are multiplied by an identity matrix like everyone else's.
      const bones = [{ name: '', index: 0, rest: mat4.create(), invRest: mat4.create() }];
      const parts = [];
      const local = mat4.create();
      let nodeCount = 0;

      /**
       * Walks one node and its children, accumulating geometry in world space.
       * @param {ModelNode} node - the node
       * @param {Float32Array} parentWorld - the accumulated transform above it
       * @param {number} boneIndex - the nearest ancestor bone, 0 for none
       * @param {number} depth - recursion depth, guarded against a cycle
       * @param {number[]} path - child indices from the roots, so a caller can address this node
       * @returns {void}
       */
      function walk(node, parentWorld, boneIndex, depth, path) {
        if (depth > 64) {
          throw new Error('Alloy.mergeModel: the node tree is more than 64 deep at "' +
                          (node.name || 'unnamed') + '". That is almost always a node listed as ' +
                          'its own child.');
        }
        const world = mat4.multiply(mat4.create(), parentWorld, nodeMatrix(local, node));
        let bone = boneIndex;
        if (node.bone) {
          bone = bones.length;
          const invRest = mat4.invert(mat4.create(), world);
          if (!invRest) {
            throw new Error('Alloy.mergeModel: bone "' + (node.name || 'unnamed') + '" has a ' +
                            'transform that cannot be inverted, which means an axis is scaled to ' +
                            'zero. A bone must have a real position in space.');
          }
          bones.push({ name: node.name || ('bone' + bone), index: bone, rest: mat4.clone(world), invRest });
        }

        const g = nodeGeometry(node);
        if (g) {
          nodeCount++;
          parts.push({ geometry: g, world: mat4.clone(world), bone, node, path: path.slice(),
                       material: node.material || defaultMaterial });
        }
        if (node.children) {
          node.children.forEach((child, i) => walk(child, world, bone, depth + 1, path.concat(i)));
        }
      }

      const identity = mat4.create();
      model.nodes.forEach((root, i) => walk(root, identity, 0, 0, [i]));

      // Sorted by material so that every triangle sharing one lands in a single contiguous range,
      // which is what turns a model into one draw call per material instead of one per node.
      parts.sort((a, b) => (a.material < b.material ? -1 : a.material > b.material ? 1 : 0));

      let vTotal = 0, iTotal = 0;
      for (const part of parts) {
        vTotal += part.geometry.positions.length / 3;
        iTotal += part.geometry.indices.length;
      }

      const positions = new Float32Array(vTotal * 3);
      const normals = new Float32Array(vTotal * 3);
      const uvs = new Float32Array(vTotal * 2);
      const joints = new Float32Array(vTotal);
      const indices = vTotal > 65535 ? new Uint32Array(iTotal) : new Uint16Array(iTotal);
      const groups = [];

      const nrm = mat3.create();
      const pt = [0, 0, 0];
      let vAt = 0, iAt = 0;
      let current = null;

      for (const part of parts) {
        const g = part.geometry;
        const count = g.positions.length / 3;
        mat3.normalFromMat4(nrm, part.world);

        for (let v = 0; v < count; v++) {
          pt[0] = g.positions[v * 3]; pt[1] = g.positions[v * 3 + 1]; pt[2] = g.positions[v * 3 + 2];
          vec3.transformMat4(pt, pt, part.world);
          positions[(vAt + v) * 3] = pt[0];
          positions[(vAt + v) * 3 + 1] = pt[1];
          positions[(vAt + v) * 3 + 2] = pt[2];

          // Normals go through the normal matrix, not the world matrix: a node scaled
          // non-uniformly would otherwise light as though it had not been.
          const nx = g.normals[v * 3], ny = g.normals[v * 3 + 1], nz = g.normals[v * 3 + 2];
          const tx = nrm[0] * nx + nrm[3] * ny + nrm[6] * nz;
          const ty = nrm[1] * nx + nrm[4] * ny + nrm[7] * nz;
          const tz = nrm[2] * nx + nrm[5] * ny + nrm[8] * nz;
          const l = Math.hypot(tx, ty, tz) || 1;
          normals[(vAt + v) * 3] = tx / l;
          normals[(vAt + v) * 3 + 1] = ty / l;
          normals[(vAt + v) * 3 + 2] = tz / l;

          uvs[(vAt + v) * 2] = g.uvs ? g.uvs[v * 2] : 0;
          uvs[(vAt + v) * 2 + 1] = g.uvs ? g.uvs[v * 2 + 1] : 0;
          joints[vAt + v] = part.bone;
        }

        if (!current || current.material !== part.material) {
          current = { material: part.material, start: iAt, count: 0 };
          groups.push(current);
        }
        // A MIRRORED node — one with an odd number of negative scale axes — turns every triangle
        // inside out. Backface culling then hides the whole thing, which reads as the mirrored
        // half simply not existing. Reversing the winding puts it back, and this is the only
        // place that can know, because by the time the GPU sees the buffer the scale is baked in.
        if (determinant3(part.world) < 0) {
          for (let i = 0; i < g.indices.length; i += 3) {
            indices[iAt + i] = g.indices[i] + vAt;
            indices[iAt + i + 1] = g.indices[i + 2] + vAt;
            indices[iAt + i + 2] = g.indices[i + 1] + vAt;
          }
        } else {
          for (let i = 0; i < g.indices.length; i++) indices[iAt + i] = g.indices[i] + vAt;
        }
        current.count += g.indices.length;

        part.indexStart = iAt;
        part.indexCount = g.indices.length;
        part.bounds = transformBounds({ min: [0, 0, 0], max: [0, 0, 0] }, g.bounds, part.world);

        vAt += count;
        iAt += g.indices.length;
      }

      const geometry = { positions, normals, uvs, joints, indices, mode: 'triangles' };
      computeBounds(geometry);
      // `parts` is what a workbench needs and a game never looks at: one entry per node that
      // carried geometry, with where it ended up in the buffer and what it occupies in space.
      return { geometry, groups, bones, parts, bounds: geometry.bounds, nodes: nodeCount };
    }

    /**
     * The determinant of a matrix's upper 3x3, whose sign says whether the transform turns space
     * inside out. Negative means an odd number of mirrored axes.
     * @param {Float32Array} m - the matrix
     * @returns {number} - the determinant
     */
    function determinant3(m) {
      return m[0] * (m[5] * m[10] - m[6] * m[9]) -
             m[4] * (m[1] * m[10] - m[2] * m[9]) +
             m[8] * (m[1] * m[6] - m[2] * m[5]);
    }

    /**
     * Counts a model's nodes without building any geometry, for a UI that wants to say how big
     * something is before it commits to merging it.
     * @param {Model} model - the model
     * @returns {number} - the node count, transforms included
     */
    function countNodes(model) {
      let n = 0;
      /**
       * @param {ModelNode} node - the node
       * @returns {void}
       */
      function walk(node) {
        n++;
        if (node.children) for (const c of node.children) walk(c);
      }
      if (model && Array.isArray(model.nodes)) for (const r of model.nodes) walk(r);
      return n;
    }

    // The material a node gets when it names none and the package offers none. White, lit, no
    // texture: visible, obviously unfinished, and never mistaken for a real material.
    const DEFAULT_MATERIAL = Object.freeze({ color: [0.78, 0.79, 0.82] });

    /**
     * Which of a package's clips drive a model: the ones that name it, plus the ones that name
     * nothing.
     *
     * A clip with no model is taken as driving any rig whose bones it happens to match, which is
     * how one shared "flinch" reaches two different characters. A clip naming a bone the rig does
     * not have is skipped by the animator, so the permissive reading costs nothing. A clip that
     * names THIS model wins over an unnamed one of the same name, because the specific answer to
     * a question beats the general one.
     *
     * @param {Object} clips - a package's clips map
     * @param {string} model - the model's name
     * @returns {Object} - a clips map, possibly empty
     */
    function clipsForModel(clips, model) {
      const out = {};
      for (const name in (clips || {})) {
        if (!clips[name].model) out[name] = clips[name];
      }
      for (const name in (clips || {})) {
        if (clips[name].model === model) out[name] = clips[name];
      }
      return out;
    }

    /**
     * A fresh bone array, every slot the identity.
     *
     * This is the pose a model has before anything animates it, and it is what slot 0 must hold
     * forever — every vertex carries a bone index, and the ones belonging to no bone carry 0.
     *
     * @param {number} count - how many bones, the identity slot included
     * @returns {Float32Array} - count * 16 floats
     */
    function identityBones(count) {
      const out = new Float32Array(count * 16);
      for (let i = 0; i < count; i++) {
        out[i * 16] = 1; out[i * 16 + 5] = 1; out[i * 16 + 10] = 1; out[i * 16 + 15] = 1;
      }
      return out;
    }

    //#endregion === Model ===


    // =====================================================================
    //           Animation — clips, blending, and the pose pipeline
    // =====================================================================
    //#region === Animation ===

    // *********************************************************************
    // MENTAL MODEL: ANIMATION WRITES INTO THE BONE ARRAY THAT PHASE 3 ALREADY BUILT, and nothing
    // else changes. The merge baked every node's rest transform into the vertices and gave each
    // one a bone index; the shader has always multiplied by `uBones[index]`. All that was missing
    // was somebody to put something other than the identity in those slots.
    //
    // What goes in a slot is a DELTA, not a transform:
    //
    //     uBones[i] = animatedWorld(i) * inverseRestWorld(i)
    //
    // A vertex in the buffer is already at its rest position in model space. Multiplying by that
    // delta undoes the rest pose and applies the animated one. For a bone that has not moved the
    // delta is the identity, which is why a static model costs nothing and why a clip that
    // animates one arm leaves the rest of the model alone without saying so.
    //
    // THE POSE PIPELINE, in order, and the order is the design:
    //
    //   1. every node starts at its REST local transform
    //   2. each playing clip is sampled and BLENDED into that pose by weight
    //   3. additive layers add their difference from rest on top
    //   4. procedural overrides (look-at, springs) compose over the result
    //   5. the tree is walked once to get world matrices
    //   6. each bone's delta is written out
    //
    // Procedural comes AFTER clips on purpose. A head that turns to watch you should keep doing so
    // while the walk cycle plays underneath it; a look-at that ran first would be overwritten by
    // the next keyframe and the head would twitch.
    //
    // ROTATIONS BLEND AS QUATERNIONS, ALWAYS. Euler angles are accepted in the data because a
    // person hand-writing a clip should not have to type a quaternion, and they are converted once
    // when the clip is prepared. Interpolating the degrees themselves takes the long way round
    // between any two keys more than 180 apart and gimbal-locks near the poles.
    // *********************************************************************

    // *********************************************************************
    //           Easing — the shape of a segment between two keys
    // *********************************************************************
    //#region === Easing ===

    /**
     * The easing curves a keyframe may name. Each takes and returns 0..1.
     *
     * `step` is the one that is not a curve: it holds the previous key's value until the next key
     * arrives. It exists because some things should not be interpolated at all — a prop appearing,
     * a hand switching pose — and lerping them looks like a mistake rather than a choice.
     */
    const EASINGS = {
      linear:    (t) => t,
      step:      (t) => 0,
      ease:      (t) => t * t * (3 - 2 * t),
      easeIn:    (t) => t * t,
      easeOut:   (t) => t * (2 - t),
      easeInOut: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
      // A gentle overshoot and settle. The constant is the standard "back" easing's, and it is
      // what makes a limb arrive somewhere rather than merely stop there.
      backOut:   (t) => { const c = 1.70158; const u = t - 1; return u * u * ((c + 1) * u + c) + 1; },
    };

    //#endregion === Easing ===


    // *********************************************************************
    //           Clips — keyframes, prepared once and sampled per frame
    // *********************************************************************
    //#region === Clips ===

    /**
     * @typedef {Object} Keyframe
     * @property {number} t - when, in seconds from the clip's start
     * @property {number[]} v - the value; three numbers, or four for a rotation quaternion
     * @property {string} [ease] - the curve from this key to the next, default 'linear'
     */

    /**
     * @typedef {Object} Clip
     * @property {string} [name] - what it is called in the package
     * @property {string} [model] - which model's bones its tracks name
     * @property {number} duration - how long, in seconds
     * @property {boolean} [loop] - whether it repeats by default
     * @property {Object<string, Object>} tracks - bone name to `{position, rotation, scale}` key arrays
     * @property {Array<Object>} [events] - `{t, name}` markers fired as the playhead passes them
     */

    /**
     * Prepares a clip for sampling: sorts its keys and converts every rotation to a quaternion.
     *
     * Done once when a clip is loaded rather than per frame, because the conversion is the
     * expensive part and the data is allowed to be written in whichever spelling suits its author.
     * The prepared form is never written back — the package keeps what the person typed.
     *
     * @param {Clip} clip - the clip as it appears in the package
     * @returns {Object} - a prepared clip
     */
    function prepareClip(clip) {
      if (!clip || typeof clip !== 'object') {
        throw new Error('Alloy animation: a clip must be an object.');
      }
      const out = {
        name: clip.name || '',
        duration: Math.max(1e-4, clip.duration || 1),
        loop: clip.loop !== false,
        tracks: {},
        events: (clip.events || []).slice().sort((a, b) => a.t - b.t),
      };
      for (const bone in (clip.tracks || {})) {
        const src = clip.tracks[bone];
        const track = {};
        for (const channel of ['position', 'rotation', 'scale']) {
          const keys = src[channel];
          if (!Array.isArray(keys) || !keys.length) continue;
          // Sorted here so an author may write keys in any order, and so the binary search below
          // can assume what it needs. An unsorted track samples nonsense with no error anywhere.
          const sorted = keys.slice().sort((a, b) => a.t - b.t);
          track[channel] = sorted.map((k) => ({
            t: k.t,
            v: channel === 'rotation' ? nodeRotation([0, 0, 0, 1], k.v) : (k.v || [0, 0, 0]),
            ease: EASINGS[k.ease] ? k.ease : 'linear',
          }));
        }
        if (Object.keys(track).length) out.tracks[bone] = track;
      }
      return out;
    }

    /**
     * Finds the segment a time falls in, by binary search.
     * @param {Array<Keyframe>} keys - the sorted keys
     * @param {number} t - the time
     * @returns {number} - the index of the key at or before t, clamped to the ends
     */
    function findKey(keys, t) {
      let lo = 0, hi = keys.length - 1;
      if (t <= keys[0].t) return 0;
      if (t >= keys[hi].t) return hi;
      while (lo < hi - 1) {
        const mid = (lo + hi) >> 1;
        if (keys[mid].t <= t) lo = mid;
        else hi = mid;
      }
      return lo;
    }

    /**
     * Samples one channel of a track at a time.
     *
     * @param {number[]} out - destination, three numbers or four
     * @param {Array<Keyframe>} keys - the sorted, prepared keys
     * @param {number} t - the time in seconds
     * @param {boolean} isRotation - true to slerp rather than lerp
     * @returns {number[]} - out
     */
    function sampleChannel(out, keys, t, isRotation) {
      const i = findKey(keys, t);
      const a = keys[i];
      const b = keys[i + 1];
      if (!b || t <= a.t) {
        for (let c = 0; c < a.v.length; c++) out[c] = a.v[c];
        return out;
      }
      const span = b.t - a.t;
      const raw = span > 1e-9 ? (t - a.t) / span : 1;
      const k = EASINGS[a.ease](clamp(raw, 0, 1));
      if (isRotation) return quat.slerp(out, a.v, b.v, k);
      for (let c = 0; c < a.v.length; c++) out[c] = a.v[c] + (b.v[c] - a.v[c]) * k;
      return out;
    }

    //#endregion === Clips ===

    // *********************************************************************
    //           The Animator — one model, several clips, one pose
    // *********************************************************************
    //#region === Animator ===

    /**
     * @typedef {Object} ClipState
     * @property {string} name - which clip
     * @property {Object} clip - the prepared clip
