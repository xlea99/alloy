<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alloy — the visual engine of the OFCU</title>
<style>
  /*#region Theme*/
  :root {
    --bg:      #0a0c10;
    --panel:   #12161d;
    --panel2:  #1b212b;
    --panel3:  #232b37;
    --line:    #252d3a;
    --line2:   #35404f;
    --ink:     #dfe6ef;
    --dim:     #78859a;
    --dim2:    #56637a;
    --accent:  #63d2ff;
    --accent2: #ffb454;
    --bad:     #ff6b6b;
    --good:    #6ee7a8;
    --mono:    ui-monospace, "JetBrains Mono", Consolas, Menlo, monospace;

    /* The stacking table. Every z-index in this file is one of these, and the windows band
       (10 to 400) sits entirely below every piece of shell chrome. Nothing may invent its own. */
    --z-win-lo:   10;
    --z-win-hi:   400;
    --z-chrome:   600;
    --z-overlay:  800;
    --z-menu:     1000;
  }
  /*#endregion Theme*/

  /*#region Layout & Containers*/
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--mono); font-size: 12px;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
  #body { display: flex; flex: 1 1 auto; min-height: 0; }
  #desk { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden;
          background: radial-gradient(120% 100% at 50% 0%, #0e1219, #080a0e 78%); }
  #deskHint {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; pointer-events: none;
    color: var(--dim2); text-align: center; letter-spacing: 0.1em; user-select: none;
  }
  #deskHint b { color: var(--dim); font-size: 15px; letter-spacing: 0.3em; font-weight: 500; }
  /*#endregion Layout & Containers*/

  /*#region Header*/
  #head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    height: 36px; padding: 0 10px; z-index: var(--z-chrome);
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #brand { font-size: 13px; letter-spacing: 0.22em; color: var(--accent); font-weight: 600;
           user-select: none; white-space: nowrap; }
  #brand span { margin-left: 7px; font-size: 9.5px; letter-spacing: 0.1em; color: var(--dim2);
                font-weight: 400; }
  #pkgbar { display: flex; align-items: center; gap: 7px; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: transparent;
         border: 1px solid var(--line2); }
  #dot.on { background: var(--accent2); border-color: var(--accent2); }
  #homeText { color: var(--dim2); font-size: 10px; letter-spacing: 0.06em; max-width: 26ch;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #headRight { margin-left: auto; display: flex; gap: 4px; }
  /*#endregion Header*/

  /*#region Buttons*/
  .chip, .ghost {
    font: inherit; font-size: 11px; color: var(--dim); cursor: pointer;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 3px;
    padding: 3px 9px; letter-spacing: 0.06em; white-space: nowrap;
  }
  .chip:hover, .ghost:hover { color: var(--ink); border-color: var(--line2); }
  .chip.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .chip:focus-visible, .ghost:focus-visible { outline: 1px solid var(--accent2); outline-offset: 2px; }
  .ghost { background: transparent; border-color: transparent; color: var(--ink); font-size: 12px;
           letter-spacing: 0.08em; padding: 3px 6px; }
  .chip.mini { padding: 1px 6px; font-size: 10px; }
  .chip.danger:hover { color: var(--bad); border-color: var(--bad); }
  /*#endregion Buttons*/

  /*#region The rail*/
  #rail {
    flex: 0 0 232px; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; overflow-x: hidden; z-index: var(--z-chrome);
  }
  #rail[hidden] { display: none; }
  .grp-head {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    color: var(--dim); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; user-select: none;
  }
  .grp-head .count { color: var(--dim2); letter-spacing: 0; }
  .grp-head .add { margin-left: auto; }
  .row {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 14px;
    cursor: pointer; user-select: none; color: var(--ink); border-left: 2px solid transparent;
  }
  .row:hover { background: var(--panel2); }
  .row.sel { background: var(--panel3); border-left-color: var(--accent); }
  .row .swatch { width: 22px; height: 16px; border-radius: 2px; border: 1px solid var(--line2);
                 flex: 0 0 auto; image-rendering: pixelated; }
  .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { margin-left: auto; color: var(--dim2); font-size: 10px; }
  .empty { padding: 10px 14px; color: var(--dim2); font-size: 10.5px; line-height: 1.7; }
  /*#endregion The rail*/

  /*#region Windows*/
  .win {
    position: absolute; display: flex; flex-direction: column; min-width: 240px; min-height: 140px;
    background: var(--panel); border: 1px solid var(--line2); border-radius: 4px;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.55); overflow: hidden;
  }
  .win.focus { border-color: var(--accent); }
  .win-bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 6px 0 9px;
    background: var(--panel2); border-bottom: 1px solid var(--line);
    cursor: move; user-select: none; color: var(--dim); font-size: 11px; letter-spacing: 0.08em;
  }
  .win.focus .win-bar { color: var(--ink); background: var(--panel3); }
  .win-bar .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .win-bar .m { margin-left: auto; cursor: pointer; padding: 0 5px; color: var(--dim); font-size: 12px; }
  .win-bar .m:hover { color: var(--ink); }
  .win-bar .x { cursor: pointer; padding: 0 5px; color: var(--dim); }
  .win-bar .x:hover { color: var(--bad); }
  .win-body { flex: 1 1 auto; min-height: 0; overflow: hidden; position: relative; }
  .win-grip { position: absolute; z-index: 2; }
  .win-grip.e { top: 0; right: 0; width: 5px; height: 100%; cursor: ew-resize; }
  .win-grip.s { bottom: 0; left: 0; height: 5px; width: 100%; cursor: ns-resize; }
  .win-grip.se { bottom: 0; right: 0; width: 12px; height: 12px; cursor: nwse-resize; }
  .win-grip.w { top: 0; left: 0; width: 5px; height: 100%; cursor: ew-resize; }
  /* Above the bar, so the top edge resizes rather than moves. Four pixels: any more and the bar
     loses its grab; any less and nobody can hit it. */
  .win-grip.n { top: 0; left: 0; height: 4px; width: 100%; cursor: ns-resize; }
  .snapline { position: absolute; background: var(--accent); opacity: 0.55; pointer-events: none;
              z-index: var(--z-win-hi); }
  /*#endregion Windows*/

  /*#region Texture editor*/
  .tex { display: flex; height: 100%; position: relative; }
  .tex-rail { flex: 0 0 44px; display: flex; flex-direction: column; align-items: center; gap: 3px;
              padding: 6px 0; background: var(--panel2); border-right: 1px solid var(--line);
              overflow-y: auto; overflow-x: hidden; min-height: 0; }
  .tool { width: 32px; height: 28px; flex: 0 0 auto; border-radius: 3px; display: flex; align-items: center;
          justify-content: center; font-size: 14px; color: var(--dim); cursor: pointer; user-select: none; }
  .tool:hover { background: var(--panel3); color: var(--ink); }
  .tool.on { background: var(--accent); color: var(--bg); }
  .tool.num { font-size: 12px; font-weight: 600; }
  .tool.sep { height: 1px; width: 26px; margin: 3px 0; background: var(--line2); cursor: default; }
  .tool.sep:hover { background: var(--line2); }
  .tool.thumb { width: 28px; height: 28px; background-size: cover; image-rendering: pixelated;
                border: 1px solid var(--line2); font-size: 9px; }
  .tool.thumb.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background-color: transparent; }
  .wells { position: relative; width: 32px; height: 32px; margin-top: 6px; flex: 0 0 auto; }
  .well { position: absolute; width: 20px; height: 20px; border: 1px solid var(--line2); border-radius: 3px; cursor: pointer; }
  .well.primary { left: 0; top: 0; z-index: 2; }
  .well.secondary { right: 0; bottom: 0; }
  .marquee { position: absolute; border: 1px dashed var(--accent2); pointer-events: none;
             box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5); }
  .marquee-mask { position: absolute; pointer-events: none; image-rendering: pixelated; }
  .tex-canvas-wrap svg.lasso { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .tex-canvas-wrap svg.lasso polyline { fill: rgba(255, 180, 84, 0.12); stroke: var(--accent2); stroke-width: 1; stroke-dasharray: 4 3; }
  .lay.folder { color: var(--accent2); }
  .lay.folder.in { background: var(--panel2); }
  .lay.inner { padding-left: 14px; }
  .tex-left { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0;
              border-right: 1px solid var(--line); }
  .tex-tools { flex: 0 0 auto; display: flex; align-items: center; gap: 5px; padding: 5px 7px;
               border-bottom: 1px solid var(--line); background: var(--panel2); flex-wrap: wrap; }
  .tex-stage { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden;
               display: flex; align-items: center; justify-content: center;
               background: repeating-conic-gradient(#15191f 0% 25%, #10141a 0% 50%) 50% / 16px 16px; }
  .tex-canvas-wrap { position: relative; }
  .tex-stage canvas { display: block; image-rendering: pixelated; }
  /* The overlay covers the canvas, so it must let the pointer fall through to it; only the shape
     handles catch the pointer. Without this every tool is dead — no click ever reaches the canvas. */
  .tex-ov { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .tex-ov .h { pointer-events: auto; }
  /* The JSON panel: the texture as the text the data block will carry, editable, over the left
     of the stage. Rarely open, so covering part of the preview is the right trade. */
  .tex-json { position: absolute; left: 0; top: 0; bottom: 0; width: 380px; max-width: 70%; z-index: 3;
              display: flex; flex-direction: column; background: var(--panel);
              border-right: 1px solid var(--line2); box-shadow: 6px 0 18px rgba(0, 0, 0, 0.45); }
  .tex-json[hidden] { display: none; }
  .tex-json textarea { flex: 1 1 auto; min-height: 0; resize: none; outline: none; border: 0;
                       padding: 8px 10px; font: 11px/1.45 var(--mono); color: var(--ink);
                       background: var(--panel); white-space: pre; tab-size: 2; }
  .tex-json .note { flex: 0 0 auto; min-height: 24px; padding: 5px 10px; font-size: 10px;
                    color: var(--dim2); border-top: 1px solid var(--line); line-height: 1.4; }
  .tex-json .note.bad { color: var(--bad); }
  .tex-tools .sep { width: 1px; align-self: stretch; margin: 0 4px; background: var(--line2); }
  /* min-width: 0 is the load-bearing part. A flex item's default minimum is its content, so a
     panel that gains three-number rows when a node is selected grew to fit them, the viewport
     beside it shrank, and the camera appeared to jump every time something was clicked. */
  .tex-right { flex: 0 0 292px; display: flex; flex-direction: column; min-height: 0; min-width: 0;
               overflow: hidden; position: relative; }
  /* A vertical grip on a panel's edge. Wider than it looks, because an edge you have to aim at
     is an edge nobody resizes. */
  .vgrip { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; z-index: 6; }
  .vgrip.left { left: -3px; }
  .vgrip.right { right: -3px; }
  .vgrip:hover, .vgrip.live { background: var(--accent); opacity: 0.35; }
  .tex-layers { flex: 0 0 auto; max-height: 46%; overflow-y: auto; border-bottom: 1px solid var(--line); }
  .tex-insp { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  .lay {
    display: flex; align-items: center; gap: 6px; padding: 2px 7px 2px 5px; cursor: pointer;
    border-left: 2px solid transparent; user-select: none;
  }
  .lay:hover { background: var(--panel2); }
  .lay.sel { background: var(--panel3); border-left-color: var(--accent); }
  .lay.drag { opacity: 0.4; }
  .lay.over { box-shadow: inset 0 2px 0 var(--accent); }
  .lay.over-below { box-shadow: inset 0 -2px 0 var(--accent); }
  /* The index sits at the far left beside the visibility toggle, so the two things a person
     scans for — which layer, and is it on — are together and away from the name. The toggle is
     big enough to hit without aiming. */
  .lay .num { width: 14px; text-align: right; color: var(--dim2); font-size: 10px; flex: 0 0 auto; }
  .lay .eye { width: 24px; height: 22px; line-height: 22px; text-align: center; font-size: 17px;
              color: var(--dim); flex: 0 0 auto; border-radius: 3px; cursor: pointer; }
  .lay .eye:hover { background: var(--panel3); color: var(--ink); }
  .lay.off .eye { color: var(--dim2); }
  .lay.off .nm, .lay.off .bl { opacity: 0.4; text-decoration: line-through; }
  .lay .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lay .bl { margin-left: auto; color: var(--dim2); font-size: 10px; white-space: nowrap; }
  .lay .mk { color: var(--accent2); font-size: 10px; }
  .sect { padding: 6px 8px; color: var(--dim); font-size: 10px; letter-spacing: 0.16em;
          text-transform: uppercase; border-bottom: 1px solid var(--line);
          border-top: 1px solid var(--line); background: var(--panel2);
          display: flex; align-items: center; gap: 6px; }
  .sect .add { margin-left: auto; }
  /*#endregion Texture editor*/

  /*#region Parameter rows*/
  .prow { display: flex; align-items: center; gap: 6px; padding: 3px 8px; min-height: 22px; }
  .prow > label { flex: 0 0 108px; color: var(--dim); font-size: 10.5px; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
  .prow .ctl { flex: 1 1 auto; display: flex; align-items: center; gap: 5px; min-width: 0; }
  .prow input[type=range] { flex: 1 1 auto; min-width: 0; height: 14px; accent-color: var(--accent); }
  .prow input[type=number], .prow input[type=text], .prow select {
    font: inherit; font-size: 11px; color: var(--ink); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 2px; padding: 2px 4px; min-width: 0;
  }
  .prow input[type=number] { flex: 0 0 60px; }
  .prow input[type=text] { flex: 1 1 auto; }
  .prow select { flex: 1 1 auto; }
  .prow input[type=color] { flex: 0 0 30px; height: 19px; padding: 0; border: 1px solid var(--line);
                            background: var(--panel2); border-radius: 2px; cursor: pointer; }
  .prow input[type=checkbox] { accent-color: var(--accent); }
  .prow.note { color: var(--dim2); font-size: 10px; line-height: 1.6; display: block; padding: 4px 8px 7px; }
  .pal { display: flex; flex-wrap: wrap; gap: 3px; padding: 2px 8px 6px 8px; }
  .pal .sw { width: 20px; height: 20px; border-radius: 2px; border: 1px solid var(--line2);
             cursor: pointer; position: relative; }
  .pal .sw:hover { border-color: var(--bad); }
  .pts { padding: 0 8px 6px; }
  .pts .pt { display: flex; align-items: center; gap: 4px; padding: 1px 0; }
  .pts .pt span { color: var(--dim2); width: 16px; font-size: 10px; }
  .pts .pt input { flex: 1 1 0; min-width: 0; }
  /*#endregion Parameter rows*/

  /*#region Timeline*/
  .clip-time {
    flex: 0 0 auto; position: relative; overflow: hidden;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  .clip-time canvas { display: block; cursor: crosshair; }
  .curve { display: block; margin: 4px 8px 8px; border-radius: 2px; background: var(--panel2); }
  /*#endregion Timeline*/

  /*#region Overlay handles*/
  .h { position: absolute; width: 9px; height: 9px; margin: -5px 0 0 -5px; border-radius: 2px;
       background: var(--accent); border: 1px solid #04202c; cursor: grab; }
  .h.mid { border-radius: 50%; background: var(--accent2); }
  .h:active { cursor: grabbing; }
  .box { position: absolute; border: 1px dashed var(--accent); pointer-events: none; opacity: 0.7; }
  .drag-tip { position: absolute; z-index: 3; pointer-events: none; white-space: nowrap;
              background: var(--panel2); border: 1px solid var(--accent2); color: var(--ink);
              font-size: 11px; padding: 2px 7px; border-radius: 2px; letter-spacing: 0.04em; }
  .drag-tip b { color: var(--accent2); font-weight: 500; }
  /*#endregion Overlay handles*/

  /*#region Status bar*/
  #foot {
    flex: 0 0 auto; display: flex; align-items: center; gap: 16px; height: 24px; padding: 0 10px;
    background: var(--panel); border-top: 1px solid var(--line); z-index: var(--z-chrome);
    color: var(--dim); font-size: 10.5px; letter-spacing: 0.05em; white-space: nowrap;
  }
  #foot b { color: var(--ink); font-weight: 500; }
  #log { margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
  #log i { color: var(--bad); font-style: normal; }
  #log em { color: var(--good); font-style: normal; }
  /*#endregion Status bar*/

  /*#region Menus and cards*/
  #menu, #card {
    position: fixed; z-index: var(--z-menu); background: var(--panel2);
    border: 1px solid var(--line2); border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    min-width: 168px; padding: 3px; max-height: 82vh; overflow-y: auto;
  }
  #menu[hidden], #card[hidden] { display: none; }
  #menu .mi { padding: 4px 10px; cursor: pointer; border-radius: 2px; color: var(--ink); }
  #menu .mi:hover { background: var(--accent); color: var(--bg); }
  #menu .mi.danger:hover { background: var(--bad); }
  #menu .mh { padding: 5px 10px 3px; color: var(--dim2); font-size: 10px; letter-spacing: 0.16em;
              text-transform: uppercase; }
  #menu .ms { height: 1px; background: var(--line); margin: 3px 6px; }
  #card { padding: 9px; min-width: 210px; }
  #card .lbl { color: var(--dim); font-size: 10.5px; margin-bottom: 6px; line-height: 1.5; }
  #card input { font: inherit; width: 100%; color: var(--ink); background: var(--panel);
                border: 1px solid var(--line2); border-radius: 2px; padding: 4px 6px; }
  #card .acts { display: flex; gap: 5px; justify-content: flex-end; margin-top: 8px; }
  .inplace { font: inherit; font-size: inherit; color: var(--ink); background: var(--panel);
             border: 1px solid var(--accent); border-radius: 2px; padding: 0 3px; width: 100%; }
  /*#endregion Menus and cards*/

  /*#region Fatal overlay*/
  #fatal {
    position: absolute; inset: 0; z-index: var(--z-overlay);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 30px; text-align: center;
    background: radial-gradient(120% 90% at 50% 40%, #171b24, #0a0c10 72%);
  }
  #fatal[hidden] { display: none; }
  #fatal h1 { margin: 0; font-size: 20px; letter-spacing: 0.18em; color: var(--bad); font-weight: 500; }
  #fatal p { margin: 0; max-width: 62ch; line-height: 1.9; color: var(--dim); font-size: 11px;
             white-space: pre-wrap; text-align: left; }
  /*#endregion Fatal overlay*/
</style>
</head>
<body>

<div id="app">

  <header id="head">
    <div id="brand">ALLOY<span id="ver">engine</span></div>
    <div id="pkgbar">
      <span id="dot" title="unsaved changes"></span>
      <button id="pkgName" class="ghost" type="button">untitled</button>
      <span id="homeText">no home</span>
      <button id="saveBtn" class="chip" type="button">Save</button>
      <button id="saveAs" class="chip mini" type="button" title="Save as…">&#9662;</button>
    </div>
    <div id="headRight">
      <button class="chip" id="btnView" type="button">3D view</button>
      <button class="chip" id="btnWindows" type="button">windows</button>
      <button class="chip on" id="btnRail" type="button">rail</button>
    </div>
  </header>

  <div id="body">
    <aside id="rail"></aside>
    <div id="desk">
      <div id="deskHint">
        <b>ALLOY</b>
        <span id="deskLine">double-click anything in the rail to open it &middot; the 3D view follows the selection</span>
      </div>
      <div id="fatal" hidden>
        <h1 id="fatalTitle">NO WEBGL2</h1>
        <p id="fatalBody"></p>
      </div>
    </div>
  </div>

  <footer id="foot">
    <span id="stat">&mdash;</span>
    <span id="log">&mdash;</span>
  </footer>

</div>

<div id="menu" hidden></div>
<div id="card" hidden></div>
<input id="fileIn" type="file" accept=".json,.alloy.json,application/json" hidden>
<input id="imgIn" type="file" accept="image/png" hidden>


<script data-ofcu-type="exportable"
        data-ofcu-package="alloy"
        data-ofcu-version="0.10.0"
        data-ofcu-built="2026-09-11T03:10:00"
        data-ofcu-description="WebGL2 rendering engine: math, procedural geometry, textures, meshes and animation"
        data-ofcu-hash="sha256:97c1bdfcb417402256c0c5946ad4665e1b4220f35459e2caf278d3356d33caa2">
  "use strict";


  // ╔══════════════════════════════════════════════════════════════════════════════════════════╗
  // ║  ALLOY ENGINE                                                                            ║
  // ║  Standalone WebGL2 renderer. No dependencies, no asset files, no build step. Textures,   ║
  // ║  meshes and animation are computed from JSON. The version is on the script tag, where    ║
  // ║  OFCU Manager reads it.                                                                  ║
  // ║                                                                                          ║
  // ║  OFCU MANAGED PACKAGE — do not hand-edit this block where it is installed.               ║
  // ║  Home file: alloy.html. Update it with OFCU Manager, never by hand.                      ║
  // ╠══════════════════════════════════════════════════════════════════════════════════════════╣

  // ║  Geometry: box, plane, cylinder, cone, sphere, wedge — parameters in, buffers out        ║

  //
  // PHASE 7, and the engine is complete. Math, GL plumbing, a lit program and a line program, six
  // primitives, subdivision, a camera, the texture engine — an ordered stack of layers evaluated to
  // pixels with no canvas anywhere — meshes as node trees, bones and clips, and the package: the
  // one object a game loads, and the code that turns it into the text of a managed-data block.
  //
  // On top of all of it sits the STAGE, which is the only part a game has to learn. `Alloy.init`
  // takes a canvas and a package and gives back something you put models in, play clips on, aim a
  // camera at, and render. Everything under it stays public, so a game that needs more reaches
  // past the stage without leaving the engine.

  // The script tag is the one true version. OFCU Manager compares `data-ofcu-version` across
  // files, so a constant that could disagree with it is a constant that eventually will. In a
  // browser `document.currentScript` is this very tag; under a Node eval there is no document
  // and the fallback keeps the engine loadable there — it is not a second source of truth, it
  // is what the engine answers when nobody stamped it.
  const ALLOY_TAG     = (typeof document !== 'undefined' && document.currentScript) || null;
  const ALLOY_VERSION = (ALLOY_TAG && ALLOY_TAG.getAttribute('data-ofcu-version')) || '0.10.0';
  const ALLOY_BUILD   = ((ALLOY_TAG && ALLOY_TAG.getAttribute('data-ofcu-built')) || '2026-09-11')

  const Alloy = (function () {
    'use strict';

    // =====================================================================
    //           Setup — engine defaults, general helpers
    // =====================================================================
    //#region === Setup ===

    // *********************************************************************
    // MENTAL MODEL: this block never touches `window` or `document` at load, and never queries
    // markup it does not own. Two reasons, and both are load-bearing.
    //
    // First, OFCU Manager refuses to install an engine that does not parse and warns about one
    // that calls getElementById — an engine that reaches for markup will not find it in a game.
    // Everything here takes the canvas it is handed and touches nothing else.
    //
    // Second, the math has to run in Node. That is how geometry gets unit-tested, how a future
    // migration tool rewrites model JSON, and how the euler convention below was checked against
    // an independent quaternion multiply rather than against somebody's confidence. Audio needed
    // a browser and pixels need a browser; matrices do not.
    // *********************************************************************

    // Engine-wide defaults. Every one of these is overridable via `new Alloy(canvas, { ... })`.
    const ENGINE_DEFAULTS = {
      // Device pixel ratio cap. A 3x phone rendering a full-screen viewport is nine times the
      // fragments of a 1x one for a difference nobody can see on chunky low-poly geometry, and
      // it is the single cheapest framerate win available. 2 is where the returns stop.
      maxDPR:        2,
      // Clear colour. Not black: a pure black background makes it impossible to tell "the scene
      // is empty" from "the context died", and you will meet both this week.
      clearColor:    [0.039, 0.047, 0.063, 1],
      antialias:     true,
      // Asking for high-performance on a laptop wakes the discrete GPU, which is right for a
      // modeling tool and rude for a game that draws a hundred boxes. Games override it.
      powerPreference: 'high-performance',
      // Backface culling. On, because every primitive this engine generates is a closed solid
      // with consistent winding, and a hole in a model is far easier to see than a wasted draw.
      cull:          true,
      // The one light Phase 0 ships. `direction` is the direction the light TRAVELS, not the
      // direction toward the light — the shader negates it. Written the way the sun works, so
      // that "pointing down" is a vector that points down.
      light: {
        direction: [-0.42, -1.0, -0.36],
        color:     [1.0, 0.96, 0.9],
        intensity: 1.0,
      },
      // Hemisphere ambient: sky colour from above, bounce colour from below. A single flat
      // ambient term makes every unlit face the identical grey, which reads as a silhouette
      // rather than a shape. Two colours cost three lines in the vertex shader and are the
      // difference between a cube you can see and a cube you can read.
      ambient: {
        sky:    [0.22, 0.26, 0.34],
        ground: [0.13, 0.11, 0.10],
      },
    };

    // Vertex attribute locations, bound BEFORE link and identical in every program the engine
    // builds. This is what lets one VAO feed any program: a mesh's vertex array object records
    // "location 0 reads this buffer", and if location 0 means position everywhere, the mesh does
    // not care which program is about to draw it. Let the linker assign them instead and two
    // programs will eventually disagree, silently, and your normals will arrive as UVs.
    const ATTR = {
      position: 0,
      normal:   1,
      uv:       2,
      color:    3,
      joint:    4,     // which bone moves this vertex; absent means the identity
      // A mat4 cannot be a vertex attribute, so a per-instance transform arrives as its four
      // columns in four consecutive slots. Anything added after these has to start at 9.
      inst0:    5,
      inst1:    6,
      inst2:    7,
      inst3:    8,
    };

    const DEG2RAD = Math.PI / 180;
    const RAD2DEG = 180 / Math.PI;

    /**
     * Clamps a value into an inclusive range.
     * @param {number} v - value to clamp
     * @param {number} lo - lower bound
     * @param {number} hi - upper bound
     * @returns {number} - v, or the bound it exceeded
     */

    /**
     * Merges a caller's options over a defaults object, one level deep, without mutating either.
     *
     * One level is deliberate. A deep merge would let a caller pass half a light and inherit the
     * other half, which reads as convenient right up to the day somebody sets `light.color` and
     * cannot work out why `light.direction` is still the engine's. Nested objects are replaced
     * whole, so what you pass is what you get.
     *
     * @param {Object} defaults - the engine's defaults
     * @param {Object} [opts] - caller options, may be undefined
     * @returns {Object} - a new object carrying every key of defaults
     */
    function withDefaults(defaults, opts) {
      const out = {};
      for (const k in defaults) out[k] = defaults[k];

    //#endregion === Setup ===


    // =====================================================================
    //           Math — vec3, mat3, mat4, quat
    // =====================================================================
    //#region === Math ===

    // *********************************************************************
    // MENTAL MODEL: matrices are COLUMN-MAJOR Float32Array(16), vectors and quaternions are
    // PLAIN ARRAYS, and every function takes its destination first.
    //
    // Column-major means m[12], m[13], m[14] is the translation, and it means
    // `gl.uniformMatrix4fv(loc, false, m)` uploads it untransposed. That is not a preference —
    // WebGL2 rejects `transpose = true` outright, so any other layout costs a transpose on every
    // upload, forever.
    //
    // Vectors are plain arrays because model data is JSON. A node's position comes off the wire
    // as `[0, 1.5, 0]`, goes straight into `vec3.add` without conversion, and goes back out
    // through `JSON.stringify` looking exactly like it did. A Float32Array would serialize as
    // `{"0":0,"1":1.5,"2":0}` and quietly poison every saved model. Matrices are never authored,
    // only computed, so they get the typed array and its upload speed.
    //
    // Out-first (`vec3.add(out, a, b)`) is the gl-matrix convention and it exists so a render
    // loop can allocate nothing. `out` may alias any input: every function below reads what it
    // needs into locals before writing a single element of `out`. That property is not free and
    // it is not optional — `mat4.multiply(m, m, t)` gets written constantly and must be right.
    // *********************************************************************

    // *********************************************************************
    //           vec3 — three numbers, plain array
    // *********************************************************************
    //#region === vec3 ===

    const vec3 = {

      /**
       * Makes a new zero vector.
       * @returns {number[]} - [0, 0, 0]
       */
      create() { return [0, 0, 0]; },

      /**
       * Makes a new vector from three components.
       * @param {number} x - x component
       * @param {number} y - y component
       * @param {number} z - z component
       * @returns {number[]} - a new [x, y, z]
       */
      from(x, y, z) { return [x, y, z]; },

      /**
       * Copies a vector into a new array.
       * @param {number[]} a - source
       * @returns {number[]} - a new copy of a
       */
      clone(a) { return [a[0], a[1], a[2]]; },

      /**
       * Writes three components into an existing vector.
       * @param {number[]} out - destination
       * @param {number} x - x component
       * @param {number} y - y component
       * @param {number} z - z component
       * @returns {number[]} - out
       */
      set(out, x, y, z) { out[0] = x; out[1] = y; out[2] = z; return out; },

      /**
       * Copies one vector into another.
       * @param {number[]} out - destination
       * @param {number[]} a - source
       * @returns {number[]} - out
       */
      copy(out, a) { out[0] = a[0]; out[1] = a[1]; out[2] = a[2]; return out; },

      /**
       * Adds two vectors.
       * @param {number[]} out - destination, may alias a or b
       * @param {number[]} a - left operand
       * @param {number[]} b - right operand
       * @returns {number[]} - out
       */
      add(out, a, b) { out[0] = a[0] + b[0]; out[1] = a[1] + b[1]; out[2] = a[2] + b[2]; return out; },

      /**
       * Subtracts b from a.
       * @param {number[]} out - destination, may alias a or b
       * @param {number[]} a - left operand
       * @param {number[]} b - right operand
       * @returns {number[]} - out
       */
      sub(out, a, b) { out[0] = a[0] - b[0]; out[1] = a[1] - b[1]; out[2] = a[2] - b[2]; return out; },

      /**
       * Multiplies two vectors component-wise.
       * @param {number[]} out - destination, may alias a or b
       * @param {number[]} a - left operand
       * @param {number[]} b - right operand
       * @returns {number[]} - out
       */
      mul(out, a, b) { out[0] = a[0] * b[0]; out[1] = a[1] * b[1]; out[2] = a[2] * b[2]; return out; },

      /**
       * Scales a vector by a scalar.
       * @param {number[]} out - destination, may alias a
       * @param {number[]} a - source vector
       * @param {number} s - scalar
       * @returns {number[]} - out
       */
      scale(out, a, s) { out[0] = a[0] * s; out[1] = a[1] * s; out[2] = a[2] * s; return out; },

      /**
       * Computes a + b * s. The workhorse of every camera pan and integrator here.
       * @param {number[]} out - destination, may alias a or b
       * @param {number[]} a - base vector
       * @param {number[]} b - vector to scale and add
       * @param {number} s - scalar applied to b
       * @returns {number[]} - out
       */

        out[0] = a[0] + b[0] * s; out[1] = a[1] + b[1] * s; out[2] = a[2] + b[2] * s;

      },

      /**
       * Negates a vector.
       * @param {number[]} out - destination, may alias a
       * @param {number[]} a - source
       * @returns {number[]} - out
       */
      negate(out, a) { out[0] = -a[0]; out[1] = -a[1]; out[2] = -a[2]; return out; },

      /**
       * Dot product.
       * @param {number[]} a - left operand
       * @param {number[]} b - right operand
       * @returns {number} - a dot b
       */
      dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; },

      /**
       * Cross product, right-handed.
       * @param {number[]} out - destination, may alias a or b
       * @param {number[]} a - left operand
       * @param {number[]} b - right operand
       * @returns {number[]} - out
       */
      cross(out, a, b) {
        const ax = a[0], ay = a[1], az = a[2];
        const bx = b[0], by = b[1], bz = b[2];
        out[0] = ay * bz - az * by;
        out[1] = az * bx - ax * bz;
        out[2] = ax * by - ay * bx;
        return out;
      },

      /**
       * Vector length.
       * @param {number[]} a - source
       * @returns {number} - euclidean length
       */
      len(a) { return Math.hypot(a[0], a[1], a[2]); },

      /**
       * Squared vector length. Use it for comparisons; it skips the square root.
       * @param {number[]} a - source
       * @returns {number} - squared length
       */
      sqrLen(a) { return a[0] * a[0] + a[1] * a[1] + a[2] * a[2]; },

      /**
       * Distance between two points.
       * @param {number[]} a - first point
       * @param {number[]} b - second point
       * @returns {number} - euclidean distance
       */
      dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]); },

      /**
       * Normalizes a vector to unit length.
       *
       * A zero-length vector is left as zero rather than becoming NaN. The caller that hands one
       * over is usually a degenerate triangle in a mesh, and a zero normal makes one face black
       * while a NaN normal makes the entire draw call vanish. Only one of those is diagnosable
       * by looking at it.

       * @param {number[]} a - source
       * @returns {number[]} - out

      normalize(out, a) {
        const x = a[0], y = a[1], z = a[2];
        let l = x * x + y * y + z * z;
        if (l > 0) {
          l = 1 / Math.sqrt(l);
          out[0] = x * l; out[1] = y * l; out[2] = z * l;
        } else {
          out[0] = 0; out[1] = 0; out[2] = 0;
        }
        return out;
      },

      /**
       * Linear interpolation between two vectors.
       * @param {number[]} out - destination, may alias a or b
       * @param {number[]} a - value at t = 0
       * @param {number[]} b - value at t = 1

        out[1] = a[1] + (b[1] - a[1]) * t;
        out[2] = a[2] + (b[2] - a[2]) * t;
        return out;
      },

      /**
       * Component-wise minimum. Grows a bounding box's low corner.
       * @param {number[]} out - destination, may alias a or b
       * @param {number[]} a - left operand
       * @param {number[]} b - right operand
       * @returns {number[]} - out

      min(out, a, b) {
        out[0] = Math.min(a[0], b[0]); out[1] = Math.min(a[1], b[1]); out[2] = Math.min(a[2], b[2]);
        return out;
      },

      /**
       * Component-wise maximum. Grows a bounding box's high corner.
       * @param {number[]} out - destination, may alias a or b
       * @param {number[]} a - left operand
       * @param {number[]} b - right operand
       * @returns {number[]} - out
       */
      max(out, a, b) {
        out[0] = Math.max(a[0], b[0]); out[1] = Math.max(a[1], b[1]); out[2] = Math.max(a[2], b[2]);

      },

      /**
       * Transforms a POINT by a mat4: rotation, scale, translation, and the w divide.
       *
       * The w divide matters the moment a projection matrix is passed in. Without it this
       * silently returns clip space instead of normalized device coordinates, which looks almost
       * right near the centre of the screen and wrong everywhere else. For a direction, which
       * must ignore translation entirely, use transformDir.
       *
       * @param {number[]} out - destination, may alias a
       * @param {number[]} a - the point
       * @param {Float32Array} m - column-major mat4
       * @returns {number[]} - out
       */
      transformMat4(out, a, m) {
        const x = a[0], y = a[1], z = a[2];
        const w = (m[3] * x + m[7] * y + m[11] * z + m[15]) || 1;
        out[0] = (m[0] * x + m[4] * y + m[8]  * z + m[12]) / w;
        out[1] = (m[1] * x + m[5] * y + m[9]  * z + m[13]) / w;
        out[2] = (m[2] * x + m[6] * y + m[10] * z + m[14]) / w;
        return out;
      },

      /**
       * Transforms a DIRECTION by a mat4: rotation and scale only, no translation, no w divide.
       * @param {number[]} out - destination, may alias a
       * @param {number[]} a - the direction
       * @param {Float32Array} m - column-major mat4
       * @returns {number[]} - out
       */
      transformDir(out, a, m) {
        const x = a[0], y = a[1], z = a[2];
        out[0] = m[0] * x + m[4] * y + m[8]  * z;
        out[1] = m[1] * x + m[5] * y + m[9]  * z;
        out[2] = m[2] * x + m[6] * y + m[10] * z;
        return out;
      },

      /**
       * Rotates a vector by a quaternion, via v + 2 * cross(q.xyz, cross(q.xyz, v) + q.w * v).
       * Cheaper than building a matrix for a single vector, and exactly as correct.
       * @param {number[]} out - destination, may alias a
       * @param {number[]} a - the vector
       * @param {number[]} q - quaternion [x, y, z, w]
       * @returns {number[]} - out
       */
      transformQuat(out, a, q) {
        const qx = q[0], qy = q[1], qz = q[2], qw = q[3];
        const x = a[0], y = a[1], z = a[2];
        // t = cross(q.xyz, v) + w * v
        const tx = qy * z - qz * y + qw * x;
        const ty = qz * x - qx * z + qw * y;
        const tz = qx * y - qy * x + qw * z;
        // out = v + 2 * cross(q.xyz, t)
        out[0] = x + 2 * (qy * tz - qz * ty);
        out[1] = y + 2 * (qz * tx - qx * tz);
        out[2] = z + 2 * (qx * ty - qy * tx);
        return out;
      },
    };

    //#endregion === vec3 ===


    // *********************************************************************
    //           mat4 — column-major Float32Array(16)
    // *********************************************************************
    //#region === mat4 ===

    const mat4 = {

      /**
       * Makes a new identity matrix.
       * @returns {Float32Array} - a fresh identity mat4

      create() {
        const m = new Float32Array(16);
        m[0] = 1; m[5] = 1; m[10] = 1; m[15] = 1;
        return m;

      /**
       * Copies a matrix into a new one.
       * @param {Float32Array} a - source
       * @returns {Float32Array} - a new copy of a
       */
      clone(a) { return new Float32Array(a); },

      /**
       * Copies one matrix into another.
       * @param {Float32Array} out - destination
       * @param {Float32Array} a - source
       * @returns {Float32Array} - out
       */
      copy(out, a) { out.set(a); return out; },

      /**
       * Resets a matrix to the identity.
       * @param {Float32Array} out - destination
       * @returns {Float32Array} - out
       */
      identity(out) {
        out[0] = 1; out[1] = 0; out[2] = 0; out[3] = 0;
        out[4] = 0; out[5] = 1; out[6] = 0; out[7] = 0;
        out[8] = 0; out[9] = 0; out[10] = 1; out[11] = 0;
        out[12] = 0; out[13] = 0; out[14] = 0; out[15] = 1;
        return out;
      },

      /**
       * Multiplies two matrices: out = a * b.
       *
       * Read that as "b happens first". A model matrix built as translate * rotate scales, then
       * rotates, then translates a point, because the point is on the right of the whole
       * expression. Every ordering bug in a 3D engine is this sentence being forgotten.
       *
       * @param {Float32Array} out - destination, may alias a or b
       * @param {Float32Array} a - left matrix
       * @param {Float32Array} b - right matrix, applied to a point first
       * @returns {Float32Array} - out
       */
      multiply(out, a, b) {
        const a00 = a[0],  a01 = a[1],  a02 = a[2],  a03 = a[3];
        const a10 = a[4],  a11 = a[5],  a12 = a[6],  a13 = a[7];
        const a20 = a[8],  a21 = a[9],  a22 = a[10], a23 = a[11];
        const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];

        for (let i = 0; i < 4; i++) {
          const b0 = b[i * 4], b1 = b[i * 4 + 1], b2 = b[i * 4 + 2], b3 = b[i * 4 + 3];
          out[i * 4]     = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
          out[i * 4 + 1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
          out[i * 4 + 2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
          out[i * 4 + 3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
        }
        return out;
      },

      /**
       * Builds a pure translation matrix.
       * @param {Float32Array} out - destination
       * @param {number[]} v - translation
       * @returns {Float32Array} - out
       */
      fromTranslation(out, v) {
        mat4.identity(out);
        out[12] = v[0]; out[13] = v[1]; out[14] = v[2];
        return out;
      },

      /**
       * Builds a pure scale matrix.
       * @param {Float32Array} out - destination
       * @param {number[]} v - per-axis scale
       * @returns {Float32Array} - out
       */
      fromScaling(out, v) {
        mat4.identity(out);
        out[0] = v[0]; out[5] = v[1]; out[10] = v[2];
        return out;
      },

      /**
       * Builds a rotation matrix from a quaternion. The quaternion is assumed normalized; a
       * quaternion that has drifted off unit length becomes a matrix with scale baked in.
       * @param {Float32Array} out - destination
       * @param {number[]} q - quaternion [x, y, z, w]
       * @returns {Float32Array} - out
       */
      fromQuat(out, q) {
        const x = q[0], y = q[1], z = q[2], w = q[3];
        const x2 = x + x, y2 = y + y, z2 = z + z;
        const xx = x * x2, xy = x * y2, xz = x * z2;
        const yy = y * y2, yz = y * z2, zz = z * z2;
        const wx = w * x2, wy = w * y2, wz = w * z2;

        out[0] = 1 - (yy + zz); out[1] = xy + wz;       out[2] = xz - wy;       out[3] = 0;
        out[4] = xy - wz;       out[5] = 1 - (xx + zz); out[6] = yz + wx;       out[7] = 0;
        out[8] = xz + wy;       out[9] = yz - wx;       out[10] = 1 - (xx + yy); out[11] = 0;
        out[12] = 0; out[13] = 0; out[14] = 0; out[15] = 1;
        return out;
      },

      /**
       * Composes a transform from translation, rotation and scale: T * R * S.
       *
       * This is the ONE place a node's transform becomes a matrix, and the order is the reason
       * scaling a rotated node does not shear it: scale is applied in the node's own space,
       * before rotation, so a stretched arm stretches along the arm.
       *
       * @param {Float32Array} out - destination
       * @param {number[]} t - translation
       * @param {number[]} r - rotation quaternion [x, y, z, w]
       * @param {number[]} s - per-axis scale
       * @returns {Float32Array} - out
       */
      compose(out, t, r, s) {
        const x = r[0], y = r[1], z = r[2], w = r[3];
        const x2 = x + x, y2 = y + y, z2 = z + z;
        const xx = x * x2, xy = x * y2, xz = x * z2;
        const yy = y * y2, yz = y * z2, zz = z * z2;
        const wx = w * x2, wy = w * y2, wz = w * z2;
        const sx = s[0], sy = s[1], sz = s[2];

        out[0] = (1 - (yy + zz)) * sx; out[1] = (xy + wz) * sx;       out[2] = (xz - wy) * sx;       out[3] = 0;
        out[4] = (xy - wz) * sy;       out[5] = (1 - (xx + zz)) * sy; out[6] = (yz + wx) * sy;       out[7] = 0;
        out[8] = (xz + wy) * sz;       out[9] = (yz - wx) * sz;       out[10] = (1 - (xx + yy)) * sz; out[11] = 0;
        out[12] = t[0]; out[13] = t[1]; out[14] = t[2]; out[15] = 1;
        return out;
      },

      /**
       * Reads the translation out of a transform.
       * @param {number[]} out - destination vec3
       * @param {Float32Array} m - source matrix
       * @returns {number[]} - out
       */
      getTranslation(out, m) { out[0] = m[12]; out[1] = m[13]; out[2] = m[14]; return out; },

      /**
       * Builds a right-handed perspective projection with a clip range of -1 to 1.
       *
       * `near` deserves more thought than it usually gets: depth precision is spent almost
       * entirely in the first few percent of the range, so halving near costs more precision
       * than doubling far. For a model viewer 0.1 is generous; for a game with a first-person
       * camera it is the difference between clean geometry and z-fighting at range.
       *
       * @param {Float32Array} out - destination
       * @param {number} fovYDeg - vertical field of view, degrees
       * @param {number} aspect - width divided by height
       * @param {number} near - near plane distance, must be greater than 0
       * @param {number} far - far plane distance
       * @returns {Float32Array} - out
       */
      perspective(out, fovYDeg, aspect, near, far) {
        const f = 1 / Math.tan(fovYDeg * DEG2RAD / 2);
        const nf = 1 / (near - far);
        out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
        out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
        out[8] = 0; out[9] = 0; out[10] = (far + near) * nf; out[11] = -1;
        out[12] = 0; out[13] = 0; out[14] = 2 * far * near * nf; out[15] = 0;
        return out;
      },

      /**
       * Builds an orthographic projection with a clip range of -1 to 1.
       * @param {Float32Array} out - destination
       * @param {number} left - left plane
       * @param {number} right - right plane
       * @param {number} bottom - bottom plane
       * @param {number} top - top plane
       * @param {number} near - near plane
       * @param {number} far - far plane
       * @returns {Float32Array} - out
       */
      ortho(out, left, right, bottom, top, near, far) {
        const lr = 1 / (left - right), bt = 1 / (bottom - top), nf = 1 / (near - far);
        out[0] = -2 * lr; out[1] = 0; out[2] = 0; out[3] = 0;
        out[4] = 0; out[5] = -2 * bt; out[6] = 0; out[7] = 0;
        out[8] = 0; out[9] = 0; out[10] = 2 * nf; out[11] = 0;
        out[12] = (left + right) * lr;
        out[13] = (top + bottom) * bt;
        out[14] = (far + near) * nf;
        out[15] = 1;
        return out;
      },

      /**
       * Builds a VIEW matrix looking from eye toward center. This is the inverse of the camera's
       * transform, not the camera's transform — for that, use targetTo.
       *
       * Degenerate input (eye at center, or an up vector parallel to the view direction) would
       * produce a matrix full of NaN that turns the whole screen into the clear colour with no
       * error anywhere. It throws instead, because a camera that cannot be built is a bug in the
       * caller and silence costs an afternoon.
       *
       * @param {Float32Array} out - destination
       * @param {number[]} eye - camera position
       * @param {number[]} center - the point being looked at
       * @param {number[]} up - the world's up direction, normally [0, 1, 0]
       * @returns {Float32Array} - out
       */
      lookAt(out, eye, center, up) {
        let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
        let l = Math.hypot(zx, zy, zz);
        if (l === 0) {
          throw new Error('mat4.lookAt: eye and center are the same point [' + eye.join(', ') +
                          ']. A view direction of zero length has no matrix.');
        }
        zx /= l; zy /= l; zz /= l;

        // x = normalize(cross(up, z))
        let xx = up[1] * zz - up[2] * zy;
        let xy = up[2] * zx - up[0] * zz;
        let xz = up[0] * zy - up[1] * zx;
        l = Math.hypot(xx, xy, xz);
        if (l === 0) {
          throw new Error('mat4.lookAt: up [' + up.join(', ') + '] is parallel to the view ' +
                          'direction. Tilt the camera or pass a different up vector.');
        }
        xx /= l; xy /= l; xz /= l;

        // y = cross(z, x), already unit because z and x are unit and perpendicular
        const yx = zy * xz - zz * xy;
        const yy = zz * xx - zx * xz;
        const yz = zx * xy - zy * xx;

        out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
        out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
        out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
        out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
        out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
        out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
        out[15] = 1;
        return out;
      },

      /**
       * Transposes a matrix.
       * @param {Float32Array} out - destination, may alias a
       * @param {Float32Array} a - source
       * @returns {Float32Array} - out
       */
      transpose(out, a) {
        const a01 = a[1], a02 = a[2], a03 = a[3];
        const a12 = a[6], a13 = a[7], a23 = a[11];
        out[0] = a[0];  out[1] = a[4];  out[2] = a[8];   out[3] = a[12];
        out[4] = a01;   out[5] = a[5];  out[6] = a[9];   out[7] = a[13];
        out[8] = a02;   out[9] = a12;   out[10] = a[10]; out[11] = a[14];
        out[12] = a03;  out[13] = a13;  out[14] = a23;   out[15] = a[15];
        return out;
      },

      /**
       * Inverts a matrix. Returns null and leaves out untouched when the matrix is singular,
       * which happens the moment a node is given a scale of zero on any axis.
       *
       * Returning null rather than throwing is deliberate: a zero scale is a legitimate way to
       * hide a node, so an inverse that cannot exist is an ordinary Tuesday and the caller
       * decides what it means.
       *
       * @param {Float32Array} out - destination, may alias a
       * @param {Float32Array} a - source
       * @returns {Float32Array|null} - out, or null if a is not invertible
       */
      invert(out, a) {
        const a00 = a[0],  a01 = a[1],  a02 = a[2],  a03 = a[3];
        const a10 = a[4],  a11 = a[5],  a12 = a[6],  a13 = a[7];
        const a20 = a[8],  a21 = a[9],  a22 = a[10], a23 = a[11];
        const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];

        const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10;
        const b02 = a00 * a13 - a03 * a10, b03 = a01 * a12 - a02 * a11;
        const b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12;
        const b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30;
        const b08 = a20 * a33 - a23 * a30, b09 = a21 * a32 - a22 * a31;
        const b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;

        let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
        if (!det) return null;
        det = 1 / det;

        out[0]  = (a11 * b11 - a12 * b10 + a13 * b09) * det;
        out[1]  = (a02 * b10 - a01 * b11 - a03 * b09) * det;
        out[2]  = (a31 * b05 - a32 * b04 + a33 * b03) * det;
        out[3]  = (a22 * b04 - a21 * b05 - a23 * b03) * det;
        out[4]  = (a12 * b08 - a10 * b11 - a13 * b07) * det;
        out[5]  = (a00 * b11 - a02 * b08 + a03 * b07) * det;
        out[6]  = (a32 * b02 - a30 * b05 - a33 * b01) * det;
        out[7]  = (a20 * b05 - a22 * b02 + a23 * b01) * det;
        out[8]  = (a10 * b10 - a11 * b08 + a13 * b06) * det;
        out[9]  = (a01 * b08 - a00 * b10 - a03 * b06) * det;
        out[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;
        out[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
        out[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;
        out[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
        out[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;
        out[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
        return out;
      },
    };

    //#endregion === mat4 ===


    // *********************************************************************
    //           mat3 — the normal matrix, and nothing else yet
    // *********************************************************************
    //#region === mat3 ===

    const mat3 = {

      /**
       * Makes a new identity mat3.
       * @returns {Float32Array} - a fresh identity mat3
       */
      create() {
        const m = new Float32Array(9);
        m[0] = 1; m[4] = 1; m[8] = 1;
        return m;
      },

      /**
       * Builds the NORMAL MATRIX for a model matrix: the inverse transpose of its upper 3x3.
       *
       * Normals are not points and do not survive a model matrix. Under non-uniform scale a
       * plain rotation-and-scale sends a surface normal off the surface — squash a sphere flat
       * and every normal tips the wrong way, so the lighting says "sphere" while the silhouette
       * says "pancake". The inverse transpose is the transform that keeps a normal perpendicular
       * to whatever the surface became.
       *
       * A singular matrix (any axis scaled to zero) falls back to the identity, because the
       * caller is hiding a node and nobody is going to look at its shading.
       *
       * @param {Float32Array} out - destination mat3
       * @param {Float32Array} m - source mat4
       * @returns {Float32Array} - out
       */
      normalFromMat4(out, m) {
        const a00 = m[0], a01 = m[1], a02 = m[2];
        const a10 = m[4], a11 = m[5], a12 = m[6];
        const a20 = m[8], a21 = m[9], a22 = m[10];

        const b01 =  a22 * a11 - a12 * a21;
        const b11 = -a22 * a10 + a12 * a20;
        const b21 =  a21 * a10 - a11 * a20;

        let det = a00 * b01 + a01 * b11 + a02 * b21;
        if (!det) {
          out[0] = 1; out[1] = 0; out[2] = 0;
          out[3] = 0; out[4] = 1; out[5] = 0;
          out[6] = 0; out[7] = 0; out[8] = 1;
          return out;
        }
        det = 1 / det;

        // The adjugate over the determinant is the INVERSE; what a normal needs is the inverse
        // TRANSPOSED, so the cofactors are written out in transposed positions here rather than
        // computed and then flipped. Do not "simplify" this back into the familiar inverse
        // layout: for a rotation the two differ by exactly a transpose, which is a rotation the
        // wrong way, and the result is a model whose lighting turns opposite to the model.
        out[0] = b01 * det;
        out[1] = b11 * det;
        out[2] = b21 * det;
        out[3] = (-a22 * a01 + a02 * a21) * det;
        out[4] = ( a22 * a00 - a02 * a20) * det;
        out[5] = (-a21 * a00 + a01 * a20) * det;
        out[6] = ( a12 * a01 - a02 * a11) * det;
        out[7] = (-a12 * a00 + a02 * a10) * det;
        out[8] = ( a11 * a00 - a01 * a10) * det;
        return out;
      },
    };

    //#endregion === mat3 ===


    // *********************************************************************
    //           quat — rotation, four numbers, plain array [x, y, z, w]
    // *********************************************************************
    //#region === quat ===

    // *********************************************************************
    // MENTAL MODEL: EULER ANGLES ARE A SPELLING, QUATERNIONS ARE THE VALUE. A node's rotation is
    // stored as a quaternion and shown to a person as three degrees, exactly the way Webposium
    // stores MIDI numbers and shows note names.
    //
    // The order is Rz * Ry * Rx, which is Blender's default XYZ: X is applied to the model
    // first, then Y, then Z. Every euler convention is somebody's arbitrary choice and all of
    // them are wrong for somebody, so what matters is that this one is written down, tested
    // against an independent quaternion multiply, and never quietly changed. A model authored
    // under one convention and loaded under another is subtly, unfixably crooked.
    //
    // Interpolation never touches euler angles. Two rotations 350 degrees apart interpolate the
    // long way round through a spin nobody asked for, and near the poles the angles themselves
    // stop being unique. Clips slerp quaternions (Phase 5); the UI converts at the very edge.
    // *********************************************************************

    const quat = {

      /**
       * Makes a new identity quaternion, meaning no rotation.
       * @returns {number[]} - [0, 0, 0, 1]
       */
      create() { return [0, 0, 0, 1]; },

      /**
       * Copies a quaternion into a new array.
       * @param {number[]} a - source
       * @returns {number[]} - a new copy of a
       */
      clone(a) { return [a[0], a[1], a[2], a[3]]; },

      /**
       * Copies one quaternion into another.
       * @param {number[]} out - destination
       * @param {number[]} a - source
       * @returns {number[]} - out
       */
      copy(out, a) { out[0] = a[0]; out[1] = a[1]; out[2] = a[2]; out[3] = a[3]; return out; },

      /**
       * Resets a quaternion to the identity.
       * @param {number[]} out - destination
       * @returns {number[]} - out
       */
      identity(out) { out[0] = 0; out[1] = 0; out[2] = 0; out[3] = 1; return out; },

      /**
       * Builds a quaternion from an axis and an angle.
       * @param {number[]} out - destination
       * @param {number[]} axis - rotation axis, normalized here so callers need not bother
       * @param {number} deg - angle in degrees, counter-clockwise looking down the axis
       * @returns {number[]} - out
       */
      fromAxisAngle(out, axis, deg) {
        const half = deg * DEG2RAD / 2;
        const s = Math.sin(half);
        let l = Math.hypot(axis[0], axis[1], axis[2]);
        if (l === 0) return quat.identity(out);
        l = 1 / l;
        out[0] = axis[0] * l * s;
        out[1] = axis[1] * l * s;
        out[2] = axis[2] * l * s;
        out[3] = Math.cos(half);
        return out;
      },

      /**
       * Builds a quaternion from euler angles in DEGREES, composed as qz * qy * qx.
       * @param {number[]} out - destination
       * @param {number} x - rotation about X, degrees, applied first
       * @param {number} y - rotation about Y, degrees
       * @param {number} z - rotation about Z, degrees, applied last
       * @returns {number[]} - out
       */
      fromEuler(out, x, y, z) {
        const hx = x * DEG2RAD / 2, hy = y * DEG2RAD / 2, hz = z * DEG2RAD / 2;
        const c1 = Math.cos(hx), s1 = Math.sin(hx);
        const c2 = Math.cos(hy), s2 = Math.sin(hy);
        const c3 = Math.cos(hz), s3 = Math.sin(hz);

        out[0] = s1 * c2 * c3 - c1 * s2 * s3;
        out[1] = c1 * s2 * c3 + s1 * c2 * s3;
        out[2] = c1 * c2 * s3 - s1 * s2 * c3;
        out[3] = c1 * c2 * c3 + s1 * s2 * s3;
        return out;
      },

      /**
       * Reads euler angles in DEGREES back out of a quaternion, in the same qz * qy * qx order
       * fromEuler writes. Round-trips exactly except at gimbal lock.
       *
       * At lock (Y at plus or minus 90 degrees) X and Z become the same axis, so infinitely many
       * angle triples describe the identical rotation. This picks Z = 0 and folds the whole
       * rotation into X. That is a choice, not a recovery: the rotation is right, and the
       * numbers a person reads may not be the numbers they typed.
       *
       * @param {number[]} out - destination vec3, degrees
       * @param {number[]} q - source quaternion
       * @returns {number[]} - out
       */
      toEuler(out, q) {
        const x = q[0], y = q[1], z = q[2], w = q[3];
        const x2 = x + x, y2 = y + y, z2 = z + z;
        const xx = x * x2, xy = x * y2, xz = x * z2;
        const yy = y * y2, yz = y * z2, zz = z * z2;
        const wx = w * x2, wy = w * y2, wz = w * z2;

        // The rotation matrix entries this needs, named r<row><col> to match the derivation:
        // R = Rz*Ry*Rx gives Y from r20, then X from r21 and r22, and Z from r10 and r00.
        const r00 = 1 - (yy + zz);
        const r10 = xy + wz,       r11 = 1 - (xx + zz), r12 = yz - wx;
        const r20 = xz - wy,       r21 = yz + wx,       r22 = 1 - (xx + yy);

        const sy = clamp(-r20, -1, 1);
        out[1] = Math.asin(sy) * RAD2DEG;

        if (Math.abs(sy) > 0.999999) {
          out[0] = Math.atan2(-r12, r11) * RAD2DEG;
          out[2] = 0;
        } else {
          out[0] = Math.atan2(r21, r22) * RAD2DEG;
          out[2] = Math.atan2(r10, r00) * RAD2DEG;
        }
        return out;
      },

      /**
       * Multiplies two quaternions: out = a * b, meaning b's rotation happens first.
       * @param {number[]} out - destination, may alias a or b
       * @param {number[]} a - left operand
       * @param {number[]} b - right operand, applied to a vector first
       * @returns {number[]} - out
       */
      multiply(out, a, b) {
        const ax = a[0], ay = a[1], az = a[2], aw = a[3];
        const bx = b[0], by = b[1], bz = b[2], bw = b[3];
        out[0] = ax * bw + aw * bx + ay * bz - az * by;
        out[1] = ay * bw + aw * by + az * bx - ax * bz;
        out[2] = az * bw + aw * bz + ax * by - ay * bx;
        out[3] = aw * bw - ax * bx - ay * by - az * bz;
        return out;
      },

      /**
       * Conjugates a quaternion, which for a unit quaternion is its inverse.
       * @param {number[]} out - destination, may alias a
       * @param {number[]} a - source
       * @returns {number[]} - out
       */
      conjugate(out, a) {
        out[0] = -a[0]; out[1] = -a[1]; out[2] = -a[2]; out[3] = a[3];
        return out;
      },

      /**
       * Normalizes a quaternion to unit length. A zero quaternion becomes the identity rather
       * than NaN, on the same reasoning as vec3.normalize: a wrong rotation can be seen, and a
       * NaN one deletes the model.
       * @param {number[]} out - destination, may alias a
       * @param {number[]} a - source
       * @returns {number[]} - out
       */
      normalize(out, a) {
        let l = Math.hypot(a[0], a[1], a[2], a[3]);
        if (l === 0) return quat.identity(out);
        l = 1 / l;
        out[0] = a[0] * l; out[1] = a[1] * l; out[2] = a[2] * l; out[3] = a[3] * l;
        return out;
      },

      /**
       * Spherical linear interpolation, the correct way to blend two rotations.
       *
       * Two details earn their lines. The DOUBLE COVER: q and -q are the same rotation, so a
       * negative dot product means the shorter path runs through the negated end quaternion, and
       * skipping that check makes a 10-degree turn animate as a 350-degree spin. The NEARLY
       * PARALLEL case falls back to a normalized lerp, because sin(theta) approaching zero
       * turns the exact formula into a division that amplifies float error into a jitter you
       * will see on any slow rotation.
       *
       * @param {number[]} out - destination, may alias a or b
       * @param {number[]} a - rotation at t = 0
       * @param {number[]} b - rotation at t = 1
       * @param {number} t - interpolant, 0 to 1
       * @returns {number[]} - out
       */
      slerp(out, a, b, t) {
        const ax = a[0], ay = a[1], az = a[2], aw = a[3];
        let bx = b[0], by = b[1], bz = b[2], bw = b[3];

        let cos = ax * bx + ay * by + az * bz + aw * bw;
        if (cos < 0) { cos = -cos; bx = -bx; by = -by; bz = -bz; bw = -bw; }

        let s0, s1;
        if (1 - cos > 1e-6) {
          const theta = Math.acos(cos);
          const sinTheta = Math.sin(theta);
          s0 = Math.sin((1 - t) * theta) / sinTheta;
          s1 = Math.sin(t * theta) / sinTheta;
        } else {
          s0 = 1 - t;
          s1 = t;
        }

        out[0] = s0 * ax + s1 * bx;
        out[1] = s0 * ay + s1 * by;
        out[2] = s0 * az + s1 * bz;
        out[3] = s0 * aw + s1 * bw;
        return quat.normalize(out, out);
      },
    };

    //#endregion === quat ===

    //#endregion === Math ===


    // =====================================================================
    //           Geometry — parameters in, vertex buffers out
    // =====================================================================
    //#region === Geometry ===

    // *********************************************************************
    // MENTAL MODEL: geometry is a PURE FUNCTION FROM PARAMETERS TO ARRAYS. A box is not an
    // object that knows how to draw itself; it is `box({width, height, depth})` returning
    // typed arrays, and nothing in this section has ever heard of WebGL.
    //
    // That separation is what makes the modeling paradigm work. A model is a tree of nodes, each
    // naming a primitive and its parameters, stored as JSON. Changing a number rebuilds arrays,
    // and nothing else in the engine has an opinion. It is also why every builder here runs in
    // Node: geometry can be generated, diffed and tested without a browser anywhere near it.
    //
    // Each primitive publishes a SCHEMA alongside its builder — parameter names, types, ranges,
    // defaults. The workbench builds its inspector from that schema rather than from hand-written
    // controls, so a new primitive in Phase 3 arrives with a full editor for free, and an AI
    // authoring model JSON can ask the engine what a box takes instead of guessing.
    // *********************************************************************

    /**
     * @typedef {Object} Geometry
     * @property {Float32Array} positions - xyz per vertex
     * @property {Float32Array} [normals] - xyz per vertex, unit length
     * @property {Float32Array} [uvs] - uv per vertex
     * @property {Float32Array} [colors] - rgb per vertex, used by the line program
     * @property {Uint16Array|Uint32Array} [indices] - triangle or line indices
     * @property {'triangles'|'lines'} mode - how to assemble the vertices
     */

    // *********************************************************************
    //           The Builder — one accumulator every primitive writes into
    // *********************************************************************
    //#region === Geometry Builder ===

    // *********************************************************************
    // MENTAL MODEL: a primitive is a LOOP OVER A PARAMETER GRID that pushes vertices and quads
    // into an accumulator. Every one of them below has the same shape — walk a surface in two
    // parameters, emit a vertex per lattice point, emit a quad per cell — and the differences are
    // entirely in the position function.
    //
    // Writing them that way rather than as bespoke vertex tables is what makes segment counts
    // possible at all, and it is what makes the winding uniform: `quad` is the only place a
    // triangle's vertex order is decided, so a face wound backwards is one bug in one function
    // rather than a bug that hides in one primitive out of six.
    //
    // FLAT OR SMOOTH is decided by whether a lattice point is emitted once or once per face. A box
    // emits four vertices per face so each face gets its own normal; a sphere shares them along
    // its rings so the normals blend. That is the whole mechanism, and it is why there is no
    // "smooth" flag in the builder — smoothness is a topology decision, not a shading one.
    // *********************************************************************

    /**
     * Makes a geometry accumulator.
     * @returns {Object} - a builder with vert, quad, tri and done
     */
    function makeBuilder() {
      const pos = [], nrm = [], uv = [], idx = [], faces = [];
      return {
        /**
         * Appends one vertex.
         * @param {number} x - position x
         * @param {number} y - position y
         * @param {number} z - position z
         * @param {number} nx - normal x
         * @param {number} ny - normal y
         * @param {number} nz - normal z
         * @param {number} u - texture u
         * @param {number} v - texture v
         * @returns {number} - the new vertex's index
         */
        vert(x, y, z, nx, ny, nz, u, v) {
          pos.push(x, y, z);
          nrm.push(nx, ny, nz);
          uv.push(u, v);
          return pos.length / 3 - 1;
        },
        /**
         * Appends one triangle. The only place a winding order is decided.
         * @param {number} a - first vertex
         * @param {number} b - second vertex
         * @param {number} c - third vertex
         * @returns {void}
         */
        tri(a, b, c) { idx.push(a, b, c); faces.push([a, b, c]); },
        /**
         * Appends a quad as two triangles, wound counter-clockwise from outside.
         * @param {number} a - corner at (0, 0)
         * @param {number} b - corner at (1, 0)
         * @param {number} c - corner at (0, 1)
         * @param {number} d - corner at (1, 1)
         * @returns {void}
         */
        quad(a, b, c, d) { idx.push(a, b, d, a, d, c); faces.push([a, b, d, c]); },
        /**
         * Freezes the accumulator into a Geometry.
         * @returns {Geometry} - a triangles geometry with bounds
         */
        done() {
          // Zero-area triangles are dropped here rather than avoided in each primitive. A cone's
          // tip and a sphere's poles both collapse a ring to a point, so the last row of quads
          // has one degenerate half each; a wedge's triangular sides are quads with a repeated
          // corner. Every one of them would be submitted to the GPU, rasterize nothing, and still
          // cost a vertex shader invocation per corner.
          //
          // Filtering by AREA rather than by repeated indices is what catches them: the cone's
          // tip vertices are distinct indices at the same position, because each carries its own
          // texture coordinate.
          const kept = [];
          for (let t = 0; t < idx.length; t += 3) {
            const a = idx[t] * 3, b2 = idx[t + 1] * 3, c = idx[t + 2] * 3;
            const ux = pos[b2] - pos[a], uy = pos[b2 + 1] - pos[a + 1], uz = pos[b2 + 2] - pos[a + 2];
            const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];
            const cx = uy * vz - uz * vy, cy = uz * vx - ux * vz, cz = ux * vy - uy * vx;
            if (cx * cx + cy * cy + cz * cz > 1e-20) kept.push(idx[t], idx[t + 1], idx[t + 2]);
          }
          const g = {
            positions: new Float32Array(pos),
            normals: new Float32Array(nrm),
            uvs: new Float32Array(uv),
            // Past 65535 vertices a Uint16Array silently wraps, which draws a shredded mesh with
            // no error anywhere. Choosing the width from the count is one line and removes the
            // whole class of bug.
            indices: pos.length / 3 > 65535 ? new Uint32Array(kept) : new Uint16Array(kept),
            // The QUADS, kept alongside the triangles. The GPU only ever sees the triangles, but
            // Catmull-Clark wants the faces a surface was actually made of: subdividing a
            // triangulated quad treats the diagonal as a real edge, which pulls the surface
            // toward it and turns a symmetric box into a lopsided one. The builder already knows
            // where its quads are, so the only cost of keeping them is this array.
            faces,
            mode: 'triangles',
          };
          computeBounds(g);
          return g;
        },
      };
    }

    /**
     * Computes and attaches a geometry's axis-aligned bounds.
     *
     * Every geometry carries these because the renderer culls with them, the camera frames with
     * them, and UV projection scales with them. Computing them once at build time costs a pass
     * nobody notices; computing them at draw time costs one per frame per object.
     *
     * @param {Geometry} g - the geometry, given a `bounds` property
     * @returns {Geometry} - g
     */
    function computeBounds(g) {
      const p = g.positions;
      const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
      for (let i = 0; i < p.length; i += 3) {
        for (let c = 0; c < 3; c++) {
          if (p[i + c] < min[c]) min[c] = p[i + c];
          if (p[i + c] > max[c]) max[c] = p[i + c];
        }
      }
      // An empty geometry gets a degenerate box at the origin rather than infinities, which would
      // poison every bound it is ever merged into.
      if (!p.length) { min[0] = min[1] = min[2] = 0; max[0] = max[1] = max[2] = 0; }
      g.bounds = { min, max };
      return g;
    }

    /**
     * A size parameter as a magnitude that is never zero. Negative sizes would build a primitive
     * inside out; zero sizes build degenerate triangles and, in a tube, NaN normals.
     * @param {number} v - the parameter
     * @returns {number} - its absolute value, at least a micron
     */
    function sizeOf(v) { return Math.max(1e-6, Math.abs(Number(v) || 0)); }

    /**
     * Rounds a segment count into a whole number within a range.
     * @param {number} v - the requested count
     * @param {number} lo - the smallest that makes a surface
     * @returns {number} - a whole number of at least lo
     */
    function segCount(v, lo) { return Math.max(lo, Math.min(512, Math.round(v))); }

    //#endregion === Geometry Builder ===


    // *********************************************************************
    //           Primitives — the six shapes a model is assembled from
    // *********************************************************************
    //#region === Primitives ===

    // The six faces of a box, each as its outward normal and the two in-plane axes that walk it.
    //
    // The invariant that keeps every face wound counter-clockwise from outside is `cross(u, v)
    // === n`. Check it before adding a face: a face wound the other way is invisible under
    // backface culling, which reads as a hole in the model rather than as a wrong face, and the
    // first instinct is always to blame the culling.
    const BOX_FACES = [
      { n: [ 1,  0,  0], u: [ 0, 0, -1], v: [0,  1,  0] },   // +X  right
      { n: [-1,  0,  0], u: [ 0, 0,  1], v: [0,  1,  0] },   // -X  left
      { n: [ 0,  1,  0], u: [ 1, 0,  0], v: [0,  0, -1] },   // +Y  top
      { n: [ 0, -1,  0], u: [ 1, 0,  0], v: [0,  0,  1] },   // -Y  bottom
      { n: [ 0,  0,  1], u: [ 1, 0,  0], v: [0,  1,  0] },   // +Z  front
      { n: [ 0,  0, -1], u: [-1, 0,  0], v: [0,  1,  0] },   // -Z  back
    ];

    /**
     * Builds an axis-aligned box centred on its own origin.
     *
     * Each face gets its own vertices, its own flat normal and its own full 0-to-1 UV square. A
     * cube with shared corners would have one normal per corner and therefore smooth shading,
     * which turns a crisp box into a rounded lump — exactly the opposite of the look this engine
     * exists to produce.
     *
     * @param {Object} [params] - box parameters
     * @param {number} [params.width] - size along X, default 1
     * @param {number} [params.height] - size along Y, default 1
     * @param {number} [params.depth] - size along Z, default 1
     * @param {number} [params.segments] - cells per face edge, default 1
     * @returns {Geometry} - a triangles geometry
     */
    function box(params) {
      const p = withDefaults(GEOMETRY_SPECS.box.defaults, params);
      // Sizes are magnitudes. A negative width turns the box inside out in its own space, which
      // the mirror check in mergeModel cannot see because it only reads the node's transform.
      const half = [sizeOf(p.width) / 2, sizeOf(p.height) / 2, sizeOf(p.depth) / 2];
      const seg = segCount(p.segments, 1);
      const b = makeBuilder();

      for (const face of BOX_FACES) {
        const n = face.n, u = face.u, v = face.v;
        // Half-extent along each of the face's own axes. The axes are unit and axis-aligned, so
        // the extent is just whichever component of `half` that axis points down.
        const hN = Math.abs(n[0]) * half[0] + Math.abs(n[1]) * half[1] + Math.abs(n[2]) * half[2];
        const hU = Math.abs(u[0]) * half[0] + Math.abs(u[1]) * half[1] + Math.abs(u[2]) * half[2];
        const hV = Math.abs(v[0]) * half[0] + Math.abs(v[1]) * half[1] + Math.abs(v[2]) * half[2];
        pushGrid(b, seg, seg, (i, j) => {
          const a = (i / seg) * 2 - 1, c = (j / seg) * 2 - 1;
          return [
            n[0] * hN + u[0] * a * hU + v[0] * c * hV,
            n[1] * hN + u[1] * a * hU + v[1] * c * hV,
            n[2] * hN + u[2] * a * hU + v[2] * c * hV,
            n[0], n[1], n[2],
            i / seg, j / seg,
          ];
        });
      }
      return b.done();
    }

    /**
     * Emits a rectangular lattice of vertices and the quads between them.
     *
     * Every primitive here is a surface in two parameters, so this is the shape of all of them.
     * The callback returns one vertex as `[x, y, z, nx, ny, nz, u, v]`, and the quads are wound
     * for a surface whose u and v cross to its normal.
     *
     * @param {Object} b - the builder
     * @param {number} su - cells along u
     * @param {number} sv - cells along v
     * @param {function(number, number): number[]} fn - vertex at lattice point (i, j)
     * @returns {number} - the index of the lattice's first vertex
     */
    function pushGrid(b, su, sv, fn) {
      const rows = [];
      for (let j = 0; j <= sv; j++) {
        const row = [];
        for (let i = 0; i <= su; i++) {
          const t = fn(i, j);
          row.push(b.vert(t[0], t[1], t[2], t[3], t[4], t[5], t[6], t[7]));
        }
        rows.push(row);
      }
      for (let j = 0; j < sv; j++) {
        for (let i = 0; i < su; i++) {
          b.quad(rows[j][i], rows[j][i + 1], rows[j + 1][i], rows[j + 1][i + 1]);
        }
      }
      return rows[0][0];
    }

    /**
     * Builds a flat plane on the XZ ground plane, facing up.
     *
     * XZ rather than XY because the overwhelming majority of planes in a game are floors, and a
     * floor that has to be rotated before it is a floor is a primitive that has picked the wrong
